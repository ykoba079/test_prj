<!doctype html><meta charset="utf-8"><canvas id="view" style="width:960px;height:700px"></canvas><script src="../vendor/babylon.js"></script><script src="../vendor/HavokPhysics_umd.js"></script><script type="module">
import {createMechanics} from '../physics.js';
import {createRobotArm} from '../robot-arm.js';
import {createFruitFactory} from '../fruit.js';
import {createPhysicalGripper} from '../gripper-physics.js';

</script>
