<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071523">
  <title>灯りの川 — 灯籠流し VR</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; }
    * { box-sizing: border-box; }
    html, body, #renderCanvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #071523; }
    #renderCanvas { display: block; touch-action: none; outline: 0; }
    .shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg,rgba(2,8,18,.05),rgba(2,8,18,.24)); z-index: 2; }
    .topbar { position: fixed; z-index: 4; top: max(14px,env(safe-area-inset-top)); left: max(14px,env(safe-area-inset-left)); right: max(14px,env(safe-area-inset-right)); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
    .title { text-shadow: 0 2px 18px #000; }
    .title h1 { margin:0; font-size:clamp(19px,4vw,30px); letter-spacing:.16em; font-weight:500; }
    .title p { margin:5px 0 0; color:#d8dfdc; font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.08em; }
    .sound { pointer-events:auto; width:44px; height:44px; border:1px solid rgba(255,255,255,.28); border-radius:50%; color:white; background:rgba(5,15,25,.52); backdrop-filter:blur(8px); font-size:18px; cursor:pointer; }
    .panel { position:fixed; z-index:4; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(480px,calc(100% - 28px)); padding:14px; border:1px solid rgba(255,230,188,.25); border-radius:18px; color:#fff9e9; background:rgba(5,15,25,.68); box-shadow:0 14px 50px rgba(0,0,0,.28); backdrop-filter:blur(12px); text-align:center; transition:opacity .5s,transform .5s; }
    .panel.hidden { opacity:0; transform:translate(-50%,24px); pointer-events:none; }
    #message { min-height:1.5em; margin:0 0 10px; font-family:system-ui,sans-serif; font-size:14px; line-height:1.55; }
    .actions { display:flex; justify-content:center; gap:9px; }
    button.action { min-height:44px; padding:10px 18px; border:1px solid rgba(255,228,175,.52); border-radius:999px; color:#fff8e8; background:linear-gradient(#9c512a,#71351f); box-shadow:0 5px 18px rgba(151,74,31,.28); font:700 14px system-ui,sans-serif; cursor:pointer; }
    button.action:hover,button.action:focus-visible { filter:brightness(1.14); outline:2px solid rgba(255,229,179,.55); outline-offset:2px; }
    .hint { position:fixed; z-index:4; left:50%; top:23%; transform:translateX(-50%); padding:8px 13px; border-radius:999px; color:#fff4d7; background:rgba(4,12,20,.62); font:12px system-ui,sans-serif; pointer-events:none; opacity:0; transition:opacity .3s; white-space:nowrap; }
    .hint.show { opacity:1; }
    .start { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 38%,#19344b 0,#081724 50%,#030a10 100%); transition:opacity .8s; }
    .start.gone { opacity:0; pointer-events:none; }
    .start-card { width:min(500px,100%); text-align:center; }
    .start-lantern { position:relative; width:76px; height:94px; margin:0 auto 26px; border:7px solid #402318; background:rgba(255,195,112,.85); box-shadow:0 0 35px #ff9a3c,0 0 90px rgba(255,128,45,.35); }
    .start-lantern:before,.start-lantern:after { content:""; position:absolute; left:-13px; width:88px; height:9px; background:#281711; }
    .start-lantern:before { top:-12px; } .start-lantern:after { bottom:-12px; }
    .start h2 { margin:0; font-size:clamp(28px,8vw,46px); letter-spacing:.2em; font-weight:500; }
    .start p { margin:14px auto 24px; max-width:390px; color:#dbe4e5; font:14px/1.8 system-ui,sans-serif; }
    .start .action { padding:13px 26px; font-size:15px; }
    .credit { margin-top:12px; color:#95a6ab; font:10px system-ui,sans-serif; }
    @media (max-height:560px) { .topbar .title p{display:none}.panel{bottom:10px;padding:10px}.start-lantern{width:52px;height:62px;margin-bottom:15px}.start h2{font-size:27px}.start p{margin:9px auto 14px} }
  </style>
</head>
<body>
  <canvas id="renderCanvas" aria-label="夕暮れの川に灯籠を流す3D体験"></canvas>
  <div class="shade"></div>
  <header class="topbar">
    <div class="title"><h1>灯りの川</h1><p>TORO NAGASHI · A QUIET RIVER OF LIGHT</p></div>
    <button id="soundButton" class="sound" aria-label="環境音を消す" title="環境音">♪</button>
  </header>
  <div id="aimHint" class="hint">川の手前を選んで、灯籠を置いてください</div>
  <section id="controlPanel" class="panel hidden" aria-live="polite">
    <p id="message">あなたの灯籠を川へ送り出しましょう。</p>
    <div class="actions"><button id="lanternButton" class="action">灯籠を手に取る</button></div>
  </section>
  <div id="startScreen" class="start">
    <div class="start-card">
      <div class="start-lantern" aria-hidden="true"></div>
      <h2>灯りの川</h2>
      <p>夕暮れの水辺で、ひとつの灯籠をそっと流す短い体験です。音が流れます。</p>
      <button id="startButton" class="action">川辺へ行く</button>
      <div class="credit">画面をドラッグして見回せます · VR対応機器ではゴーグルボタンが表示されます</div>
    </div>
  </div>

  <script>
  (() => {
    "use strict";
    const canvas = document.getElementById("renderCanvas");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const controlPanel = document.getElementById("controlPanel");
    const lanternButton = document.getElementById("lanternButton");
    const message = document.getElementById("message");
    const aimHint = document.getElementById("aimHint");
    const soundButton = document.getElementById("soundButton");
    const engine = new BABYLON.Engine(canvas, true, { stencil:true, adaptToDeviceRatio:true });
    let scene, camera, water, readyLantern = null, heldLantern = null, audio = null, muted = false, releasedCount = 0;
    let flameMaterial = null, reflectionMaterial = null, woodMaterial = null, glowLayer = null;
    const paperMaterials = [];
    const floatingLanterns = [], allLanterns = [];
    const rand = (a,b) => a + Math.random() * (b-a);

    function material(name, color, emissive=null, alpha=1) {
      const m = new BABYLON.StandardMaterial(name, scene);
      m.diffuseColor = color; m.alpha = alpha;
      if (emissive) m.emissiveColor = emissive;
      return m;
    }

    function createSky() {
      const dome = BABYLON.MeshBuilder.CreateSphere("夕暮れの空", { diameter:380, segments:32, sideOrientation:BABYLON.Mesh.BACKSIDE }, scene);
      const skyMat = new BABYLON.ShaderMaterial("夕暮れ", scene, { vertex:"gradient", fragment:"gradient" }, { attributes:["position"], uniforms:["worldViewProjection","world","time"] });
      skyMat.backFaceCulling = false;
      dome.material = skyMat;
      scene.onBeforeRenderObservable.add(()=>skyMat.setFloat("time",performance.now()/1000));
    }

    BABYLON.Effect.ShadersStore.gradientVertexShader = `
      precision highp float; attribute vec3 position; uniform mat4 worldViewProjection; uniform mat4 world;
      varying vec3 vPos; void main(){ vec4 wp=world*vec4(position,1.0); vPos=normalize(wp.xyz); gl_Position=worldViewProjection*vec4(position,1.0); }`;
    BABYLON.Effect.ShadersStore.gradientFragmentShader = `
      precision highp float; varying vec3 vPos; uniform float time;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        float h=clamp(vPos.y*.72+.38,0.,1.);
        vec3 night=vec3(.006,.018,.055), blue=vec3(.035,.105,.19), dusk=vec3(.52,.135,.085);
        vec3 c=mix(dusk,blue,smoothstep(.04,.30,h)); c=mix(c,night,smoothstep(.37,.88,h));
        vec2 uv=vec2(atan(vPos.z,vPos.x)/6.2831853+.5,asin(clamp(vPos.y,-1.,1.))/3.1415926+.5);
        vec2 cells=uv*vec2(520.,260.), id=floor(cells), p=fract(cells)-.5;
        float n=hash(id), n2=hash(id+19.37); vec2 offset=vec2(hash(id+3.1),hash(id+7.7))-.5;
        float radius=mix(.032,.12,n2*n2); float star=smoothstep(radius,0.,length(p-offset))*step(.972,n);
        float twinkle=.76+.24*sin(time*(1.1+n2*2.8)+n*31.4);
        vec3 starColor=mix(vec3(.72,.82,1.),vec3(1.,.78,.52),hash(id+53.))*star*twinkle;
        float horizonFade=smoothstep(.12,.38,vPos.y);
        float milky=pow(max(0.,1.-abs(vPos.x*.62+vPos.y*.44-.08)),8.)*.045*smoothstep(.2,.75,vPos.y);
        c+=starColor*horizonFade+vec3(.25,.31,.46)*milky;
        gl_FragColor=vec4(c,1.);
      }`;

    function createLandscape() {
      const bankMat=material("川岸",new BABYLON.Color3(.055,.09,.075));
      const sandMat=material("砂",new BABYLON.Color3(.18,.16,.11));
      const barkMat=material("樹皮",new BABYLON.Color3(.045,.026,.017));
      const foliageMats=[
        material("葉の影",new BABYLON.Color3(.025,.052,.043)),
        material("葉の中間色",new BABYLON.Color3(.038,.071,.055)),
        material("葉の残照",new BABYLON.Color3(.052,.086,.064))
      ];
      [-1,1].forEach(side => {
        const bank=BABYLON.MeshBuilder.CreateGround("川岸",{width:34,height:180},scene);
        bank.position.set(side*23,-.12,50); bank.material=bankMat;
        const edge=BABYLON.MeshBuilder.CreateGround("岸辺",{width:9,height:180},scene);
        edge.position.set(side*10.7,-.055,50); edge.material=sandMat;
      });
      const foreground=BABYLON.MeshBuilder.CreateGround("足元",{width:24,height:12},scene);
      foreground.position.set(0,.02,-12); foreground.material=sandMat;
      for(let row=0;row<3;row++) for(let i=0;i<17;i++) {
        const hill=BABYLON.MeshBuilder.CreateSphere("遠景の山",{diameter:rand(20,38),segments:8},scene);
        hill.scaling.y=rand(.35,.65); hill.position.set(-105+i*13+rand(-4,4),rand(0,5),92+row*18); hill.material=bankMat;
      }
      for(let i=0;i<28;i++) {
        const side=i%2?-1:1, x=side*rand(15,29), z=rand(-8,100);
        const height=rand(3.8,6.8), trunk=BABYLON.MeshBuilder.CreateCylinder("木",{height,diameterTop:.12,diameterBottom:.38,tessellation:7},scene);
        trunk.position.set(x,height/2-.08,z); trunk.material=barkMat;
        for(let cluster=0;cluster<5;cluster++){
          const crown=BABYLON.MeshBuilder.CreateIcoSphere("重なる樹冠",{radius:rand(1.25,2.25),subdivisions:1,flat:true},scene);
          crown.scaling.set(rand(.75,1.2),rand(.8,1.45),rand(.72,1.12));
          crown.rotation.set(rand(-.25,.25),rand(0,Math.PI),rand(-.18,.18));
          crown.position.set(x+rand(-1.15,1.15),height-rand(.2,1.8),z+rand(-.85,.85));
          crown.material=foliageMats[cluster%foliageMats.length];
        }
      }
      const distantLight=material("対岸の灯り",BABYLON.Color3.Black(),new BABYLON.Color3(1,.40,.09));
      for(let i=0;i<22;i++){
        const lamp=BABYLON.MeshBuilder.CreateSphere("遠くのぼけた灯り",{diameter:rand(.07,.22),segments:6},scene);
        lamp.position.set(rand(-15,15),rand(.7,4.2),rand(96,116)); lamp.material=distantLight;
      }
    }

    function createWater() {
      water=BABYLON.MeshBuilder.CreateGround("川",{width:18,height:180,subdivisions:64},scene);
      water.position.set(0,0,50); water.isPickable=true;
      const wm=new BABYLON.WaterMaterial("ゆらぐ水面",scene,new BABYLON.Vector2(512,512));
      wm.bumpTexture=new BABYLON.Texture("https://assets.babylonjs.com/textures/waterbump.png",scene);
      wm.windForce=-1.5; wm.waveHeight=.038; wm.bumpHeight=.17; wm.waveLength=.20; wm.waveSpeed=.27; wm.colorBlendFactor=.13;
      wm.waterColor=new BABYLON.Color3(.002,.012,.018); wm.windDirection=new BABYLON.Vector2(.18,1);
      wm.specularColor=new BABYLON.Color3(.68,.72,.70); wm.specularPower=240;
      water.material=wm;
      scene.meshes.filter(mesh=>mesh!==water && mesh.name!=="足元").forEach(mesh=>wm.addToRenderList(mesh));
      return wm;
    }

    function getFlameMaterial() {
      if(flameMaterial) return flameMaterial;
      const texture=new BABYLON.DynamicTexture("炎テクスチャ",{width:128,height:256},scene,false);
      const ctx=texture.getContext(); ctx.clearRect(0,0,128,256);
      const outer=ctx.createRadialGradient(64,148,4,64,148,62);
      outer.addColorStop(0,"rgba(255,255,225,1)"); outer.addColorStop(.18,"rgba(255,230,110,.98)"); outer.addColorStop(.5,"rgba(255,105,20,.82)"); outer.addColorStop(1,"rgba(170,30,0,0)");
      ctx.fillStyle=outer; ctx.beginPath(); ctx.moveTo(64,18); ctx.bezierCurveTo(103,82,116,170,64,235); ctx.bezierCurveTo(12,170,25,82,64,18); ctx.fill(); texture.update(false);
      flameMaterial=new BABYLON.StandardMaterial("ろうそくの炎",scene); flameMaterial.diffuseTexture=texture; flameMaterial.emissiveTexture=texture; flameMaterial.opacityTexture=texture;
      flameMaterial.disableLighting=true; flameMaterial.backFaceCulling=false; flameMaterial.useAlphaFromDiffuseTexture=true;
      return flameMaterial;
    }

    function getReflectionMaterial() {
      if(reflectionMaterial) return reflectionMaterial;
      reflectionMaterial=new BABYLON.StandardMaterial("水面に途切れる灯り",scene);
      reflectionMaterial.diffuseColor=new BABYLON.Color3(1.,.62,.16); reflectionMaterial.emissiveColor=new BABYLON.Color3(1.,.30,.035);
      reflectionMaterial.alpha=.14; reflectionMaterial.disableLighting=true; reflectionMaterial.backFaceCulling=false;
      return reflectionMaterial;
    }

    function getPaperMaterial(variant=0) {
      if(paperMaterials[variant]) return paperMaterials[variant];
      const texture=new BABYLON.DynamicTexture(`和紙の繊維${variant}`,{width:256,height:256},scene,false);
      const ctx=texture.getContext(), glow=ctx.createRadialGradient(128,145,6,128,145,186);
      glow.addColorStop(0,"#fff8d9"); glow.addColorStop(.48,"#f5d28b"); glow.addColorStop(1,"#c9823e"); ctx.fillStyle=glow; ctx.fillRect(0,0,256,256);
      ctx.globalAlpha=.10;
      for(let i=0;i<460;i++){const y=rand(0,256),x=rand(0,256),length=rand(3,35);ctx.strokeStyle=i%3?"#fffdf0":"#80502c";ctx.lineWidth=rand(.2,.7);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+length*.5,y+rand(-2,2),x+length,y+rand(-1,1));ctx.stroke();}
      ctx.globalAlpha=.72; ctx.strokeStyle="#ba542e"; ctx.lineWidth=5; ctx.strokeRect(8,8,240,240);
      const motifColors=["#5c4937","#8b3b2d","#476151","#74543c"], glyphs=["祈","灯","夢","花"];
      ctx.fillStyle=motifColors[variant]; ctx.font='bold 48px "Yu Mincho",serif'; ctx.fillText(glyphs[variant],172,72);
      ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(62,218); ctx.bezierCurveTo(40,164,76,118,113,67); ctx.stroke();
      for(let leaf=0;leaf<4;leaf++){const lx=66+leaf*13,ly=186-leaf*30;ctx.beginPath();ctx.ellipse(lx+(leaf%2?17:-9),ly,18,8,leaf%2?-.65:.65,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1; texture.update(false);
      const paper=new BABYLON.PBRMaterial(`絵入りの薄い和紙${variant}`,scene); paper.albedoTexture=texture; paper.emissiveTexture=texture;
      paper.albedoColor=new BABYLON.Color3(.95,.82,.58); paper.emissiveColor=new BABYLON.Color3(.62,.22,.035);
      paper.metallic=0; paper.roughness=.97; paper.alpha=.76; paper.backFaceCulling=false;
      paper.transparencyMode=BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND; paperMaterials[variant]=paper;
      return paper;
    }

    function getWoodMaterial() {
      if(woodMaterial) return woodMaterial;
      const texture=new BABYLON.DynamicTexture("木枠の木目",{width:256,height:64},scene,false),ctx=texture.getContext();
      const base=ctx.createLinearGradient(0,0,0,64);base.addColorStop(0,"#35170d");base.addColorStop(.5,"#6c3219");base.addColorStop(1,"#261009");ctx.fillStyle=base;ctx.fillRect(0,0,256,64);
      ctx.globalAlpha=.28;for(let i=0;i<34;i++){ctx.strokeStyle=i%2?"#c06b35":"#180a06";ctx.lineWidth=rand(.4,1.5);ctx.beginPath();ctx.moveTo(0,rand(0,64));ctx.bezierCurveTo(70,rand(0,64),170,rand(0,64),256,rand(0,64));ctx.stroke();}texture.update(false);
      woodMaterial=new BABYLON.PBRMaterial("木目の木枠",scene);woodMaterial.albedoTexture=texture;woodMaterial.albedoColor=new BABYLON.Color3(.25,.12,.07);woodMaterial.metallic=0;woodMaterial.roughness=.84;
      return woodMaterial;
    }

    function createLantern(pos, scale=1, personal=false) {
      const root=new BABYLON.TransformNode(personal?"あなたの灯籠":"流れる灯籠",scene);
      root.position.copyFrom(pos); root.scaling.setAll(scale);
      const paper=getPaperMaterial(Math.floor(rand(0,4))), wood=getWoodMaterial();
      [[0,0,.36,0],[0,0,-.36,Math.PI],[.36,0,0,Math.PI/2],[-.36,0,0,-Math.PI/2]].forEach((side,index)=>{
        const panel=BABYLON.MeshBuilder.CreatePlane("灯籠の和紙",{width:.72,height:.82,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
        panel.parent=root; panel.position.set(side[0],.52,side[2]); panel.rotation.y=side[3]; panel.material=paper; panel.isPickable=false;
      });
      const base=BABYLON.MeshBuilder.CreateBox("灯籠の底板",{width:.86,height:.075,depth:.86},scene);
      base.parent=root; base.position.y=.045; base.material=wood; base.isPickable=false;
      [[.88,.055,.055,0,.98,.415],[.88,.055,.055,0,.98,-.415],[.055,.055,.78,.415,.98,0],[.055,.055,.78,-.415,.98,0]].forEach(part=>{
        const rail=BABYLON.MeshBuilder.CreateBox("開いた上面の木枠",{width:part[0],height:part[1],depth:part[2]},scene);
        rail.parent=root; rail.position.set(part[3],part[4],part[5]); rail.material=wood; rail.isPickable=false;
      });
      [[-.39,-.39],[-.39,.39],[.39,-.39],[.39,.39]].forEach(corner=>{
        const post=BABYLON.MeshBuilder.CreateBox("縦の木枠",{width:.055,height:.93,depth:.055},scene);
        post.parent=root; post.position.set(corner[0],.52,corner[1]); post.material=wood; post.isPickable=false;
      });
      const handlePath=BABYLON.Curve3.CreateQuadraticBezier(
        new BABYLON.Vector3(-.29,1.01,0),new BABYLON.Vector3(0,1.43,0),new BABYLON.Vector3(.29,1.01,0),14
      ).getPoints();
      const handle=BABYLON.MeshBuilder.CreateTube("灯籠の持ち手",{path:handlePath,radius:.012,tessellation:6,cap:BABYLON.Mesh.CAP_ALL},scene);
      handle.parent=root; handle.material=wood; handle.isPickable=false;
      const wax=material("ろうそく",new BABYLON.Color3(.82,.73,.52));
      const candle=BABYLON.MeshBuilder.CreateCylinder("ろうそく",{height:.25,diameter:.12,tessellation:16},scene); candle.parent=root; candle.position.y=.20; candle.material=wax; candle.isPickable=false;
      const wick=BABYLON.MeshBuilder.CreateCylinder("芯",{height:.10,diameter:.018,tessellation:6},scene); wick.parent=root; wick.position.y=.37; wick.material=wood; wick.isPickable=false;
      const flameRoot=new BABYLON.TransformNode("揺れる炎",scene); flameRoot.parent=root; flameRoot.position.y=.49;
      [0,Math.PI/2].forEach(rotation=>{const flame=BABYLON.MeshBuilder.CreatePlane("炎",{width:.16,height:.38,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);flame.parent=flameRoot;flame.rotation.y=rotation;flame.position.y=.08;flame.material=getFlameMaterial();flame.isPickable=false;});
      if(personal) {
        const mark=BABYLON.MeshBuilder.CreateDisc("あなたの印",{radius:.105,tessellation:28,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
        mark.parent=root; mark.position.set(0,.55,-.367); mark.rotation.y=Math.PI; mark.material=material("朱色の丸印",new BABYLON.Color3(.45,.07,.025),new BABYLON.Color3(.18,.018,.004),.58);
      }
      const reflectionParts=[];
      for(let streak=0;streak<12;streak++){
        const ripple=BABYLON.MeshBuilder.CreateDisc("途切れた水面反射",{radius:.22,tessellation:20,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
        ripple.position.set(Math.sin(streak*2.7)*.09,.018,-.10-streak*.155); ripple.rotation.x=Math.PI/2;
        ripple.scaling.set(rand(.48,1.6)*(1-streak*.035),rand(.035,.095),1); ripple.bakeCurrentTransformIntoVertices(); reflectionParts.push(ripple);
      }
      const glow=BABYLON.Mesh.MergeMeshes(reflectionParts,true,true,undefined,false,true);
      glow.name="波で途切れる灯籠の反射"; glow.parent=root; glow.material=getReflectionMaterial(); glow.isPickable=false; glow.metadata={excludeGlow:true,isReflection:true};
      if(glowLayer) glowLayer.addExcludedMesh(glow);
      let light=null;
      if(personal){light=new BABYLON.PointLight("灯籠の灯り",new BABYLON.Vector3(0,.62,0),scene);light.parent=root;light.diffuse=new BABYLON.Color3(1,.32,.075);light.intensity=.72;light.range=6;light.falloffType=BABYLON.Light.FALLOFF_PHYSICAL;}
      root.metadata={ phase:rand(0,Math.PI*2), speed:rand(.58,.8), baseX:pos.x, personal, born:performance.now(), flame:flameRoot, light, reflection:glow };
      allLanterns.push(root);
      if(water?.material?.addToRenderList) {
        root.getChildMeshes().filter(mesh=>!mesh.metadata?.isReflection).forEach(mesh=>water.material.addToRenderList(mesh));
      }
      return root;
    }

    function seedLanterns() {
      for(let i=0;i<34;i++) {
        const z=9+Math.pow(Math.random(),1.55)*98, x=rand(-6.7,6.7);
        const l=createLantern(new BABYLON.Vector3(x,.08,z),rand(.72,.95));
        l.metadata.speed=rand(.28,.55); floatingLanterns.push(l);
      }
    }

    function createLanternStand() {
      const wood=material("灯籠台",new BABYLON.Color3(.12,.055,.024));
      const stand=BABYLON.MeshBuilder.CreateBox("灯籠台",{width:2,height:.42,depth:1.45},scene);
      stand.position.set(-7.15,.18,3.2); stand.material=wood;
      readyLantern=createLantern(new BABYLON.Vector3(-7.15,.38,3.2),.86,true);
      readyLantern.getChildMeshes().forEach(mesh=>{mesh.isPickable=true;mesh.metadata={...(mesh.metadata||{}),takeLantern:true};});
      const labelTexture=new BABYLON.DynamicTexture("案内",{width:512,height:128},scene,true);
      labelTexture.hasAlpha=true; labelTexture.drawText("灯籠を手に取る",28,82,"bold 48px sans-serif","#fff2cf","rgba(4,12,18,.78)",true,true);
      const labelMat=new BABYLON.StandardMaterial("案内板",scene); labelMat.diffuseTexture=labelTexture; labelMat.emissiveTexture=labelTexture; labelMat.opacityTexture=labelTexture; labelMat.backFaceCulling=false;
      const label=BABYLON.MeshBuilder.CreatePlane("灯籠を手に取る",{width:3.2,height:.8,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
      label.position.set(-7.15,1.75,3.2); label.billboardMode=BABYLON.Mesh.BILLBOARDMODE_Y; label.material=labelMat; label.metadata={takeLantern:true};
    }

    function takeLantern() {
      if(heldLantern) return;
      heldLantern=createLantern(new BABYLON.Vector3(0,.8,2.8),1,true);
      heldLantern.metadata.held=true;
      if(readyLantern) readyLantern.setEnabled(false);
      lanternButton.textContent="灯籠を持っています"; lanternButton.disabled=true;
      message.textContent="川の手前を選んで、灯籠をそっと置いてください。";
      aimHint.classList.add("show");
    }

    function releaseLantern(point) {
      if(!heldLantern || point.z<1 || point.z>40 || Math.abs(point.x)>8.4) return;
      heldLantern.position.set(BABYLON.Scalar.Clamp(point.x,-6.7,6.7),.08,BABYLON.Scalar.Clamp(point.z,2,24));
      heldLantern.metadata.held=false; heldLantern.metadata.baseX=heldLantern.position.x; heldLantern.metadata.born=performance.now();
      floatingLanterns.push(heldLantern); heldLantern=null; releasedCount++;
      aimHint.classList.remove("show");
      lanternButton.disabled=false; lanternButton.textContent="もう一つ流す";
      if(readyLantern) readyLantern.setEnabled(true);
      message.textContent="あなたの灯りが、ゆっくり川を下っていきます。";
      setTimeout(()=>{ if(!heldLantern) message.textContent="灯りが集まり、ひとつの流れになっていきます。"; },6500);
    }

    function setupInteraction() {
      lanternButton.addEventListener("click",takeLantern);
      scene.onPointerObservable.add(info=>{
        if(info.type!==BABYLON.PointerEventTypes.POINTERDOWN) return;
        if(info.pickInfo?.pickedMesh?.metadata?.takeLantern){takeLantern();return;}
        if(!heldLantern) return;
        const pick=info.pickInfo?.pickedMesh===water ? info.pickInfo : scene.pick(scene.pointerX,scene.pointerY,m=>m===water);
        if(pick?.hit) releaseLantern(pick.pickedPoint);
      });
      scene.onBeforeRenderObservable.add(()=>{
        if(!heldLantern) return;
        const pick=scene.pick(scene.pointerX,scene.pointerY,m=>m===water);
        if(pick?.hit && pick.pickedPoint.z<40) heldLantern.position=BABYLON.Vector3.Lerp(heldLantern.position,new BABYLON.Vector3(pick.pickedPoint.x,.55,pick.pickedPoint.z),.12);
      });
    }

    function updateLanterns(t) {
      const dt=Math.min(engine.getDeltaTime()/1000,.04);
      allLanterns.forEach(l=>{
        const m=l.metadata, flicker=.92+Math.sin(t*12.7+m.phase)*.055+Math.sin(t*21.3+m.phase)*.025;
        if(m.flame){m.flame.scaling.set(.88+Math.sin(t*9.1+m.phase)*.10,flicker,1);m.flame.rotation.z=Math.sin(t*7.4+m.phase)*.07;m.flame.position.x=Math.sin(t*5.8+m.phase)*.012;}
        if(m.light)m.light.intensity=.68*flicker;
        if(m.reflection)m.reflection.scaling.x=.86+Math.sin(t*2.6+m.phase)*.16;
      });
      floatingLanterns.forEach(l=>{
        const m=l.metadata; if(m.held)return;
        l.position.z+=m.speed*dt;
        const age=(performance.now()-m.born)/1000;
        l.position.x=m.baseX+Math.sin(t*.45+m.phase)*.20+Math.sin(t*.13+m.phase)*.12;
        l.position.y=.09+Math.sin(t*1.25+m.phase)*.025;
        l.rotation.y=Math.sin(t*.34+m.phase)*.12;
        l.rotation.z=Math.sin(t*.72+m.phase)*.018;
        if(m.personal && age<35) l.scaling.setAll(1+Math.sin(t*2)*.018);
        if(l.position.z>120){l.position.z=12;l.metadata.baseX=rand(-6.5,6.5);}
      });
    }

    function makeNoiseBuffer(ctx, seconds) {
      const b=ctx.createBuffer(1,ctx.sampleRate*seconds,ctx.sampleRate),d=b.getChannelData(0);
      let last=0; for(let i=0;i<d.length;i++){const white=Math.random()*2-1;last=last*.985+white*.015;d[i]=last*3.2;} return b;
    }

    function startAudio() {
      if(audio){audio.ctx.resume();return;}
      const ctx=new (window.AudioContext||window.webkitAudioContext)(), master=ctx.createGain(); master.gain.value=.38; master.connect(ctx.destination);
      function noise(type,freq,gain){const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=makeNoiseBuffer(ctx,3);src.loop=true;filter.type=type;filter.frequency.value=freq;g.gain.value=gain;src.connect(filter).connect(g).connect(master);src.start();return g;}
      noise("lowpass",720,.52); noise("bandpass",190,.18); noise("lowpass",160,.11);
      const insectGain=ctx.createGain(); insectGain.gain.value=.025; insectGain.connect(master); audio={ctx,master};
      function chirp(){if(!audio)return;const now=ctx.currentTime;for(let i=0;i<rand(2,5);i++){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=rand(3200,4900);o.type="sine";g.gain.setValueAtTime(0,now+i*.095);g.gain.linearRampToValueAtTime(.16,now+i*.095+.012);g.gain.exponentialRampToValueAtTime(.001,now+i*.095+.07);o.connect(g).connect(insectGain);o.start(now+i*.095);o.stop(now+i*.095+.08);}setTimeout(chirp,rand(1200,3400));} chirp();
    }

    async function createScene() {
      scene=new BABYLON.Scene(engine); scene.clearColor=new BABYLON.Color4(.008,.025,.05,1); scene.ambientColor=new BABYLON.Color3(.11,.14,.19);
      scene.imageProcessingConfiguration.exposure=1.04; scene.imageProcessingConfiguration.contrast=1.18;
      scene.imageProcessingConfiguration.toneMappingEnabled=true; scene.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
      scene.imageProcessingConfiguration.vignetteEnabled=true; scene.imageProcessingConfiguration.vignetteWeight=1.35; scene.imageProcessingConfiguration.vignetteStretch=.15;
      camera=new BABYLON.ArcRotateCamera("川岸の視点",-Math.PI/2,1.25,18,new BABYLON.Vector3(0,1.2,15),scene);
      camera.attachControl(canvas,true); camera.lowerRadiusLimit=12; camera.upperRadiusLimit=22; camera.lowerBetaLimit=.86; camera.upperBetaLimit=1.47; camera.wheelPrecision=80; camera.panningSensibility=0;
      const hemi=new BABYLON.HemisphericLight("残照",new BABYLON.Vector3(0,1,-.4),scene); hemi.intensity=.48; hemi.diffuse=new BABYLON.Color3(.5,.58,.72); hemi.groundColor=new BABYLON.Color3(.18,.08,.05);
      const dusk=new BABYLON.DirectionalLight("夕暮れ",new BABYLON.Vector3(.2,-.25,.8),scene); dusk.intensity=.45; dusk.diffuse=new BABYLON.Color3(1,.38,.2);
      createSky(); createLandscape(); createWater(); seedLanterns(); createLanternStand();
      glowLayer=new BABYLON.GlowLayer("柔らかな光",scene,{blurKernelSize:48}); glowLayer.intensity=.58;
      scene.meshes.filter(mesh=>mesh.metadata?.excludeGlow).forEach(mesh=>glowLayer.addExcludedMesh(mesh));
      setupInteraction();
      try { await scene.createDefaultXRExperienceAsync({ disableTeleportation:true, uiOptions:{sessionMode:"immersive-vr",referenceSpaceType:"local-floor"}, optionalFeatures:true }); } catch(e){ console.info("WebXRはこの環境では利用できません。",e); }
      return scene;
    }

    startButton.addEventListener("click",()=>{startAudio();startScreen.classList.add("gone");controlPanel.classList.remove("hidden");setTimeout(()=>startScreen.hidden=true,850);});
    soundButton.addEventListener("click",()=>{if(!audio){startAudio();muted=false;}else{muted=!muted;audio.master.gain.setTargetAtTime(muted?0:.38,audio.ctx.currentTime,.08);}soundButton.textContent=muted?"♩":"♪";soundButton.setAttribute("aria-label",muted?"環境音を流す":"環境音を消す");});
    createScene().then(()=>{engine.runRenderLoop(()=>{updateLanterns(performance.now()/1000);scene.render();});}).catch(err=>{console.error(err);message.textContent="3Dシーンを読み込めませんでした。ページを再読み込みしてください。";controlPanel.classList.remove("hidden");});
    window.addEventListener("resize",()=>engine.resize());
  })();
  </script>
</body>
</html>
