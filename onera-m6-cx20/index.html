<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080f18">
  <title>ONERA M6 · CX20さん改造版</title>
  <style>
    :root {color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#080f18;color:#eef4fc}
    * {box-sizing:border-box} html,body {width:100%;height:100%;margin:0;overflow:hidden}
    canvas {display:block;width:100%;height:100%;touch-action:none;outline:none}
    .credit {position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:11px;color:#a8bdcf;background:#0e1926df;padding:8px 12px;border:1px solid #263849;border-radius:9px;white-space:nowrap}
    a {color:#79d2e0}.mobile-controls {display:none}
    button {font:inherit;color:inherit;background:#172637;border:1px solid #344657;border-radius:8px;padding:8px;cursor:pointer}
    .error {position:fixed;inset:0;display:grid;place-content:center;background:#080f18f5;text-align:center;padding:24px;z-index:10}
    .error[hidden] {display:none}.error p {max-width:500px;line-height:1.8}
    @media(max-width:850px) {
      .credit {top:auto;bottom:max(8px,env(safe-area-inset-bottom));font-size:10px}
      .mobile-controls {display:flex;position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;gap:5px}
      .mobile-controls button {font-size:11px;padding:8px 7px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@8.45.3/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-gui@8.45.3/babylon.gui.min.js"></script>
</head>
<body>
  <canvas id="canvas" aria-label="CX20さんによるONERA M6の気流可視化。断面表示・粒子アニメーション・マッハ数表示付き"></canvas>
  <div class="credit">CX20さん改造版 · <a href="../onera-m6/">元デモ</a> · <a href="README.md">説明</a></div>
  <nav class="mobile-controls" aria-label="操作パネル">
    <button id="analysisPanel" aria-pressed="false">解析</button>
    <button id="displayPanel" aria-pressed="false">表示</button>
    <button id="closePanel">閉じる</button>
  </nav>
  <div id="error" class="error" role="alert" hidden><h1>デモを起動できませんでした</h1><p id="errorMessage"></p><button id="retry">再読み込み</button></div>
  <script type="module" src="main.js?v=cx20-20261003"></script>
</body>
</html>
