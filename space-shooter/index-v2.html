<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gradius Style Mini Shooter</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050814;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        #renderCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        .hud {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #e9fbff;
            font-size: 15px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(69, 211, 255, 0.7);
            user-select: none;
        }

        .hud span,
        .powerBar,
        .help {
            border: 1px solid rgba(92, 221, 255, 0.34);
            border-radius: 6px;
            background: rgba(5, 12, 30, 0.7);
            box-shadow: 0 0 20px rgba(10, 160, 255, 0.13);
            padding: 8px 10px;
        }

        .powerBar {
            position: fixed;
            left: 50%;
            bottom: 16px;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, minmax(66px, 1fr));
            gap: 6px;
            width: min(520px, calc(100vw - 32px));
            padding: 8px;
            transform: translateX(-50%);
            color: #d9f7ff;
            user-select: none;
        }

        .powerSlot {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(130, 242, 255, 0.24);
            border-radius: 4px;
            padding: 7px 8px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            background: rgba(10, 24, 52, 0.74);
        }

        .powerSlot.isActive {
            border-color: rgba(255, 242, 92, 0.95);
            background: rgba(255, 214, 52, 0.22);
            color: #fff7a8;
            box-shadow: 0 0 16px rgba(255, 228, 66, 0.5);
        }

        .powerSlot.isActive::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 2px solid #fff06a;
            border-radius: 6px;
            box-shadow: 0 0 18px rgba(255, 240, 106, 0.72);
            pointer-events: none;
        }

        .powerSlot.isOwned {
            color: #88ffcc;
        }

        .powerSlot.isDisabled {
            border-color: rgba(130, 150, 170, 0.18);
            background: rgba(8, 14, 24, 0.58);
            color: rgba(190, 215, 225, 0.42);
            box-shadow: none;
        }

        .powerSlot.isDisabled.isActive {
            border-color: rgba(255, 242, 92, 0.82);
            color: rgba(255, 246, 160, 0.72);
        }

        .help {
            position: fixed;
            right: 16px;
            bottom: 86px;
            z-index: 5;
            color: #d9f7ff;
            font-size: 14px;
            line-height: 1.55;
            user-select: none;
        }

        .mobileControls {
            position: fixed;
            inset: auto 0 0;
            z-index: 14;
            display: none;
            align-items: end;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 0 18px 18px;
            pointer-events: none;
            user-select: none;
        }

        .movePad {
            position: relative;
            width: 118px;
            height: 118px;
            border: 1px solid rgba(132, 230, 255, 0.38);
            border-radius: 50%;
            background: rgba(5, 13, 30, 0.48);
            box-shadow: inset 0 0 24px rgba(82, 212, 255, 0.16), 0 0 22px rgba(15, 160, 255, 0.16);
            pointer-events: auto;
            touch-action: none;
        }

        .movePadKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 242, 120, 0.72);
            border-radius: 50%;
            background: rgba(255, 225, 78, 0.3);
            box-shadow: 0 0 18px rgba(255, 225, 78, 0.38);
            transform: translate(-50%, -50%);
        }

        .mobileActions {
            display: grid;
            grid-template-columns: 72px 92px;
            gap: 12px;
            align-items: end;
            pointer-events: auto;
        }

        .controlButton {
            display: grid;
            place-items: center;
            height: 64px;
            border: 1px solid rgba(132, 230, 255, 0.42);
            border-radius: 50%;
            background: rgba(5, 13, 30, 0.58);
            box-shadow: inset 0 0 18px rgba(82, 212, 255, 0.14), 0 0 20px rgba(15, 160, 255, 0.16);
            color: #e9fbff;
            font: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0;
            touch-action: none;
        }

        .controlButton.isPrimary {
            height: 92px;
            background: rgba(255, 215, 54, 0.24);
            border-color: rgba(255, 238, 118, 0.72);
            color: #fff7a8;
            box-shadow: inset 0 0 22px rgba(255, 225, 78, 0.15), 0 0 24px rgba(255, 225, 78, 0.22);
        }

        .controlButton.isPressed,
        .movePad.isActive {
            filter: brightness(1.25);
        }

        @media (hover: none), (pointer: coarse), (max-width: 760px) {
            .mobileControls {
                display: flex;
            }

            .help {
                display: none;
            }

            .hud {
                top: 10px;
                left: 10px;
                right: 10px;
                gap: 6px;
                font-size: 12px;
            }

            .hud span,
            .powerBar {
                padding: 6px 7px;
            }

            .powerBar {
                bottom: 142px;
                grid-template-columns: repeat(5, minmax(48px, 1fr));
                width: calc(100vw - 20px);
                gap: 4px;
            }

            .powerSlot {
                padding: 6px 4px;
                font-size: 11px;
            }

            .dialogue {
                bottom: 216px;
            }
        }

        .centerMessage {
            position: fixed;
            inset: 0;
            z-index: 6;
            display: none;
            place-items: center;
            color: #f4fbff;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 18px rgba(89, 219, 255, 0.75);
        }

        .centerMessage.isVisible {
            display: grid;
        }

        .centerMessage h1 {
            margin: 0 0 14px;
            font-size: clamp(34px, 6vw, 72px);
        }

        .centerMessage p {
            margin: 6px 0;
            font-size: clamp(15px, 2.2vw, 20px);
            color: #ccf2ff;
        }

        .titleScreen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            align-items: end;
            justify-items: start;
            box-sizing: border-box;
            padding: clamp(28px, 6vw, 72px);
            color: #f8fbff;
            background:
                linear-gradient(90deg, rgba(2, 5, 14, 0.9) 0%, rgba(3, 6, 16, 0.54) 42%, rgba(3, 6, 16, 0.08) 100%),
                linear-gradient(0deg, rgba(2, 5, 14, 0.86) 0%, rgba(2, 5, 14, 0.16) 54%, rgba(2, 5, 14, 0.36) 100%),
                url("./img/title-escape-karaage-empire.jpg") center / cover no-repeat;
            user-select: none;
        }

        .titleScreen.isHidden {
            display: none;
        }

        .titleContent {
            width: min(760px, 100%);
            text-shadow: 0 0 22px rgba(76, 214, 255, 0.7), 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .titleContent h1 {
            margin: 0 0 14px;
            font-size: clamp(38px, 8vw, 92px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .titleContent p {
            max-width: 620px;
            margin: 0 0 22px;
            color: #d9f7ff;
            font-size: clamp(15px, 2.1vw, 21px);
            font-weight: 700;
            line-height: 1.55;
        }

        .titleActions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .startButton {
            border: 1px solid rgba(255, 235, 112, 0.9);
            border-radius: 6px;
            background: rgba(255, 213, 48, 0.92);
            box-shadow: 0 0 22px rgba(255, 225, 72, 0.48);
            color: #191207;
            padding: 12px 18px;
            font: inherit;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }

        .titleHint {
            color: #aeefff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .dialogue {
            position: fixed;
            left: 50%;
            bottom: 94px;
            z-index: 12;
            display: none;
            width: min(760px, calc(100vw - 32px));
            box-sizing: border-box;
            border: 1px solid rgba(131, 230, 255, 0.42);
            border-radius: 8px;
            background: rgba(4, 10, 26, 0.86);
            box-shadow: 0 0 28px rgba(35, 180, 255, 0.22);
            padding: 14px 16px;
            transform: translateX(-50%);
            color: #eafcff;
            text-shadow: 0 0 12px rgba(80, 220, 255, 0.42);
            pointer-events: none;
        }

        .dialogue.isVisible {
            display: block;
        }

        .dialogueSpeaker {
            margin-bottom: 6px;
            color: #fff07a;
            font-size: 13px;
            font-weight: 900;
        }

        .dialogueText {
            font-size: clamp(23px, 3vw, 29px);
            font-weight: 800;
            line-height: 1.55;
            white-space: pre-line;
        }

        .powerSlot.isLocked {
            border-color: rgba(130, 150, 170, 0.18);
            background: rgba(8, 14, 24, 0.58);
            color: rgba(190, 215, 225, 0.32);
        }

        .intermission {
            position: fixed;
            inset: 0;
            z-index: 18;
            display: none;
            place-items: center;
            box-sizing: border-box;
            padding: 24px;
            background: rgba(1, 4, 13, 0.78);
            color: #f5fbff;
            text-align: center;
            text-shadow: 0 0 18px rgba(79, 213, 255, 0.68);
            user-select: none;
        }

        .intermission.isVisible {
            display: grid;
        }

        .intermissionPanel {
            width: min(760px, 100%);
            border: 1px solid rgba(128, 230, 255, 0.42);
            border-radius: 8px;
            background: rgba(5, 12, 30, 0.84);
            box-shadow: 0 0 34px rgba(48, 190, 255, 0.28);
            padding: clamp(22px, 5vw, 42px);
        }

        .intermissionImage {
            display: none;
            width: 100%;
            max-height: min(46vh, 390px);
            object-fit: cover;
            border: 1px solid rgba(144, 232, 255, 0.24);
            border-radius: 8px;
            margin-bottom: 18px;
            box-shadow: 0 0 24px rgba(33, 170, 255, 0.18);
        }

        .intermissionImage.isVisible {
            display: block;
        }

        .intermissionPanel h2 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 58px);
            letter-spacing: 0;
        }

        .intermissionPanel p {
            margin: 8px 0;
            color: #d9f7ff;
            font-size: clamp(23px, 3.15vw, 30px);
            font-weight: 800;
            line-height: 1.55;
            white-space: pre-line;
        }

        .intermissionHint {
            display: block;
            margin-top: 18px;
            color: #fff07a;
            font-size: 13px;
            font-weight: 900;
        }

        .bossHud {
            position: fixed;
            top: 70px;
            left: 50%;
            z-index: 8;
            display: none;
            width: min(620px, calc(100vw - 32px));
            transform: translateX(-50%);
            color: #ffeef5;
            text-shadow: 0 0 14px rgba(255, 92, 160, 0.7);
            user-select: none;
        }

        .bossHud.isVisible {
            display: block;
        }

        .bossName {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 900;
            text-align: center;
        }

        .bossBar {
            height: 14px;
            border: 1px solid rgba(255, 172, 208, 0.6);
            border-radius: 6px;
            overflow: hidden;
            background: rgba(32, 5, 20, 0.72);
            box-shadow: 0 0 22px rgba(255, 80, 150, 0.24);
        }

        .bossFill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff467f, #ffe66a);
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="titleScreen" class="titleScreen" aria-label="title screen">
        <div class="titleContent">
            <h1>からあげ帝国からの脱出</h1>
            <div class="titleActions">
                <button id="startButton" class="startButton" type="button">START</button>
                <span class="titleHint">Z / ENTER / SPACE</span>
            </div>
        </div>
    </div>
    <div class="hud" aria-label="game status">
        <span id="score">SCORE 0</span>
        <span id="lives">LIFE 3</span>
        <span id="wave">WAVE 1</span>
        <span id="power">READY -</span>
        <span id="weapon">SHOT</span>
    </div>
    <div id="powerBar" class="powerBar" aria-label="power up bar">
        <div class="powerSlot" data-power-index="0">SPEED</div>
        <div class="powerSlot" data-power-index="1">MISSILE</div>
        <div class="powerSlot" data-power-index="2">OPTION</div>
        <div class="powerSlot" data-power-index="3">SHIELD</div>
        <div class="powerSlot" data-power-index="4">LEMON</div>
    </div>
    <div class="help">WASD / ARROWS: MOVE<br>Z: FIRE<br>X: POWER UP<br>R: RESTART</div>
    <div id="mobileControls" class="mobileControls" aria-label="mobile controls">
        <div id="movePad" class="movePad" aria-label="move pad">
            <div id="movePadKnob" class="movePadKnob"></div>
        </div>
        <div class="mobileActions">
            <button id="powerButton" class="controlButton" type="button">POWER</button>
            <button id="fireButton" class="controlButton isPrimary" type="button">FIRE</button>
        </div>
    </div>
    <div id="dialogue" class="dialogue" aria-live="polite">
        <div id="dialogueSpeaker" class="dialogueSpeaker"></div>
        <div id="dialogueText" class="dialogueText"></div>
    </div>
    <div id="bossHud" class="bossHud" aria-label="boss status">
        <div id="bossName" class="bossName">KARAAGE EMPEROR</div>
        <div class="bossBar"><div id="bossFill" class="bossFill"></div></div>
    </div>
    <div id="intermission" class="intermission" aria-live="polite">
        <div class="intermissionPanel">
            <img id="intermissionImage" class="intermissionImage" alt="">
            <h2 id="intermissionTitle"></h2>
            <p id="intermissionText"></p>
            <span class="intermissionHint">CLICK / Z / ENTER / SPACE</span>
        </div>
    </div>
    <div id="message" class="centerMessage">
        <div>
            <h1>GAME OVER</h1>
            <p id="finalScore">SCORE 0</p>
            <p>PRESS R TO RESTART</p>
        </div>
    </div>

    <script>

        function playTone(frequency, duration, type = "square", volume = 0.2, slide = 0) {
            const context = audioState.context;
            if (!context || context.state !== "running") {
                return;
            }
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            const now = context.currentTime;
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, now);
            if (slide !== 0) {
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(30, frequency + slide), now + duration);
            }
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            oscillator.connect(gain);
            gain.connect(audioState.master);
            oscillator.start(now);
            oscillator.stop(now + duration + 0.02);
        }

        function playNoise(duration, volume = 0.18) {
            const context = audioState.context;
            if (!context || context.state !== "running") {
                return;
            }
            const length = Math.max(1, Math.floor(context.sampleRate * duration));
            const buffer = context.createBuffer(1, length, context.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / length);
            }
            const source = context.createBufferSource();
            const gain = context.createGain();
            const now = context.currentTime;
            source.buffer = buffer;
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            source.connect(gain);
            gain.connect(audioState.master);
            source.start(now);
        }

                const data = audioState.noiseBuffer.getChannelData(0);
                for (let index = 0; index < data.length; index += 1) {
                    data[index] = Math.random() * 2 - 1;
                }
            }
            return audioState.noiseBuffer;

        function scheduleSfxTone(context, options) {
            const {

            oscillator.connect(gain);

            oscillator.start(start);

        function scheduleSfxNoise(context, options) {
            const {
                start,
                duration,
                filterType = "bandpass",
                frequency = 1200,
                endFrequency = frequency,
                q = 1,
                volume = 0.15,
                attack = 0.002
            } = options;
            const source = context.createBufferSource();
            const filter = context.createBiquadFilter();
            const gain = context.createGain();
            source.buffer = getSfxNoiseBuffer(context);
            filter.type = filterType;
            filter.frequency.setValueAtTime(frequency, start);
            filter.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), start + duration);
            filter.Q.setValueAtTime(q, start);

            gain.gain.linearRampToValueAtTime(volume, start + Math.min(attack, duration * 0.35));
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            source.connect(filter);

            source.start(start);
            source.stop(start + duration + 0.01);

            if (type === "stage-clear") {

                ];
                melody.forEach(([offset, frequency, duration]) => {
                    scheduleSfxTone(context, { start: start + offset, duration, frequency, endFrequency: frequency * 1.002, type: "square", volume: 0.04, attack: 0.008 });
                    scheduleSfxTone(context, { start: start + offset, duration: duration + 0.12, frequency: frequency / 2, endFrequency: frequency / 2, type: "sine", volume: 0.06, attack: 0.01 });
                });
                [[0.0, 261.63, 0.72], [0.82, 349.23, 1.05], [1.9, 392.0, 1.15], [3.4, 261.63, 1.5]].forEach(([offset, frequency, duration]) => {
                    scheduleSfxTone(context, { start: start + offset, duration, frequency, endFrequency: frequency, type: "triangle", volume: 0.07, attack: 0.018 });
                });
                scheduleSfxNoise(context, { start, duration: 0.09, filterType: "highpass", frequency: 4800, endFrequency: 7200, volume: 0.025 });

            }
            if (type === "game-start") {
                [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
                    const noteStart = start + index * 0.14;
                    scheduleSfxTone(context, { start: noteStart, duration: 0.25, frequency, endFrequency: frequency * 1.01, type: "square", volume: 0.055, attack: 0.008 });
                    scheduleSfxTone(context, { start: noteStart, duration: 0.32, frequency: frequency / 2, endFrequency: frequency / 2, type: "sine", volume: 0.075, attack: 0.008 });

        function playSound(name) {
            try {
                initAudio();
                const context = audioState.context;
                if (!context || context.state !== "running") {
                    return;
                }
                const sfxMap = {
                    start: "game-start",
                    shot: "normal-shot",
                    missile: "missile-shot",
                    pickup: "item-pickup",
                    power: "power-up",
                    hit: "hit-normal",
                    impact: "hit-normal",
                    shield: "hit-shield",
                    shieldBreak: "shield-break",
                    explosion: "destroy-small",
                    boss: "destroy-large",
                    gameover: "destroy-large",
                    enemyShotSmall: "enemy-shot-small",
                    enemyShotLarge: "enemy-shot-large",
                    stageClear: "stage-clear"
                };
                const type = sfxMap[name];
                if (type) {
                    synthesizeSfx(type, context, context.currentTime + 0.008);
                }
            } catch (error) {
                console.warn("Audio playback skipped", error);
            }
        }

        function startMusic() {
            initAudio();
            if (!audioState.context || audioState.musicTimer) {
                return;
            }
            const notes = [110, 146.83, 164.81, 196, 164.81, 146.83, 130.81, 98];
            audioState.musicTimer = window.setInterval(() => {
                if (!state.hasStarted || state.gameOver || state.isIntermission) {
                    return;
                }
                const context = audioState.context;
                if (!context || context.state !== "running") {
                    return;
                }
                const note = notes[audioState.noteIndex % notes.length];
                audioState.noteIndex += 1;
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                const now = context.currentTime;
                oscillator.type = "triangle";
                oscillator.frequency.setValueAtTime(note, now);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
                oscillator.connect(gain);
                gain.connect(audioState.musicGain);
                oscillator.start(now);
                oscillator.stop(now + 0.28);
            }, 320);
        }

        function setTouchMoveFromEvent(event) {
            const rect = movePadEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxDistance = rect.width * 0.36;
            const dx = event.clientX - centerX;
            const dy = event.clientY - centerY;
            const distance = Math.min(maxDistance, Math.sqrt(dx * dx + dy * dy));
            const angle = Math.atan2(dy, dx);
            const knobX = Math.cos(angle) * distance;
            const knobY = Math.sin(angle) * distance;
            touchInput.x = maxDistance > 0 ? knobX / maxDistance : 0;
            touchInput.y = maxDistance > 0 ? -knobY / maxDistance : 0;
            movePadKnobEl.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
        }

        function resetTouchMove() {
            touchInput.x = 0;
            touchInput.y = 0;
            touchInput.movePointerId = null;
            movePadKnobEl.style.transform = "translate(-50%, -50%)";
            movePadEl.classList.remove("isActive");
        }

        window.addEventListener("keydown", (event) => {
            keys.add(event.code);
            playTitleMusic();
            if (!state.hasStarted && (event.code === "Enter" || event.code === "Space" || event.code === "KeyZ")) {
                event.preventDefault();
                startGame();
                return;
            }
            if (state.isIntermission && (event.code === "Enter" || event.code === "Space" || event.code === "KeyZ")) {
                event.preventDefault();
                advanceIntermission();
                return;
            }
            if (event.code === "KeyZ" || event.code === "KeyX") {
                event.preventDefault();
            }
            if (event.code === "KeyX" && !event.repeat) {
                activatePower();
            }
            if (event.code === "KeyR" && state.hasStarted) {
                resetGame();
            }
        });

        window.addEventListener("keyup", (event) => {
            keys.delete(event.code);
        });

        });

        mobileControlsEl.addEventListener("pointerdown", (event) => {

        movePadEl.addEventListener("pointerdown", (event) => {

        movePadEl.addEventListener("pointermove", (event) => {
            if (touchInput.movePointerId !== event.pointerId) {

            event.preventDefault();

        });

        ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => {
            movePadEl.addEventListener(type, (event) => {
                if (touchInput.movePointerId !== null && event.pointerId !== touchInput.movePointerId) {
                    return;

        function randomRange(value) {
            if (Array.isArray(value)) {
                return value[0] + Math.random() * (value[1] - value[0]);
            }
            return value;
        }

        function scaleEnemyShotInterval(value) {
            const interval = randomRange(value);
            return interval / enemyShotFrequencyMultiplier;
        }

        function chooseWeighted(entries) {
            const total = entries.reduce((sum, entry) => sum + entry[1], 0);
            let roll = Math.random() * total;
            for (const [key, weight] of entries) {
                roll -= weight;
                if (roll <= 0) {
                    return key;
                }
            }
            return entries[entries.length - 1][0];
        }

        function getStageEnemyTable(stageNumber) {
            if (stageNumber === 2 && state.stageElapsed >= 24) {
                return stageEnemyTables["2-late"];
            }
            return stageEnemyTables[stageNumber] || stageEnemyTables[1];
        }

        function createGlowMaterial(scene, name, color, emissiveStrength) {
            const material = new BABYLON.StandardMaterial(name, scene);
            material.diffuseColor = color.scale(0.35);
            material.emissiveColor = color.scale(emissiveStrength);
            material.specularColor = color.scale(0.25);
            return material;
        }

        function createEngineFlame(scene, materials, name, x, y, size) {
            const flame = BABYLON.MeshBuilder.CreateCylinder(name, {
                diameterTop: 0,
                diameterBottom: 0.14 * size,
                height: 0.58 * size,
                tessellation: 8
            }, scene);
            flame.rotation.z = Math.PI / 2;
            flame.position.set(x, y, 0.02);
            flame.material = materials.engine;
            return flame;
        }

        function fitImportedModelToPlayer(root, meshes) {
            const modelMeshes = meshes.filter((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
            if (modelMeshes.length === 0) {
                return;
            }

            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));
            const bounds = BABYLON.Mesh.MinMax(modelMeshes);
            const size = bounds.max.subtract(bounds.min);
            const maxDimension = Math.max(size.x, size.y, size.z);
            const scale = maxDimension > 0 ? 1.65 / maxDimension : 1;
            const center = bounds.min.add(size.scale(0.5));

            root.position.set(0, 0, 0);
            modelMeshes.forEach((mesh) => {
                mesh.position.subtractInPlace(center);
            });

            root.rotation.y = playerModelYaw;
            root.rotation.z = 0;
            root.scaling.setAll(scale);
            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));

            const fittedBounds = BABYLON.Mesh.MinMax(modelMeshes);
            const fittedCenterY = (fittedBounds.min.y + fittedBounds.max.y) * 0.5;
            root.position.x = playerModelLeftX - fittedBounds.min.x;
            root.position.y = -fittedCenterY;
        }

        function fitImportedModel(root, meshes, targetSize, rotation, scaleMultiplier = BABYLON.Vector3.One()) {
            const modelMeshes = meshes.filter((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
            if (modelMeshes.length === 0) {
                return;
            }

            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));
            const bounds = BABYLON.Mesh.MinMax(modelMeshes);
            const size = bounds.max.subtract(bounds.min);
            const maxDimension = Math.max(size.x, size.y, size.z);
            const center = bounds.min.add(size.scale(0.5));

            modelMeshes.forEach((mesh) => {
                mesh.position.subtractInPlace(center);
            });
            root.rotation.set(rotation.x, rotation.y, rotation.z);
            const scale = maxDimension > 0 ? targetSize / maxDimension : 1;
            root.scaling.set(scale * scaleMultiplier.x, scale * scaleMultiplier.y, scale * scaleMultiplier.z);
        }

        function loadModelTemplate(scene, templates, key, fileName, targetSize, rotation = BABYLON.Vector3.Zero(), scaleMultiplier = BABYLON.Vector3.One()) {
            BABYLON.SceneLoader.ImportMeshAsync("", "./", fileName, scene).then((result) => {
                const templateRoot = new BABYLON.TransformNode(`${key}Template`, scene);
                const modelRoot = new BABYLON.TransformNode(`${key}Model`, scene);
                modelRoot.parent = templateRoot;
                result.meshes.forEach((mesh) => {
                    mesh.parent = modelRoot;
                    mesh.setEnabled(false);
                });
                fitImportedModel(modelRoot, result.meshes, targetSize, rotation);
                templateRoot.scaling.set(scaleMultiplier.x, scaleMultiplier.y, scaleMultiplier.z);
                templateRoot.setEnabled(false);
                templates[key] = templateRoot;
            }).catch((error) => {
                console.warn(`Could not load ${fileName}`, error);
            });
        }

        function cloneModelTemplate(key, name) {
            const template = game.modelTemplates[key];
            if (!template) {
                return null;
            }

            const clone = template.clone(name, null, false);
            clone.setEnabled(true);
            clone.getChildMeshes(false).forEach((mesh) => {
                mesh.setEnabled(true);
            });
            return clone;
        }

        function loadPlayerModel(scene, root, fileIndex = 0) {
            const fileName = playerModelFiles[fileIndex];
            if (!fileName) {
                console.warn("Could not load any player GLB model.");
                return;
            }

            BABYLON.SceneLoader.ImportMeshAsync("", "./", fileName, scene).then((result) => {
                const importedRoot = new BABYLON.TransformNode("playerModelRoot", scene);
                result.meshes.forEach((mesh) => {
                    mesh.parent = importedRoot;
                });
                fitImportedModelToPlayer(importedRoot, result.meshes);
                importedRoot.parent = root;
                root.metadata.modelRoot = importedRoot;
            }).catch(() => {
                loadPlayerModel(scene, root, fileIndex + 1);
            });
        }

        function createPlayerShip(scene, materials) {
            const root = new BABYLON.TransformNode("playerShip", scene);
            const flameMain = createEngineFlame(scene, materials, "playerFlameMain", -1.05, -0.02, 1);
            const flameAux = createEngineFlame(scene, materials, "playerFlameAux", -1.05, -0.02, 1);
            flameMain.metadata = { baseY: -0.02, bankOffset: -1 };
            flameAux.metadata = { baseY: -0.02, bankOffset: 1 };
            flameMain.parent = root;
            flameAux.parent = root;

            root.position.set(world.minX + 1.3, 0, 0);
            root.metadata = {
                flames: [flameMain, flameAux]
            };

            loadPlayerModel(scene, root);

            return root;
        }

        function createEnemyShip(scene, materials, isAsteroid) {
            const root = new BABYLON.TransformNode(isAsteroid ? "asteroid" : "enemyDrone", scene);

            if (isAsteroid) {
                const mainRock = BABYLON.MeshBuilder.CreatePolyhedron("asteroidCore", {
                    type: 2,
                    size: 0.46 + Math.random() * 0.18
                }, scene);
                mainRock.material = materials.asteroid;
                mainRock.parent = root;

                for (let i = 0; i < 3; i++) {
                    const chip = BABYLON.MeshBuilder.CreatePolyhedron("asteroidChip", {
                        type: 1,
                        size: 0.16 + Math.random() * 0.12
                    }, scene);
                    const angle = Math.random() * Math.PI * 2;
                    chip.position.set(Math.cos(angle) * 0.32, Math.sin(angle) * 0.24, 0.03);
                    chip.rotation.set(Math.random(), Math.random(), Math.random());
                    chip.material = materials.asteroid;
                    chip.parent = root;
                }
                return root;
            }

            const body = BABYLON.MeshBuilder.CreateBox("enemyBody", {
                width: 0.48,
                height: 0.48,
                depth: 0.18
            }, scene);
            body.rotation.z = Math.PI / 4;
            body.material = materials.enemy;
            body.parent = root;

            const wingTop = BABYLON.MeshBuilder.CreateBox("enemyWingTop", {
                width: 0.48,
                height: 0.1,
                depth: 0.12
            }, scene);
            wingTop.position.set(-0.22, 0.34, 0);
            wingTop.rotation.z = -0.25;
            wingTop.material = materials.enemyWing;
            wingTop.parent = root;

            const wingBottom = wingTop.clone("enemyWingBottom");
            wingBottom.position.y = -0.34;
            wingBottom.rotation.z = 0.25;
            wingBottom.parent = root;

            const core = BABYLON.MeshBuilder.CreateSphere("enemyCore", {
                diameter: 0.2,
                segments: 12
            }, scene);
            core.position.z = -0.12;
            core.material = materials.enemyCore;
            core.parent = root;

            return root;
        }

        const game = createScene();

        function updateHud() {
            scoreEl.textContent = `SCORE ${state.score}`;
            livesEl.textContent = `LIFE ${state.lives}`;
            waveEl.textContent = `STAGE ${state.stage}`;
            powerEl.textContent = state.powerCursor >= 0 ? `READY ${powerItems[state.powerCursor]}` : "READY -";
            const mainWeapon = state.hasLaser ? "LEMON" : "SHOT";
            const missileText = state.missileLevel > 0 ? ` + MSL${state.missileLevel}` : "";
            weaponEl.textContent = `${mainWeapon}${missileText}  SPD ${state.speedLevel}`;
            powerSlots.forEach((slot, index) => {
                const disabled = isPowerMaxed(index);
                slot.classList.toggle("isActive", index === state.powerCursor);
                slot.classList.toggle("isDisabled", disabled);
                slot.classList.toggle("isLocked", index === 4 && !state.lemonUnlocked);
                slot.classList.toggle("isOwned",
                    (index === 0 && state.speedLevel > 0)
                    || (index === 1 && state.missileLevel > 0)
                    || (index === 2 && options.length > 0)
                    || (index === 3 && state.shield > 0)
                    || (index === 4 && state.hasLaser)
                );
            });
        }

        function isPowerMaxed(index) {
            switch (index) {
                case 0:
                    return state.speedLevel >= 3;
                case 1:
                    return state.missileLevel >= (state.lemonUnlocked ? 4 : 1);
                case 2:
                    return options.length >= 2;
                case 3:
                    return state.shield > 0;
                case 4:
                    return !state.lemonUnlocked || state.hasLaser;
                default:
                    return true;
            }
        }

        function advancePowerCursor() {
            for (let i = 0; i < powerItems.length; i++) {
                state.powerCursor = (state.powerCursor + 1) % powerItems.length;
                if (!isPowerMaxed(state.powerCursor)) {
                    return;
                }
            }
            state.powerCursor = -1;
        }

        function clearActiveGameObjects(options = {}) {
            const keepEnemies = !!options.keepEnemies;
            const keepCapsules = !!options.keepCapsules;
            bullets.splice(0).forEach((item) => item.dispose());
            enemyBullets.splice(0).forEach((item) => item.dispose());
            if (!keepEnemies) {
                enemies.splice(0).forEach((item) => disposeEnemy(item));
            }
            if (!keepCapsules) {
                capsules.splice(0).forEach((item) => item.dispose());
            }
            terrain.splice(0).forEach((item) => item.dispose());
            shockwaves.splice(0).forEach((item) => item.dispose());
            sparks.splice(0).forEach((item) => item.dispose());
            explosions.splice(0).forEach((item) => item.dispose());
        }

        function clearStage3IntroObjects() {
            stage3IntroObjects.splice(0).forEach((item) => {
                if (item.mesh && !item.mesh.isDisposed()) {
                    item.mesh.dispose();
                } else if (item.dispose && !item.isDisposed()) {
                    item.dispose();
                }
            });
        }

        function createStage3FallbackSupportShip(name) {

                height: 0.28,
                depth: 0.18

            }, game.scene);

            core.material = game.materials.capsuleCarrierCore;

            return root;

            }

        function updateStage3IntroCutscene(delta) {
            state.stage3IntroTimer += delta;
            const t = state.stage3IntroTimer;
            if (t <= 3.1) {
                game.camera.position.set(
                    BABYLON.Scalar.Lerp(game.camera.position.x, 8.2, Math.min(1, delta * 2)),
                    BABYLON.Scalar.Lerp(game.camera.position.y, 2.3, Math.min(1, delta * 2)),
                    BABYLON.Scalar.Lerp(game.camera.position.z, -2.0, Math.min(1, delta * 2))
                );
                game.camera.setTarget(new BABYLON.Vector3(-1.2, 0.15, 0));
            } else {
                const cameraProgress = Math.min(1, (t - 3.1) / 2.2);
                game.camera.position.x = BABYLON.Scalar.Lerp(8.2, -5.4, cameraProgress);
                game.camera.position.y = BABYLON.Scalar.Lerp(2.3, 1.15, cameraProgress);
                game.camera.position.z = BABYLON.Scalar.Lerp(-2.0, -10.8, cameraProgress);
                game.camera.setTarget(new BABYLON.Vector3(BABYLON.Scalar.Lerp(-1.2, world.maxX + 4.0, cameraProgress), 0, 0.7));
            }

            stage3IntroObjects.forEach((item) => {
                const mesh = item.mesh || item;
                if (!mesh || mesh.isDisposed()) {
                    return;
                }
                if (item.kind === "supportShip") {
                    mesh.position.x = mesh.metadata.baseX + Math.sin(t * 1.8 + mesh.metadata.phase) * 0.08;
                    mesh.position.y = mesh.metadata.baseY + Math.cos(t * 1.6 + mesh.metadata.phase) * 0.06;
                    mesh.position.z = mesh.metadata.baseZ + Math.sin(t * 1.2 + mesh.metadata.phase) * 0.05;
                    if (t > 8.0) {
                        mesh.position.x -= delta * 4.4;
                        mesh.position.y += delta * (mesh.position.y > 0 ? 0.55 : -0.55);
                    }
                } else if (item.kind === "supportMissile") {
                    if (!mesh.metadata.launched && t > mesh.metadata.launchDelay) {
                        mesh.metadata.launched = true;
                        mesh.metadata.smokeBurst = 0.18;
                    }
                    if (!mesh.metadata.launched && mesh.metadata.carrier) {
                        mesh.position.x = mesh.metadata.carrier.position.x;
                        mesh.position.y = mesh.metadata.carrier.position.y - 0.34;
                        mesh.position.z = mesh.metadata.carrier.position.z - 0.2;
                    } else {
                        const passProgress = Math.min(1, Math.max(0, (t - mesh.metadata.launchDelay) / 2.4));
                        mesh.metadata.speed = Math.min(mesh.metadata.maxSpeed, mesh.metadata.speed + mesh.metadata.acceleration * delta);
                        mesh.position.x += mesh.metadata.speed * delta;
                        mesh.position.y = BABYLON.Scalar.Lerp(mesh.position.y, mesh.metadata.offsetY, Math.min(1, delta * 1.35));
                        mesh.position.z = BABYLON.Scalar.Lerp(mesh.position.z, -0.06, Math.min(1, delta * 1.1));
                        if (mesh.position.x > game.player.position.x + 0.55) {
                            mesh.position.y = BABYLON.Scalar.Lerp(mesh.position.y, mesh.metadata.targetY, Math.min(1, delta * 0.7));
                            mesh.position.z = BABYLON.Scalar.Lerp(mesh.position.z, 0.65, Math.min(1, delta * 0.75));
                        }
                        mesh.rotation.z = Math.sin(passProgress * Math.PI) * 0.12;
                        mesh.metadata.trailTimer -= delta;
                        if (mesh.metadata.trailTimer <= 0 && mesh.position.x < world.maxX + 8.5) {
                            addSmokePuff(mesh.position, mesh.metadata.smokeBurst > 0 ? 1.45 : 1);
                            addSparks(mesh.position, 1);
                            mesh.metadata.trailTimer = 0.065;
                        }
                        mesh.metadata.smokeBurst = Math.max(0, mesh.metadata.smokeBurst - delta);
                    }
                }
            });

            if (!state.stage3IntroExploded && t > 6.4) {
                state.stage3IntroExploded = true;
                for (let i = 0; i < 34; i++) {
                    const position = new BABYLON.Vector3(
                        world.maxX - 0.3 + Math.random() * 4.2,
                        world.minY + 0.6 + Math.random() * (world.maxY - world.minY - 1.2),
                        0.55 + Math.random() * 0.42
                    );
                    addExplosionBurst(position, 0.75 + Math.random() * 0.85);
                    addSparks(position, 18);
                }
                playSound("boss");
                showDialogue("レモンジ", "あとは任せたぜ。全機反転、離脱！Good luck！！", 4.2);
            }

            if (t > 10.6 && !state.stage3IntroFinished) {
                state.stage3IntroFinished = true;
                clearStage3IntroObjects();
                resetCameraToGameplay();
                state.stage3IntroActive = false;
                state.stageElapsed = 0;
                state.enemyTimer = 0.4;
                state.formationTimer = 1.4;
                showDialogue("作戦宙域 3", stageDefinitions[2].title, 3);
            }
        }

        function updateStage(delta) {
            storyEvents.forEach((event) => {
                if (
                    event.stage === state.stage
                    && state.stageElapsed >= event.at
                    && !state.triggeredStories.has(event.id)
                ) {
                    state.triggeredStories.add(event.id);
                    showDialogue(event.speaker, event.text, 4.8);
                }
            });

            if (state.stage === 1 && !state.stage1BossSpawned) {
                updateStageOnePatterns();
            }

            if (state.stage === 1 && state.stage1CoreDefeated) {
                if (state.stage1CoreFallDone && state.stageBossCount <= 0) {
                    state.stage1ClearTimer += delta;
                }
                if (state.stage1CoreFallDone && state.stageBossCount <= 0 && state.stage1ClearTimer >= 0.6) {
                    triggerStageClear();
                }
                return;
            }

            if (state.stage === 1 && !state.stage1GuideShown && state.stageElapsed >= 20) {
                state.stage1GuideShown = true;
                showIntermission(
                    "レモンジ",
                    "そこの戦闘機！からあげを振り切ってアステロイドベルトまで来い。追っ手はそこで散らせる。",
                    "resumeStage1",
                    "img/event-lemonji-portrait.jpg",
                    { keepEnemies: true, keepCapsules: true }
                );
                return;
            }

            if (state.stage === 1 && state.stage1GuideShown && !state.stage1BossSpawned && state.stageElapsed >= 37) {
                spawnStageOneBoss();
                return;
            }

            if (state.stage === 2 && state.stage2ClearPending) {
                state.stage2ClearTimer += delta;
                if (state.stage2ClearTimer >= 0.6) {
                    triggerStageClear();
                }
                return;
            }

            if (state.stage === 2 && !state.stage2BossSpawned && state.stageElapsed >= 46) {
                spawnStageTwoBoss();
                return;
            }

            if (state.stage === 3 && !state.stage3BossSpawned && !state.stage3BossMusicCueStarted && state.stageElapsed >= 13) {
                state.stage3BossMusicCueStarted = true;
                fadeOutStage3MusicForBoss(5);
            }

            if (state.stage === 3 && !state.stage3BossSpawned && state.stageElapsed >= 18) {
                spawnFinalBoss();
                return;
            }

            const current = stageDefinitions[state.stage - 1];
            if (current && state.stageElapsed >= current.duration) {
                triggerStageClear();
            }
        }

        function updateStageOnePatterns() {
            while (
                state.stagePatternIndex < stageOnePatterns.length
                && state.stageElapsed >= stageOnePatterns[state.stagePatternIndex].at
            ) {
                spawnStageOnePattern(stageOnePatterns[state.stagePatternIndex]);
                state.stagePatternIndex += 1;
            }
        }

        function spawnStageOnePattern(pattern) {
            const startX = world.maxX + 0.8;
            if (pattern.kind === "line" || pattern.kind === "sparse") {
                for (let i = 0; i < pattern.count; i++) {
                    const y = Array.isArray(pattern.y)
                        ? pattern.y[i % pattern.y.length]
                        : BABYLON.Scalar.Clamp(pattern.y + (i - pattern.count / 2) * 0.72, world.minY + 0.5, world.maxY - 0.5);
                    spawnEnemyAt(startX, y, i * (pattern.gap || 0.6), {
                        enemyType: pattern.enemyTypes ? pattern.enemyTypes[i % pattern.enemyTypes.length] : pattern.enemyType,
                        carriesCapsule: pattern.capsuleIndex === i,
                        waveAmount: pattern.kind === "sparse" ? 0.38 : 0.18,
                        waveSpeed: 1.4,
                        wavePhase: i * 0.6
                    });
                }
                return;
            }

            if (pattern.kind === "wave") {
                for (let i = 0; i < pattern.count; i++) {
                    const phase = (pattern.phase || 0) + i * 0.78;
                    const y = BABYLON.Scalar.Clamp(
                        pattern.baseY + Math.sin(phase) * (pattern.waveAmount || 1),
                        world.minY + 0.5,
                        world.maxY - 0.5
                    );
                    spawnEnemyAt(startX, y, i * (pattern.gap || 0.5), {
                        enemyType: pattern.enemyType,
                        carriesCapsule: pattern.capsuleIndex === i,
                        waveY: pattern.baseY,
                        waveAmount: pattern.waveAmount || 1,
                        waveSpeed: pattern.waveSpeed || 1.6,
                        wavePhase: phase,
                        speedBonus: 0.1
                    });
                }
                return;
            }

            if (pattern.kind === "fighterDive") {
                for (let i = 0; i < pattern.count; i++) {
                    const phase = (pattern.phase || 0) + i * 0.82;
                    const y = BABYLON.Scalar.Clamp(
                        pattern.baseY + Math.sin(phase) * (pattern.waveAmount || 1),
                        world.minY + 0.5,
                        world.maxY - 0.5
                    );
                    spawnEnemyAt(startX + i * 0.42, y, i * (pattern.gap || 0.42), {
                        enemyType: "fighter",
                        carriesCapsule: pattern.capsuleIndex === i,
                        waveY: pattern.baseY,
                        waveAmount: pattern.waveAmount || 1,
                        waveSpeed: pattern.waveSpeed || 1.8,
                        wavePhase: phase,
                        speedBonus: 0.45,
                        depthIntroZ: pattern.fromNear ? -1.35 : 1.15,
                        depthIntroScale: pattern.fromNear ? 2 : 0.2,
                        depthIntroDuration: 3,
                        introRightX: world.maxX - 0.65,
                        introRotation: pattern.fromNear
                            ? { x: BABYLON.Tools.ToRadians(6), y: BABYLON.Tools.ToRadians(420), z: BABYLON.Tools.ToRadians(-16) }
                            : { x: BABYLON.Tools.ToRadians(-6), y: BABYLON.Tools.ToRadians(80), z: BABYLON.Tools.ToRadians(16) },
                        canShoot: true
                    });
                }
            }
        }

            if (imageSrc) {

                intermissionImageEl.removeAttribute("src");
                intermissionImageEl.classList.remove("isVisible");

        function triggerStageClear() {
            if (state.isIntermission) {
                return;
            }
            if (state.stage === 1) {
                stopStage1JourneyMusic();
                playSound("stageClear");
                showIntermission(
                    "STAGE 1 CLEAR",
                    `SCORE ${state.score} / 撃破 ${state.stageKills}。小惑星地帯への進路を確保した。`,
                    "stage1Result"
                );
                return;
            }
            if (state.stage === 2) {
                stopStage2Music();
                playSound("stageClear");
                showIntermission(
                    "STAGE 2 CLEAR",
                    `SCORE ${state.score} / 撃破 ${state.stageKills}。アステロイドベルトから脱出に成功した。`,
                    "stage2Result"
                );
            }
        }

            const definition = stageDefinitions[stageNumber - 1];
            resetCameraToGameplay();
            state.stage = stageNumber;
            state.stageElapsed = 0;
            state.enemyTimer = 0.4;
            state.formationTimer = 1.4;
            state.terrainTimer = stageNumber >= 2 ? 0.8 : 2;
            state.enemiesSinceCapsule = 0;
            state.stageKills = 0;
            state.stagePatternIndex = 0;
            state.stage1ClearTimer = 0;
            state.stage1CoreDefeated = false;

            state.stage2ClearTimer = 0;

            state.nextMediumLargeOpeningShot = 3 + Math.floor(Math.random() * 6);

            state.stage3IntroActive = false;
            state.stage3IntroTimer = 0;
            state.stage3IntroLaunched = false;
            state.stage3IntroExploded = false;
            state.stage3IntroFinished = false;
            state.stage3BossMusicCueStarted = false;
            state.stageBossCount = 0;
            state.bossEnemy = null;
            state.bossMaxHp = 1;
            bossHudEl.classList.remove("isVisible");
            if (stageNumber !== 1) {
                stopStage1JourneyMusic();
            }
            stopStage2Music();
            stopStage3Music();
            stopEndingMusic();
            stopStage3BossMusic();
            state.isIntermission = false;
            state.intermissionStep = null;

                playStage3Music();

                    playStage2Music();

                showDialogue("作戦宙域 " + stageNumber, definition.title, 3);

            updateHud();
        }

        function fireOneShot(origin, forceNormal = false, shotOwner = "player") {
            const isLaser = state.hasLaser && !forceNormal;
            const isLemonBullet = state.lemonUnlocked && !isLaser && !forceNormal && shotOwner === "player";
            const normalShotLimit = shotOwner === "player" ? 3 : 2;
            const activeOwnerShots = bullets.filter((bullet) =>
                bullet.metadata.kind === "normal" && bullet.metadata.shotOwner === shotOwner
            ).length;
            if (!isLaser && activeOwnerShots >= normalShotLimit) {
                return false;
            }
            const bullet = isLaser
                ? cloneModelTemplate("laserLemon", "laser") || BABYLON.MeshBuilder.CreateBox("laser", { width: 1.05, height: 0.08, depth: 0.08 }, game.scene)
                : BABYLON.MeshBuilder.CreateSphere("bullet", { diameter: 0.16, segments: 12 }, game.scene);
            bullet.position.set(origin.x + 0.65, origin.y, -0.05);
            bullet.metadata = {
                kind: isLaser ? "laser" : "normal",
                speed: isLaser ? 15 : 12,
                radius: isLaser ? 0.34 : isLemonBullet ? 0.18 : 0.16,
                damage: isLaser ? 3 : isLemonBullet ? 0.85 : 0.5,
                spin: isLaser ? 9.5 : 0,
                lemon: isLemonBullet,
                shotOwner
            };
            bullet.material = isLaser ? game.materials.laser : isLemonBullet ? game.materials.lemonBullet : game.materials.bullet;
            bullets.push(bullet);
            return true;
        }

        function fireMissile(origin) {
            const activeMissiles = bullets.filter((bullet) => bullet.metadata.kind === "missile").length;
            const missileLimit = state.missileLevel >= 4 ? 4 : state.missileLevel >= 3 ? 3 : 2;
            if (activeMissiles >= missileLimit) {
                return false;
            }
            const missile = state.missileLevel >= 2 ? cloneModelTemplate("missileLemon", "missile") : null;
            const missileMesh = missile || BABYLON.MeshBuilder.CreateBox("missile", {
                width: 0.42,
                height: 0.14,
                depth: 0.12
            }, game.scene);
            missileMesh.position.set(origin.x + 0.38, origin.y - 0.52, -0.04);
            missileMesh.rotation.z = -0.38;
            missileMesh.metadata = {
                kind: "missile",
                speed: 8.5,
                vx: 7.6,
                vy: -3.2,
                radius: 0.26,
                damage: state.missileLevel >= 2 ? 3 : 2,
                explosive: state.missileLevel >= 2
            };
            if (!missile) {
                missileMesh.material = game.materials.missile;
            }
            bullets.push(missileMesh);
            playSound("missile");
            return true;
        }

        function fireBullet() {
            let didFire = fireOneShot(game.player.position);
            if (state.missileLevel > 0) {
                didFire = fireMissile(game.player.position) || didFire;
            }
            options.forEach((option) => {
                didFire = fireOneShot(option.position, true, option.metadata.shotOwner) || didFire;
            });
            if (didFire) {
                playSound("shot");
            }
        }

        function addEnemyPart(enemy, part) {
            part.parent = enemy;
            enemy.metadata.parts.push(part);
            return part;
        }

        function decorateCapsuleCarrier(enemy) {
            enemy.metadata.parts = enemy.metadata.parts || [];
            enemy.getChildMeshes(false).forEach((mesh) => {
                if (mesh.name === "enemyCore") {
                    mesh.material = game.materials.capsuleCarrierCore;
                } else {
                    mesh.material = game.materials.capsuleCarrier;
                }
            });
            const ring = BABYLON.MeshBuilder.CreateTorus("capsuleCarrierRing", {
                diameter: 0.9,
                thickness: 0.035,
                tessellation: 48
            }, game.scene);
            ring.rotation.x = Math.PI / 2;
            ring.position.set(0, 0, -0.16);
            ring.material = game.materials.capsuleCarrier;
            ring.metadata = { pulse: Math.random() * Math.PI * 2 };
            addEnemyPart(enemy, ring);
        }

        function decorateEnemy(enemy, enemyType) {
            enemy.metadata.parts = [];
            if (enemyType === "corvette") {
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const orb = BABYLON.MeshBuilder.CreateSphere("corvetteArmorOrb", {
                        diameter: 0.16,
                        segments: 12
                    }, game.scene);
                    orb.position.set(Math.cos(angle) * 0.58, Math.sin(angle) * 0.58, -0.03);
                    orb.material = game.materials.corvetteArmor;
                    addEnemyPart(enemy, orb);
                }
            } else if (enemyType === "gunner") {
                [-0.22, 0.22].forEach((y) => {
                    const cannon = BABYLON.MeshBuilder.CreateCylinder("gunnerCannon", {
                        diameter: 0.07,
                        height: 0.48,
                        tessellation: 12
                    }, game.scene);
                    cannon.rotation.z = Math.PI / 2;
                    cannon.position.set(-0.28, y, -0.08);
                    cannon.material = game.materials.gunnerCannon;
                    addEnemyPart(enemy, cannon);
                });
            } else if (enemyType === "worker") {
                enemy.metadata.shields = [];
                const shieldHp = enemy.metadata.enemyConfig ? enemy.metadata.enemyConfig.shieldHp : 5;
                [-0.42, 0, 0.42].forEach((y, index) => {
                    const shield = BABYLON.MeshBuilder.CreateCylinder("workerHexShield", {
                        diameter: 0.54,
                        height: 0.035,
                        tessellation: 6
                    }, game.scene);
                    shield.rotation.x = Math.PI / 2;
                    shield.rotation.z = Math.PI / 6;
                    shield.position.set(-0.94, y, -0.49);
                    shield.material = game.materials.guardShield;
                    shield.visibility = 0.58;
                    shield.metadata = {
                        hp: shieldHp,
                        maxHp: shieldHp,
                        radius: 0.29,
                        index
                    };
                    shield.rotation.y = Math.PI / 2;
                    shield.parent = enemy;
                    enemy.metadata.shields.push(shield);
                    enemy.metadata.parts.push(shield);
                });
            }
        }

        function applyEnemyHitReaction(enemy, damage, hitPosition) {
            if (!enemy || !enemy.metadata) {
                return;
            }
            const maxHp = Math.max(0.5, enemy.metadata.maxHp || enemy.metadata.hp || 1);
            const damageRatio = BABYLON.Scalar.Clamp(damage / maxHp, 0.05, 0.8);
            const hitSide = hitPosition && hitPosition.y < enemy.position.y ? 1 : -1;
            enemy.metadata.hitKick = (enemy.metadata.hitKick || 0) + hitSide * damageRatio * 0.7;
            enemy.metadata.hitFlash = 0.12 + damageRatio * 0.18;
            enemy.metadata.hitScale = 1 + damageRatio * 0.16;
        }

        function spawnEnemyAt(x, y, delayOffset, options = {}) {
            const forcedType = options.enemyType || null;
            const asteroidChance = state.stage === 1 ? 0.12 : state.stage === 2 ? 0.62 : 0.2;
            const isAsteroid = forcedType === "asteroid" || (!forcedType && Math.random() < asteroidChance);
            const carriesCapsule = options.carriesCapsule !== undefined
                ? options.carriesCapsule
                : !forcedType && (state.enemiesSinceCapsule >= 4 || Math.random() < 0.08);
            const isHeavyKaraage = !forcedType && !carriesCapsule && state.stage >= 3 && Math.random() < 0.24;
            let enemyType = carriesCapsule ? "carrier" : forcedType || (isAsteroid ? "asteroid" : "teacherMedium");
            if (!forcedType && !carriesCapsule && !isAsteroid && !isHeavyKaraage) {
                enemyType = chooseWeighted(getStageEnemyTable(state.stage));
            }
            if (isHeavyKaraage) {
                enemyType = "teacherLarge";
            }
            const config = enemyConfigs[enemyType] || null;
            const templateKey = config ? config.template : "enemyKaraage";
            const karaageEnemy = carriesCapsule
                ? null
                : options.forceFallback
                    ? null
                    : cloneModelTemplate(templateKey, config ? config.spawnName : isAsteroid ? "karaageAsteroid" : "karaageEnemy");
            const mesh = carriesCapsule
                ? createEnemyShip(game.scene, game.materials, false)
                : karaageEnemy || createEnemyShip(game.scene, game.materials, isAsteroid);
            mesh.position.set(x + delayOffset, y, 0);
            if (options.positionZ !== undefined) {
                mesh.position.z = options.positionZ;
            }
            mesh.rotation.z = 0;
            if (enemyType === "fighter") {
                mesh.position.z = options.depthIntroZ !== undefined ? options.depthIntroZ : Math.random() < 0.5 ? -0.8 : 0.55;
                mesh.scaling.setAll(options.depthIntroScale || (mesh.position.z < 0 ? 0.48 : 1.32));
            }
            if (isAsteroid && !carriesCapsule && !isHeavyKaraage && mesh.name !== "asteroid") {
                mesh.scaling.scaleInPlace(1.16);
            }
            const speedByType = {
                carrier: 2.7,
                asteroid: 2.3
            };
            const asteroidSize = isAsteroid ? 0.72 + Math.random() * 1.58 : 1;
            const asteroidHp = isAsteroid ? Math.max(2, Math.min(10, Math.round(asteroidSize * 4.4))) : 0;
            if (isAsteroid) {
                mesh.scaling.setAll(asteroidSize);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            }
            const hpByType = {
                carrier: 0.5,
                asteroid: asteroidHp
            };
            const pointsByType = {
                carrier: 120,
                asteroid: 150
            };
            const speed = config ? randomRange(config.speed) : speedByType[enemyType];
            const waveAmount = options.waveAmount !== undefined ? options.waveAmount : config ? randomRange(config.waveAmount) : 0.28;
            const waveSpeed = options.waveSpeed !== undefined ? options.waveSpeed : config ? randomRange(config.waveSpeed) : 2.2;
            const shotInterval = scaleEnemyShotInterval(config ? config.shotInterval : 1.05 + Math.random() * 1.7);
            const defaultWorkerHoverX = enemyType === "worker" && state.stage >= 2
                ? world.maxX - (world.maxX - world.minX) * 0.42
                : undefined;
            mesh.metadata = {
                speed: (speed || 2.6) + (config ? 0 : state.stage * 0.22 + state.wave * 0.08 + Math.random() * 0.42) + (options.speedBonus || 0),
                radius: config ? config.radius : carriesCapsule ? 0.38 : isAsteroid ? 0.45 : 0.38,
                hp: config ? config.hp : hpByType[enemyType],
                maxHp: config ? config.hp : hpByType[enemyType],
                points: config ? config.points : pointsByType[enemyType],
                spin: config && config.randomSpin ? (Math.random() - 0.5) * 3.8 : 0,
                baseRotationZ: 0,
                hitKick: 0,
                hitFlash: 0,
                hitScale: 1,
                waveY: options.waveY !== undefined ? options.waveY : y,
                waveAmount: isAsteroid ? 0 : waveAmount,
                waveSpeed: isAsteroid ? 0 : waveSpeed,
                wavePhase: options.wavePhase !== undefined ? options.wavePhase : Math.random() * Math.PI * 2,
                enemyType,
                motion: isAsteroid ? "drift" : options.motion || (config ? config.motion : "sine"),
                hoverX: options.hoverX !== undefined ? options.hoverX : defaultWorkerHoverX,
                enemyConfig: config,
                driftY: isAsteroid ? (Math.random() - 0.5) * 0.45 : 0,
                asteroidSpinX: isAsteroid ? (Math.random() - 0.5) * 1.8 : 0,
                asteroidSpinY: isAsteroid ? (Math.random() - 0.5) * 1.8 : 0,
                asteroidSpinZ: isAsteroid ? (Math.random() - 0.5) * 1.8 : 0,
                dodgeCooldown: enemyType === "fighter" ? 0.25 + Math.random() * 0.35 : 0,
                dodgeTimer: 0,
                dodgeY: 0,
                dodgeDirection: 0,
                depthIntro: enemyType === "fighter" ? 0 : null,
                depthIntroStartZ: enemyType === "fighter" ? mesh.position.z : null,
                depthIntroStartScale: enemyType === "fighter" ? mesh.scaling.x : null,
                depthIntroDuration: options.depthIntroDuration || 0.75,
                introRightX: options.introRightX,
                introRotation: options.introRotation || null,
                carriesCapsule,
                canShoot: carriesCapsule
                    ? false
                    : options.canShoot !== undefined
                    ? options.canShoot
                    : !!karaageEnemy && config && config.canShoot !== false && state.stage >= 2,
                shotInterval,
                shootTimer: shotInterval,
                openingShotPending: false,
                isStageBoss: !!options.isStageBoss
            };
            if ((enemyType === "teacherMedium" || enemyType === "teacherLarge") && !options.isStageBoss) {
                state.mediumLargeSpawnShotCount += 1;
                if (state.mediumLargeSpawnShotCount >= state.nextMediumLargeOpeningShot) {
                    mesh.metadata.openingShotPending = true;
                    state.mediumLargeSpawnShotCount = 0;
                    state.nextMediumLargeOpeningShot = 3 + Math.floor(Math.random() * 6);
                }
            }
            decorateEnemy(mesh, enemyType);
            if (carriesCapsule) {
                mesh.scaling.setAll(1);
                decorateCapsuleCarrier(mesh);
            }
            if (mesh.getTotalVertices) {
                mesh.material = isAsteroid ? game.materials.asteroid : game.materials.enemy;
            }
            if (options.debugMarker) {
                const marker = BABYLON.MeshBuilder.CreateTorus("stage1WorkerMarker", {
                    diameter: 1.35,
                    thickness: 0.045,
                    tessellation: 48
                }, game.scene);
                marker.rotation.x = Math.PI / 2;
                marker.position.set(0, 0, -0.35);
                marker.material = game.materials.capsule;
                marker.parent = mesh;
                mesh.metadata.parts = mesh.metadata.parts || [];
                mesh.metadata.parts.push(marker);
            }
            state.enemiesSinceCapsule = carriesCapsule ? 0 : state.enemiesSinceCapsule + 1;
            enemies.push(mesh);
            return mesh;
        }

        function spawnEnemy() {
            spawnEnemyAt(world.maxX + 0.7, world.minY + 0.5 + Math.random() * (world.maxY - world.minY - 1), 0);
        }

        function spawnFormation() {
            const baseY = world.minY + 1 + Math.random() * (world.maxY - world.minY - 2);
            for (let i = 0; i < 5; i++) {
                const y = baseY + Math.sin(i * 0.85) * 0.75;
                spawnEnemyAt(world.maxX + 0.7, BABYLON.Scalar.Clamp(y, world.minY + 0.5, world.maxY - 0.5), i * 0.65);
            }
        }

        function spawnCapsule(position) {
            const capsule = BABYLON.MeshBuilder.CreateBox("powerCapsule", {
                width: 0.55,
                height: 0.28,
                depth: 0.14
            }, game.scene);
            capsule.position.copyFrom(position);
            capsule.position.z = -0.04;
            const ring = BABYLON.MeshBuilder.CreateTorus("powerCapsuleRing", {
                diameter: 0.78,
                thickness: 0.035,
                tessellation: 36
            }, game.scene);
            ring.rotation.x = Math.PI / 2;
            ring.position.z = -0.05;
            ring.parent = capsule;
            ring.material = game.materials.capsuleRing;
            capsule.metadata = {
                speed: 2.2,
                radius: 0.42,
                ring
            };
            capsule.material = game.materials.capsule;
            capsules.push(capsule);
        }

        function updateBossCapsuleSupply(delta, isBossActive) {
            if (!isBossActive || state.stage2ClearPending || state.isIntermission) {
                state.bossCapsuleTimer = Math.min(state.bossCapsuleTimer || 6, 6);
                return;
            }
            if (capsules.length >= 2) {
                return;
            }
            state.bossCapsuleTimer -= delta;
            if (state.bossCapsuleTimer > 0) {
                return;
            }
            spawnCapsule(new BABYLON.Vector3(
                world.maxX + 0.8,
                world.minY + 0.8 + Math.random() * (world.maxY - world.minY - 1.6),
                -0.04
            ));
            state.bossCapsuleTimer = 7 + Math.random() * 4;
        }

        function spawnTerrainBlock() {
            const top = Math.random() < 0.5;
            const height = 0.55 + Math.random() * 1.3;
            const block = BABYLON.MeshBuilder.CreateBox("terrain", {
                width: 1.6 + Math.random() * 1.2,
                height,
                depth: 0.28
            }, game.scene);
            block.position.set(world.maxX + 1.4, top ? world.maxY - height / 2 : world.minY + height / 2, 0.2);
            block.metadata = {
                speed: 2.15 + state.wave * 0.12,
                radius: Math.max(block.scaling.x, height) * 0.45
            };
            block.material = game.materials.terrain;
            terrain.push(block);
        }

        function spawnStageTwoMeteor() {
            const meteor = createEnemyShip(game.scene, game.materials, true);
            const size = 1.5 + Math.random() * 1.5;
            meteor.name = "stage2Meteor";
            meteor.position.set(
                world.maxX + 1.2 + Math.random() * 1.8,
                world.minY + 0.7 + Math.random() * (world.maxY - world.minY - 1.4),
                0.05 + Math.random() * 0.22
            );
            meteor.scaling.setAll(size);
            meteor.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            meteor.metadata = {
                kind: "meteor",
                speed: 1.35 + Math.random() * 1.35,
                vx: -(1.35 + Math.random() * 1.35),
                vy: (Math.random() - 0.5) * 0.55,
                radius: 0.45 * size,
                hp: Math.round(10 + Math.random() * 10),
                maxHp: 20,
                spinX: (Math.random() - 0.5) * 1.6,
                spinY: (Math.random() - 0.5) * 1.6,
                spinZ: (Math.random() - 0.5) * 1.6
            };
            terrain.push(meteor);
        }

        function spawnGravityAsteroid(boss) {
            const angle = boss.metadata.gravityAngle || 0;
            boss.metadata.gravityAngle = angle + 1.45;
            const y = BABYLON.Scalar.Clamp(
                boss.position.y + Math.sin(angle) * (2.2 + Math.random() * 1.3),
                world.minY + 0.6,
                world.maxY - 0.6
            );
            const asteroid = spawnEnemyAt(world.maxX + 1.4 + Math.random() * 1.4, y, 0, {
                enemyType: "asteroid",
                carriesCapsule: false,
                speedBonus: -0.45
            });
            asteroid.metadata.gravityPulled = true;
            asteroid.metadata.gravityBoss = boss;
            asteroid.metadata.driftY = (boss.position.y - y) * 0.32;
            asteroid.metadata.points = Math.max(40, asteroid.metadata.points);
        }

        function addOption() {
            if (options.length >= 2) {
                return;
            }
            const option = BABYLON.MeshBuilder.CreateSphere("option", {
                diameter: 0.36,
                segments: 16
            }, game.scene);
            option.position.set(game.player.position.x - 1.1 - options.length * 0.9, game.player.position.y, -0.08);
            option.metadata = {
                trailOffset: 10 + options.length * 14,
                shotOwner: `option-${options.length}`,
                radius: 0.22
            };
            option.material = game.materials.option;
            options.push(option);
        }

        function collectCapsule(capsule) {
            advancePowerCursor();
            state.score += 250;
            addSparks(capsule.position, 20);
            playSound("pickup");
            updateHud();
        }

        function activatePower() {
            if (state.powerCursor < 0 || state.gameOver) {
                return;
            }
            if (isPowerMaxed(state.powerCursor)) {
                return;
            }
            if (state.powerCursor === 4 && !state.lemonUnlocked) {
                return;
            }

            switch (state.powerCursor) {
                case 0:
                    state.speedLevel = Math.min(3, state.speedLevel + 1);
                    break;
                case 1:
                    state.missileLevel = Math.min(state.lemonUnlocked ? 4 : 1, state.missileLevel + 1);
                    break;
                case 2:
                    addOption();
                    break;
                case 3:
                    state.shield = 1;
                    break;
                case 4:
                    state.hasLaser = true;
                    break;
            }
            state.powerCursor = -1;
            addSparks(game.player.position, 24);
            playSound("power");
            updateHud();
        }

        function addSparks(position, count) {
            for (let i = 0; i < count; i++) {
                const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                    diameter: 0.08 + Math.random() * 0.07,
                    segments: 8
                }, game.scene);
                spark.position.copyFrom(position);
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.2 + Math.random() * 3.2;
                spark.metadata = {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.32 + Math.random() * 0.25,
                    maxLife: 0.57
                };
                spark.material = game.materials.spark;
                sparks.push(spark);
            }
        }

        function distance2D(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function disposeEnemy(enemy) {
            if (enemy.metadata && enemy.metadata.isFinalBoss) {
                disposeFinalBossCannonMeshes(enemy);
            }
            if (enemy.metadata && enemy.metadata.parts) {
                enemy.metadata.parts.forEach((part) => part.dispose());
                enemy.metadata.parts.length = 0;
            }
            enemy.dispose();
        }

        function addPlayerImpactEffect(intensity = 0.55) {
            const position = game.player.position.clone();
            addExplosionBurst(position, intensity);
            addSparks(position, Math.round(18 + intensity * 18));
        }

        function startPlayerDeathExplosion() {
            state.playerDeathTimer = 0;
            state.playerDeathNextBurst = 0;
            state.playerDeathBursts = 7;
            game.player.scaling.set(1.35, 1.35, 1.35);
        }

        function updatePlayerDeathExplosion(delta) {
            if (!state.gameOver || state.playerDeathBursts <= 0) {
                return;
            }
            state.playerDeathTimer += delta;
            state.playerDeathNextBurst -= delta;
            game.player.rotation.z += delta * 7.5;
            game.player.scaling.scaleInPlace(Math.max(0.96, 1 - delta * 0.42));
            if (state.playerDeathNextBurst <= 0) {
                const offset = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 0.9,
                    (Math.random() - 0.5) * 0.72,
                    -0.08
                );
                const burstPosition = game.player.position.add(offset);
                const isFinalBurst = state.playerDeathBursts === 1;
                addExplosionBurst(burstPosition, isFinalBurst ? 2.4 : 0.85 + Math.random() * 0.65);
                addSparks(burstPosition, isFinalBurst ? 90 : 30);
                playSound(isFinalBurst ? "boss" : "explosion");
                state.playerDeathBursts -= 1;
                state.playerDeathNextBurst = isFinalBurst ? 0.4 : 0.16 + Math.random() * 0.08;
                if (isFinalBurst) {
                    game.player.setEnabled(false);
                }
            }
        }

        function damagePlayer() {
            if (state.invincibleTimer > 0 || state.gameOver) {
                return;
            }
            if (state.shield > 0) {
                state.shield = 0;
                state.invincibleTimer = 1.2;
                game.player.scaling.set(1.25, 1.25, 1.25);
                addPlayerImpactEffect(0.45);
                playSound("hit");
                updateHud();
                return;
            }
            state.lives -= 1;
