        function addOption() {
            if (options.length >= 2) {
                return;
            }
            const option = BABYLON.MeshBuilder.CreateSphere("option", {
                diameter: 0.36,
                segments: 16
            }, game.scene);
            option.position.set(game.player.position.x - 1.1 - options.length * 0.9, game.player.position.y, -0.08);
            option.metadata = {
                trailOffset: 10 + options.length * 14,
                shotOwner: `option-${options.length}`,
                radius: 0.22
            };
            option.material = game.materials.option;
            options.push(option);
        }

        function collectCapsule(capsule) {
            advancePowerCursor();
            state.score += 250;
            addSparks(capsule.position, 20);
            updateHud();
        }

        function activatePower() {
            if (state.powerCursor < 0 || state.gameOver) {
                return;
            }
            if (isPowerMaxed(state.powerCursor)) {
                return;
            }
            if (state.powerCursor === 4 && !state.lemonUnlocked) {
                return;
            }

            switch (state.powerCursor) {
                case 0:
                    state.speedLevel = Math.min(3, state.speedLevel + 1);
                    break;
                case 1:
                    state.missileLevel = Math.min(state.lemonUnlocked ? 4 : 1, state.missileLevel + 1);
                    break;
                case 2:
                    addOption();
                    break;
                case 3:
                    state.shield = 1;
                    break;
                case 4:
                    state.hasLaser = true;
                    break;
            }
            state.powerCursor = -1;
            addSparks(game.player.position, 24);
            updateHud();
        }

        function addSparks(position, count) {
            for (let i = 0; i < count; i++) {
                const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                    diameter: 0.08 + Math.random() * 0.07,
                    segments: 8
                }, game.scene);
                spark.position.copyFrom(position);
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.2 + Math.random() * 3.2;
                spark.metadata = {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.32 + Math.random() * 0.25,
                    maxLife: 0.57
                };
                spark.material = game.materials.spark;
                sparks.push(spark);
            }
        }

        function distance2D(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function disposeEnemy(enemy) {
            if (enemy.metadata && enemy.metadata.parts) {
                enemy.metadata.parts.forEach((part) => part.dispose());
                enemy.metadata.parts.length = 0;
            }
            enemy.dispose();
        }

        function damagePlayer() {
            if (state.shield > 0) {
                state.shield = 0;
                game.player.scaling.set(1.25, 1.25, 1.25);
                addSparks(game.player.position, 24);
                updateHud();
                return;
            }
            state.lives -= 1;
            state.powerCursor = -1;
            state.missileLevel = 0;
            state.hasLaser = false;
            state.speedLevel = Math.max(0, state.speedLevel - 1);
            options.splice(0).forEach((option) => option.dispose());
            game.player.scaling.set(1.25, 1.25, 1.25);
            addSparks(game.player.position, 18);
            if (state.lives <= 0) {
                state.gameOver = true;
                finalScoreEl.textContent = `SCORE ${state.score}`;
                messageEl.classList.add("isVisible");
            }
            updateHud();
        }

        function updatePlayer(delta) {
            const velocity = new BABYLON.Vector2(0, 0);
            if (keys.has("ArrowUp") || keys.has("KeyW")) velocity.y += 1;
            if (keys.has("ArrowDown") || keys.has("KeyS")) velocity.y -= 1;
            if (keys.has("ArrowLeft") || keys.has("KeyA")) velocity.x -= 1;
            if (keys.has("ArrowRight") || keys.has("KeyD")) velocity.x += 1;
            const isMoving = velocity.lengthSquared() > 0;
            if (isMoving) {
                velocity.normalize();
                const playerSpeed = 6.1 + state.speedLevel * 0.75;
                game.player.position.x += velocity.x * playerSpeed * delta;
                game.player.position.y += velocity.y * playerSpeed * delta;
            }

            game.player.position.x = BABYLON.Scalar.Clamp(game.player.position.x, world.minX + 0.5, world.maxX - 0.5);
            game.player.position.y = BABYLON.Scalar.Clamp(game.player.position.y, world.minY + 0.45, world.maxY - 0.45);
            const modelRoot = game.player.metadata.modelRoot;
            if (modelRoot) {
                modelRoot.rotation.z = BABYLON.Scalar.Lerp(modelRoot.rotation.z, velocity.y * playerModelRoll, 0.18);
            }
            game.player.scaling.x = BABYLON.Scalar.Lerp(game.player.scaling.x, 1, 0.16);
            game.player.scaling.y = BABYLON.Scalar.Lerp(game.player.scaling.y, 1, 0.16);
            game.player.scaling.z = BABYLON.Scalar.Lerp(game.player.scaling.z, 1, 0.16);
            if (game.player.metadata.flames) {
                const pulse = 0.85 + Math.sin(state.elapsed * 22) * 0.2;
                game.player.metadata.flames.forEach((flame, index) => {
                    const flamePulse = pulse + index * 0.06;
                    const targetY = flame.metadata.baseY + velocity.y * flame.metadata.bankOffset * 0.08;
                    flame.position.y = BABYLON.Scalar.Lerp(flame.position.y, targetY, 0.18);
                    flame.scaling.x = flamePulse;
                    flame.scaling.y = flamePulse;
                });
            }

            if (isMoving) {
                playerTrail.unshift(game.player.position.clone());
                if (playerTrail.length > 80) {
                    playerTrail.length = 80;
                }
                options.forEach((option) => {
                    const target = playerTrail[option.metadata.trailOffset] || game.player.position;
                    option.position.x = BABYLON.Scalar.Lerp(option.position.x, target.x - 0.8, 0.16);
                    option.position.y = BABYLON.Scalar.Lerp(option.position.y, target.y, 0.16);
                    option.rotation.z += delta * 3.5;
                });
            }

            state.fireCooldown -= delta;
            if (keys.has("KeyZ") && state.fireCooldown <= 0) {
                fireBullet();
                state.fireCooldown = state.hasLaser ? 0.13 : 0.18;
            }
        }

        function findMissileTarget(missile) {
            let target = null;
            let bestDistance = Infinity;
            enemies.forEach((enemy) => {
                if (enemy.position.x < missile.position.x - 0.4) {
                    return;
                }
                const distance = distance2D(missile.position, enemy.position);
                if (distance < bestDistance) {
                    bestDistance = distance;
                    target = enemy;
                }
            });
            return target;
        }

        function updateMissile(missile, delta) {
            const target = findMissileTarget(missile);
            if (target) {
                const direction = new BABYLON.Vector2(
                    target.position.x - missile.position.x,
                    target.position.y - missile.position.y
                );
                if (direction.lengthSquared() > 0.0001) {
                    direction.normalize();
                    const desiredVx = direction.x * missile.metadata.speed;
                    const desiredVy = direction.y * missile.metadata.speed;
                    const turn = Math.min(1, delta * 4.2);
                    missile.metadata.vx = BABYLON.Scalar.Lerp(missile.metadata.vx, desiredVx, turn);
                    missile.metadata.vy = BABYLON.Scalar.Lerp(missile.metadata.vy, desiredVy, turn);
                }
            }

            missile.position.x += missile.metadata.vx * delta;
            missile.position.y += missile.metadata.vy * delta;
            missile.rotation.z = Math.atan2(missile.metadata.vy, missile.metadata.vx);
        }

        function fireEnemyBullet(enemy) {
            if (enemy.metadata.isFinalBoss) {
                fireBossTurrets(enemy);
                return;
            }
            if (enemy.metadata.enemyConfig && enemy.metadata.enemyConfig.ringShot) {
                fireEnemyRing(enemy);
                return;
            }
            const bullet = BABYLON.MeshBuilder.CreateSphere("enemyBullet", {
                diameter: 0.16,
                segments: 12
            }, game.scene);
            bullet.position.set(enemy.position.x - 0.32, enemy.position.y, -0.06);
            const direction = new BABYLON.Vector2(
                game.player.position.x - bullet.position.x,
                game.player.position.y - bullet.position.y
            );
            if (direction.lengthSquared() > 0.0001) {
                direction.normalize();
            } else {
                direction.set(-1, 0);
            }
            const speed = 4.6 + state.wave * 0.18;
            bullet.metadata = {
                vx: direction.x * speed,
                vy: direction.y * speed,
                radius: 0.14
            };
            bullet.material = game.materials.enemyBullet;
            enemyBullets.push(bullet);
        }

        function createEnemyAimBullet(x, y, speed = 4.6 + state.wave * 0.18, radius = 0.14, diameter = 0.16) {
            const bullet = BABYLON.MeshBuilder.CreateSphere("enemyBullet", {
                diameter,
                segments: 12
            }, game.scene);
            bullet.position.set(x, y, -0.06);
            const direction = new BABYLON.Vector2(
                game.player.position.x - bullet.position.x,
                game.player.position.y - bullet.position.y
            );
            if (direction.lengthSquared() > 0.0001) {
                direction.normalize();
            } else {
                direction.set(-1, 0);
            }
            bullet.metadata = {
                vx: direction.x * speed,
                vy: direction.y * speed,
                radius
            };
            bullet.material = game.materials.enemyBullet;
            enemyBullets.push(bullet);
            return bullet;
        }

        function fireBossTurrets(enemy) {
            const offsets = enemy.metadata.turretOffsets || [
                new BABYLON.Vector2(-1.0, 0.62),
                new BABYLON.Vector2(-1.12, 0),
                new BABYLON.Vector2(-1.0, -0.62)
            ];
            offsets.forEach((offset) => {
                createEnemyAimBullet(enemy.position.x + offset.x, enemy.position.y + offset.y, 4.2 + state.wave * 0.12, 0.15, 0.18);
            });
        }

        function fireEnemyRing(enemy) {
            const center = new BABYLON.Vector2(enemy.position.x - 0.5, enemy.position.y);
            const direction = new BABYLON.Vector2(game.player.position.x - center.x, game.player.position.y - center.y);
            if (direction.lengthSquared() > 0.0001) {
                direction.normalize();
            } else {
                direction.set(-1, 0);
            }
            const speed = 3.5 + state.wave * 0.12;
            const ringRx = enemy.metadata.radius * 0.45;
            const ringRy = enemy.metadata.radius * 0.34;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const bullet = BABYLON.MeshBuilder.CreateSphere("enemyRingBullet", {
                    diameter: 0.13,
                    segments: 10
                }, game.scene);
                bullet.position.set(center.x + Math.cos(angle) * ringRx, center.y + Math.sin(angle) * ringRy, -0.06);
                bullet.metadata = {
                    vx: direction.x * speed,
                    vy: direction.y * speed,
                    radius: 0.12,
                    ringCenterX: center.x,
                    ringCenterY: center.y,
                    ringAngle: angle,
                    ringRx,
                    ringRy,
                    ringSpin: 1.4
                };
                bullet.material = game.materials.enemyBullet;
                enemyBullets.push(bullet);
            }
        }

        function destroyEnemyAt(index, position) {
            const enemy = enemies[index];
            if (!enemy) {
                return;
            }
            state.score += enemy.metadata.points;
            state.kills += 1;
            state.stageKills += 1;
            const wasStageBoss = enemy.metadata.isStageBoss;
            const wasFinalBoss = enemy.metadata.isFinalBoss;
            if (enemy.metadata.carriesCapsule) {
                spawnCapsule(position);
            }
            addSparks(position, 22);
            disposeEnemy(enemy);
            enemies.splice(index, 1);
            if (wasStageBoss) {
                state.stageBossCount = Math.max(0, state.stageBossCount - 1);
                if (state.stage === 1 && state.stageBossCount === 0) {
                    triggerStageClear();
                }
            }
            if (wasFinalBoss) {
                state.bossEnemy = null;
                completeGame();
            }
            updateHud();
        }

        function addShockwave(position, directEnemy) {
            const shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {
                diameter: 0.22,
                thickness: 0.035,
                tessellation: 64
            }, game.scene);
            shockwave.rotation.x = Math.PI / 2;
            shockwave.position.set(position.x, position.y, -0.09);
            shockwave.material = game.materials.shockwave;
            shockwave.metadata = {
                age: 0,
                duration: 0.42,
                radius: 0.11,
                maxRadius: 1.45,
                damage: 2,
                damagedEnemies: new Set(directEnemy ? [directEnemy] : [])
            };
            shockwaves.push(shockwave);
        }

        function explodeMissile(position, directEnemy) {
            addSparks(position, 34);
            addShockwave(position, directEnemy);
        }

        function updateShockwaves(delta) {
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const shockwave = shockwaves[i];
                shockwave.metadata.age += delta;
                const progress = Math.min(1, shockwave.metadata.age / shockwave.metadata.duration);
                const radius = BABYLON.Scalar.Lerp(0.11, shockwave.metadata.maxRadius, progress);
                shockwave.metadata.radius = radius;
                shockwave.scaling.set(radius / 0.11, radius / 0.11, radius / 0.11);

                for (let k = enemies.length - 1; k >= 0; k--) {
                    const enemy = enemies[k];
                    if (shockwave.metadata.damagedEnemies.has(enemy)) {
                        continue;
                    }
                    const distance = distance2D(shockwave.position, enemy.position);
                    if (distance <= radius + enemy.metadata.radius) {
                        shockwave.metadata.damagedEnemies.add(enemy);
                        enemy.metadata.hp -= shockwave.metadata.damage;
                        if (enemy.metadata.isFinalBoss) {
                            const hpRatio = Math.max(0, enemy.metadata.hp / state.bossMaxHp);
                            bossFillEl.style.width = `${hpRatio * 100}%`;
                        }
                        addSparks(enemy.position, 10);
                        if (enemy.metadata.hp <= 0) {
                            destroyEnemyAt(k, enemy.position.clone());
                        }
                    }
                }

                if (progress >= 1) {
                    shockwave.dispose();
                    shockwaves.splice(i, 1);
                }
            }
        }

        function tryDamageEnemyShield(enemy, bullet, damage) {
            if (!enemy.metadata || !enemy.metadata.shields || enemy.metadata.shields.length === 0) {
                return false;
            }
            for (let i = enemy.metadata.shields.length - 1; i >= 0; i--) {
                const shield = enemy.metadata.shields[i];
                if (!shield || shield.isDisposed()) {
                    enemy.metadata.shields.splice(i, 1);
                    continue;
                }
                const shieldPosition = shield.getAbsolutePosition();
                if (distance2D(shieldPosition, bullet.position) < shield.metadata.radius + bullet.metadata.radius) {
                    shield.metadata.hp -= damage;
                    const hpRatio = Math.max(0, shield.metadata.hp / shield.metadata.maxHp);
                    shield.visibility = 0.18 + hpRatio * 0.4;
                    shield.scaling.set(0.65 + hpRatio * 0.35, 0.65 + hpRatio * 0.35, 1);
                    addSparks(shieldPosition, 8);
                    if (shield.metadata.hp <= 0) {
                        addSparks(shieldPosition, 16);
                        shield.dispose();
                        enemy.metadata.shields.splice(i, 1);
                    }
                    return true;
                }
            }
            return false;
        }

        function updateLists(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                if (bullet.metadata.kind === "missile") {
                    updateMissile(bullet, delta);
                } else {
                    bullet.position.x += bullet.metadata.speed * delta;
                    bullet.position.y += (bullet.metadata.vy || 0) * delta;
                    if (bullet.metadata.spin) {
                        bullet.rotation.z += bullet.metadata.spin * delta;
                        bullet.rotation.y += bullet.metadata.spin * 0.45 * delta;
                    }
                }
                if (bullet.position.x > world.maxX + 1.6 || bullet.position.y < world.minY - 1 || bullet.position.y > world.maxY + 1) {
                    bullet.dispose();
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const motion = enemy.metadata.motion || "sine";
                if (motion === "hover") {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 2.0, 0.018);
                } else if (motion === "boss") {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 2.4, 0.02);
                } else {
                    enemy.position.x -= enemy.metadata.speed * delta;
                }
                if (enemy.metadata.isStageBoss) {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 1.3, 0.025);
                }
                if (enemy.metadata.isFinalBoss) {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 1.8, 0.02);
                    enemy.metadata.waveY = 0;
                }
                const waveAmount = enemy.metadata.waveAmount === undefined ? 0.28 : enemy.metadata.waveAmount;
                const waveSpeed = enemy.metadata.waveSpeed === undefined ? 2.2 : enemy.metadata.waveSpeed;
                enemy.position.y = enemy.metadata.waveY + Math.sin(state.elapsed * waveSpeed + enemy.metadata.wavePhase) * waveAmount;
                const bankZ = BABYLON.Scalar.Clamp(
                    Math.cos(state.elapsed * waveSpeed + enemy.metadata.wavePhase) * waveAmount * waveSpeed * 0.16,
                    BABYLON.Tools.ToRadians(-20),
                    BABYLON.Tools.ToRadians(20)
                );
                enemy.rotation.z += enemy.metadata.spin * delta;
                const modelRoot = enemy.getChildren().find((child) => child.name && child.name.indexOf("Model") >= 0);
                if (modelRoot && enemy.metadata.enemyConfig) {
                    modelRoot.rotation.z = enemy.metadata.enemyConfig.rotation.z + bankZ;
                }
                if (enemy.metadata.enemyType === "corvette" && enemy.metadata.parts) {
                    enemy.metadata.parts.forEach((part, partIndex) => {
                        const angle = state.elapsed * 1.8 + (Math.PI * 2 * partIndex) / enemy.metadata.parts.length;
                        part.position.x = Math.cos(angle) * 0.58;
                        part.position.y = Math.sin(angle) * 0.58;
                    });
                }
                if (enemy.metadata.canShoot && enemy.position.x < world.maxX - 0.2 && enemy.position.x > game.player.position.x + 1.2) {
                    enemy.metadata.shootTimer -= delta;
                    if (enemy.metadata.shootTimer <= 0) {
                        const shotChance = enemy.metadata.isFinalBoss ? 0.95 : 1;
                        if (Math.random() < shotChance) {
                            fireEnemyBullet(enemy);
                        }
                        enemy.metadata.shootTimer = enemy.metadata.isFinalBoss
                            ? randomRange(enemy.metadata.shotInterval || 4)
                            : randomRange(enemy.metadata.shotInterval || 8);
                    }
                }

                if (distance2D(enemy.position, game.player.position) < enemy.metadata.radius + 0.38) {
                    addSparks(enemy.position, 14);
                    disposeEnemy(enemy);
                    enemies.splice(i, 1);
                    damagePlayer();
                    continue;
                }

                if (!enemy.metadata.isStageBoss && !enemy.metadata.isFinalBoss && enemy.position.x < world.minX - 1) {
                    disposeEnemy(enemy);
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (tryDamageEnemyShield(enemy, bullet, bullet.metadata.damage)) {
                        bullet.dispose();
                        bullets.splice(j, 1);
                        break;
                    }
                    if (distance2D(enemy.position, bullet.position) < enemy.metadata.radius + bullet.metadata.radius) {
                        const hitPosition = bullet.position.clone();
                        const enemyPosition = enemy.position.clone();
                        const bulletDamage = bullet.metadata.damage;
                        const isExplosiveMissile = bullet.metadata.kind === "missile" && bullet.metadata.explosive;
                        bullet.dispose();
                        bullets.splice(j, 1);
                        enemy.metadata.hp -= bulletDamage;
                        if (enemy.metadata.isFinalBoss) {
                            const hpRatio = Math.max(0, enemy.metadata.hp / state.bossMaxHp);
                            bossFillEl.style.width = `${hpRatio * 100}%`;
                        }
                        addSparks(hitPosition, 8);
                        if (isExplosiveMissile) {
                            explodeMissile(hitPosition, enemy);
                        }
                        if (enemy.metadata.hp <= 0) {
                            const currentIndex = enemies.indexOf(enemy);
                            if (currentIndex >= 0) {
                                destroyEnemyAt(currentIndex, enemyPosition);
                            }
                        }
                        break;
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                if (bullet.metadata.ringCenterX !== undefined) {
                    bullet.metadata.ringCenterX += bullet.metadata.vx * delta;
                    bullet.metadata.ringCenterY += bullet.metadata.vy * delta;
                    bullet.metadata.ringAngle += bullet.metadata.ringSpin * delta;
                    bullet.position.x = bullet.metadata.ringCenterX + Math.cos(bullet.metadata.ringAngle) * bullet.metadata.ringRx;
                    bullet.position.y = bullet.metadata.ringCenterY + Math.sin(bullet.metadata.ringAngle) * bullet.metadata.ringRy;
                } else {
                    bullet.position.x += bullet.metadata.vx * delta;
                    bullet.position.y += bullet.metadata.vy * delta;
                }
                bullet.rotation.z += delta * 7;

                if (distance2D(bullet.position, game.player.position) < bullet.metadata.radius + 0.38) {
                    addSparks(bullet.position, 10);
                    bullet.dispose();
                    enemyBullets.splice(i, 1);
                    damagePlayer();
                    continue;
                }

                if (
                    bullet.position.x < world.minX - 1
                    || bullet.position.x > world.maxX + 1
                    || bullet.position.y < world.minY - 1
                    || bullet.position.y > world.maxY + 1
                ) {
                    bullet.dispose();
                    enemyBullets.splice(i, 1);
                }
            }

            for (let i = capsules.length - 1; i >= 0; i--) {
                const capsule = capsules[i];
                capsule.position.x -= capsule.metadata.speed * delta;
                capsule.rotation.z += delta * 5;
                if (distance2D(capsule.position, game.player.position) < capsule.metadata.radius + 0.42) {
                    collectCapsule(capsule);
                    capsule.dispose();
                    capsules.splice(i, 1);
                    continue;
                }
                if (capsule.position.x < world.minX - 1) {
                    capsule.dispose();
                    capsules.splice(i, 1);
                }
            }

            for (let i = terrain.length - 1; i >= 0; i--) {
                const block = terrain[i];
                block.position.x -= block.metadata.speed * delta;
                if (distance2D(block.position, game.player.position) < block.metadata.radius + 0.24) {
                    addSparks(game.player.position, 18);
                    damagePlayer();
                    block.position.x = world.minX - 2;
                }
                if (block.position.x < world.minX - 2) {
                    block.dispose();
                    terrain.splice(i, 1);
                }
            }

            updateShockwaves(delta);

            for (let i = sparks.length - 1; i >= 0; i--) {
                const spark = sparks[i];
                spark.metadata.life -= delta;
                spark.position.x += spark.metadata.vx * delta;
                spark.position.y += spark.metadata.vy * delta;
                const scale = Math.max(0, spark.metadata.life / spark.metadata.maxLife);
                spark.scaling.set(scale, scale, scale);
                if (spark.metadata.life <= 0) {
                    spark.dispose();
                    sparks.splice(i, 1);
                }
            }
        }

        function updateStars(delta) {
            game.stars.forEach((star) => {
                star.position.x -= star.metadata.speed * delta;
                if (star.position.x < world.minX - 0.3) {
                    star.position.x = world.maxX + Math.random();
                    star.position.y = world.minY + Math.random() * (world.maxY - world.minY);
                }
            });
        }

        game.scene.onBeforeRenderObservable.add(() => {
            const delta = Math.min(engine.getDeltaTime() / 1000, 0.033);
            updateStars(delta);

            if (!state.hasStarted) {
                return;
            }

            if (state.isIntermission) {
                return;
            }

            if (state.gameOver) {
                return;
            }

            state.elapsed += delta;
            state.stageElapsed += delta;
            updateStage(delta);
            updateDialogue(delta);
            if (state.isIntermission) {
                return;
            }
            state.wave = 1 + Math.floor(state.elapsed / 24) + Math.max(0, state.stage - 1);
            state.enemyTimer -= delta;
            state.formationTimer -= delta;
            state.terrainTimer -= delta;

            const spawnDelay = Math.max(0.36, 1.16 - state.stage * 0.16 - state.wave * 0.04);
            const isBossActive = (state.stage === 1 && state.stage1BossSpawned) || (state.stage === 3 && state.stage3BossSpawned);
            if (state.enemyTimer <= 0 && !isBossActive) {
                spawnEnemy();
                state.enemyTimer = spawnDelay;
            }
            if (state.formationTimer <= 0 && !isBossActive) {
                spawnFormation();
                state.formationTimer = Math.max(3.8, 8.8 - state.stage * 1.1 - state.wave * 0.18);
            }
            if (state.terrainTimer <= 0) {
                spawnTerrainBlock();
                state.terrainTimer = state.stage >= 2 ? Math.max(1.9, 4.2 - state.wave * 0.16) : Math.max(3.2, 6.4 - state.wave * 0.1);
            }

            updatePlayer(delta);
            updateLists(delta);
            updateHud();
        });

        resetGame();

        engine.runRenderLoop(() => {
            game.scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
