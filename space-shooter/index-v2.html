<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gradius Style Mini Shooter</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050814;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        #renderCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        .hud {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #e9fbff;
            font-size: 15px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(69, 211, 255, 0.7);
            user-select: none;
        }

        .hud span,
        .powerBar,
        .help {
            border: 1px solid rgba(92, 221, 255, 0.34);
            border-radius: 6px;
            background: rgba(5, 12, 30, 0.7);
            box-shadow: 0 0 20px rgba(10, 160, 255, 0.13);
            padding: 8px 10px;
        }

        .powerBar {
            position: fixed;
            left: 50%;
            bottom: 16px;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, minmax(66px, 1fr));
            gap: 6px;
            width: min(520px, calc(100vw - 32px));
            padding: 8px;
            transform: translateX(-50%);
            color: #d9f7ff;
            user-select: none;
        }

        .powerSlot {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(130, 242, 255, 0.24);
            border-radius: 4px;
            padding: 7px 8px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            background: rgba(10, 24, 52, 0.74);
        }

        .powerSlot.isActive {
            border-color: rgba(255, 242, 92, 0.95);
            background: rgba(255, 214, 52, 0.22);
            color: #fff7a8;
            box-shadow: 0 0 16px rgba(255, 228, 66, 0.5);
        }

        .powerSlot.isActive::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 2px solid #fff06a;
            border-radius: 6px;
            box-shadow: 0 0 18px rgba(255, 240, 106, 0.72);
            pointer-events: none;
        }

        .powerSlot.isOwned {
            color: #88ffcc;
        }

        .powerSlot.isDisabled {
            border-color: rgba(130, 150, 170, 0.18);
            background: rgba(8, 14, 24, 0.58);
            color: rgba(190, 215, 225, 0.42);
            box-shadow: none;
        }

        .powerSlot.isDisabled.isActive {
            border-color: rgba(255, 242, 92, 0.82);
            color: rgba(255, 246, 160, 0.72);
        }

        .help {
            position: fixed;
            right: 16px;
            bottom: 86px;
            z-index: 5;
            color: #d9f7ff;
            font-size: 14px;
            line-height: 1.55;
            user-select: none;
        }

        .centerMessage {
            position: fixed;
            inset: 0;
            z-index: 6;
            display: none;
            place-items: center;
            color: #f4fbff;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 18px rgba(89, 219, 255, 0.75);
        }

        .centerMessage.isVisible {
            display: grid;
        }

        .centerMessage h1 {
            margin: 0 0 14px;
            font-size: clamp(34px, 6vw, 72px);
        }

        .centerMessage p {
            margin: 6px 0;
            font-size: clamp(15px, 2.2vw, 20px);
            color: #ccf2ff;
        }

        .titleScreen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            align-items: end;
            justify-items: start;
            box-sizing: border-box;
            padding: clamp(28px, 6vw, 72px);
            color: #f8fbff;
            background:
                linear-gradient(90deg, rgba(2, 5, 14, 0.9) 0%, rgba(3, 6, 16, 0.54) 42%, rgba(3, 6, 16, 0.08) 100%),
                linear-gradient(0deg, rgba(2, 5, 14, 0.86) 0%, rgba(2, 5, 14, 0.16) 54%, rgba(2, 5, 14, 0.36) 100%),
                url("./img/title-escape-karaage-empire.png") center / cover no-repeat;
            user-select: none;
        }

        .titleScreen.isHidden {
            display: none;
        }

        .titleContent {
            width: min(760px, 100%);
            text-shadow: 0 0 22px rgba(76, 214, 255, 0.7), 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .titleContent h1 {
            margin: 0 0 14px;
            font-size: clamp(38px, 8vw, 92px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .titleContent p {
            max-width: 620px;
            margin: 0 0 22px;
            color: #d9f7ff;
            font-size: clamp(15px, 2.1vw, 21px);
            font-weight: 700;
            line-height: 1.55;
        }

        .titleActions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .startButton {
            border: 1px solid rgba(255, 235, 112, 0.9);
            border-radius: 6px;
            background: rgba(255, 213, 48, 0.92);
            box-shadow: 0 0 22px rgba(255, 225, 72, 0.48);
            color: #191207;
            padding: 12px 18px;
            font: inherit;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }

        .titleHint {
            color: #aeefff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .dialogue {
            position: fixed;
            left: 50%;
            bottom: 94px;
            z-index: 12;
            display: none;
            width: min(760px, calc(100vw - 32px));
            box-sizing: border-box;
            border: 1px solid rgba(131, 230, 255, 0.42);
            border-radius: 8px;
            background: rgba(4, 10, 26, 0.86);
            box-shadow: 0 0 28px rgba(35, 180, 255, 0.22);
            padding: 14px 16px;
            transform: translateX(-50%);
            color: #eafcff;
            text-shadow: 0 0 12px rgba(80, 220, 255, 0.42);
            pointer-events: none;
        }

        .dialogue.isVisible {
            display: block;
        }

        .dialogueSpeaker {
            margin-bottom: 6px;
            color: #fff07a;
            font-size: 13px;
            font-weight: 900;
        }

        .dialogueText {
            font-size: clamp(15px, 2vw, 19px);
            font-weight: 800;
            line-height: 1.55;
        }

        .powerSlot.isLocked {
            border-color: rgba(130, 150, 170, 0.18);
            background: rgba(8, 14, 24, 0.58);
            color: rgba(190, 215, 225, 0.32);
        }

        .intermission {
            position: fixed;
            inset: 0;
            z-index: 18;
            display: none;
            place-items: center;
            box-sizing: border-box;
            padding: 24px;
            background: rgba(1, 4, 13, 0.78);
            color: #f5fbff;
            text-align: center;
            text-shadow: 0 0 18px rgba(79, 213, 255, 0.68);
            user-select: none;
        }

        .intermission.isVisible {
            display: grid;
        }

        .intermissionPanel {
            width: min(760px, 100%);
            border: 1px solid rgba(128, 230, 255, 0.42);
            border-radius: 8px;
            background: rgba(5, 12, 30, 0.84);
            box-shadow: 0 0 34px rgba(48, 190, 255, 0.28);
            padding: clamp(22px, 5vw, 42px);
        }

        .intermissionImage {
            display: none;
            width: 100%;
            max-height: min(46vh, 390px);
            object-fit: cover;
            border: 1px solid rgba(144, 232, 255, 0.24);
            border-radius: 8px;
            margin-bottom: 18px;
            box-shadow: 0 0 24px rgba(33, 170, 255, 0.18);
        }

        .intermissionImage.isVisible {
            display: block;
        }

        .intermissionPanel h2 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 58px);
            letter-spacing: 0;
        }

        .intermissionPanel p {
            margin: 8px 0;
            color: #d9f7ff;
            font-size: clamp(15px, 2.1vw, 20px);
            font-weight: 800;
            line-height: 1.55;
        }

        .intermissionHint {
            display: block;
            margin-top: 18px;
            color: #fff07a;
            font-size: 13px;
            font-weight: 900;
        }

        .bossHud {
            position: fixed;
            top: 70px;
            left: 50%;
            z-index: 8;
            display: none;
            width: min(620px, calc(100vw - 32px));
            transform: translateX(-50%);
            color: #ffeef5;
            text-shadow: 0 0 14px rgba(255, 92, 160, 0.7);
            user-select: none;
        }

        .bossHud.isVisible {
            display: block;
        }

        .bossName {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 900;
            text-align: center;
        }

        .bossBar {
            height: 14px;
            border: 1px solid rgba(255, 172, 208, 0.6);
            border-radius: 6px;
            overflow: hidden;
            background: rgba(32, 5, 20, 0.72);
            box-shadow: 0 0 22px rgba(255, 80, 150, 0.24);
        }

        .bossFill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff467f, #ffe66a);
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="titleScreen" class="titleScreen" aria-label="title screen">
        <div class="titleContent">
            <h1>からあげ帝国からの脱出</h1>
            <p>事故で迷い込んだ帝国空域。背後から迫るからあげの大群を振り切り、レモンジの導きで故郷の惑星を目指せ。</p>
            <div class="titleActions">
                <button id="startButton" class="startButton" type="button">START</button>
                <span class="titleHint">Z / ENTER / SPACE</span>
            </div>
        </div>
    </div>
    <div class="hud" aria-label="game status">
        <span id="score">SCORE 0</span>
        <span id="lives">LIFE 3</span>
        <span id="wave">WAVE 1</span>
        <span id="power">READY -</span>
        <span id="weapon">SHOT</span>
    </div>
    <div id="powerBar" class="powerBar" aria-label="power up bar">
        <div class="powerSlot" data-power-index="0">SPEED</div>
        <div class="powerSlot" data-power-index="1">MISSILE</div>
        <div class="powerSlot" data-power-index="2">OPTION</div>
        <div class="powerSlot" data-power-index="3">SHIELD</div>
        <div class="powerSlot" data-power-index="4">LEMON</div>
    </div>
    <div class="help">WASD / ARROWS: MOVE<br>Z: FIRE<br>X: POWER UP<br>R: RESTART</div>
    <div id="dialogue" class="dialogue" aria-live="polite">
        <div id="dialogueSpeaker" class="dialogueSpeaker"></div>
        <div id="dialogueText" class="dialogueText"></div>
    </div>
    <div id="bossHud" class="bossHud" aria-label="boss status">
        <div id="bossName" class="bossName">KARAAGE EMPEROR</div>
        <div class="bossBar"><div id="bossFill" class="bossFill"></div></div>
    </div>
    <div id="intermission" class="intermission" aria-live="polite">
        <div class="intermissionPanel">
            <img id="intermissionImage" class="intermissionImage" alt="">
            <h2 id="intermissionTitle"></h2>
            <p id="intermissionText"></p>
            <span class="intermissionHint">CLICK / Z / ENTER / SPACE</span>
        </div>
    </div>
    <div id="message" class="centerMessage">
        <div>
            <h1>GAME OVER</h1>
            <p id="finalScore">SCORE 0</p>
            <p>PRESS R TO RESTART</p>
        </div>
    </div>

        const state = {

        };

        const keys = new Set();
        const bullets = [];
        const enemyBullets = [];
        const enemies = [];
        const capsules = [];
        const options = [];
        const terrain = [];
        const shockwaves = [];
        const sparks = [];

        window.addEventListener("keydown", (event) => {
            keys.add(event.code);
            if (!state.hasStarted && (event.code === "Enter" || event.code === "Space" || event.code === "KeyZ")) {
                event.preventDefault();
                startGame();
                return;
            }
            if (state.isIntermission && (event.code === "Enter" || event.code === "Space" || event.code === "KeyZ")) {
                event.preventDefault();
                advanceIntermission();
                return;
            }
            if (event.code === "KeyZ" || event.code === "KeyX") {
                event.preventDefault();
            }
            if (event.code === "KeyX" && !event.repeat) {
                activatePower();
            }
            if (event.code === "KeyR" && state.hasStarted) {
                resetGame();
            }
        });

        window.addEventListener("keyup", (event) => {
            keys.delete(event.code);
        });

        startButtonEl.addEventListener("click", () => {
            startGame();
        });

        intermissionEl.addEventListener("click", () => {
            advanceIntermission();
        });

        function randomRange(value) {
            if (Array.isArray(value)) {
                return value[0] + Math.random() * (value[1] - value[0]);
            }
            return value;
        }

        function createGlowMaterial(scene, name, color, emissiveStrength) {
            const material = new BABYLON.StandardMaterial(name, scene);
            material.diffuseColor = color.scale(0.35);
            material.emissiveColor = color.scale(emissiveStrength);
            material.specularColor = color.scale(0.25);
            return material;
        }

        function createEngineFlame(scene, materials, name, x, y, size) {
            const flame = BABYLON.MeshBuilder.CreateCylinder(name, {
                diameterTop: 0,
                diameterBottom: 0.14 * size,
                height: 0.58 * size,
                tessellation: 8
            }, scene);
            flame.rotation.z = Math.PI / 2;
            flame.position.set(x, y, 0.02);
            flame.material = materials.engine;
            return flame;
        }

        function fitImportedModelToPlayer(root, meshes) {
            const modelMeshes = meshes.filter((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
            if (modelMeshes.length === 0) {
                return;
            }

            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));
            const bounds = BABYLON.Mesh.MinMax(modelMeshes);
            const size = bounds.max.subtract(bounds.min);
            const maxDimension = Math.max(size.x, size.y, size.z);
            const scale = maxDimension > 0 ? 1.65 / maxDimension : 1;
            const center = bounds.min.add(size.scale(0.5));

            root.position.set(0, 0, 0);
            modelMeshes.forEach((mesh) => {
                mesh.position.subtractInPlace(center);
            });

            root.rotation.y = playerModelYaw;
            root.rotation.z = 0;
            root.scaling.setAll(scale);
            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));

            const fittedBounds = BABYLON.Mesh.MinMax(modelMeshes);
            const fittedCenterY = (fittedBounds.min.y + fittedBounds.max.y) * 0.5;
            root.position.x = playerModelLeftX - fittedBounds.min.x;
            root.position.y = -fittedCenterY;
        }

        function fitImportedModel(root, meshes, targetSize, rotation, scaleMultiplier = BABYLON.Vector3.One()) {
            const modelMeshes = meshes.filter((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
            if (modelMeshes.length === 0) {
                return;
            }

            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));
            const bounds = BABYLON.Mesh.MinMax(modelMeshes);
            const size = bounds.max.subtract(bounds.min);
            const maxDimension = Math.max(size.x, size.y, size.z);
            const center = bounds.min.add(size.scale(0.5));

            modelMeshes.forEach((mesh) => {
                mesh.position.subtractInPlace(center);
            });
            root.rotation.set(rotation.x, rotation.y, rotation.z);
            const scale = maxDimension > 0 ? targetSize / maxDimension : 1;
            root.scaling.set(scale * scaleMultiplier.x, scale * scaleMultiplier.y, scale * scaleMultiplier.z);
        }

        function loadModelTemplate(scene, templates, key, fileName, targetSize, rotation = BABYLON.Vector3.Zero(), scaleMultiplier = BABYLON.Vector3.One()) {
            BABYLON.SceneLoader.ImportMeshAsync("", "./", fileName, scene).then((result) => {
                const templateRoot = new BABYLON.TransformNode(`${key}Template`, scene);
                const modelRoot = new BABYLON.TransformNode(`${key}Model`, scene);
                modelRoot.parent = templateRoot;
                result.meshes.forEach((mesh) => {
                    mesh.parent = modelRoot;
                    mesh.setEnabled(false);
                });
                fitImportedModel(modelRoot, result.meshes, targetSize, rotation);
                templateRoot.scaling.set(scaleMultiplier.x, scaleMultiplier.y, scaleMultiplier.z);
                templateRoot.setEnabled(false);
                templates[key] = templateRoot;
            }).catch((error) => {
                console.warn(`Could not load ${fileName}`, error);
            });
        }

        function cloneModelTemplate(key, name) {
            const template = game.modelTemplates[key];
            if (!template) {
                return null;
            }

            const clone = template.clone(name, null, false);
            clone.setEnabled(true);
            clone.getChildMeshes(false).forEach((mesh) => {
                mesh.setEnabled(true);
            });
            return clone;
        }

        function loadPlayerModel(scene, root, fileIndex = 0) {
            const fileName = playerModelFiles[fileIndex];
            if (!fileName) {
                console.warn("Could not load any player GLB model.");
                return;
            }

            BABYLON.SceneLoader.ImportMeshAsync("", "./", fileName, scene).then((result) => {
                const importedRoot = new BABYLON.TransformNode("playerModelRoot", scene);
                result.meshes.forEach((mesh) => {
                    mesh.parent = importedRoot;
                });
                fitImportedModelToPlayer(importedRoot, result.meshes);
                importedRoot.parent = root;
                root.metadata.modelRoot = importedRoot;
            }).catch(() => {
                loadPlayerModel(scene, root, fileIndex + 1);
            });
        }

        function createPlayerShip(scene, materials) {
            const root = new BABYLON.TransformNode("playerShip", scene);
            const flameMain = createEngineFlame(scene, materials, "playerFlameMain", -1.05, -0.02, 1);
            const flameAux = createEngineFlame(scene, materials, "playerFlameAux", -1.05, -0.02, 1);
            flameMain.metadata = { baseY: -0.02, bankOffset: -1 };
            flameAux.metadata = { baseY: -0.02, bankOffset: 1 };
            flameMain.parent = root;
            flameAux.parent = root;

            root.position.set(world.minX + 1.3, 0, 0);
            root.metadata = {
                flames: [flameMain, flameAux]
            };

            loadPlayerModel(scene, root);

            return root;
        }

        function createEnemyShip(scene, materials, isAsteroid) {
            const root = new BABYLON.TransformNode(isAsteroid ? "asteroid" : "enemyDrone", scene);

            if (isAsteroid) {
                const mainRock = BABYLON.MeshBuilder.CreatePolyhedron("asteroidCore", {
                    type: 2,
                    size: 0.46 + Math.random() * 0.18
                }, scene);
                mainRock.material = materials.asteroid;
                mainRock.parent = root;

                for (let i = 0; i < 3; i++) {
                    const chip = BABYLON.MeshBuilder.CreatePolyhedron("asteroidChip", {
                        type: 1,
                        size: 0.16 + Math.random() * 0.12
                    }, scene);
                    const angle = Math.random() * Math.PI * 2;
                    chip.position.set(Math.cos(angle) * 0.32, Math.sin(angle) * 0.24, 0.03);
                    chip.rotation.set(Math.random(), Math.random(), Math.random());
                    chip.material = materials.asteroid;
                    chip.parent = root;
                }
                return root;
            }

            const body = BABYLON.MeshBuilder.CreateBox("enemyBody", {
                width: 0.48,
                height: 0.48,
                depth: 0.18
            }, scene);
            body.rotation.z = Math.PI / 4;
            body.material = materials.enemy;
            body.parent = root;

            const wingTop = BABYLON.MeshBuilder.CreateBox("enemyWingTop", {
                width: 0.48,
                height: 0.1,
                depth: 0.12
            }, scene);
            wingTop.position.set(-0.22, 0.34, 0);
            wingTop.rotation.z = -0.25;
            wingTop.material = materials.enemyWing;
            wingTop.parent = root;

            const wingBottom = wingTop.clone("enemyWingBottom");
            wingBottom.position.y = -0.34;
            wingBottom.rotation.z = 0.25;
            wingBottom.parent = root;

            const core = BABYLON.MeshBuilder.CreateSphere("enemyCore", {
                diameter: 0.2,
                segments: 12
            }, scene);
            core.position.z = -0.12;
            core.material = materials.enemyCore;
            core.parent = root;

            return root;
        }

        function createScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.012, 0.018, 0.05, 1);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 0, -1), scene);

            const glow = new BABYLON.GlowLayer("glow", scene);

            const materials = {

                shockwave: createGlowMaterial(scene, "shockwaveMat", new BABYLON.Color3(0.7, 0.95, 1), 1.2),

                option: createGlowMaterial(scene, "optionMat", new BABYLON.Color3(0.42, 1, 0.72), 1.05),
                spark: createGlowMaterial(scene, "sparkMat", new BABYLON.Color3(0.75, 0.95, 1), 1.3),
                star: createGlowMaterial(scene, "starMat", new BABYLON.Color3(0.65, 0.9, 1), 0.9),
                terrain: createGlowMaterial(scene, "terrainMat", new BABYLON.Color3(0.35, 0.45, 0.68), 0.22),
                enemyBullet: createGlowMaterial(scene, "enemyBulletMat", new BABYLON.Color3(1, 0.36, 0.72), 1.15),
                corvetteArmor: createGlowMaterial(scene, "corvetteArmorMat", new BABYLON.Color3(1, 0.58, 0.16), 0.82),
                gunnerCannon: createGlowMaterial(scene, "gunnerCannonMat", new BABYLON.Color3(0.13, 0.15, 0.2), 0.24),
                guardShield: createGlowMaterial(scene, "guardShieldMat", new BABYLON.Color3(0.34, 0.9, 1), 0.75),
                dartBooster: createGlowMaterial(scene, "dartBoosterMat", new BABYLON.Color3(1, 0.35, 0.1), 1.15)
            };

            const player = createPlayerShip(scene, materials);
            const modelTemplates = {
                missileLemon: null,
                laserLemon: null,
                enemyKaraage: null,
                enemyKaraageMini: null,
                enemyKaraageCorvette: null,
                enemyKaraageHeavy: null,
                enemyTeacherSmall: null,
                enemyTeacherMedium: null,
                enemyTeacherLarge: null,
                enemyWorker: null,
                enemyDisk: null,
                enemyDiskA: null,
                enemyDiskB: null,
                enemyBattleship: null,
                enemyFighter: null
            };
            loadModelTemplate(scene, modelTemplates, "missileLemon", modelAssetFiles.missileLemon, 0.93, new BABYLON.Vector3(0, Math.PI / 2, 0));
            loadModelTemplate(scene, modelTemplates, "laserLemon", modelAssetFiles.laserLemon, 1.44, new BABYLON.Vector3(0, Math.PI / 2, BABYLON.Tools.ToRadians(80)), new BABYLON.Vector3(2, 0.5, 1));
            loadModelTemplate(scene, modelTemplates, "enemyKaraage", modelAssetFiles.enemyKaraage, 0.92, new BABYLON.Vector3(0, Math.PI / 2, 0));
            loadModelTemplate(scene, modelTemplates, "enemyKaraageMini", modelAssetFiles.enemyKaraage, 0.62, new BABYLON.Vector3(0, Math.PI / 2, 0));
            loadModelTemplate(scene, modelTemplates, "enemyKaraageCorvette", modelAssetFiles.enemyKaraage, 1.04, new BABYLON.Vector3(0, Math.PI / 2, 0));
            loadModelTemplate(scene, modelTemplates, "enemyKaraageHeavy", modelAssetFiles.enemyKaraage, 1.38, new BABYLON.Vector3(0, Math.PI, 0));
            loadModelTemplate(scene, modelTemplates, "enemyTeacherSmall", modelAssetFiles.enemyKaraage, enemyConfigs.teacherSmall.size, new BABYLON.Vector3(enemyConfigs.teacherSmall.rotation.x, enemyConfigs.teacherSmall.rotation.y, enemyConfigs.teacherSmall.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyTeacherMedium", modelAssetFiles.enemyKaraage, enemyConfigs.teacherMedium.size, new BABYLON.Vector3(enemyConfigs.teacherMedium.rotation.x, enemyConfigs.teacherMedium.rotation.y, enemyConfigs.teacherMedium.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyTeacherLarge", modelAssetFiles.enemyKaraage, enemyConfigs.teacherLarge.size, new BABYLON.Vector3(enemyConfigs.teacherLarge.rotation.x, enemyConfigs.teacherLarge.rotation.y, enemyConfigs.teacherLarge.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyWorker", modelAssetFiles.enemyWorker, enemyConfigs.worker.size, new BABYLON.Vector3(enemyConfigs.worker.rotation.x, enemyConfigs.worker.rotation.y, enemyConfigs.worker.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyDisk", modelAssetFiles.enemyDisk, 1.34, new BABYLON.Vector3(0, Math.PI / 2, 0));
            loadModelTemplate(scene, modelTemplates, "enemyDiskA", modelAssetFiles.enemyDisk, enemyConfigs.diskA.size, new BABYLON.Vector3(enemyConfigs.diskA.rotation.x, enemyConfigs.diskA.rotation.y, enemyConfigs.diskA.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyDiskB", modelAssetFiles.enemyDisk, enemyConfigs.diskB.size, new BABYLON.Vector3(enemyConfigs.diskB.rotation.x, enemyConfigs.diskB.rotation.y, enemyConfigs.diskB.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyBattleship", modelAssetFiles.enemyBattleship, enemyConfigs.battleship.size, new BABYLON.Vector3(enemyConfigs.battleship.rotation.x, enemyConfigs.battleship.rotation.y, enemyConfigs.battleship.rotation.z));
            loadModelTemplate(scene, modelTemplates, "enemyFighter", modelAssetFiles.enemyFighter, enemyConfigs.fighter.size, new BABYLON.Vector3(enemyConfigs.fighter.rotation.x, enemyConfigs.fighter.rotation.y, enemyConfigs.fighter.rotation.z));

            const stars = [];
            for (let i = 0; i < 115; i++) {
                const star = BABYLON.MeshBuilder.CreateSphere("star", {
                    diameter: 0.025 + Math.random() * 0.055,
                    segments: 8
                }, scene);
                star.position.set(
                    world.minX + Math.random() * (world.maxX - world.minX),
                    world.minY + Math.random() * (world.maxY - world.minY),
                    1.8 + Math.random() * 1.8
                );
                star.metadata = {
                    speed: 0.8 + Math.random() * 1.8
                };
                star.material = materials.star;
                stars.push(star);
            }

            return {
                scene,
                player,
                stars,
                modelTemplates,
                materials
            };
        }

        const game = createScene();

        function updateHud() {
            scoreEl.textContent = `SCORE ${state.score}`;
            livesEl.textContent = `LIFE ${state.lives}`;
            waveEl.textContent = `STAGE ${state.stage}`;
            powerEl.textContent = state.powerCursor >= 0 ? `READY ${powerItems[state.powerCursor]}` : "READY -";
            const mainWeapon = state.hasLaser ? "LEMON" : "SHOT";
            const missileText = state.missileLevel > 0 ? ` + MSL${state.missileLevel}` : "";
            weaponEl.textContent = `${mainWeapon}${missileText}  SPD ${state.speedLevel}`;
            powerSlots.forEach((slot, index) => {
                const disabled = isPowerMaxed(index);
                slot.classList.toggle("isActive", index === state.powerCursor);
                slot.classList.toggle("isDisabled", disabled);
                slot.classList.toggle("isLocked", index === 4 && !state.lemonUnlocked);
                slot.classList.toggle("isOwned",
                    (index === 0 && state.speedLevel > 0)
                    || (index === 1 && state.missileLevel > 0)
                    || (index === 2 && options.length > 0)
                    || (index === 3 && state.shield > 0)
                    || (index === 4 && state.hasLaser)
                );
            });
        }

        function isPowerMaxed(index) {
            switch (index) {
                case 0:
                    return state.speedLevel >= 3;
                case 1:
                    return state.missileLevel >= (state.lemonUnlocked ? 4 : 1);
                case 2:
                    return options.length >= 2;
                case 3:
                    return state.shield > 0;
                case 4:
                    return !state.lemonUnlocked || state.hasLaser;
                default:
                    return true;
            }
        }

        function advancePowerCursor() {
            for (let i = 0; i < powerItems.length; i++) {
                state.powerCursor = (state.powerCursor + 1) % powerItems.length;
                if (!isPowerMaxed(state.powerCursor)) {
                    return;
                }
            }
            state.powerCursor = -1;
        }

        function resetGame() {
            bullets.splice(0).forEach((item) => item.dispose());
            enemyBullets.splice(0).forEach((item) => item.dispose());
            enemies.splice(0).forEach((item) => item.dispose());
            capsules.splice(0).forEach((item) => item.dispose());
            options.splice(0).forEach((item) => item.dispose());
            terrain.splice(0).forEach((item) => item.dispose());
            shockwaves.splice(0).forEach((item) => item.dispose());
            sparks.splice(0).forEach((item) => item.dispose());
            playerTrail.splice(0);
            state.score = 0;
            state.lives = 3;
            state.stage = 1;
            state.stageElapsed = 0;
            state.wave = 1;
            state.elapsed = 0;
            state.fireCooldown = 0;
            state.enemyTimer = 0;
            state.formationTimer = 1.6;
            state.terrainTimer = 2;
            state.kills = 0;
            state.stageKills = 0;
            state.enemiesSinceCapsule = 0;
            state.powerCursor = -1;
            state.speedLevel = 0;
            state.missileLevel = 0;
            state.hasLaser = false;
            state.shield = 0;
            state.gameOver = false;
            state.isIntermission = false;
            state.intermissionStep = null;
            state.lemonUnlocked = false;
            state.stage1GuideShown = false;
            state.stage1BossSpawned = false;
            state.stage3BossSpawned = false;
            state.stageBossCount = 0;
            state.bossEnemy = null;
            state.bossMaxHp = 1;
            state.dialogueTimer = 0;
            state.triggeredStories = new Set();
            game.player.position.set(world.minX + 1.3, 0, 0);
            messageEl.classList.remove("isVisible");
            dialogueEl.classList.remove("isVisible");
            bossHudEl.classList.remove("isVisible");
            intermissionEl.classList.remove("isVisible");
            updateHud();
        }

        function startGame() {
            state.hasStarted = true;
            titleScreenEl.classList.add("isHidden");
            resetGame();
            showIntermission(
                "UNKNOWN SPACE",
                "航路事故により、所属不明の空域へ突入した。通信不能。背後から謎のからあげ型反応が接近している。",
                "introStart",
                "img/event-unknown-space.png"
            );
        }

        function showDialogue(speaker, text, duration = 4.2) {
            dialogueSpeakerEl.textContent = speaker;
            dialogueTextEl.textContent = text;
            dialogueEl.classList.add("isVisible");
            state.dialogueTimer = duration;
        }

        function updateDialogue(delta) {
            if (state.dialogueTimer <= 0) {
                return;
            }
            state.dialogueTimer -= delta;
            if (state.dialogueTimer <= 0) {
                dialogueEl.classList.remove("isVisible");
            }
        }

        function clearActiveGameObjects() {
            bullets.splice(0).forEach((item) => item.dispose());
            enemyBullets.splice(0).forEach((item) => item.dispose());
            enemies.splice(0).forEach((item) => item.dispose());
            capsules.splice(0).forEach((item) => item.dispose());
            terrain.splice(0).forEach((item) => item.dispose());
            shockwaves.splice(0).forEach((item) => item.dispose());
            sparks.splice(0).forEach((item) => item.dispose());
        }

        function updateStage(delta) {
            storyEvents.forEach((event) => {
                if (
                    event.stage === state.stage
                    && state.stageElapsed >= event.at
                    && !state.triggeredStories.has(event.id)
                ) {
                    state.triggeredStories.add(event.id);
                    showDialogue(event.speaker, event.text, 4.8);
                }
            });

            if (state.stage === 1 && !state.stage1GuideShown && state.stageElapsed >= 20) {
                state.stage1GuideShown = true;
                showIntermission(
                    "レモンジ",
                    "こっちだ。からあげを振り切ってアステロイドベルトまで来い。追っ手はそこで散らせる。",
                    "resumeStage1",
                    "img/event-lemonji-portrait.png"
                );
                return;
            }

            if (state.stage === 1 && state.stage1GuideShown && !state.stage1BossSpawned && state.stageElapsed >= 42) {
                spawnStageOneBoss();
                return;
            }

            if (state.stage === 3 && !state.stage3BossSpawned && state.stageElapsed >= 18) {
                spawnFinalBoss();
                return;
            }

            const current = stageDefinitions[state.stage - 1];
            if (current && state.stageElapsed >= current.duration) {
                triggerStageClear();
            }
        }

        function spawnStageOneBoss() {
            state.stage1BossSpawned = true;
            state.stageBossCount = 3;
            showDialogue("WARNING", "大型からあげ編隊、接近。", 2.4);
            const yPositions = [1.9, 0, -1.9];
            yPositions.forEach((y, index) => {
                const boss = cloneModelTemplate("enemyKaraageHeavy", "stage1KaraageBoss") || createEnemyShip(game.scene, game.materials, false);
                boss.position.set(world.maxX + 1.5 + index * 1.15, y, 0);
                boss.rotation.z = 0;
                boss.metadata = {
                    speed: 1.6,
                    radius: 0.72,
                    hp: 5,
                    points: 650,
                    spin: 0,
                    waveY: y,
                    wavePhase: index * 1.1,
                    carriesCapsule: false,
                    canShoot: true,
                    shootTimer: 0.8 + index * 0.35,
                    isStageBoss: true
                };
                enemies.push(boss);
            });
        }

        function spawnFinalBoss() {
            state.stage3BossSpawned = true;
            showDialogue("WARNING", "巨大からあげ皇帝、出現。", 2.8);
            const boss = cloneModelTemplate("enemyBattleship", "karaageEmperorBattleship") || cloneModelTemplate("enemyKaraageHeavy", "karaageEmperorBoss") || createEnemyShip(game.scene, game.materials, false);
            const config = enemyConfigs.battleship;
            boss.position.set(world.maxX + 2.4, 0, 0);
            boss.rotation.z = 0;
            boss.metadata = {
                speed: randomRange(config.speed),
                radius: config.radius,
                hp: config.hp,
                points: config.points,
                spin: 0,
                waveY: 0,
                waveAmount: randomRange(config.waveAmount),
                waveSpeed: randomRange(config.waveSpeed),
                wavePhase: 0,
                motion: config.motion,
                enemyType: "battleship",
                enemyConfig: config,
                carriesCapsule: false,
                canShoot: true,
                shotInterval: config.shotInterval,
                shootTimer: config.shotInterval,
                turretOffsets: [
                    new BABYLON.Vector2(-1.28, 0.88),
                    new BABYLON.Vector2(-1.42, 0.38),
                    new BABYLON.Vector2(-1.48, -0.18),
                    new BABYLON.Vector2(-1.18, -0.78)
                ],
                isFinalBoss: true
            };
            state.bossEnemy = boss;
            state.bossMaxHp = boss.metadata.hp;
            bossNameEl.textContent = "KARAAGE BATTLESHIP";
            bossFillEl.style.width = "100%";
            bossHudEl.classList.add("isVisible");
            enemies.push(boss);
        }

        function completeGame() {
            state.isIntermission = true;
            state.intermissionStep = "ending";
            bossHudEl.classList.remove("isVisible");
            showIntermission(
                "ESCAPE COMPLETE",
                `SCORE ${state.score}。巨大からあげ戦艦を撃破した。レモンジは次のクーデターへ、あなたは故郷の惑星へ進路を取った。`,
                "ending",
                "img/event-karaage-emperor.png"
            );
        }

        function showIntermission(title, text, step, imageSrc = "") {
            state.isIntermission = true;
            state.intermissionStep = step;
            intermissionTitleEl.textContent = title;
            intermissionTextEl.textContent = text;
            if (imageSrc) {
                intermissionImageEl.src = imageSrc;
                intermissionImageEl.classList.add("isVisible");
            } else {
                intermissionImageEl.removeAttribute("src");
                intermissionImageEl.classList.remove("isVisible");
            }
            intermissionEl.classList.add("isVisible");
            dialogueEl.classList.remove("isVisible");
            clearActiveGameObjects();
            updateHud();
        }

        function triggerStageClear() {
            if (state.isIntermission) {
                return;
            }
            if (state.stage === 1) {
                showIntermission(
                    "STAGE 1 CLEAR",
                    `SCORE ${state.score} / 撃破 ${state.stageKills}。小惑星地帯への進路を確保した。`,
                    "stage1Result"
                );
                return;
            }
            if (state.stage === 2) {
                showIntermission(
                    "STAGE 2 CLEAR",
                    `SCORE ${state.score} / 撃破 ${state.stageKills}。レモンリキッドで包囲部隊を押し返した。`,
                    "stage2Result"
                );
            }
        }

        function beginStage(stageNumber) {
            const definition = stageDefinitions[stageNumber - 1];
            state.stage = stageNumber;
            state.stageElapsed = 0;
            state.enemyTimer = 0.4;
            state.formationTimer = 1.4;
            state.terrainTimer = stageNumber >= 2 ? 0.8 : 2;
            state.enemiesSinceCapsule = 0;
            state.stageKills = 0;
            state.isIntermission = false;
            state.intermissionStep = null;
            intermissionEl.classList.remove("isVisible");
            showDialogue("STAGE " + stageNumber, definition.title, 3);
            updateHud();
        }

        function advanceIntermission() {
            if (!state.isIntermission) {
                return;
            }
            switch (state.intermissionStep) {
                case "introStart":
                    beginStage(1);
                    break;
                case "resumeStage1":
                    state.isIntermission = false;
                    state.intermissionStep = null;
                    intermissionEl.classList.remove("isVisible");
                    showDialogue("STAGE 1", "アステロイドベルトへ向かえ。", 2.2);
                    break;
                case "stage1Result":
                    showIntermission(
                        "レモンジの基地",
                        "よく来た。ここは小惑星帯の反体制派基地だ。俺たちは定期的にクーデターを起こしている。",
                        "baseTalkPlayer",
                        "img/event-lemonji-base.png"
                    );
                    break;
                case "baseTalkPlayer":
                    showIntermission(
                        "PLAYER",
                        "悪いが、クーデターに参加する気はない。こっちは故郷に帰りたいだけだ。",
                        "baseTalkDeal",
                        "img/event-lemonji-base.png"
                    );
                    break;
                case "baseTalkDeal":
                    showIntermission(
                        "レモンジ",
                        "なら取引だ。からあげの戦力を減らしてくれ。代わりにレモンリキッドを提供する。",
                        "lemonLiquid",
                        "img/event-lemonji-base.png"
                    );
                    break;
                case "lemonLiquid":
                    state.lemonUnlocked = true;
                    showIntermission(
                        "LEMON LIQUID",
                        "レモンリキッドを受け取った。LEMONバレットとレモンミサイルの段階強化が解禁された。",
                        "startStage2",
                        "img/event-lemonji-base.png"
                    );
                    break;
                case "startStage2":
                    beginStage(2);
                    break;
                case "stage2Result":
                    showIntermission(
                        "からあげ皇帝",
                        "憲法第1条、からあげにレモンをかけた者は許さぬ。巨大戦艦、出撃。",
                        "startStage3",
                        "img/event-karaage-emperor.png"
                    );
                    break;
                case "startStage3":
                    beginStage(3);
                    break;
                case "ending":
                    state.hasStarted = false;
                    state.isIntermission = false;
                    state.intermissionStep = null;
                    intermissionEl.classList.remove("isVisible");
                    titleScreenEl.classList.remove("isHidden");
                    resetGame();
                    break;
                default:
                    state.isIntermission = false;
                    intermissionEl.classList.remove("isVisible");
                    break;
            }
        }

        function fireOneShot(origin, forceNormal = false, shotOwner = "player") {
            const isLaser = state.hasLaser && !forceNormal;
            const normalShotLimit = shotOwner === "player" ? 3 : 2;
            const activeOwnerShots = bullets.filter((bullet) =>
                bullet.metadata.kind === "normal" && bullet.metadata.shotOwner === shotOwner
            ).length;
            if (!isLaser && activeOwnerShots >= normalShotLimit) {
                return;
            }
            const bullet = isLaser
                ? cloneModelTemplate("laserLemon", "laser") || BABYLON.MeshBuilder.CreateBox("laser", { width: 1.05, height: 0.08, depth: 0.08 }, game.scene)
                : BABYLON.MeshBuilder.CreateSphere("bullet", { diameter: 0.16, segments: 12 }, game.scene);
            bullet.position.set(origin.x + 0.65, origin.y, -0.05);
            bullet.metadata = {
                kind: isLaser ? "laser" : "normal",
                speed: isLaser ? 15 : 12,
                radius: isLaser ? 0.32 : 0.16,
                damage: isLaser ? 2 : 0.5,
                spin: isLaser ? 9.5 : 0,
                shotOwner
            };
            bullet.material = isLaser ? game.materials.laser : game.materials.bullet;
            bullets.push(bullet);
        }

        function fireMissile(origin) {
            const activeMissiles = bullets.filter((bullet) => bullet.metadata.kind === "missile").length;
            const missileLimit = state.missileLevel >= 4 ? 4 : state.missileLevel >= 3 ? 3 : 2;
            if (activeMissiles >= missileLimit) {
                return;
            }
            const missile = state.missileLevel >= 2 ? cloneModelTemplate("missileLemon", "missile") : null;
            const missileMesh = missile || BABYLON.MeshBuilder.CreateBox("missile", {
                width: 0.42,
                height: 0.14,
                depth: 0.12
            }, game.scene);
            missileMesh.position.set(origin.x + 0.38, origin.y - 0.52, -0.04);
            missileMesh.rotation.z = -0.38;
            missileMesh.metadata = {
                kind: "missile",
                speed: 8.5,
                vx: 7.6,
                vy: -3.2,
                radius: 0.26,
                damage: 2,
                explosive: state.missileLevel >= 2
            };
            if (!missile) {
                missileMesh.material = game.materials.missile;
            }
            bullets.push(missileMesh);
        }

        function fireBullet() {
            fireOneShot(game.player.position);
            if (state.missileLevel > 0) {
                fireMissile(game.player.position);
            }
            options.forEach((option) => {
                fireOneShot(option.position, true, option.metadata.shotOwner);
            });
        }

        function addEnemyPart(enemy, part) {
            part.parent = enemy;
            enemy.metadata.parts.push(part);
            return part;
        }

        function decorateEnemy(enemy, enemyType) {
            enemy.metadata.parts = [];
            if (enemyType === "corvette") {
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const orb = BABYLON.MeshBuilder.CreateSphere("corvetteArmorOrb", {
                        diameter: 0.16,
                        segments: 12
                    }, game.scene);
                    orb.position.set(Math.cos(angle) * 0.58, Math.sin(angle) * 0.58, -0.03);
                    orb.material = game.materials.corvetteArmor;
                    addEnemyPart(enemy, orb);
                }
            } else if (enemyType === "gunner") {
                [-0.22, 0.22].forEach((y) => {
                    const cannon = BABYLON.MeshBuilder.CreateCylinder("gunnerCannon", {
                        diameter: 0.07,
                        height: 0.48,
                        tessellation: 12
                    }, game.scene);
                    cannon.rotation.z = Math.PI / 2;
                    cannon.position.set(-0.28, y, -0.08);
                    cannon.material = game.materials.gunnerCannon;
                    addEnemyPart(enemy, cannon);
                });
            } else if (enemyType === "worker") {
                enemy.metadata.shields = [];
                const shieldHp = enemy.metadata.enemyConfig ? enemy.metadata.enemyConfig.shieldHp : 5;
                [-0.42, 0, 0.42].forEach((y, index) => {
                    const shield = BABYLON.MeshBuilder.CreateCylinder("workerHexShield", {
                        diameter: 0.54,
                        height: 0.035,
                        tessellation: 6
                    }, game.scene);
                    shield.rotation.x = Math.PI / 2;
                    shield.rotation.z = Math.PI / 6;
                    shield.position.set(-0.94, y, -0.49);
                    shield.material = game.materials.guardShield;
                    shield.visibility = 0.58;
                    shield.metadata = {
                        hp: shieldHp,
                        maxHp: shieldHp,
                        radius: 0.29,
                        index
                    };
                    shield.rotation.y = Math.PI / 2;
                    shield.parent = enemy;
                    enemy.metadata.shields.push(shield);
                    enemy.metadata.parts.push(shield);
                });
            }
        }

        function spawnEnemyAt(x, y, delayOffset) {
            const asteroidChance = state.stage === 1 ? 0.12 : state.stage === 2 ? 0.38 : 0.2;
            const isAsteroid = Math.random() < asteroidChance;
            const carriesCapsule = state.enemiesSinceCapsule >= 4 || Math.random() < 0.08;
            const isHeavyKaraage = !carriesCapsule && state.stage >= 3 && Math.random() < 0.24;
            let enemyType = carriesCapsule ? "carrier" : isAsteroid ? "asteroid" : "teacherMedium";
            if (!carriesCapsule && !isAsteroid && !isHeavyKaraage) {
                const roll = Math.random();
                if (state.stage === 1) {
                    enemyType = roll < 0.3 ? "teacherSmall" : roll < 0.56 ? "fighter" : roll < 0.82 ? "teacherMedium" : "teacherLarge";
                } else if (state.stage === 2) {
                    enemyType = roll < 0.16 ? "diskA" : roll < 0.32 ? "diskB" : roll < 0.5 ? "worker" : roll < 0.72 ? "fighter" : roll < 0.86 ? "teacherSmall" : "teacherMedium";
                } else {
                    enemyType = roll < 0.18 ? "diskA" : roll < 0.36 ? "diskB" : roll < 0.58 ? "worker" : roll < 0.76 ? "fighter" : "teacherLarge";
                }
            }
            if (isHeavyKaraage) {
                enemyType = "teacherLarge";
            }
            const config = enemyConfigs[enemyType] || null;
            const templateKey = config ? config.template : "enemyKaraage";
            const karaageEnemy = carriesCapsule
                ? null
                : cloneModelTemplate(templateKey, config ? config.spawnName : isAsteroid ? "karaageAsteroid" : "karaageEnemy");
            const mesh = carriesCapsule
                ? createEnemyShip(game.scene, game.materials, false)
                : karaageEnemy || createEnemyShip(game.scene, game.materials, isAsteroid);
            mesh.position.set(x + delayOffset, y, 0);
            mesh.rotation.z = 0;
            if (isAsteroid && !carriesCapsule && !isHeavyKaraage && mesh.name !== "asteroid") {
                mesh.scaling.scaleInPlace(1.16);
            }
            const speedByType = {
                carrier: 2.7,
                asteroid: 2.3
            };
            const hpByType = {
                carrier: 0.5,
                asteroid: 2 + Math.floor(state.wave / 3)
            };
            const pointsByType = {
                carrier: 120,
                asteroid: 150
            };
            const speed = config ? randomRange(config.speed) : speedByType[enemyType];
            const waveAmount = config ? randomRange(config.waveAmount) : 0.28;
            const waveSpeed = config ? randomRange(config.waveSpeed) : 2.2;
            const shotInterval = config ? randomRange(config.shotInterval) : 1.05 + Math.random() * 1.7;
            mesh.metadata = {
                speed: (speed || 2.6) + (config ? 0 : state.stage * 0.22 + state.wave * 0.08 + Math.random() * 0.42),
                radius: config ? config.radius : carriesCapsule ? 0.38 : isAsteroid ? 0.45 : 0.38,
                hp: config ? config.hp : hpByType[enemyType],
                points: config ? config.points : pointsByType[enemyType],
                spin: config && config.randomSpin ? (Math.random() - 0.5) * 3.8 : 0,
                waveY: y,
                waveAmount,
                waveSpeed,
                wavePhase: Math.random() * Math.PI * 2,
                enemyType,
                motion: config ? config.motion : "sine",
                enemyConfig: config,
                carriesCapsule,
                canShoot: !!karaageEnemy && config && config.canShoot !== false && state.stage >= 2,
                shotInterval,
                shootTimer: shotInterval
            };
            decorateEnemy(mesh, enemyType);
            if (mesh.getTotalVertices) {
                mesh.material = isAsteroid ? game.materials.asteroid : game.materials.enemy;
            }
            state.enemiesSinceCapsule = carriesCapsule ? 0 : state.enemiesSinceCapsule + 1;
            enemies.push(mesh);
        }

        function spawnEnemy() {
            spawnEnemyAt(world.maxX + 0.7, world.minY + 0.5 + Math.random() * (world.maxY - world.minY - 1), 0);
        }

        function spawnFormation() {
            const baseY = world.minY + 1 + Math.random() * (world.maxY - world.minY - 2);
            for (let i = 0; i < 5; i++) {
                const y = baseY + Math.sin(i * 0.85) * 0.75;
                spawnEnemyAt(world.maxX + 0.7, BABYLON.Scalar.Clamp(y, world.minY + 0.5, world.maxY - 0.5), i * 0.65);
            }
        }

        function spawnCapsule(position) {
            const capsule = BABYLON.MeshBuilder.CreateBox("powerCapsule", {
                width: 0.55,
                height: 0.28,
                depth: 0.14
            }, game.scene);
            capsule.position.copyFrom(position);
            capsule.position.z = -0.04;
            capsule.metadata = {
                speed: 2.2,
                radius: 0.34
            };
            capsule.material = game.materials.capsule;
            capsules.push(capsule);
        }

        function spawnTerrainBlock() {
            const top = Math.random() < 0.5;
            const height = 0.55 + Math.random() * 1.3;
            const block = BABYLON.MeshBuilder.CreateBox("terrain", {
                width: 1.6 + Math.random() * 1.2,
                height,
                depth: 0.28
            }, game.scene);
            block.position.set(world.maxX + 1.4, top ? world.maxY - height / 2 : world.minY + height / 2, 0.2);
            block.metadata = {
                speed: 2.15 + state.wave * 0.12,
                radius: Math.max(block.scaling.x, height) * 0.45
            };
