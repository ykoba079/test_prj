<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gradius Style Mini Shooter</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
            background: #050814;
            font-family: "Segoe UI", system-ui, sans-serif;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        #renderCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
        }

        .hud {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #e9fbff;
            font-size: 15px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(69, 211, 255, 0.7);
            user-select: none;
        }

        .hud span,
        .powerBar,
        .help {
            border: 1px solid rgba(92, 221, 255, 0.34);
            border-radius: 6px;
            background: rgba(5, 12, 30, 0.7);
            box-shadow: 0 0 20px rgba(10, 160, 255, 0.13);
            padding: 8px 10px;
        }

        .powerBar {
            position: fixed;
            left: 50%;
            bottom: 16px;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, minmax(66px, 1fr));
            gap: 6px;
            width: min(520px, calc(100vw - 32px));
            padding: 8px;
            transform: translateX(-50%);
            color: #d9f7ff;
            user-select: none;
        }

        .powerSlot {
            position: relative;
            min-width: 0;
            border: 1px solid rgba(130, 242, 255, 0.24);
            border-radius: 4px;
            padding: 7px 8px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            background: rgba(10, 24, 52, 0.74);
        }

        .powerSlot.isActive {
            border-color: rgba(255, 242, 92, 0.95);
            background: rgba(255, 214, 52, 0.22);
            color: #fff7a8;
            box-shadow: 0 0 16px rgba(255, 228, 66, 0.5);
        }

        .powerSlot.isActive::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 2px solid #fff06a;
            border-radius: 6px;
            box-shadow: 0 0 18px rgba(255, 240, 106, 0.72);
            pointer-events: none;
        }

        .powerSlot.isOwned {
            color: #88ffcc;
        }

        .powerSlot.isDisabled {
            border-color: rgba(130, 150, 170, 0.18);
            background: rgba(8, 14, 24, 0.58);
            color: rgba(190, 215, 225, 0.42);
            box-shadow: none;
        }

        .powerSlot.isDisabled.isActive {
            border-color: rgba(255, 242, 92, 0.82);
            color: rgba(255, 246, 160, 0.72);
        }

        .help {
            position: fixed;
            right: 16px;
            bottom: 86px;
            z-index: 5;
            color: #d9f7ff;
            font-size: 14px;
            line-height: 1.55;
            user-select: none;
        }

        .mobileControls {
            position: fixed;
            inset: auto 0 0;
            z-index: 14;
            display: none;
            align-items: end;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 0 18px 18px;
            pointer-events: none;
            user-select: none;
        }

        .movePad {
            position: relative;
            width: 118px;
            height: 118px;
            border: 1px solid rgba(132, 230, 255, 0.38);
            border-radius: 50%;
            background: rgba(5, 13, 30, 0.48);
            box-shadow: inset 0 0 24px rgba(82, 212, 255, 0.16), 0 0 22px rgba(15, 160, 255, 0.16);
            pointer-events: auto;
            touch-action: none;
        }

        .movePadKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 242, 120, 0.72);
            border-radius: 50%;
            background: rgba(255, 225, 78, 0.3);
            box-shadow: 0 0 18px rgba(255, 225, 78, 0.38);
            transform: translate(-50%, -50%);
        }

        .mobileActions {
            display: grid;
            grid-template-columns: 72px 92px;
            gap: 12px;
            align-items: end;
            pointer-events: auto;
        }

        .controlButton {
            display: grid;
            place-items: center;
            height: 64px;
            border: 1px solid rgba(132, 230, 255, 0.42);
            border-radius: 50%;
            background: rgba(5, 13, 30, 0.58);
            box-shadow: inset 0 0 18px rgba(82, 212, 255, 0.14), 0 0 20px rgba(15, 160, 255, 0.16);
            color: #e9fbff;
            font: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0;
            touch-action: none;
        }

        .controlButton.isPrimary {
            height: 92px;
            background: rgba(255, 215, 54, 0.24);
            border-color: rgba(255, 238, 118, 0.72);
            color: #fff7a8;
            box-shadow: inset 0 0 22px rgba(255, 225, 78, 0.15), 0 0 24px rgba(255, 225, 78, 0.22);
        }

        .controlButton.isPressed,
        .movePad.isActive {
            filter: brightness(1.25);
        }

        @media (hover: none), (pointer: coarse), (max-width: 760px) {
            .mobileControls {
                display: flex;
                padding:
                    0
                    max(14px, env(safe-area-inset-right, 0px))
                    max(14px, env(safe-area-inset-bottom, 0px))
                    max(14px, env(safe-area-inset-left, 0px));
            }

            .help {
                display: none;
            }

            .hud {
                top: max(8px, env(safe-area-inset-top, 0px));
                left: max(8px, env(safe-area-inset-left, 0px));
                right: max(8px, env(safe-area-inset-right, 0px));
                gap: 6px;
                font-size: 12px;
            }

            .hud span,
            .powerBar {
                padding: 6px 7px;
            }

            .powerBar {
                top: auto;
                right: auto;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                left: 50%;
                grid-template-columns: repeat(5, 6.8ch);
                width: auto;
                max-width: calc(100vw - 300px);
                gap: 3px;
                transform: translateX(-50%);
                background: rgba(5, 12, 30, 0.48);
            }

            .powerSlot {
                padding: 5px 1px;
                font-size: 10px;
                white-space: nowrap;
            }

            .dialogue {
                bottom: calc(206px + env(safe-area-inset-bottom, 0px));
                width: min(720px, calc(100vw - 20px));
                padding: 10px 12px;
            }

            .dialogueText {
                font-size: clamp(13px, 2.95vw, 17px);
                line-height: 1.32;
                overflow-wrap: anywhere;
            }

            .dialogueSpeaker {
                font-size: 12px;
            }

            .dialoguePortrait {
                width: clamp(48px, 11vw, 72px);
                height: clamp(48px, 11vw, 72px);
            }

            .eventSkipButton {
                top: max(10px, env(safe-area-inset-top, 0px));
                right: max(10px, env(safe-area-inset-right, 0px));
                min-width: 54px;
                min-height: 42px;
            }

            .stage3IntroCaption {
                left: max(14px, env(safe-area-inset-left, 0px));
                right: max(14px, env(safe-area-inset-right, 0px));
                bottom: calc(136px + env(safe-area-inset-bottom, 0px));
                gap: 12px;
                font-size: clamp(13px, 3.1vw, 20px);
                line-height: 1.28;
            }

            .stage3IntroPortrait {
                width: clamp(48px, 12vw, 80px);
                height: clamp(48px, 12vw, 80px);
            }

            .intermission {
                padding:
                    max(8px, env(safe-area-inset-top, 0px))
                    max(8px, env(safe-area-inset-right, 0px))
                    max(8px, env(safe-area-inset-bottom, 0px))
                    max(8px, env(safe-area-inset-left, 0px));
            }

            .intermissionPanel {
                height: calc(100dvh - max(16px, env(safe-area-inset-top, 0px)) - max(16px, env(safe-area-inset-bottom, 0px)));
                padding: clamp(10px, 2.6vw, 18px);
            }

            .intermissionPanel h2 {
                font-size: clamp(21px, 5.4vw, 36px);
            }

            .intermissionPanel p {
                font-size: clamp(11px, 2.5vw, 14px);
                line-height: 1.25;
                overflow-wrap: anywhere;
            }

            .intermissionPanel.hasImage:not(.isGogai) .intermissionImage {
                height: min(31dvh, 220px);
                max-height: min(31dvh, 220px);
            }

            .intermissionPanel.isControls {
                grid-template-rows: minmax(0, 80%) minmax(30px, auto);
            }

            .controlsGuide {
                gap: 8px;
            }

            .endingLyrics {
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                width: min(92vw, 720px);
                padding: 9px 12px;
                font-size: clamp(10px, 2.66vw, 14px);
                line-height: 1.28;
            }

            .titleScreen {
                align-items: end;
                padding:
                    max(20px, env(safe-area-inset-top, 0px))
                    max(18px, env(safe-area-inset-right, 0px))
                    max(22px, env(safe-area-inset-bottom, 0px))
                    max(18px, env(safe-area-inset-left, 0px));
            }

            .titleContent h1 {
                font-size: clamp(34px, 11vw, 76px);
            }

            .startButton {
                min-height: 46px;
                padding: 12px 20px;
            }

            .bossHud {
                top: calc(48px + env(safe-area-inset-top, 0px));
                width: calc(100vw - 24px);
            }

            .movePad {
                width: clamp(104px, 22vmin, 132px);
                height: clamp(104px, 22vmin, 132px);
            }

            .movePadKnob {
                width: clamp(38px, 8vmin, 50px);
                height: clamp(38px, 8vmin, 50px);
            }

            .mobileActions {
                grid-template-columns: repeat(2, clamp(86px, 17vmin, 108px));
                gap: clamp(8px, 2vmin, 14px);
            }

            .controlButton {
                height: clamp(82px, 17vmin, 108px);
            }

            .controlButton.isPrimary {
                height: clamp(82px, 17vmin, 108px);
            }
        }

        @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
            .mobileControls {
                padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
            }

            .powerBar {
                top: calc(max(8px, env(safe-area-inset-top, 0px)) + 42px);
                right: auto;
                bottom: auto;
                left: 50%;
                width: auto;
                max-width: calc(100vw - 20px);
                transform: translateX(-50%);
            }

            .powerSlot {
                font-size: 10px;
                padding: 5px 2px;
            }

            .dialogue {
                bottom: calc(196px + env(safe-area-inset-bottom, 0px));
            }
        }

        @media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
            .hud {
                max-width: 46vw;
            }

            .powerBar {
                top: auto;
                right: auto;
                bottom: calc(10px + env(safe-area-inset-bottom, 0px));
                left: 50%;
                width: auto;
                max-width: min(430px, calc(100vw - 360px));
                transform: translateX(-50%);
            }

            .mobileControls {
                align-items: center;
                padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
            }

            .movePad {
                width: clamp(92px, 24vh, 118px);
                height: clamp(92px, 24vh, 118px);
            }

            .mobileActions {
                grid-template-columns: repeat(2, clamp(76px, 19vh, 94px));
            }

            .controlButton {
                height: clamp(72px, 19vh, 92px);
            }

            .controlButton.isPrimary {
                height: clamp(72px, 19vh, 92px);
            }

            .bossHud {
                top: calc(max(8px, env(safe-area-inset-top, 0px)) + 2px);
                left: calc(max(8px, env(safe-area-inset-left, 0px)) + 168px);
                width: min(210px, calc(100vw - 500px));
                transform: none;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
            }

            .bossName {
                margin-bottom: 3px;
                font-size: 9px;
                text-align: left;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .bossBar {
                height: 5px;
                border-radius: 4px;
            }

            .dialogue {
                bottom: calc(104px + env(safe-area-inset-bottom, 0px));
                width: min(480px, 46vw);
                max-width: 46vw;
                padding: 7px 9px;
                border-color: rgba(131, 230, 255, 0.24);
                background: rgba(4, 10, 26, 0.42);
                box-shadow: 0 0 18px rgba(35, 180, 255, 0.12);
                text-shadow: 0 0 10px rgba(0, 0, 0, 0.86), 0 0 10px rgba(80, 220, 255, 0.28);
            }

            .dialogue.isVisible {
                gap: 8px;
            }

            .dialoguePortrait {
                width: clamp(34px, 8vh, 46px);
                height: clamp(34px, 8vh, 46px);
            }

            .dialogueText {
                font-size: clamp(5px, 1.02vw, 6px);
                line-height: 1.2;
            }

            .dialogueSpeaker {
                margin-bottom: 3px;
                font-size: 9px;
            }

            .stage3IntroCaption {
                bottom: calc(96px + env(safe-area-inset-bottom, 0px));
                max-width: 68vw;
                font-size: clamp(7px, 1.55vw, 10px);
                line-height: 1.2;
            }

            .intermissionPanel.isControls {
                grid-template-rows: minmax(0, 84%) minmax(28px, auto);
            }

            .controlsGuide {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .intermissionPanel.hasImage:not(.isGogai):not(.isControls):not(.isNextWorld):not(.isFinalResult) {
                grid-template-columns: minmax(0, 48%) minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
                column-gap: 14px;
                row-gap: 4px;
                align-content: stretch;
                text-align: left;
            }

            .intermissionPanel.hasImage:not(.isGogai):not(.isControls):not(.isNextWorld):not(.isFinalResult) .intermissionImage {
                grid-column: 1;
                grid-row: 1 / 4;
                height: 100%;
                max-height: none;
                margin: 0;
                object-position: center;
            }

            .intermissionPanel.hasImage:not(.isGogai):not(.isControls):not(.isNextWorld):not(.isFinalResult) h2 {
                grid-column: 2;
                grid-row: 1;
                align-self: start;
                font-size: clamp(13px, 2.8vw, 18px);
                line-height: 1.05;
            }

            .intermissionPanel.hasImage:not(.isGogai):not(.isControls):not(.isNextWorld):not(.isFinalResult) p {
                grid-column: 2;
                grid-row: 2;
                display: block;
                align-items: initial;
                min-height: 0;
                max-height: none;
                height: auto;
                overflow: visible;
                overflow-wrap: anywhere;
                word-break: normal;
                font-size: clamp(11px, 2.5vw, 14px);
                line-height: 1.38;
            }

            .intermissionPanel.hasImage:not(.isGogai):not(.isControls):not(.isNextWorld):not(.isFinalResult) .intermissionHint {
                grid-column: 2;
                grid-row: 3;
                align-self: end;
                text-align: center;
            }
        }

        @media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-width: 760px) {
            .powerBar {
                grid-template-columns: repeat(5, 6.1ch);
                max-width: calc(100vw - 260px);
            }

            .powerSlot {
                font-size: 9px;
            }
        }

        .centerMessage {
            position: fixed;
            inset: 0;
            z-index: 6;
            display: none;
            place-items: center;
            color: #f4fbff;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 18px rgba(89, 219, 255, 0.75);
        }

        .centerMessage.isVisible {
            display: grid;
        }

        .centerMessage h1 {
            margin: 0 0 14px;
            font-size: clamp(34px, 6vw, 72px);
        }

        .centerMessage p {
            margin: 6px 0;
            font-size: clamp(15px, 2.2vw, 20px);
            color: #ccf2ff;
        }

        .stageClearBanner {
            position: fixed;
            inset: 0;
            z-index: 11;
            display: none;
            place-items: center;
            color: #fff8b8;
            font-size: clamp(42px, 9vw, 118px);
            font-weight: 1000;
            letter-spacing: 0;
            text-shadow:
                0 0 16px rgba(255, 235, 96, 0.92),
                0 0 36px rgba(68, 214, 255, 0.55),
                0 3px 12px rgba(0, 0, 0, 0.88);
            text-align: center;
            white-space: pre-line;
            pointer-events: none;
            user-select: none;
        }

        .stageClearBanner.isVisible {
            display: grid;
        }

        .titleScreen {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            align-items: end;
            justify-items: start;
            box-sizing: border-box;
            padding: clamp(28px, 6vw, 72px);
            color: #f8fbff;
            background:
                linear-gradient(90deg, rgba(2, 5, 14, 0.9) 0%, rgba(3, 6, 16, 0.54) 42%, rgba(3, 6, 16, 0.08) 100%),
                linear-gradient(0deg, rgba(2, 5, 14, 0.86) 0%, rgba(2, 5, 14, 0.16) 54%, rgba(2, 5, 14, 0.36) 100%),
                url("./img/title-escape-karaage-empire.jpg") center / cover no-repeat;
            user-select: none;
        }

        .titleScreen.isHidden {
            display: none;
        }

        .titleContent {
            width: min(760px, 100%);
            text-shadow: 0 0 22px rgba(76, 214, 255, 0.7), 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .titleContent h1 {
            margin: 0 0 14px;
            font-size: clamp(38px, 8vw, 92px);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .titleContent p {
            max-width: 620px;
            margin: 0 0 22px;
            color: #d9f7ff;
            font-size: clamp(15px, 2.1vw, 21px);
            font-weight: 700;
            line-height: 1.55;
        }

        .titleActions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .startButton {
            border: 1px solid rgba(255, 235, 112, 0.9);
            border-radius: 6px;
            background: rgba(255, 213, 48, 0.92);
            box-shadow: 0 0 22px rgba(255, 225, 72, 0.48);
            color: #191207;
            padding: 12px 18px;
            font: inherit;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }

        .titleHint {
            color: #aeefff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .titleHighScore {
            margin-top: 16px;
            color: #fff07a;
            font-size: clamp(18px, 3vw, 30px);
            font-weight: 1000;
            letter-spacing: 0;
            text-shadow: 0 0 18px rgba(255, 232, 96, 0.66), 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .mobileTestStamp {
            margin-top: 8px;
            color: rgba(217, 247, 255, 0.78);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .dialogue {
            position: fixed;
            left: 50%;
            bottom: 94px;
            z-index: 12;
            display: none;
            width: min(760px, calc(100vw - 32px));
            box-sizing: border-box;
            border: 1px solid rgba(131, 230, 255, 0.42);
            border-radius: 8px;
            background: rgba(4, 10, 26, 0.86);
            box-shadow: 0 0 28px rgba(35, 180, 255, 0.22);
            padding: 14px 16px;
            transform: translateX(-50%);
            color: #eafcff;
            text-shadow: 0 0 12px rgba(80, 220, 255, 0.42);
            pointer-events: none;
        }

        .dialogue.isVisible {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dialoguePortrait {
            display: none;
            width: clamp(58px, 8vw, 92px);
            height: clamp(58px, 8vw, 92px);
            object-fit: cover;
            flex: 0 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.52);
        }

        .dialogue.hasPortrait .dialoguePortrait {
            display: block;
        }

        .dialogueBody {
            min-width: 0;
            flex: 1 1 auto;
        }

        .dialogueSpeaker {
            margin-bottom: 6px;
            color: #fff07a;
            font-size: 13px;
            font-weight: 900;
        }

        .dialogueText {
            font-size: clamp(23px, 3vw, 29px);
            font-weight: 800;
            line-height: 1.55;
            white-space: pre-line;
        }

        .stage3IntroOverlay {
            position: fixed;
            inset: 0;
            z-index: 13;
            display: none;
            pointer-events: none;
            color: #f4fbff;
            text-shadow: 0 0 14px rgba(0, 0, 0, 0.9);
        }

        .stage3IntroOverlay.isVisible {
            display: block;
            pointer-events: auto;
        }

        .stage3IntroOverlay.isFading::after {
            opacity: 1;
        }

        .stage3IntroOverlay::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 45%, transparent 44%, rgba(0, 0, 0, 0.66) 100%),
                linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 30%, transparent 70%, rgba(0, 0, 0, 0.36));
        }

        .stage3IntroOverlay::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            background: #02040a;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        .stage3IntroCanvas {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            background: #02040a;
            touch-action: none;
        }

        .stage3IntroCaption {
            position: absolute;
            z-index: 2;
            left: clamp(18px, 5vw, 72px);
            right: clamp(18px, 5vw, 72px);
            bottom: clamp(24px, 7vh, 72px);
            max-width: 980px;
            display: flex;
            align-items: center;
            gap: clamp(12px, 2vw, 22px);
            font-size: clamp(22px, 3.2vw, 38px);
            line-height: 1.45;
            font-weight: 800;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

    <script>
        (function () {
            function showBootError(message) {
                const text = "起動エラー: " + message;
                const render = function () {
                    let el = document.getElementById("bootError");
                    if (!el) {
                        el = document.createElement("div");
                        el.id = "bootError";
                        el.className = "bootError";
                        document.body.appendChild(el);
                    }
                    el.textContent = text;
                    el.classList.add("isVisible");
                };
                if (document.body) {
                    render();
                } else {
                    window.addEventListener("DOMContentLoaded", render, { once: true });
                }
            }
            window.__showBootError = showBootError;
            window.addEventListener("error", function (event) {
                showBootError(event.message || "unknown error");
            });
            window.addEventListener("unhandledrejection", function (event) {
                showBootError(String(event.reason || "promise rejected"));
            });
        })();
    </script>

        function scheduleSfxTone(context, options) {
            const {
                start,
                duration,
                frequency,
                endFrequency = frequency,
                type = "sine",
                volume = 0.15,
                attack = 0.003
            } = options;
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, start);
            oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), start + duration);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(volume, start + Math.min(attack, duration * 0.35));
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            oscillator.connect(gain);
            gain.connect(audioState.master);
            oscillator.start(start);
            oscillator.stop(start + duration + 0.01);
        }

        function scheduleSfxNoise(context, options) {
            const {
                start,
                duration,
                filterType = "bandpass",
                frequency = 1200,
                endFrequency = frequency,
                q = 1,
                volume = 0.15,
                attack = 0.002
            } = options;
            const source = context.createBufferSource();
            const filter = context.createBiquadFilter();
            const gain = context.createGain();
            source.buffer = getSfxNoiseBuffer(context);
            filter.type = filterType;
            filter.frequency.setValueAtTime(frequency, start);
            filter.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), start + duration);
            filter.Q.setValueAtTime(q, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.linearRampToValueAtTime(volume, start + Math.min(attack, duration * 0.35));
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioState.master);
            source.start(start);
            source.stop(start + duration + 0.01);

        function setTouchMoveFromEvent(event) {
            const rect = movePadEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxDistance = rect.width * 0.36;
            const dx = event.clientX - centerX;
            const dy = event.clientY - centerY;
            const rawDistance = Math.sqrt(dx * dx + dy * dy);
            const distance = Math.min(maxDistance, rawDistance);
            const angle = Math.atan2(dy, dx);
            const knobX = Math.cos(angle) * distance;
            const knobY = Math.sin(angle) * distance;
            const normalized = maxDistance > 0 ? distance / maxDistance : 0;
            const deadZone = 0.17;
            if (normalized <= deadZone) {
                touchInput.x = 0;
                touchInput.y = 0;
            } else {
                const adjusted = (normalized - deadZone) / (1 - deadZone);
                const response = Math.pow(adjusted, 1.65);
                touchInput.x = Math.cos(angle) * response;
                touchInput.y = -Math.sin(angle) * response;
            }
            movePadKnobEl.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
        }

            touchInput.x = 0;

        function getFirstActiveGamepad() {
            if (!navigator.getGamepads) {
                return null;
            }
            const pads = navigator.getGamepads();
            for (let i = 0; i < pads.length; i++) {
                const pad = pads[i];
                if (pad && pad.connected) {
                    return pad;
                }
            }
            return null;
        }

        function isGamepadButtonDown(pad, index, threshold = 0.5) {
            const button = pad && pad.buttons ? pad.buttons[index] : null;
            if (!button) {
                return false;
            }
            return button.pressed || button.value >= threshold;
        }

        function consumeGamepadPress(pad, index, threshold = 0.5) {
            const pressed = isGamepadButtonDown(pad, index, threshold);
            const wasPressed = !!gamepadInput.previousButtons[index];
            gamepadInput.previousButtons[index] = pressed;
            return pressed && !wasPressed;
        }

        function updateGamepadInput() {
            const pad = getFirstActiveGamepad();
            if (!pad) {
                gamepadInput.x = 0;
                gamepadInput.y = 0;
                gamepadInput.firing = false;
                gamepadInput.connected = false;
                gamepadInput.name = "";
                gamepadInput.previousButtons = [];
                return;
            }

            gamepadInput.connected = true;
            gamepadInput.name = pad.id || "Gamepad";
            const deadZone = 0.22;
            const axisX = Math.abs(pad.axes[0] || 0) >= deadZone ? pad.axes[0] : 0;
            const axisY = Math.abs(pad.axes[1] || 0) >= deadZone ? -(pad.axes[1] || 0) : 0;
            const dpadX = (isGamepadButtonDown(pad, 15) ? 1 : 0) - (isGamepadButtonDown(pad, 14) ? 1 : 0);
            const dpadY = (isGamepadButtonDown(pad, 12) ? 1 : 0) - (isGamepadButtonDown(pad, 13) ? 1 : 0);
            gamepadInput.x = BABYLON.Scalar.Clamp(axisX + dpadX, -1, 1);
            gamepadInput.y = BABYLON.Scalar.Clamp(axisY + dpadY, -1, 1);
            gamepadInput.firing =
                isGamepadButtonDown(pad, 0)
                || isGamepadButtonDown(pad, 1)
                || isGamepadButtonDown(pad, 7, 0.18);

            const confirmPressed =
                consumeGamepadPress(pad, 0)
                || consumeGamepadPress(pad, 7, 0.18);
            const powerPressed =
                consumeGamepadPress(pad, 2)
                || consumeGamepadPress(pad, 3)
                || consumeGamepadPress(pad, 6, 0.18);
            const startPressed = consumeGamepadPress(pad, 9);
            const restartPressed = consumeGamepadPress(pad, 8);

            if (confirmPressed || powerPressed || startPressed || restartPressed) {
                initAudio();
                playTitleMusic();
            }
            if (startPressed && isEventSkipAvailable()) {
                skipActiveEvent();
                return;
            }
            if (state.stage3IntroActive) {
                if (confirmPressed) {
                    advanceStage3IntroDialogue();
                }
                return;
            }
            if (state.stage3FinaleActive && confirmPressed) {
                advanceStage3FinaleDialogue();
                return;
            }
            if (!state.hasStarted && state.isIntermission && state.intermissionStep === "controlsGuide" && (confirmPressed || powerPressed || startPressed || restartPressed)) {
                startGame();
                return;
            }
            if (!state.hasStarted && (confirmPressed || startPressed)) {
                if (state.isIntermission && state.intermissionStep === "controlsGuide") {
                    startGame();
                } else {
                    showTitleControlsGuide();
                }
                return;
            }
            if (state.gameOver && (confirmPressed || powerPressed || startPressed || restartPressed)) {
                returnToTitleFromGameOver();
                return;
            }

        function randomRange(value) {
            if (Array.isArray(value)) {
                return value[0] + Math.random() * (value[1] - value[0]);
            }
            return value;
        }

        function scaleEnemyShotInterval(value) {
            const interval = randomRange(value);
            return interval / enemyShotFrequencyMultiplier;
        }

        function chooseWeighted(entries) {
            const total = entries.reduce((sum, entry) => sum + entry[1], 0);
            let roll = Math.random() * total;
            for (const [key, weight] of entries) {
                roll -= weight;
                if (roll <= 0) {
                    return key;
                }
            }
            return entries[entries.length - 1][0];
        }

        function getStageEnemyTable(stageNumber) {
            if (stageNumber === 2 && state.stageElapsed >= 24) {
                return stageEnemyTables["2-late"];
            }
            return stageEnemyTables[stageNumber] || stageEnemyTables[1];
        }

        function createGlowMaterial(scene, name, color, emissiveStrength) {
            const material = new BABYLON.StandardMaterial(name, scene);
            material.diffuseColor = color.scale(0.35);
            material.emissiveColor = color.scale(emissiveStrength);
            material.specularColor = color.scale(0.25);
            return material;
        }

        function createPlayerShieldMaterial(scene) {
            const texture = new BABYLON.DynamicTexture("playerShieldTexture", { width: 512, height: 512 }, scene, true);
            const context = texture.getContext();
            context.clearRect(0, 0, 512, 512);
            context.save();
            context.beginPath();
            context.ellipse(256, 256, 224, 186, 0, 0, Math.PI * 2);
            context.clip();

            const bodyGradient = context.createRadialGradient(256, 256, 24, 256, 256, 230);
            bodyGradient.addColorStop(0, "rgba(20, 150, 255, 0.02)");
            bodyGradient.addColorStop(0.56, "rgba(30, 160, 255, 0.08)");
            bodyGradient.addColorStop(0.78, "rgba(50, 210, 255, 0.22)");
            bodyGradient.addColorStop(1, "rgba(110, 230, 255, 0.44)");
            context.fillStyle = bodyGradient;
            context.fillRect(0, 0, 512, 512);

            context.strokeStyle = "rgba(88, 195, 255, 0.2)";
            context.lineWidth = 1.2;
            const radius = 18;
            const hexH = Math.sqrt(3) * radius;
            for (let y = 60; y < 456; y += hexH) {
                for (let x = 36; x < 476; x += radius * 3) {
                    const offsetX = ((Math.round(y / hexH) % 2) * radius * 1.5);
                    context.beginPath();
                    for (let i = 0; i < 6; i += 1) {
                        const angle = Math.PI / 6 + i * Math.PI / 3;
                        const px = x + offsetX + Math.cos(angle) * radius;
                        const py = y + Math.sin(angle) * radius;
                        if (i === 0) {
                            context.moveTo(px, py);
                        } else {
                            context.lineTo(px, py);
                        }
                    }
                    context.closePath();
                    context.stroke();
                }
            }
            context.restore();

            const rimGradient = context.createRadialGradient(256, 256, 150, 256, 256, 236);
            rimGradient.addColorStop(0, "rgba(80, 210, 255, 0)");
            rimGradient.addColorStop(0.72, "rgba(80, 210, 255, 0.1)");
            rimGradient.addColorStop(0.9, "rgba(130, 240, 255, 0.58)");
            rimGradient.addColorStop(1, "rgba(245, 255, 255, 0.82)");
            context.beginPath();
            context.ellipse(256, 256, 224, 186, 0, 0, Math.PI * 2);
            context.strokeStyle = rimGradient;
            context.lineWidth = 22;
            context.stroke();

            context.strokeStyle = "rgba(220, 250, 255, 0.9)";
            context.lineWidth = 3;
            context.beginPath();
            context.ellipse(256, 256, 224, 186, 0, 0, Math.PI * 2);
            context.stroke();

            const rearFade = context.createLinearGradient(32, 0, 480, 0);
            rearFade.addColorStop(0, "rgba(255, 255, 255, 0.58)");
            rearFade.addColorStop(0.42, "rgba(255, 255, 255, 0.72)");
            rearFade.addColorStop(1, "rgba(255, 255, 255, 0.96)");
            context.globalCompositeOperation = "destination-in";
            context.fillStyle = rearFade;
            context.fillRect(0, 0, 512, 512);
            context.globalCompositeOperation = "source-over";

            texture.update();
            const material = new BABYLON.StandardMaterial("playerShieldMat", scene);
            material.diffuseTexture = texture;
            material.emissiveTexture = texture;
            material.opacityTexture = texture;
            material.diffuseColor = BABYLON.Color3.White();
            material.emissiveColor = BABYLON.Color3.White();
            material.specularColor = BABYLON.Color3.Black();
            material.useAlphaFromDiffuseTexture = true;
            material.backFaceCulling = false;
            material.disableLighting = true;
            material.alpha = 0.82;
            return material;
        }

        function createEngineFlame(scene, materials, name, x, y, size) {
            const flame = BABYLON.MeshBuilder.CreateCylinder(name, {
                diameterTop: 0,
                diameterBottom: 0.14 * size,
                height: 0.58 * size,
                tessellation: 8
            }, scene);
            flame.rotation.z = Math.PI / 2;
            flame.position.set(x, y, 0.02);
            flame.material = materials.engine;
            return flame;
        }

        function fitImportedModelToPlayer(root, meshes) {
            const modelMeshes = meshes.filter((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
            if (modelMeshes.length === 0) {
                return;
            }

            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));
            const bounds = BABYLON.Mesh.MinMax(modelMeshes);
            const size = bounds.max.subtract(bounds.min);
            const maxDimension = Math.max(size.x, size.y, size.z);
            const scale = maxDimension > 0 ? 1.65 / maxDimension : 1;
            const center = bounds.min.add(size.scale(0.5));

            root.position.set(0, 0, 0);
            modelMeshes.forEach((mesh) => {
                mesh.position.subtractInPlace(center);
            });

            root.rotation.y = playerModelYaw;
            root.rotation.z = 0;
            root.scaling.setAll(scale);
            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));

            const fittedBounds = BABYLON.Mesh.MinMax(modelMeshes);
            const fittedCenterY = (fittedBounds.min.y + fittedBounds.max.y) * 0.5;
            root.position.x = playerModelLeftX - fittedBounds.min.x;
            root.position.y = -fittedCenterY;
        }

        function fitImportedModel(root, meshes, targetSize, rotation, scaleMultiplier = BABYLON.Vector3.One()) {
            const modelMeshes = meshes.filter((mesh) => mesh.getTotalVertices && mesh.getTotalVertices() > 0);
            if (modelMeshes.length === 0) {
                return;
            }

            root.computeWorldMatrix(true);
            modelMeshes.forEach((mesh) => mesh.computeWorldMatrix(true));
            const bounds = BABYLON.Mesh.MinMax(modelMeshes);
            const size = bounds.max.subtract(bounds.min);
            const maxDimension = Math.max(size.x, size.y, size.z);
            const center = bounds.min.add(size.scale(0.5));

            modelMeshes.forEach((mesh) => {
                mesh.position.subtractInPlace(center);
            });
            root.rotation.set(rotation.x, rotation.y, rotation.z);
            const scale = maxDimension > 0 ? targetSize / maxDimension : 1;
            root.scaling.set(scale * scaleMultiplier.x, scale * scaleMultiplier.y, scale * scaleMultiplier.z);
        }

        function loadModelTemplate(scene, templates, key, fileName, targetSize, rotation = BABYLON.Vector3.Zero(), scaleMultiplier = BABYLON.Vector3.One()) {
            BABYLON.SceneLoader.ImportMeshAsync("", "./", fileName, scene).then((result) => {
                const templateRoot = new BABYLON.TransformNode(`${key}Template`, scene);
                const modelRoot = new BABYLON.TransformNode(`${key}Model`, scene);
                modelRoot.parent = templateRoot;
                result.meshes.forEach((mesh) => {
                    mesh.parent = modelRoot;
                    mesh.setEnabled(false);
                });
                fitImportedModel(modelRoot, result.meshes, targetSize, rotation);
                templateRoot.scaling.set(scaleMultiplier.x, scaleMultiplier.y, scaleMultiplier.z);
                templateRoot.setEnabled(false);
                templates[key] = templateRoot;
            }).catch((error) => {
                console.warn(`Could not load ${fileName}`, error);
            });
        }

        function cloneModelTemplate(key, name) {
            const template = game.modelTemplates[key];
            if (!template) {
                return null;
            }

            const clone = template.clone(name, null, false);
            clone.setEnabled(true);
            clone.getChildMeshes(false).forEach((mesh) => {
                mesh.setEnabled(true);
            });
            return clone;
        }

        function loadPlayerModel(scene, root, fileIndex = 0) {
            const fileName = playerModelFiles[fileIndex];
            if (!fileName) {
                console.warn("Could not load any player GLB model.");
                return;
            }

            BABYLON.SceneLoader.ImportMeshAsync("", "./", fileName, scene).then((result) => {
                const importedRoot = new BABYLON.TransformNode("playerModelRoot", scene);
                result.meshes.forEach((mesh) => {
                    mesh.parent = importedRoot;
                });
                fitImportedModelToPlayer(importedRoot, result.meshes);
                importedRoot.parent = root;
                root.metadata.modelRoot = importedRoot;
            }).catch(() => {
                loadPlayerModel(scene, root, fileIndex + 1);
            });
        }

        function createPlayerShip(scene, materials) {
            const root = new BABYLON.TransformNode("playerShip", scene);
            const flameMain = createEngineFlame(scene, materials, "playerFlameMain", -1.05, -0.02, 1);
            const flameAux = createEngineFlame(scene, materials, "playerFlameAux", -1.05, -0.02, 1);
            flameMain.metadata = { baseY: -0.02, bankOffset: -1 };
            flameAux.metadata = { baseY: -0.02, bankOffset: 1 };
            flameMain.parent = root;
            flameAux.parent = root;

            root.position.set(world.minX + 1.3, 0, 0);
            root.metadata = {
                flames: [flameMain, flameAux]
            };

            loadPlayerModel(scene, root);

            return root;
        }

        function createEnemyShip(scene, materials, isAsteroid) {
            const root = new BABYLON.TransformNode(isAsteroid ? "asteroid" : "enemyDrone", scene);

            if (isAsteroid) {
                const mainRock = BABYLON.MeshBuilder.CreatePolyhedron("asteroidCore", {
                    type: 2,
                    size: 0.46 + Math.random() * 0.18
                }, scene);
                mainRock.material = materials.asteroid;
                mainRock.parent = root;

                for (let i = 0; i < 3; i++) {
                    const chip = BABYLON.MeshBuilder.CreatePolyhedron("asteroidChip", {
                        type: 1,
                        size: 0.16 + Math.random() * 0.12
                    }, scene);
                    const angle = Math.random() * Math.PI * 2;
                    chip.position.set(Math.cos(angle) * 0.32, Math.sin(angle) * 0.24, 0.03);
                    chip.rotation.set(Math.random(), Math.random(), Math.random());
                    chip.material = materials.asteroid;
                    chip.parent = root;
                }
                return root;
            }

            const body = BABYLON.MeshBuilder.CreateBox("enemyBody", {
                width: 0.48,
                height: 0.48,
                depth: 0.18
            }, scene);
            body.rotation.z = Math.PI / 4;
            body.material = materials.enemy;
            body.parent = root;

            const wingTop = BABYLON.MeshBuilder.CreateBox("enemyWingTop", {
                width: 0.48,
                height: 0.1,
                depth: 0.12
            }, scene);
            wingTop.position.set(-0.22, 0.34, 0);
            wingTop.rotation.z = -0.25;
            wingTop.material = materials.enemyWing;
            wingTop.parent = root;

            const wingBottom = wingTop.clone("enemyWingBottom");

            wingBottom.parent = root;

            const core = BABYLON.MeshBuilder.CreateSphere("enemyCore", {
                diameter: 0.2,
                segments: 12
            }, scene);
            core.position.z = -0.12;
            core.material = materials.enemyCore;
            core.parent = root;

            return root;
        }

        function loadHighScore() {
            try {
                const saved = Number(window.localStorage.getItem(highScoreStorageKey) || 0);
                state.highScore = Number.isFinite(saved) ? Math.max(0, Math.floor(saved)) : 0;
            } catch (error) {
                state.highScore = 0;
            }
        }

        function updateTitleHighScore() {
            titleHighScoreEl.textContent = `HI SCORE ${state.highScore}`;
        }

        function saveHighScore() {
            if (state.score <= state.highScore) {
                updateTitleHighScore();
                return false;
            }
            state.highScore = Math.floor(state.score);
            try {
                window.localStorage.setItem(highScoreStorageKey, String(state.highScore));
            } catch (error) {
                console.warn("Could not save high score.", error);
            }
            updateTitleHighScore();
            return true;
        }

        function updateHud() {
            scoreEl.textContent = `SCORE ${state.score}`;
            livesEl.textContent = `LIFE ${state.lives}`;
            powerSlots.forEach((slot, index) => {
                const disabled = isPowerMaxed(index);
                slot.classList.toggle("isActive", index === state.powerCursor);
                slot.classList.toggle("isDisabled", disabled);
                slot.classList.toggle("isLocked", index === 4 && !state.lemonUnlocked);
                slot.classList.toggle("isOwned",
                    (index === 0 && state.speedLevel > 0)
                    || (index === 1 && state.missileLevel > 0)
                    || (index === 2 && options.length > 0)
                    || (index === 3 && state.shield > 0)
                    || (index === 4 && state.hasLaser)
                );
            });
        }

        function isPowerMaxed(index) {
            switch (index) {
                case 0:
                    return state.speedLevel >= 3;
                case 1:
                    return state.missileLevel >= (state.lemonUnlocked ? 4 : 1);
                case 2:
                    return options.length >= 2;
                case 3:
                    return state.shield > 0;
                case 4:
                    return !state.lemonUnlocked || state.hasLaser;
                default:
                    return true;
            }
        }

        function advancePowerCursor() {
            for (let i = 0; i < powerItems.length; i++) {
                state.powerCursor = (state.powerCursor + 1) % powerItems.length;
                if (!isPowerMaxed(state.powerCursor)) {
                    return;
                }
            }
            state.powerCursor = -1;
        }

        function areAllPowersMaxed() {
            return powerItems.every((_, index) => isPowerMaxed(index));
        }

                dialogueEl.classList.remove("hasPortrait");
            }

            if (state.dialogueTimer <= 0) {
                return;
            }

                dialogueEl.classList.remove("hasPortrait");
                dialoguePortraitEl.removeAttribute("src");

        function clearActiveGameObjects(options = {}) {
            const keepEnemies = !!options.keepEnemies;
            const keepCapsules = !!options.keepCapsules;
            bullets.splice(0).forEach((item) => item.dispose());
            enemyBullets.splice(0).forEach((item) => item.dispose());
            if (!keepEnemies) {
                enemies.splice(0).forEach((item) => disposeEnemy(item));
            }
            if (!keepCapsules) {
                capsules.splice(0).forEach((item) => item.dispose());
            }
            terrain.splice(0).forEach((item) => item.dispose());
            shockwaves.splice(0).forEach((item) => item.dispose());
            sparks.splice(0).forEach((item) => item.dispose());
            explosions.splice(0).forEach((item) => item.dispose());
        }

                console.warn("Could not dispose Stage3 intro scene.", error);

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
