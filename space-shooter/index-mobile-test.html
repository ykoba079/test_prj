        function launchStage3SupportMissile(actor) {
            const missile = actor.metadata.missile;
            if (!missile || missile.isDisposed()) {
                return;
            }
            const worldMatrix = missile.computeWorldMatrix(true);
            const launchPosition = new BABYLON.Vector3();
            const launchScale = new BABYLON.Vector3();
            const launchRotation = new BABYLON.Quaternion();
            worldMatrix.decompose(launchScale, launchRotation, launchPosition);
            missile.parent = null;
            missile.position.copyFrom(launchPosition);
            missile.scaling.copyFrom(launchScale);
            missile.rotationQuaternion = launchRotation;
            missile.rotation.set(0, 0, 0);
            missile.metadata = {
                kind: "lemonjiSupportMissile",
                speed: 10.8,
                radius: 0.52,
                damage: 4.5,
                supportCluster: true,
                spin: 0,
                lemon: true,
                shotOwner: "lemonjiSupport"
            };
            bullets.push(missile);
            actor.metadata.missile = null;
            addSparks(launchPosition, 16);
            playSound("missile");
        }

        function finishStageOneLemonjiFlyby() {
            state.stage1LemonjiEventActive = false;
            state.stage1LemonjiEventTimer = 0;
            state.enemyTimer = 0.8;
            state.formationTimer = 1.6;
            for (let i = stageActors.length - 1; i >= 0; i--) {
                const actor = stageActors[i];
                if (actor && actor.metadata && actor.metadata.kind === "stage1LemonjiFlyby") {
                    actor.dispose();
                    stageActors.splice(i, 1);
                }
            }
        }

        function updateStageActors(delta) {
            for (let i = stageActors.length - 1; i >= 0; i--) {
                const actor = stageActors[i];
                if (!actor || (actor.isDisposed && actor.isDisposed())) {
                    stageActors.splice(i, 1);
                    continue;
                }
                if (!actor.metadata) {
                    continue;
                }
                if (actor.metadata.kind === "stage3LemonjiSupport") {
                    const data = actor.metadata;
                    data.age += delta;
                    if (data.age < 1.0) {
                        const progress = easeInOut(data.age / 1.0);
                        actor.position.x = BABYLON.Scalar.Lerp(data.startX, data.holdX, progress);
                        actor.position.y = BABYLON.Scalar.Lerp(data.startY, data.holdY, progress);
                        actor.rotation.z = BABYLON.Scalar.Lerp(BABYLON.Tools.ToRadians(-18), 0, progress);
                    } else if (data.age < 2.0) {
                        const hover = Math.sin(data.age * 5.2) * 0.05;
                        actor.position.set(data.holdX, data.holdY + hover, -0.2);
                        actor.rotation.z = Math.sin(data.age * 4.4) * 0.035;
                    } else {
                        if (!data.launched) {
                            data.launched = true;
                            launchStage3SupportMissile(actor);
                        }
                        const progress = easeInOut(Math.min(1, (data.age - 2.0) / 2.4));
                        actor.position.x = BABYLON.Scalar.Lerp(data.holdX, data.exitX, progress);
                        actor.position.y = BABYLON.Scalar.Lerp(data.holdY, data.exitY, progress);
                        actor.position.z = BABYLON.Scalar.Lerp(-0.2, -0.8, progress);
                        actor.scaling.setAll(BABYLON.Scalar.Lerp(0.72, 1.8, progress));
                        actor.rotation.set(
                            BABYLON.Scalar.Lerp(0, BABYLON.Tools.ToRadians(8), progress),
                            BABYLON.Tools.ToRadians(290),
                            BABYLON.Scalar.Lerp(0, BABYLON.Tools.ToRadians(80), progress)
                        );
                        if (progress >= 1) {
                            actor.dispose();
                            stageActors.splice(i, 1);
                        }
                    }
                    continue;
                }
                if (actor.metadata.kind !== "stage1LemonjiFlyby") {
                    continue;
                }
                const t = state.stage1LemonjiEventTimer;
                if (t < 0) {
                    actor.setEnabled(false);
                    continue;
                }
                if (!actor.isEnabled()) {
                    actor.setEnabled(true);
                }
                const data = actor.metadata;
                if (t < 2.8) {
                    const progress = easeInOut(Math.min(1, t / 2.8));
                    actor.position.set(
                        BABYLON.Scalar.Lerp(data.startX, data.holdX, progress),
                        BABYLON.Scalar.Lerp(data.startY, data.holdY, progress),
                        BABYLON.Scalar.Lerp(data.startZ, data.holdZ, progress)
                    );
                    actor.scaling.setAll(BABYLON.Scalar.Lerp(0.4, 1.0, progress));
                    actor.rotation.set(
                        0,
                        BABYLON.Tools.ToRadians(290),
                        BABYLON.Scalar.Lerp(BABYLON.Tools.ToRadians(50), 0, progress)
                    );
                    continue;
                }

                if (!data.dialogueShown) {
                    data.dialogueShown = true;
                    showDialogue(
                        "レモンジ通信",
                        "そこの戦闘機、からあげを振り切ってアステロイドベルトまで来い。\n追っ手はそこで散らせる。",
                        4.8,
                        "img/lemonji_insert.jpg"
                    );
                }

                if (t < 4.8) {
                    const hover = Math.sin(t * 3.4) * 0.08;
                    actor.position.set(data.holdX, data.holdY + hover, data.holdZ);
                    actor.scaling.setAll(1.0);
                    actor.rotation.set(0, BABYLON.Tools.ToRadians(290), Math.sin(t * 2.7) * 0.035);
                    continue;
                }

                const progress = easeInOut(Math.min(1, (t - 4.8) / 3.0));
                actor.position.set(
                    BABYLON.Scalar.Lerp(data.holdX, data.exitX, progress),
                    BABYLON.Scalar.Lerp(data.holdY, data.exitY, progress),
                    BABYLON.Scalar.Lerp(data.holdZ, data.exitZ, progress)
                );
                actor.scaling.setAll(BABYLON.Scalar.Lerp(1.0, 2.5, progress));
                actor.rotation.set(
                    BABYLON.Scalar.Lerp(0, BABYLON.Tools.ToRadians(8), progress),
                    BABYLON.Tools.ToRadians(290),
                    BABYLON.Scalar.Lerp(0, BABYLON.Tools.ToRadians(80), progress)
                );
                if (progress >= 1) {
                    actor.dispose();
                    stageActors.splice(i, 1);
                }
            }
        }

        function hideStage3IntroCaption() {
            stage3IntroCaptionEl.classList.remove("isVisible");
            stage3IntroTextEl.textContent = "";
        }

        function requestStage3IntroSkip() {
            if (!state.stage3IntroActive || state.stage3IntroFading) {
                return;
            }
            state.stage3IntroFading = true;
            state.stage3IntroFadeTimer = 0;
            stage3IntroOverlayEl.classList.add("isFading");
            hideStage3IntroCaption();
        }

        function advanceStage3IntroDialogue() {
            if (!state.stage3IntroActive || state.stage3IntroFading) {
                return;
            }
            const advanced = stage3IntroInstance
                && typeof stage3IntroInstance.advanceDialogue === "function"
                && stage3IntroInstance.advanceDialogue();
            if (!advanced) {
                requestStage3IntroSkip();
            }
        }

        function finishStage3IntroCutscene() {
            if (!state.stage3IntroActive) {
                return;
            }
            state.stage3IntroActive = false;
            state.stage3IntroFading = false;
            state.stage3IntroFadeTimer = 0;
            resetCameraToGameplay();
            disposeStage3IntroInstance();
            state.stageElapsed = 0;
            state.enemyTimer = 0.4;
            state.formationTimer = 1.4;
            game.player.position.set(world.minX + 1.3, 0, 0);
            game.player.rotation.set(0, 0, 0);
            game.player.scaling.set(1, 1, 1);
            game.player.setEnabled(true);
            stage3IntroOverlayEl.classList.remove("isVisible", "isFading");
            stage3IntroCaptionEl.classList.remove("isVisible");
            showDialogue("作戦宙域 3", stageDefinitions[2].title, 3);
        }

        function startStage3IntroCutscene() {
            clearActiveGameObjects();
            state.stageElapsed = 0;
            state.stage3IntroActive = true;
            state.stage3IntroTimer = 0;
            state.stage3IntroFading = false;
            state.stage3IntroFadeTimer = 0;
            stage3IntroOverlayEl.classList.add("isVisible");
            stage3IntroOverlayEl.classList.remove("isFading");
            hideStage3IntroCaption();
            dialogueEl.classList.remove("isVisible");
            game.player.setEnabled(false);
            resetCameraToGameplay();
            disposeStage3IntroInstance();
            try {
                stage3IntroInstance = window.Stage3FleetIntro.create({
                    canvas: stage3IntroCanvasEl,
                    captionEl: stage3IntroCaptionEl,
                    captionTextEl: stage3IntroTextEl,
                    embedded: true,
                    applyEmbeddedClass: false
                });
            } catch (error) {
                console.warn("Stage3 intro scene failed to start.", error);
                finishStage3IntroCutscene();
            }
        }

        function updateStage3IntroCutscene(delta) {
            state.stage3IntroTimer += delta;
            const t = state.stage3IntroTimer;

            if (state.stage3IntroFading) {
                state.stage3IntroFadeTimer += delta;
                if (state.stage3IntroFadeTimer >= 0.95) {
                    finishStage3IntroCutscene();
                }
                return;
            }

            if (t >= 9) {
                requestStage3IntroSkip();
                return;
            }
            return;
        }

        function isEventSkipAvailable() {
            return state.stage3IntroActive
                || state.stage3FinaleActive
                || state.stage1LemonjiEventActive
                || (state.isIntermission && state.intermissionStep !== "controlsGuide" && state.intermissionStep !== "endingFinalResult" && state.intermissionStep !== "ending");
        }

        function syncEventSkipButton() {
            eventSkipButtonEl.classList.toggle("isVisible", isEventSkipAvailable());
        }

        function skipIntermissionSequence() {
            switch (state.intermissionStep) {
                case "controlsGuide":
                    startGame();
                    break;
                case "introStart":
                    beginStage(1);
                    break;
                case "stage1Result":
                case "baseTalkPlayerQuestion":
                case "baseTalkLemonQuestion":
                case "baseTalkPlayerLemon":
                case "baseTalkLaw":
                case "baseTalkPlayerShock":
                case "baseTalkCoup":
                case "baseTalkRefuse":
                case "baseTalkDeal":
                case "baseTalkMission":
                case "baseTalkAccept":
                case "lemonLiquid":
                case "startStage2":
                    state.lemonUnlocked = true;
                    stopHideoutMusic();
                    beginStage(2);
                    break;
                case "stage2Result":
                case "startStage3":
                    beginStage(3);
                    break;
                case "endingGogai1":
                case "endingGogai2":
                case "endingGogai3":
                case "endingBlackoutBeforeGogai":
                case "endingBlackoutBeforeCredits":
                case "endingCredits":
                case "endingBlackoutBeforeNextWorld":
                case "endingNextWorld":
                case "endingBlackoutBeforeResult":
                    showEndingFinalResult();
                    break;
                case "ending":
                case "endingFinalResult":
                    advanceIntermission();
                    break;
                default:
                    advanceIntermission();
                    break;
            }
        }

        function skipStage3Finale() {
            if (state.stage3FinaleLemonji && !state.stage3FinaleLemonji.isDisposed()) {
                state.stage3FinaleLemonji.dispose();
            }
            state.stage3FinaleLemonji = null;
            state.stage3FinaleActive = false;
            state.stage3FinalePhase = "";
            state.stage3FinaleTimer = 0;
            state.stage3FinaleBurstTimer = 0;
            state.stage3FinaleDialogueIndex = 0;
            dialogueEl.classList.remove("isVisible");
            dialogueEl.classList.remove("hasPortrait");
            dialoguePortraitEl.removeAttribute("src");
            stage3IntroOverlayEl.classList.remove("isVisible", "isFading");
            clearActiveGameObjects();
            if (!audioState.endingMusic || audioState.endingMusic.paused) {
                playEndingMusic();
            }
            showEndingFinalResult();
        }

        function skipActiveEvent() {
            initAudio();
            if (state.stage3IntroActive) {
                requestStage3IntroSkip();
                return;
            }
            if (state.stage3FinaleActive) {
                skipStage3Finale();
                return;
            }
            if (state.stage1LemonjiEventActive) {
                finishStageOneLemonjiFlyby();
                dialogueEl.classList.remove("isVisible");
                dialogueEl.classList.remove("hasPortrait");
                dialoguePortraitEl.removeAttribute("src");
                return;
            }
            if (state.isIntermission) {
                playSound("pickup");
                skipIntermissionSequence();
            }
        }

        function startStageClearExit(stageNumber) {
            if (state.stageClearExitActive || state.isIntermission) {
                return;
            }
            state.stageClearExitActive = true;
            state.stageClearExitTimer = 0;
            state.stageClearExitStage = stageNumber;
            state.stageClearExitStartX = game.player.position.x;
            state.stageClearExitStartY = game.player.position.y;
            state.stageClearExitPlayerGone = false;
            touchInput.firing = false;
            resetTouchMove();
            bullets.splice(0).forEach((item) => item.dispose());
            enemyBullets.splice(0).forEach((item) => item.dispose());
            enemies.splice(0).forEach((item) => disposeEnemy(item));
            capsules.splice(0).forEach((item) => item.dispose());
            terrain.splice(0).forEach((item) => item.dispose());
            bossHudEl.classList.remove("isVisible");
            dialogueEl.classList.remove("isVisible");
            stageClearBannerEl.textContent = `STAGE ${stageNumber} CLEAR\nSCORE ${state.score}`;
            stageClearBannerEl.classList.add("isVisible");
            if (stageNumber === 1) {
                stopStage1JourneyMusic();
            } else if (stageNumber === 2) {
                stopStage2Music();
            }
            playStageClearJingle();
        }

        function updateStageClearExit(delta) {
            state.stageClearExitTimer += delta;
            const exitDuration = 3.0;
            const progress = Math.min(1, state.stageClearExitTimer / exitDuration);
            const eased = easeInOut(progress);
            if (!state.stageClearExitPlayerGone) {
                game.player.position.x = BABYLON.Scalar.Lerp(state.stageClearExitStartX, world.maxX + 1.8, eased);
                game.player.position.y = BABYLON.Scalar.Lerp(state.stageClearExitStartY, 1.25, eased);
                game.player.scaling.setAll(BABYLON.Scalar.Lerp(1, 0.76, progress));
                const modelRoot = game.player.metadata.modelRoot;
                if (modelRoot) {
                    modelRoot.rotation.z = BABYLON.Scalar.Lerp(modelRoot.rotation.z, -playerModelRoll * 1.35, 0.12);
                }
                if (game.player.metadata.flames) {
                    game.player.metadata.flames.forEach((flame) => {
                        flame.scaling.x = 1.25 + Math.sin(state.elapsed * 24) * 0.16;
                        flame.scaling.y = flame.scaling.x;
                    });
                }
                playerTrail.unshift(game.player.position.clone());
                if (playerTrail.length > 80) {
                    playerTrail.length = 80;
                }
                options.forEach((option) => {
                    option.position.x = BABYLON.Scalar.Lerp(option.position.x, game.player.position.x - 0.7, 0.1);
                    option.position.y = BABYLON.Scalar.Lerp(option.position.y, game.player.position.y, 0.08);
                    option.rotation.z += delta * 4.2;
                });
            }
            if (progress >= 1 && !state.stageClearExitPlayerGone) {
                state.stageClearExitPlayerGone = true;
                game.player.setEnabled(false);
                options.splice(0).forEach((option) => option.dispose());
            }
            if (state.stageClearExitPlayerGone) {
                stageClearBannerEl.classList.remove("isVisible");
                state.stageClearExitActive = false;
                triggerStageClear();
            }
        }

        function updateStage(delta) {
            if (state.stage3ClearPending) {
                state.stage3ClearTimer += delta;
                if (state.stage3ClearTimer >= 2.8) {
                    completeGame();
                }
                return;
            }

            storyEvents.forEach((event) => {
                if (
                    event.stage === state.stage
                    && state.stageElapsed >= event.at
                    && !state.triggeredStories.has(event.id)
                ) {
                    state.triggeredStories.add(event.id);
                    showDialogue(event.speaker, event.text, 4.8);
                }
            });

            if (state.stage === 1 && state.stage1LemonjiEventActive) {
                return;
            }

            if (state.stage === 1 && !state.stage1BossSpawned) {
                updateStageOnePatterns();
            }

            if (state.stage === 1 && state.stage1CoreDefeated) {
                if (state.stage1CoreFallDone && state.stageBossCount <= 0) {
                    state.stage1ClearTimer += delta;
                }
                if (state.stage1CoreFallDone && state.stageBossCount <= 0 && state.stage1ClearTimer >= 2.8) {
                    startStageClearExit(1);
                }
                return;
            }

            if (state.stage === 1 && !state.stage1GuideShown && state.stageElapsed >= 30) {
                startStageOneLemonjiFlyby();
                return;
            }

            if (state.stage === 1 && state.stage1GuideShown && !state.stage1BossSpawned && state.stageElapsed >= 47) {
                spawnStageOneBoss();
                return;
            }

            if (state.stage === 2 && state.stage2ClearPending) {
                state.stage2ClearTimer += delta;
                if (state.stage2ClearTimer >= 2.8) {
                    startStageClearExit(2);
                }
                return;
            }

            if (state.stage === 2 && !state.stage2BossSpawned && state.stageElapsed >= 46) {
                spawnStageTwoBoss();
                return;
            }

            if (state.stage === 3) {
                state.stage3SupportCooldown = Math.max(0, state.stage3SupportCooldown - delta);
            }

            if (state.stage === 3 && !state.stage3BossSpawned && !state.stage3BossMusicCueStarted && state.stageElapsed >= 38) {
                state.stage3BossMusicCueStarted = true;
                fadeOutStage3MusicForBoss(5);
            }

            if (state.stage === 3 && !state.stage3BossSpawned && state.stageElapsed >= 43) {
                spawnFinalBoss();
                return;
            }

            const current = stageDefinitions[state.stage - 1];
            if (current && state.stageElapsed >= current.duration) {
                triggerStageClear();
            }
        }

        function updateStageOnePatterns() {
            while (
                state.stagePatternIndex < stageOnePatterns.length
                && state.stageElapsed >= stageOnePatterns[state.stagePatternIndex].at
            ) {
                spawnStageOnePattern(stageOnePatterns[state.stagePatternIndex]);
                state.stagePatternIndex += 1;
            }
        }

        function spawnStageOnePattern(pattern) {
            const startX = world.maxX + 0.8;
            if (pattern.kind === "line" || pattern.kind === "sparse") {
                for (let i = 0; i < pattern.count; i++) {
                    const y = Array.isArray(pattern.y)
                        ? pattern.y[i % pattern.y.length]
                        : BABYLON.Scalar.Clamp(pattern.y + (i - pattern.count / 2) * 0.72, world.minY + 0.5, world.maxY - 0.5);
                    spawnEnemyAt(startX, y, i * (pattern.gap || 0.6), {
                        enemyType: pattern.enemyTypes ? pattern.enemyTypes[i % pattern.enemyTypes.length] : pattern.enemyType,
                        carriesCapsule: pattern.capsuleIndex === i,
                        waveAmount: pattern.kind === "sparse" ? 0.38 : 0.18,
                        waveSpeed: 1.4,
                        wavePhase: i * 0.6
                    });
                }
                return;
            }

            if (pattern.kind === "wave") {
                for (let i = 0; i < pattern.count; i++) {
                    const phase = (pattern.phase || 0) + i * 0.78;
                    const y = BABYLON.Scalar.Clamp(
                        pattern.baseY + Math.sin(phase) * (pattern.waveAmount || 1),
                        world.minY + 0.5,
                        world.maxY - 0.5
                    );
                    spawnEnemyAt(startX, y, i * (pattern.gap || 0.5), {
                        enemyType: pattern.enemyType,
                        carriesCapsule: pattern.capsuleIndex === i,
                        waveY: pattern.baseY,
                        waveAmount: pattern.waveAmount || 1,
                        waveSpeed: pattern.waveSpeed || 1.6,
                        wavePhase: phase,
                        speedBonus: 0.1
                    });
                }
                return;
            }

            if (pattern.kind === "fighterDive") {
                for (let i = 0; i < pattern.count; i++) {
                    const phase = (pattern.phase || 0) + i * 0.82;
                    const y = BABYLON.Scalar.Clamp(
                        pattern.baseY + Math.sin(phase) * (pattern.waveAmount || 1),
                        world.minY + 0.5,
                        world.maxY - 0.5
                    );
                    spawnEnemyAt(startX + i * 0.42, y, i * (pattern.gap || 0.42), {
                        enemyType: "fighter",
                        carriesCapsule: pattern.capsuleIndex === i,
                        waveY: pattern.baseY,
                        waveAmount: pattern.waveAmount || 1,
                        waveSpeed: pattern.waveSpeed || 1.8,
                        wavePhase: phase,
                        speedBonus: 0.45,
                        depthIntroZ: pattern.fromNear ? -1.35 : 1.15,
                        depthIntroScale: pattern.fromNear ? 2 : 0.2,
                        depthIntroDuration: 3,
                        introRightX: world.maxX - 0.65,
                        introRotation: pattern.fromNear
                            ? { x: BABYLON.Tools.ToRadians(6), y: BABYLON.Tools.ToRadians(420), z: BABYLON.Tools.ToRadians(-16) }
                            : { x: BABYLON.Tools.ToRadians(-6), y: BABYLON.Tools.ToRadians(80), z: BABYLON.Tools.ToRadians(16) },
                        canShoot: true
                    });
                }
            }
        }

        function spawnStageOneBoss() {
            state.stage1BossSpawned = true;
            state.stageBossCount = 4;
            showDialogue("帝国警報", "哨戒部隊、侵入者の進路を封鎖せよ。", 2.4);

            const config = enemyConfigs.diskA;
            const diskHoverX = world.maxX - 1.35;
            const workerHoverX = world.maxX - (world.maxX - world.minX) * 0.31;
            const disk = cloneModelTemplate("enemyDiskA", "stage1DiskCore") || createEnemyShip(game.scene, game.materials, false);
            disk.position.set(world.maxX + 2.2, 0, 0);
            disk.rotation.z = 0;
            disk.metadata = {
                speed: randomRange(config.speed),
                radius: config.radius,
                hp: 20,
                maxHp: 20,
                points: 2500,
                spin: 0,
                baseRotationZ: 0,
                hitKick: 0,
                hitFlash: 0,
                hitScale: 1,
                waveY: 0,
                waveAmount: 0.36,
                waveSpeed: 0.9,
                wavePhase: 0,
                motion: "hover",
                hoverX: diskHoverX,
                enemyType: "diskA",
                enemyConfig: config,
                carriesCapsule: false,
                canShoot: true,
                shotInterval: 1.5,
                shootTimer: 1.5,
                isStageBoss: true,
                isStageOneCore: true
            };
            enemies.push(disk);

            spawnEnemyAt(world.maxX + 2.2, 0, 0, {
                enemyType: "worker",
                carriesCapsule: false,
                motion: "stage1LeftGuard",
                hoverX: workerHoverX,
                positionZ: -0.45,
                waveY: 0,
                waveAmount: 0.22,
                waveSpeed: 1.1,
                wavePhase: 0,
                canShoot: true,
                isStageBoss: true
            });

            [-2.15, 2.15].forEach((y, index) => {
                spawnEnemyAt(world.maxX + 1.4, y, index * 0.42, {
                    enemyType: "teacherLarge",
                    carriesCapsule: false,
                    motion: "hover",
                    hoverX: world.maxX - 1.65,
                    waveY: y,
                    waveAmount: 0.26,
                    waveSpeed: 1.0,
                    wavePhase: index * Math.PI,
                    canShoot: true,
                    hp: 3,
                    isStageBoss: true
                });
            });
        }

        function addGravityBossOrbitingRocks(boss) {
            boss.metadata.shields = boss.metadata.shields || [];
            boss.metadata.parts = boss.metadata.parts || [];
            for (let i = 0; i < 8; i++) {
                const rock = createEnemyShip(game.scene, game.materials, true);
                rock.name = `gravityOrbitRock${i}`;
                rock.parent = boss;
                rock.metadata = {
                    kind: "gravityOrbitRock",
                    hp: 14,
                    maxHp: 14,
                    radius: 0.84,
                    orbitAngle: (Math.PI * 2 * i) / 8,
                    orbitRadiusX: 2.55 + (i % 2) * 0.18,
                    orbitRadiusY: 1.7 + ((i + 1) % 2) * 0.16,
                    orbitSpeed: 1.25,
                    spinX: 0.8 + Math.random() * 1.2,
                    spinY: -0.8 + Math.random() * 1.6,
                    spinZ: -1.1 + Math.random() * 2.2,
                    baseScale: 0.92 + Math.random() * 0.32
                };
                rock.scaling.setAll(rock.metadata.baseScale);
                rock.position.set(
                    Math.cos(rock.metadata.orbitAngle) * rock.metadata.orbitRadiusX,
                    Math.sin(rock.metadata.orbitAngle) * rock.metadata.orbitRadiusY,
                    -0.34
                );
                boss.metadata.shields.push(rock);
                boss.metadata.parts.push(rock);
            }
        }

        function spawnStageTwoBoss() {
            state.stage2BossSpawned = true;
            state.stageBossCount = 1;
            showDialogue("レモンジ", "でかい重力反応だ。\n小惑星を引き寄せて、盾にしてるぞ。", 3.2);
            const config = enemyConfigs.diskB;
            const boss = cloneModelTemplate("enemyDiskB", "stage2GravityKaraage") || cloneModelTemplate("enemyDiskA", "stage2GravityKaraage") || createEnemyShip(game.scene, game.materials, false);
            boss.position.set(world.maxX + 2.2, 0, -0.08);
            boss.rotation.z = 0;
            boss.metadata = {
                speed: 0.9,
                radius: 2.15,
                hp: 42,
                maxHp: 42,
                points: 4200,
                spin: 0,
                baseRotationZ: 0,
                hitKick: 0,
                hitFlash: 0,
                hitScale: 1,
                waveY: 0,
                waveAmount: 1.35,
                waveSpeed: 0.55,
                wavePhase: 0,
                motion: "gravityBoss",
                hoverX: world.maxX - 2.15,
                enemyType: "gravityBoss",
                enemyConfig: config,
                carriesCapsule: false,
                canShoot: true,
                shotInterval: 2.2,
                shootTimer: 1.2,
                gravityTimer: 0.4,
                gravityAngle: 0,
                isStageBoss: true
            };
            const field = BABYLON.MeshBuilder.CreateTorus("gravityField", {
                diameter: 4.2,
                thickness: 0.045,
                tessellation: 72
            }, game.scene);
            field.rotation.x = Math.PI / 2;

            intermissionPanelEl.classList.toggle("isNextWorld", isNextWorldStep);
            intermissionPanelEl.classList.toggle("isControls", isControlsStep);

        function fireOneShot(origin, forceNormal = false, shotOwner = "player") {
            const isLaser = state.hasLaser && !forceNormal;
            const isLemonBullet = state.lemonUnlocked && !isLaser && !forceNormal && shotOwner === "player";
            const normalShotLimit = 3;
            const activeOwnerShots = bullets.filter((bullet) =>
                bullet.metadata.kind === "normal" && bullet.metadata.shotOwner === shotOwner
            ).length;
            if (!isLaser && activeOwnerShots >= normalShotLimit) {
                return false;
            }
            const bullet = isLaser
                ? cloneModelTemplate("laserLemon", "laser") || BABYLON.MeshBuilder.CreateBox("laser", { width: 1.05, height: 0.08, depth: 0.08 }, game.scene)
                : BABYLON.MeshBuilder.CreateSphere("bullet", { diameter: 0.16, segments: 12 }, game.scene);
            bullet.position.set(origin.x + 0.65, origin.y, -0.05);
            bullet.metadata = {
                kind: isLaser ? "laser" : "normal",
                speed: isLaser ? 15 : 12,
                radius: isLaser ? 0.34 : isLemonBullet ? 0.18 : 0.16,
                damage: isLaser ? 3 : isLemonBullet ? 0.85 : 0.5,
                spin: isLaser ? 9.5 : 0,
                lemon: isLemonBullet,
                shotOwner
            };
            bullet.material = isLaser ? game.materials.laser : isLemonBullet ? game.materials.lemonBullet : game.materials.bullet;
            bullets.push(bullet);
            return true;
        }

        function fireMissile(origin) {
            const activeMissiles = bullets.filter((bullet) => bullet.metadata.kind === "missile").length;
            const missileLimit = state.missileLevel >= 4 ? 4 : state.missileLevel >= 3 ? 3 : 2;
            if (activeMissiles >= missileLimit) {
                return false;
            }
            const missile = state.missileLevel >= 2 ? cloneModelTemplate("missileLemon", "missile") : null;
            const missileMesh = missile || BABYLON.MeshBuilder.CreateBox("missile", {
                width: 0.42,
                height: 0.14,
                depth: 0.12
            }, game.scene);
            missileMesh.position.set(origin.x + 0.38, origin.y - 0.52, -0.04);
            missileMesh.rotation.z = -0.38;
            missileMesh.metadata = {
                kind: "missile",
                speed: 8.5,
                vx: 7.6,
                vy: -3.2,
                radius: 0.26,
                damage: state.missileLevel >= 2 ? 3 : 2,
                explosive: state.missileLevel >= 2
            };
            if (!missile) {
                missileMesh.material = game.materials.missile;
            }
            bullets.push(missileMesh);
            playSound("missile");
            return true;
        }

        function fireBullet() {
            let didFire = fireOneShot(game.player.position);
            if (state.missileLevel > 0) {
                didFire = fireMissile(game.player.position) || didFire;
            }
            options.forEach((option) => {
                didFire = fireOneShot(option.position, true, option.metadata.shotOwner) || didFire;
            });
            if (didFire) {
                playSound("shot");

        }

        function addEnemyPart(enemy, part) {
            part.parent = enemy;
            enemy.metadata.parts.push(part);
            return part;

        function decorateCapsuleCarrier(enemy) {
            enemy.metadata.parts = enemy.metadata.parts || [];
            enemy.getChildMeshes(false).forEach((mesh) => {
                if (mesh.name === "enemyCore") {
                    mesh.material = game.materials.capsuleCarrierCore;

                    mesh.material = game.materials.capsuleCarrier;
                }
            });
            const ring = BABYLON.MeshBuilder.CreateTorus("capsuleCarrierRing", {
                diameter: 0.9,
                thickness: 0.035,
                tessellation: 48
            }, game.scene);
            ring.rotation.x = Math.PI / 2;
            ring.position.set(0, 0, -0.16);
            ring.material = game.materials.capsuleCarrier;
            ring.metadata = { pulse: Math.random() * Math.PI * 2 };
            addEnemyPart(enemy, ring);
        }

        function decorateEnemy(enemy, enemyType) {
            enemy.metadata.parts = [];
            if (enemyType === "corvette") {
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const orb = BABYLON.MeshBuilder.CreateSphere("corvetteArmorOrb", {
                        diameter: 0.16,
                        segments: 12
                    }, game.scene);
                    orb.position.set(Math.cos(angle) * 0.58, Math.sin(angle) * 0.58, -0.03);
                    orb.material = game.materials.corvetteArmor;
                    addEnemyPart(enemy, orb);
                }
            } else if (enemyType === "gunner") {
                [-0.22, 0.22].forEach((y) => {
                    const cannon = BABYLON.MeshBuilder.CreateCylinder("gunnerCannon", {
                        diameter: 0.07,
                        height: 0.48,
                        tessellation: 12
                    }, game.scene);
                    cannon.rotation.z = Math.PI / 2;
                    cannon.position.set(-0.28, y, -0.08);
                    cannon.material = game.materials.gunnerCannon;
                    addEnemyPart(enemy, cannon);
                });
            } else if (enemyType === "worker") {
                enemy.metadata.shields = [];
                const shieldHp = enemy.metadata.enemyConfig ? enemy.metadata.enemyConfig.shieldHp : 5;
                [-0.42, 0, 0.42].forEach((y, index) => {
                    const shield = BABYLON.MeshBuilder.CreateCylinder("workerHexShield", {
                        diameter: 0.54,
                        height: 0.035,
                        tessellation: 6
                    }, game.scene);
                    shield.rotation.x = Math.PI / 2;
                    shield.rotation.z = Math.PI / 6;
                    shield.position.set(-0.94, y, -0.49);
                    shield.material = game.materials.guardShield;
                    shield.visibility = 0.58;
                    shield.metadata = {
                        hp: shieldHp,
                        maxHp: shieldHp,
                        radius: 0.29,
                        index
                    };
                    shield.rotation.y = Math.PI / 2;
                    shield.parent = enemy;
                    enemy.metadata.shields.push(shield);
                    enemy.metadata.parts.push(shield);
                });
            }
        }

        function applyEnemyHitReaction(enemy, damage, hitPosition) {
            if (!enemy || !enemy.metadata) {
                return;
            }
            const maxHp = Math.max(0.5, enemy.metadata.maxHp || enemy.metadata.hp || 1);
            const damageRatio = BABYLON.Scalar.Clamp(damage / maxHp, 0.05, 0.8);
            const hitSide = hitPosition && hitPosition.y < enemy.position.y ? 1 : -1;
            enemy.metadata.hitKick = (enemy.metadata.hitKick || 0) + hitSide * damageRatio * 0.7;
            enemy.metadata.hitFlash = 0.12 + damageRatio * 0.18;
            enemy.metadata.hitScale = 1 + damageRatio * 0.16;
        }

        function spawnEnemyAt(x, y, delayOffset, options = {}) {
            const forcedType = options.enemyType || null;
            const asteroidChance = state.stage === 1 ? 0.12 : state.stage === 2 ? 0.62 : 0.2;
            const isAsteroid = forcedType === "asteroid" || (!forcedType && Math.random() < asteroidChance);
            const carriesCapsule = options.carriesCapsule !== undefined
                ? options.carriesCapsule
                : !forcedType && (state.enemiesSinceCapsule >= 4 || Math.random() < 0.08);
            const isHeavyKaraage = !forcedType && !carriesCapsule && state.stage >= 3 && Math.random() < 0.24;
            let enemyType = carriesCapsule ? "carrier" : forcedType || (isAsteroid ? "asteroid" : "teacherMedium");
            if (!forcedType && !carriesCapsule && !isAsteroid && !isHeavyKaraage) {
                enemyType = chooseWeighted(getStageEnemyTable(state.stage));
            }
            if (isHeavyKaraage) {
                enemyType = "teacherLarge";
            }
            const config = enemyConfigs[enemyType] || null;
            const templateKey = config ? config.template : "enemyKaraage";
            const karaageEnemy = carriesCapsule
                ? null
                : options.forceFallback
                    ? null
                    : cloneModelTemplate(templateKey, config ? config.spawnName : isAsteroid ? "karaageAsteroid" : "karaageEnemy");
            const mesh = carriesCapsule
                ? createEnemyShip(game.scene, game.materials, false)
                : karaageEnemy || createEnemyShip(game.scene, game.materials, isAsteroid);
            mesh.position.set(x + delayOffset, y, 0);
            if (options.positionZ !== undefined) {
                mesh.position.z = options.positionZ;
            }
            mesh.rotation.z = 0;
            if (enemyType === "fighter") {
                mesh.position.z = options.depthIntroZ !== undefined ? options.depthIntroZ : Math.random() < 0.5 ? -0.8 : 0.55;
                mesh.scaling.setAll(options.depthIntroScale || (mesh.position.z < 0 ? 0.48 : 1.32));
            }
            if (isAsteroid && !carriesCapsule && !isHeavyKaraage && mesh.name !== "asteroid") {
                mesh.scaling.scaleInPlace(1.16);
            }
            const speedByType = {
                carrier: 2.7,
                asteroid: 2.3
            };
            const asteroidSize = isAsteroid ? 0.72 + Math.random() * 1.58 : 1;
            const asteroidHp = isAsteroid ? Math.max(2, Math.min(10, Math.round(asteroidSize * 4.4))) : 0;
            if (isAsteroid) {
                mesh.scaling.setAll(asteroidSize);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            }
            const hpByType = {
                carrier: 0.5,
                asteroid: asteroidHp
            };
            const pointsByType = {
                carrier: 120,
                asteroid: 150
            };
            const speed = config ? randomRange(config.speed) : speedByType[enemyType];
            const waveAmount = options.waveAmount !== undefined ? options.waveAmount : config ? randomRange(config.waveAmount) : 0.28;
            const waveSpeed = options.waveSpeed !== undefined ? options.waveSpeed : config ? randomRange(config.waveSpeed) : 2.2;
            const shotInterval = scaleEnemyShotInterval(config ? config.shotInterval : 1.05 + Math.random() * 1.7);
            const defaultWorkerHoverX = enemyType === "worker" && state.stage >= 2
                ? world.maxX - (world.maxX - world.minX) * 0.42
                : undefined;
            mesh.metadata = {
                speed: (speed || 2.6) + (config ? 0 : state.stage * 0.22 + state.wave * 0.08 + Math.random() * 0.42) + (options.speedBonus || 0),
                radius: config ? config.radius : carriesCapsule ? 0.38 : isAsteroid ? 0.45 : 0.38,
                hp: options.hp !== undefined ? options.hp : config ? config.hp : hpByType[enemyType],
                maxHp: options.hp !== undefined ? options.hp : config ? config.hp : hpByType[enemyType],
                points: config ? config.points : pointsByType[enemyType],
                spin: config && config.randomSpin ? (Math.random() - 0.5) * 3.8 : 0,
                baseRotationZ: 0,
                hitKick: 0,
                hitFlash: 0,
                hitScale: 1,
                waveY: options.waveY !== undefined ? options.waveY : y,
                waveAmount: isAsteroid ? 0 : waveAmount,
                waveSpeed: isAsteroid ? 0 : waveSpeed,
                wavePhase: options.wavePhase !== undefined ? options.wavePhase : Math.random() * Math.PI * 2,
                enemyType,
                motion: isAsteroid ? "drift" : options.motion || (config ? config.motion : "sine"),
                hoverX: options.hoverX !== undefined ? options.hoverX : defaultWorkerHoverX,
                enemyConfig: config,
                driftY: isAsteroid ? (Math.random() - 0.5) * 0.45 : 0,
                asteroidSpinX: isAsteroid ? (Math.random() - 0.5) * 1.8 : 0,
                asteroidSpinY: isAsteroid ? (Math.random() - 0.5) * 1.8 : 0,
                asteroidSpinZ: isAsteroid ? (Math.random() - 0.5) * 1.8 : 0,
                dodgeCooldown: enemyType === "fighter" ? 0.25 + Math.random() * 0.35 : 0,
                dodgeTimer: 0,
                dodgeY: 0,
                dodgeDirection: 0,
                depthIntro: enemyType === "fighter" ? 0 : null,
                depthIntroStartZ: enemyType === "fighter" ? mesh.position.z : null,
                depthIntroStartScale: enemyType === "fighter" ? mesh.scaling.x : null,
                depthIntroDuration: options.depthIntroDuration || 0.75,
                introRightX: options.introRightX,
                introRotation: options.introRotation || null,
                carriesCapsule,
                canShoot: carriesCapsule
                    ? false
                    : options.canShoot !== undefined
                    ? options.canShoot
                    : !!karaageEnemy && config && config.canShoot !== false && state.stage >= 2,
                shotInterval,
                shootTimer: shotInterval,
                openingShotPending: false,
                isStageBoss: !!options.isStageBoss
            };
            if ((enemyType === "teacherMedium" || enemyType === "teacherLarge") && !options.isStageBoss) {
                state.mediumLargeSpawnShotCount += 1;
                if (state.mediumLargeSpawnShotCount >= state.nextMediumLargeOpeningShot) {
                    mesh.metadata.openingShotPending = true;
                    state.mediumLargeSpawnShotCount = 0;
                    state.nextMediumLargeOpeningShot = 3 + Math.floor(Math.random() * 6);
                }
            }
            decorateEnemy(mesh, enemyType);
            if (carriesCapsule) {
                mesh.scaling.setAll(1);
                decorateCapsuleCarrier(mesh);
            }
            if (mesh.getTotalVertices) {
                mesh.material = isAsteroid ? game.materials.asteroid : game.materials.enemy;
            }
            if (options.debugMarker) {
                const marker = BABYLON.MeshBuilder.CreateTorus("stage1WorkerMarker", {
                    diameter: 1.35,
                    thickness: 0.045,
                    tessellation: 48
                }, game.scene);
                marker.rotation.x = Math.PI / 2;
                marker.position.set(0, 0, -0.35);
                marker.material = game.materials.capsule;
                marker.parent = mesh;
                mesh.metadata.parts = mesh.metadata.parts || [];
                mesh.metadata.parts.push(marker);
            }
            state.enemiesSinceCapsule = carriesCapsule ? 0 : state.enemiesSinceCapsule + 1;
            enemies.push(mesh);
            if (
                state.stage === 3
                && !options.isStageBoss
                && (enemyType === "diskA" || enemyType === "diskB")
            ) {
                state.stage3SupportDiskCount += 1;
                if (state.stage3SupportDiskCount >= 2 && state.stage3SupportCooldown <= 0 && !hasActiveStage3LemonjiSupport()) {
                    state.stage3SupportDiskCount = 0;
                    state.stage3SupportCooldown = 12;
                    spawnStage3LemonjiSupport();
                }
            }
            return mesh;
        }

        function spawnEnemy() {
            spawnEnemyAt(world.maxX + 0.7, world.minY + 0.5 + Math.random() * (world.maxY - world.minY - 1), 0);
        }

        function spawnFormation() {
            const baseY = world.minY + 1 + Math.random() * (world.maxY - world.minY - 2);
            for (let i = 0; i < 5; i++) {
                const y = baseY + Math.sin(i * 0.85) * 0.75;
                spawnEnemyAt(world.maxX + 0.7, BABYLON.Scalar.Clamp(y, world.minY + 0.5, world.maxY - 0.5), i * 0.65);
            }
        }

        function spawnCapsule(position) {
            const capsule = BABYLON.MeshBuilder.CreateBox("powerCapsule", {
                width: 0.55,
                height: 0.28,
                depth: 0.14
            }, game.scene);
            capsule.position.copyFrom(position);
            capsule.position.z = -0.04;
            const ring = BABYLON.MeshBuilder.CreateTorus("powerCapsuleRing", {
                diameter: 0.78,
                thickness: 0.035,
                tessellation: 36
            }, game.scene);
            ring.rotation.x = Math.PI / 2;
            ring.position.z = -0.05;
            ring.parent = capsule;
            ring.material = game.materials.capsuleRing;
            capsule.metadata = {
                speed: 2.2,
                radius: 0.42,
                ring
            };
            capsule.material = game.materials.capsule;
            capsules.push(capsule);
        }

        function updateBossCapsuleSupply(delta, isBossActive) {
            if (!isBossActive || state.stage2ClearPending || state.isIntermission) {
                state.bossCapsuleTimer = Math.min(state.bossCapsuleTimer || 6, 6);
                return;
            }
            if (capsules.length >= 2) {
                return;
            }
            state.bossCapsuleTimer -= delta;
            if (state.bossCapsuleTimer > 0) {
                return;
            }
            spawnCapsule(new BABYLON.Vector3(
                world.maxX + 0.8,
                world.minY + 0.8 + Math.random() * (world.maxY - world.minY - 1.6),
                -0.04
            ));
            state.bossCapsuleTimer = 7 + Math.random() * 4;
        }

        function spawnStageTwoMeteor() {
            const meteor = createEnemyShip(game.scene, game.materials, true);
            const size = 1.5 + Math.random() * 1.5;
            meteor.name = "stage2Meteor";
            meteor.position.set(
                world.maxX + 1.2 + Math.random() * 1.8,
                world.minY + 0.7 + Math.random() * (world.maxY - world.minY - 1.4),
                0.05 + Math.random() * 0.22
            );
            meteor.scaling.setAll(size);
            meteor.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            meteor.metadata = {
                kind: "meteor",
                speed: 1.35 + Math.random() * 1.35,
                vx: -(1.35 + Math.random() * 1.35),
                vy: (Math.random() - 0.5) * 0.55,
                radius: 0.45 * size,
                hp: Math.round(5 + Math.random() * 10),
                maxHp: 15,
                spinX: (Math.random() - 0.5) * 1.6,
                spinY: (Math.random() - 0.5) * 1.6,
                spinZ: (Math.random() - 0.5) * 1.6
            };
            terrain.push(meteor);
        }

        function spawnGravityAsteroid(boss) {
            const angle = boss.metadata.gravityAngle || 0;
            boss.metadata.gravityAngle = angle + 1.45;
            const y = BABYLON.Scalar.Clamp(
                boss.position.y + Math.sin(angle) * (2.2 + Math.random() * 1.3),
                world.minY + 0.6,
                world.maxY - 0.6
            );
            const asteroid = spawnEnemyAt(world.maxX + 1.4 + Math.random() * 1.4, y, 0, {
                enemyType: "asteroid",
                carriesCapsule: false,
                speedBonus: -0.45
            });
            asteroid.metadata.gravityPulled = true;
            asteroid.metadata.gravityBoss = boss;
            asteroid.metadata.driftY = (boss.position.y - y) * 0.32;
            asteroid.metadata.points = Math.max(40, asteroid.metadata.points);
        }

        function addOption() {
            if (options.length >= 2) {
                return;
            }
            const option = BABYLON.MeshBuilder.CreateSphere("option", {
                diameter: 0.36,
                segments: 16
            }, game.scene);
            option.position.set(game.player.position.x - 1.1 - options.length * 0.9, game.player.position.y, -0.08);
            option.metadata = {
                trailOffset: 10 + options.length * 14,
                shotOwner: `option-${options.length}`,
                radius: 0.22
            };
            option.material = game.materials.option;
            options.push(option);
        }

        function createPlayerShieldVisual() {
            if (playerShieldVisual && !playerShieldVisual.isDisposed()) {
                playerShieldVisual.setEnabled(true);
                return playerShieldVisual;
            }
            playerShieldVisual = BABYLON.MeshBuilder.CreatePlane("playerShieldVisual", {
                size: 1
            }, game.scene);
            playerShieldVisual.parent = game.player;
            playerShieldVisual.position.set(0.34, 0, -0.36);
            playerShieldVisual.rotation.set(0, 0, 0);
            playerShieldVisual.scaling.set(2.74, 0.93, 1);
            playerShieldVisual.material = game.materials.playerShield;
            playerShieldVisual.visibility = 0.86;
            playerShieldVisual.isPickable = false;
            return playerShieldVisual;
        }

        function disposePlayerShieldVisual() {
            if (playerShieldVisual && !playerShieldVisual.isDisposed()) {
                playerShieldVisual.dispose();
            }
            playerShieldVisual = null;
        }

        function updatePlayerShieldVisual(delta) {
            if (state.shield <= 0 || state.gameOver || !game.player.isEnabled()) {
                disposePlayerShieldVisual();
                return;
            }
            const shield = createPlayerShieldVisual();
            const pulse = 1 + Math.sin(state.elapsed * 5.2) * 0.025;
            shield.rotation.set(0, 0, 0);
            shield.scaling.set(2.74 * pulse, 0.93 * pulse, 1);
            shield.visibility = 0.82 + Math.sin(state.elapsed * 6.4) * 0.035;
        }

        function addFloatingText(text, position) {
            const texture = new BABYLON.DynamicTexture(`floatingTextTexture${floatingTexts.length}`, { width: 256, height: 128 }, game.scene, true);
            const context = texture.getContext();
            context.clearRect(0, 0, 256, 128);
            context.font = "900 72px sans-serif";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.lineWidth = 10;
            context.strokeStyle = "rgba(0, 40, 70, 0.92)";
            context.strokeText(text, 128, 64);
            context.fillStyle = "rgba(255, 244, 80, 1)";
            context.fillText(text, 128, 64);
            texture.update();

            const material = new BABYLON.StandardMaterial(`floatingTextMat${floatingTexts.length}`, game.scene);
            material.diffuseTexture = texture;
            material.emissiveTexture = texture;
            material.opacityTexture = texture;
            material.useAlphaFromDiffuseTexture = true;
            material.disableLighting = true;
            material.backFaceCulling = false;

            const mesh = BABYLON.MeshBuilder.CreatePlane("floatingScoreText", {
                width: 1.18,
                height: 0.58
            }, game.scene);
            mesh.position.copyFrom(position);
            mesh.position.z = -0.62;
            mesh.material = material;
            mesh.isPickable = false;
            mesh.metadata = {
                age: 0,
                life: 1,
                startY: position.y,
                material
            };
            floatingTexts.push(mesh);
        }

        function updateFloatingTexts(delta) {
            for (let i = floatingTexts.length - 1; i >= 0; i -= 1) {
                const text = floatingTexts[i];
                if (!text || text.isDisposed()) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                text.metadata.age += delta;
                const progress = Math.min(1, text.metadata.age / text.metadata.life);
                text.position.y = text.metadata.startY + progress * 0.48;
                text.visibility = 1 - progress;
                if (text.metadata.material) {
                    text.metadata.material.alpha = 1 - progress;
                }
                if (progress >= 1) {
                    if (text.material) {
                        const material = text.material;
                        const texture = material.diffuseTexture;
                        text.dispose();
                        if (texture) {
                            texture.dispose();
                        }
                        material.dispose();
                    } else {
                        text.dispose();
                    }
                    floatingTexts.splice(i, 1);
                }
            }
        }

        function collectCapsule(capsule) {
            const wasFullyPowered = areAllPowersMaxed();
            const bonusPosition = capsule.position.clone();
            advancePowerCursor();
            state.score += 250;
            if (wasFullyPowered) {
                state.score += 500;
                addFloatingText("500", bonusPosition);
            }
            saveHighScore();
            addSparks(capsule.position, 20);
            playSound("pickup");
            updateHud();
        }

        function activatePower() {
            if (state.powerCursor < 0 || state.gameOver) {
                return;
            }
            if (isPowerMaxed(state.powerCursor)) {
                return;
            }
            if (state.powerCursor === 4 && !state.lemonUnlocked) {
                return;
            }

            switch (state.powerCursor) {
                case 0:
                    state.speedLevel = Math.min(3, state.speedLevel + 1);
                    break;
                case 1:
                    state.missileLevel = Math.min(state.lemonUnlocked ? 4 : 1, state.missileLevel + 1);
                    break;
                case 2:
                    addOption();
                    break;
                case 3:
                    state.shield = 1;
                    createPlayerShieldVisual();
                    break;
                case 4:
                    state.hasLaser = true;
                    break;
            }
            state.powerCursor = -1;
            addSparks(game.player.position, 24);
            playSound("power");
            updateHud();
        }

        function addSparks(position, count) {
            for (let i = 0; i < count; i++) {
                const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                    diameter: 0.08 + Math.random() * 0.07,
                    segments: 8
                }, game.scene);
                spark.position.copyFrom(position);
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.2 + Math.random() * 3.2;
                spark.metadata = {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.32 + Math.random() * 0.25,
                    maxLife: 0.57
                };
                spark.material = game.materials.spark;
                sparks.push(spark);
            }
        }

        function distance2D(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function disposeEnemy(enemy) {
            if (enemy.metadata && enemy.metadata.isFinalBoss) {
                disposeFinalBossCannonMeshes(enemy);
            }
            if (enemy.metadata && enemy.metadata.parts) {
                enemy.metadata.parts.forEach((part) => part.dispose());
                enemy.metadata.parts.length = 0;
            }
            enemy.dispose();
        }

        function addPlayerImpactEffect(intensity = 0.55) {
            const position = game.player.position.clone();
            addExplosionBurst(position, intensity);
            addSparks(position, Math.round(18 + intensity * 18));
        }

        function startPlayerDeathExplosion() {
            state.playerDeathTimer = 0;
            state.playerDeathNextBurst = 0;
            state.playerDeathBursts = 7;
            game.player.scaling.set(1.35, 1.35, 1.35);
        }

        function updatePlayerDeathExplosion(delta) {
            if (!state.gameOver || state.playerDeathBursts <= 0) {
                return;
            }
            state.playerDeathTimer += delta;
            state.playerDeathNextBurst -= delta;
            game.player.rotation.z += delta * 7.5;
            game.player.scaling.scaleInPlace(Math.max(0.96, 1 - delta * 0.42));
            if (state.playerDeathNextBurst <= 0) {
                const offset = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 0.9,
                    (Math.random() - 0.5) * 0.72,
                    -0.08
                );
                const burstPosition = game.player.position.add(offset);
                const isFinalBurst = state.playerDeathBursts === 1;
                addExplosionBurst(burstPosition, isFinalBurst ? 2.4 : 0.85 + Math.random() * 0.65);
                addSparks(burstPosition, isFinalBurst ? 90 : 30);
                playSound(isFinalBurst ? "boss" : "explosion");
                state.playerDeathBursts -= 1;
                state.playerDeathNextBurst = isFinalBurst ? 0.4 : 0.16 + Math.random() * 0.08;
                if (isFinalBurst) {
                    game.player.setEnabled(false);
                }
            }
        }

        function damagePlayer() {
            if (state.invincibleTimer > 0 || state.gameOver) {
                return;
            }
            if (state.shield > 0) {
                state.shield = 0;
                disposePlayerShieldVisual();
                state.invincibleTimer = 1.2;
                game.player.scaling.set(1.25, 1.25, 1.25);
                addPlayerImpactEffect(0.45);
                playSound("hit");
                updateHud();
                return;
            }
            state.lives -= 1;
            state.missileLevel = Math.max(0, state.missileLevel - 1);
            state.hasLaser = false;
            state.speedLevel = Math.max(0, state.speedLevel - 1);
            const lostOption = options.pop();
            if (lostOption) {
                lostOption.dispose();
            }
            state.invincibleTimer = 1.6;
            game.player.scaling.set(1.25, 1.25, 1.25);
            addPlayerImpactEffect(0.58);
            playSound("hit");
            if (state.lives <= 0) {
                state.gameOver = true;
                state.gameOverReturnTimer = 0;
                saveHighScore();
                finalScoreEl.textContent = `SCORE ${state.score}`;
                messageEl.classList.add("isVisible");
                stopStage3BossMusic();
                startPlayerDeathExplosion();
                playSound("gameover");
            }
            updateHud();
        }

        function updatePlayer(delta) {
            state.invincibleTimer = Math.max(0, state.invincibleTimer - delta);
            const velocity = new BABYLON.Vector2(0, 0);
            if (keys.has("ArrowUp") || keys.has("KeyW")) velocity.y += 1;
            if (keys.has("ArrowDown") || keys.has("KeyS")) velocity.y -= 1;
            if (keys.has("ArrowLeft") || keys.has("KeyA")) velocity.x -= 1;
            if (keys.has("ArrowRight") || keys.has("KeyD")) velocity.x += 1;
            velocity.x += touchInput.x;
            velocity.y += touchInput.y;
            velocity.x += gamepadInput.x;
            velocity.y += gamepadInput.y;
            const isMoving = velocity.lengthSquared() > 0;
            if (isMoving) {
                velocity.normalize();
                const playerSpeed = 6.1 + state.speedLevel * 0.75;
                game.player.position.x += velocity.x * playerSpeed * delta;
                game.player.position.y += velocity.y * playerSpeed * delta;
            }

            game.player.position.x = BABYLON.Scalar.Clamp(game.player.position.x, world.minX + 0.5, world.maxX - 0.5);
            game.player.position.y = BABYLON.Scalar.Clamp(game.player.position.y, world.minY + 0.45, world.maxY - 0.45);
            const modelRoot = game.player.metadata.modelRoot;
            if (modelRoot) {
                modelRoot.rotation.z = BABYLON.Scalar.Lerp(modelRoot.rotation.z, velocity.y * playerModelRoll, 0.18);
            }
            game.player.scaling.x = BABYLON.Scalar.Lerp(game.player.scaling.x, 1, 0.16);
            game.player.scaling.y = BABYLON.Scalar.Lerp(game.player.scaling.y, 1, 0.16);
            game.player.scaling.z = BABYLON.Scalar.Lerp(game.player.scaling.z, 1, 0.16);
            game.player.getChildMeshes(false).forEach((mesh) => {
                mesh.visibility = state.invincibleTimer > 0 && Math.floor(state.elapsed * 18) % 2 === 0 ? 0.34 : 1;
            });
            updatePlayerShieldVisual(delta);
            if (game.player.metadata.flames) {
                const pulse = 0.85 + Math.sin(state.elapsed * 22) * 0.2;
                game.player.metadata.flames.forEach((flame, index) => {
                    const flamePulse = pulse + index * 0.06;
                    const targetY = flame.metadata.baseY + velocity.y * flame.metadata.bankOffset * 0.08;
                    flame.position.y = BABYLON.Scalar.Lerp(flame.position.y, targetY, 0.18);
                    flame.scaling.x = flamePulse;
                    flame.scaling.y = flamePulse;
                });
            }

            if (isMoving) {
                playerTrail.unshift(game.player.position.clone());
                if (playerTrail.length > 80) {
                    playerTrail.length = 80;
                }
                options.forEach((option) => {
                    const target = playerTrail[option.metadata.trailOffset] || game.player.position;
                    option.position.x = BABYLON.Scalar.Lerp(option.position.x, target.x - 0.8, 0.16);
                    option.position.y = BABYLON.Scalar.Lerp(option.position.y, target.y, 0.16);
                    option.rotation.z += delta * 3.5;
                });
            }

            state.fireCooldown -= delta;
            if ((keys.has("KeyZ") || touchInput.firing || gamepadInput.firing) && state.fireCooldown <= 0) {
                fireBullet();
                state.fireCooldown = state.hasLaser ? 0.13 : 0.18;
            }
        }

        function findMissileTarget(missile) {
            let target = null;
            let bestDistance = Infinity;
            enemies.forEach((enemy) => {
                if (enemy.position.x < missile.position.x - 0.4) {
                    return;
                }
                const distance = distance2D(missile.position, enemy.position);
                if (distance < bestDistance) {
                    bestDistance = distance;
                    target = enemy;
                }
            });
            return target;
        }

        function updateMissile(missile, delta) {
            const target = findMissileTarget(missile);
            if (target) {
                const direction = new BABYLON.Vector2(
                    target.position.x - missile.position.x,
                    target.position.y - missile.position.y
                );
                if (direction.lengthSquared() > 0.0001) {
                    direction.normalize();
                    const desiredVx = direction.x * missile.metadata.speed;
                    const desiredVy = direction.y * missile.metadata.speed;
                    const turn = Math.min(1, delta * 4.2);
                    missile.metadata.vx = BABYLON.Scalar.Lerp(missile.metadata.vx, desiredVx, turn);
                    missile.metadata.vy = BABYLON.Scalar.Lerp(missile.metadata.vy, desiredVy, turn);
                }
            }

            missile.position.x += missile.metadata.vx * delta;
            missile.position.y += missile.metadata.vy * delta;
            missile.rotation.z = Math.atan2(missile.metadata.vy, missile.metadata.vx);
        }

        function fireEnemyBullet(enemy) {
            if (enemy.metadata.isFinalBoss) {
                playSound("enemyShotLarge");
                fireBossTurrets(enemy);
                return;
            }
            if (enemy.metadata.enemyConfig && enemy.metadata.enemyConfig.ringShot) {
                playSound("enemyShotLarge");
                fireEnemyRing(enemy);
                return;
            }
            const bullet = BABYLON.MeshBuilder.CreateSphere("enemyBullet", {
                diameter: 0.16,
                segments: 12
            }, game.scene);
            bullet.position.set(enemy.position.x - 0.32, enemy.position.y, -0.06);
            const direction = new BABYLON.Vector2(
                game.player.position.x - bullet.position.x,
                game.player.position.y - bullet.position.y
            );
            if (direction.lengthSquared() > 0.0001) {
                direction.normalize();
            } else {
                direction.set(-1, 0);
            }
            const speed = 4.6 + state.wave * 0.18;
            bullet.metadata = {
                vx: direction.x * speed,
                vy: direction.y * speed,
                radius: 0.14
            };
            bullet.material = game.materials.enemyBullet;
            enemyBullets.push(bullet);
            playSound(enemy.metadata.enemyType === "teacherLarge" || enemy.metadata.enemyType === "worker" ? "enemyShotLarge" : "enemyShotSmall");
        }

        function createEnemyAimBullet(x, y, speed = 4.6 + state.wave * 0.18, radius = 0.14, diameter = 0.16) {
            const bullet = BABYLON.MeshBuilder.CreateSphere("enemyBullet", {
                diameter,
                segments: 12
            }, game.scene);
            bullet.position.set(x, y, -0.06);
            const direction = new BABYLON.Vector2(
                game.player.position.x - bullet.position.x,
                game.player.position.y - bullet.position.y
            );
            if (direction.lengthSquared() > 0.0001) {
                direction.normalize();
            } else {
                direction.set(-1, 0);
            }
            bullet.metadata = {
                vx: direction.x * speed,
                vy: direction.y * speed,
                radius
            };
            bullet.material = game.materials.enemyBullet;
            enemyBullets.push(bullet);
            return bullet;
        }

        function fireBossTurrets(enemy) {
            const offsets = enemy.metadata.turretOffsets || [
                new BABYLON.Vector2(-1.0, 0.62),
                new BABYLON.Vector2(-1.12, 0),
                new BABYLON.Vector2(-1.0, -0.62)
            ];
            const phase = enemy.metadata.finalBossPhase || 1;
            const aimSpeed = (phase === 3 ? 5.0 : phase === 2 ? 4.55 : 4.2) + state.wave * 0.12;
            offsets.forEach((offset) => {
                createEnemyAimBullet(enemy.position.x + offset.x, enemy.position.y + offset.y, aimSpeed, 0.15, 0.18);
            });
            if (phase >= 2) {
                const spreadSpeed = 3.9 + state.wave * 0.1;
                [-1.05, 0, 1.05].forEach((dy) => {
                    const bullet = BABYLON.MeshBuilder.CreateSphere("enemyBossSpreadBullet", {
                        diameter: 0.15,
                        segments: 10
                    }, game.scene);
                    bullet.position.set(enemy.position.x - 1.55, enemy.position.y + dy, -0.06);
                    bullet.metadata = {
                        vx: -spreadSpeed,
                        vy: dy * 0.24,
                        radius: 0.13
                    };
                    bullet.material = game.materials.enemyBullet;
                    enemyBullets.push(bullet);
                });
            }
            if (phase >= 3) {
                const center = new BABYLON.Vector2(enemy.position.x - 1.25, enemy.position.y);
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 * i) / 8 + state.elapsed * 0.35;
                    const bullet = BABYLON.MeshBuilder.CreateSphere("enemyBossRageBullet", {
                        diameter: 0.13,
                        segments: 10
                    }, game.scene);
                    bullet.position.set(center.x, center.y, -0.06);
                    const speed = 3.25 + state.wave * 0.08;
                    bullet.metadata = {
                        vx: Math.cos(angle) * speed - 1.5,
                        vy: Math.sin(angle) * speed,
                        radius: 0.12
                    };
                    bullet.material = game.materials.enemyBullet;
                    enemyBullets.push(bullet);
                }
            }
        }

        function updateFinalBossPhase(enemy) {
            const hpRatio = Math.max(0, enemy.metadata.hp / enemy.metadata.maxHp);
            const nextPhase = hpRatio <= 0.55 ? 3 : hpRatio <= 0.8 ? 2 : 1;
            if (nextPhase === enemy.metadata.finalBossPhase) {
                return;
            }
            enemy.metadata.finalBossPhase = nextPhase;
            enemy.metadata.shootTimer = Math.min(enemy.metadata.shootTimer || 0, nextPhase === 3 ? 0.55 : 0.85);
            enemy.metadata.mainCannonCooldown = Math.min(enemy.metadata.mainCannonCooldown || 0, nextPhase === 3 ? 0.9 : 1.5);
            addExplosionBurst(enemy.position, nextPhase === 3 ? 1.45 : 1.05);
            addSparks(enemy.position, nextPhase === 3 ? 86 : 54);
            playSound("boss");
        }

        function spawnFinalBossFighters(enemy) {
            const baseY = BABYLON.Scalar.Clamp(enemy.position.y, world.minY + 1.0, world.maxY - 1.0);
            [-0.88, 0, 0.88].forEach((offsetY, index) => {
                const fighter = spawnEnemyAt(world.maxX + 1.9, BABYLON.Scalar.Clamp(baseY + offsetY, world.minY + 0.55, world.maxY - 0.55), index * 0.28, {
                    enemyType: "fighter",
                    carriesCapsule: false,
                    canShoot: true,
                    depthIntroZ: 0.9,
                    depthIntroScale: 0.55,
                    depthIntroDuration: 1.25,
                    introRightX: world.maxX - 0.35
                });
                fighter.metadata.openingShotPending = true;
                fighter.metadata.shootTimer = 1.1 + index * 0.35;
            });
            playSound("enemyShotLarge");
        }

        function spawnFinalBossKaraageMissile(boss) {
            const side = boss.metadata.karaageMissileLaunchSide || 1;
            boss.metadata.karaageMissileLaunchSide = -side;
            const missile = cloneModelTemplate("bossKaraageMissile", "bossKaraageMissile")
                || cloneModelTemplate("enemyKaraageMini", "bossKaraageMissile")
                || createEnemyShip(game.scene, game.materials, false);
            const offsetX = -0.45 + Math.random() * 0.5;
            const offsetY = side > 0 ? 1.25 : -1.25;
            missile.position.set(boss.position.x + offsetX, BABYLON.Scalar.Clamp(boss.position.y + offsetY, world.minY + 0.55, world.maxY - 0.55), -0.02);
            missile.rotation.z = side > 0 ? BABYLON.Tools.ToRadians(82) : BABYLON.Tools.ToRadians(-82);
            missile.metadata = {
                speed: 4.25,
                radius: 0.42,
                hp: 4,
                maxHp: 4,
                points: 320,
                spin: 0,
                baseRotationZ: missile.rotation.z,
                hitKick: 0,
                hitFlash: 0,
                hitScale: 1,
                waveY: missile.position.y,
                waveAmount: 0,
                waveSpeed: 0,
                wavePhase: 0,
                motion: "bossKaraageMissile",
                enemyType: "bossKaraageMissile",
                enemyConfig: null,
                vx: -0.35,
                vy: side * (3.4 + Math.random() * 0.55),
                armTimer: 0.55 + Math.random() * 0.22,
                lifeTimer: 0,
                carriesCapsule: false,
                canShoot: false,
                shootTimer: 99,
                openingShotPending: false,
                isStageBoss: false
            };
            if (missile.getTotalVertices && missile.getTotalVertices() > 0) {
                missile.material = game.materials.enemy;
            }
            enemies.push(missile);
            addSparks(missile.position, 12);
            playSound("enemyShotLarge");
        }

        function updateBossKaraageMissile(missile, delta) {
            missile.metadata.lifeTimer += delta;
            missile.metadata.armTimer -= delta;
            if (missile.metadata.armTimer <= 0) {
                const direction = new BABYLON.Vector2(
                    game.player.position.x - missile.position.x,
                    game.player.position.y - missile.position.y
                );
                if (direction.lengthSquared() > 0.0001) {
                    direction.normalize();
                    const targetSpeed = 4.1 + Math.min(1.2, missile.metadata.lifeTimer * 0.24);
                    const turn = Math.min(1, delta * 2.6);
                    missile.metadata.vx = BABYLON.Scalar.Lerp(missile.metadata.vx, direction.x * targetSpeed, turn);
                    missile.metadata.vy = BABYLON.Scalar.Lerp(missile.metadata.vy, direction.y * targetSpeed, turn);
                }
            }
            missile.position.x += missile.metadata.vx * delta;
            missile.position.y += missile.metadata.vy * delta;
            missile.position.y = BABYLON.Scalar.Clamp(missile.position.y, world.minY + 0.35, world.maxY - 0.35);
            missile.metadata.baseRotationZ = Math.atan2(missile.metadata.vy, missile.metadata.vx);
        }

        function updateFinalBossKaraageMissiles(enemy, delta) {
            if (enemy.position.x > world.maxX - 0.9) {
                return;
            }
            if (enemy.metadata.karaageMissileBurstRemaining > 0) {
                enemy.metadata.karaageMissileBurstGap -= delta;
                if (enemy.metadata.karaageMissileBurstGap <= 0) {
                    spawnFinalBossKaraageMissile(enemy);
                    enemy.metadata.karaageMissileBurstRemaining -= 1;
                    enemy.metadata.karaageMissileBurstGap = 0.22 + Math.random() * 0.18;
                }
                return;
            }
            enemy.metadata.karaageMissileTimer -= delta;
            if (enemy.metadata.karaageMissileTimer <= 0) {
                const phase = enemy.metadata.finalBossPhase || 1;
                const lemonAdvantage = state.hasLaser || (state.lemonUnlocked && state.missileLevel >= 3);
                if (phase >= 3) {
                    const minBurst = state.hasLaser ? 4 : 2;
                    const maxBurst = state.hasLaser ? 8 : 4;
                    enemy.metadata.karaageMissileBurstRemaining = minBurst + Math.floor(Math.random() * (maxBurst - minBurst + 1));
                } else {
                    const maxBurst = phase >= 2 ? 3 : 2;
                    enemy.metadata.karaageMissileBurstRemaining = 1 + Math.floor(Math.random() * maxBurst);
                }
                if (lemonAdvantage) {
                    enemy.metadata.karaageMissileBurstRemaining *= 2;
                }
                enemy.metadata.karaageMissileBurstGap = 0;
                enemy.metadata.karaageMissileTimer = 1 + Math.random() * 2;
            }
        }

        function disposeFinalBossCannonMeshes(enemy) {
            ["mainCannonWarningMesh", "mainCannonBeamMesh"].forEach((key) => {
                const mesh = enemy.metadata[key];
                if (mesh && !mesh.isDisposed()) {
                    mesh.dispose();
                }
                enemy.metadata[key] = null;
            });
        }

        function startFinalBossMainCannon(enemy) {
            const startX = world.minX - 0.2;
            const endX = enemy.position.x - 1.65;
            const width = Math.max(1, endX - startX);
            const targetY = BABYLON.Scalar.Clamp(enemy.position.y, world.minY + 0.48, world.maxY - 0.48);
            const warning = BABYLON.MeshBuilder.CreateBox("bossMainCannonWarning", {
                width,
                height: 0.1,
                depth: 0.05
            }, game.scene);
            warning.position.set(startX + width / 2, targetY, -0.16);
            warning.material = game.materials.bossBeamWarning;
            enemy.metadata.mainCannonTargetY = targetY;
            enemy.metadata.mainCannonCharge = 1.15;
            enemy.metadata.mainCannonBeamAge = 0;
            enemy.metadata.mainCannonHitPlayer = false;
            enemy.metadata.mainCannonWarningMesh = warning;
            playSound("shield");
        }

        function fireFinalBossMainCannon(enemy) {
