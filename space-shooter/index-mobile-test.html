            const startX = world.minX - 0.2;
            const endX = enemy.position.x - 1.55;
            const width = Math.max(1, endX - startX);
            const beamHeight = enemy.metadata.finalBossPhase >= 3 ? 0.64 : 0.5;
            const beam = BABYLON.MeshBuilder.CreateBox("bossMainCannonBeam", {
                width,
                height: beamHeight,
                depth: 0.08
            }, game.scene);
            beam.position.set(startX + width / 2, enemy.metadata.mainCannonTargetY, -0.17);
            beam.material = game.materials.bossBeam;
            enemy.metadata.mainCannonBeamAge = 0.36;
            enemy.metadata.mainCannonBeamMesh = beam;
            if (enemy.metadata.mainCannonWarningMesh && !enemy.metadata.mainCannonWarningMesh.isDisposed()) {
                enemy.metadata.mainCannonWarningMesh.dispose();
            }
            enemy.metadata.mainCannonWarningMesh = null;
            playSound("boss");
        }

        function updateFinalBossMainCannon(enemy, delta) {
            if (enemy.position.x > world.maxX - 0.9) {
                return;
            }
            if (enemy.metadata.mainCannonBeamAge > 0) {
                enemy.metadata.mainCannonBeamAge -= delta;
                const beam = enemy.metadata.mainCannonBeamMesh;
                if (beam && !beam.isDisposed()) {
                    const pulse = 1 + Math.sin(state.elapsed * 42) * 0.12;
                    beam.scaling.y = pulse;
                    beam.visibility = Math.max(0, enemy.metadata.mainCannonBeamAge / 0.36);
                }
                if (!enemy.metadata.mainCannonHitPlayer && Math.abs(game.player.position.y - enemy.metadata.mainCannonTargetY) < 0.5) {
                    enemy.metadata.mainCannonHitPlayer = true;
                    damagePlayer();
                }
                if (enemy.metadata.mainCannonBeamAge <= 0) {
                    disposeFinalBossCannonMeshes(enemy);
                    enemy.metadata.mainCannonCooldown = enemy.metadata.finalBossPhase >= 3 ? 3.2 : 4.4;
                }
                return;
            }
            if (enemy.metadata.mainCannonCharge > 0) {
                enemy.metadata.mainCannonCharge -= delta;
                const warning = enemy.metadata.mainCannonWarningMesh;
                if (warning && !warning.isDisposed()) {
                    const pulse = 1 + Math.sin(state.elapsed * 24) * 0.55;
                    warning.scaling.y = Math.max(0.55, pulse);
                    warning.visibility = 0.32 + Math.max(0, 1 - enemy.metadata.mainCannonCharge / 1.15) * 0.54;
                }
                if (enemy.metadata.mainCannonCharge <= 0) {
                    fireFinalBossMainCannon(enemy);
                }
                return;
            }
            enemy.metadata.mainCannonCooldown -= delta;
            if (enemy.metadata.mainCannonCooldown <= 0) {
                startFinalBossMainCannon(enemy);
            }
        }

        function updateFinalBoss(enemy, delta) {
            if (enemy.metadata.finalBossDying) {
                return;
            }
            updateFinalBossPhase(enemy);
            updateFinalBossMainCannon(enemy, delta);
            updateFinalBossKaraageMissiles(enemy, delta);
            if ((enemy.metadata.finalBossPhase || 1) < 3 || enemy.position.x > world.maxX - 0.9) {
                return;
            }
            enemy.metadata.summonTimer -= delta;
            if (enemy.metadata.summonTimer <= 0) {
                spawnFinalBossFighters(enemy);
                enemy.metadata.summonTimer = 6.6;
            }
        }

        function startStage3FinaleBossDestruction(enemy, position) {
            addDestructionEffect(enemy, position);
            playSound("boss");
            disposeFinalBossCannonMeshes(enemy);
            enemyBullets.splice(0).forEach((item) => item.dispose());
            bullets.splice(0).forEach((item) => item.dispose());
            state.bossEnemy = enemy;
            state.stage3ClearPending = false;
            state.stage3ClearTimer = 0;
            state.stage3FinaleActive = true;
            state.stage3FinalePhase = "bossFall";
            state.stage3FinaleTimer = 0;
            state.stage3FinaleBurstTimer = 0.12;
            state.stage3FinaleDialogueIndex = 0;
            state.stage3FinaleLemonji = null;
            enemy.metadata.finalBossDying = true;
            enemy.metadata.canShoot = false;
            enemy.metadata.isFinalBoss = true;
            enemy.metadata.hp = 999999;
            enemy.metadata.points = 0;
            enemy.metadata.dyingStartX = enemy.position.x;
            enemy.metadata.dyingStartY = enemy.position.y;
            enemy.metadata.dyingStartZ = enemy.position.z;
            enemy.metadata.dyingStartRotationZ = enemy.rotation.z || 0;
            enemy.metadata.dyingStartScale = enemy.scaling.x || 1;
            bossHudEl.classList.remove("isVisible");
        }

        function spawnStage3FinaleLemonji() {
            const actor = cloneModelTemplate("lemonjiSupport", "stage3FinaleLemonji") || createFallbackLemonjiActor("stage3FinaleLemonji");
            actor.position.set(world.minX - 1.4, BABYLON.Scalar.Clamp(game.player.position.y + 1.1, world.minY + 1.0, world.maxY - 0.8), -0.32);
            actor.scaling.setAll(0.72);
            actor.rotation.set(0, BABYLON.Tools.ToRadians(290), BABYLON.Tools.ToRadians(-18));
            actor.metadata = {
                kind: "stage3FinaleLemonji",
                startX: actor.position.x,
                startY: actor.position.y,
                holdX: world.minX + 1.45,
                holdY: actor.position.y,
                exitX: world.minX - 2.0,
                exitY: world.minY - 1.45
            };
            stageActors.push(actor);
            state.stage3FinaleLemonji = actor;
            return actor;
        }

        function showNextStage3FinaleDialogue() {
            if (state.stage3FinaleDialogueIndex >= stage3FinaleDialogue.length) {
                dialogueEl.classList.remove("isVisible");
                dialogueEl.classList.remove("hasPortrait");
                dialoguePortraitEl.removeAttribute("src");
                state.stage3FinalePhase = "lemonjiExit";
                state.stage3FinaleTimer = 0;
                return;
            }
            const line = stage3FinaleDialogue[state.stage3FinaleDialogueIndex];
            state.stage3FinaleDialogueIndex += 1;
            showDialogue(line.speaker, line.text, line.duration, line.portrait);
            state.stage3FinaleTimer = line.duration;
        }

        function advanceStage3FinaleDialogue() {
            if (!state.stage3FinaleActive || state.stage3FinalePhase !== "dialogue") {
                return;
            }
            playSound("pickup");
            showNextStage3FinaleDialogue();
        }

        function updateStage3Finale(delta) {
            if (!state.stage3FinaleActive) {
                return;
            }
            if (state.stage3FinalePhase === "dialogue") {
                state.stage3FinaleTimer -= delta;
                if (state.stage3FinaleTimer <= 0) {
                    showNextStage3FinaleDialogue();
                }
                return;
            }
            state.stage3FinaleTimer += delta;

            if (state.stage3FinalePhase === "bossFall") {
                const boss = state.bossEnemy;
                if (boss && !boss.isDisposed()) {
                    const progress = Math.min(1, state.stage3FinaleTimer / 4.0);
                    const eased = easeInOut(progress);
                    boss.position.x = BABYLON.Scalar.Lerp(boss.metadata.dyingStartX, boss.metadata.dyingStartX - 0.85, eased);
                    boss.position.y = BABYLON.Scalar.Lerp(boss.metadata.dyingStartY, world.minY - 1.2, eased);
                    boss.position.z = BABYLON.Scalar.Lerp(boss.metadata.dyingStartZ, -0.42, eased);
                    boss.rotation.z = BABYLON.Scalar.Lerp(boss.metadata.dyingStartRotationZ, BABYLON.Tools.ToRadians(-24), eased);
                    const modelRoot = boss.getChildren().find((child) => child.name && child.name.indexOf("Model") >= 0);
                    if (modelRoot) {
                        modelRoot.rotation.x = BABYLON.Scalar.Lerp(modelRoot.rotation.x, BABYLON.Tools.ToRadians(10), 0.05);
                        modelRoot.rotation.z += Math.sin(state.elapsed * 5.4) * 0.002;
                    }
                    state.stage3FinaleBurstTimer -= delta;
                    if (state.stage3FinaleBurstTimer <= 0) {
                        const burst = boss.position.clone();
                        burst.x += -1.7 + Math.random() * 3.2;
                        burst.y += -1.3 + Math.random() * 2.6;
                        addExplosionBurst(burst, 0.95 + Math.random() * 0.85);
                        addSparks(burst, 24);
                        playSound(progress > 0.82 ? "boss" : "explosion");
                        state.stage3FinaleBurstTimer = Math.max(0.14, 0.46 - progress * 0.28);
                    }
                    if (progress >= 1) {
                        for (let i = 0; i < 9; i++) {
                            const angle = (Math.PI * 2 * i) / 9;
                            const burst = new BABYLON.Vector3(
                                boss.position.x + Math.cos(angle) * (0.6 + Math.random() * 2.2),
                                boss.position.y + Math.sin(angle) * (0.45 + Math.random() * 1.7),
                                boss.position.z
                            );
                            addExplosionBurst(burst, 1.1 + Math.random() * 0.9);
                            addSparks(burst, 36);
                        }
                        stopStage3BossMusic();
                        playEndingMusic();
                        playSound("boss");
                        disposeEnemy(boss);
                        const bossIndex = enemies.indexOf(boss);
                        if (bossIndex >= 0) {
                            enemies.splice(bossIndex, 1);
                        }
                    }
                }
                if (state.stage3FinaleTimer >= 4.0) {
                    enemies.splice(0).forEach((item) => disposeEnemy(item));
                    enemyBullets.splice(0).forEach((item) => item.dispose());
                    bullets.splice(0).forEach((item) => item.dispose());
                    terrain.splice(0).forEach((item) => item.dispose());
                    capsules.splice(0).forEach((item) => item.dispose());
                    state.stage3FinalePhase = "waitLemonji";
                    state.stage3FinaleTimer = 0;
                }
                return;
            }

            if (state.stage3FinalePhase === "waitLemonji") {
                if (state.stage3FinaleTimer >= 2.0) {
                    spawnStage3FinaleLemonji();
                    state.stage3FinalePhase = "lemonjiEnter";
                    state.stage3FinaleTimer = 0;
                }
                return;
            }

            if (state.stage3FinalePhase === "lemonjiEnter") {
                const actor = state.stage3FinaleLemonji;
                const progress = Math.min(1, state.stage3FinaleTimer / 1.5);
                if (actor && !actor.isDisposed()) {
                    const eased = easeInOut(progress);
                    actor.position.x = BABYLON.Scalar.Lerp(actor.metadata.startX, actor.metadata.holdX, eased);
                    actor.position.y = BABYLON.Scalar.Lerp(actor.metadata.startY, actor.metadata.holdY, eased);
                    actor.rotation.z = BABYLON.Scalar.Lerp(BABYLON.Tools.ToRadians(-18), 0, eased);
                    actor.scaling.setAll(BABYLON.Scalar.Lerp(0.72, 1.0, eased));
                }
                if (progress >= 1) {
                    state.stage3FinalePhase = "dialogue";
                    state.stage3FinaleTimer = 0;
                    showNextStage3FinaleDialogue();
                }
                return;
            }

            if (state.stage3FinalePhase === "lemonjiExit") {
                const actor = state.stage3FinaleLemonji;
                const progress = Math.min(1, state.stage3FinaleTimer / 3.2);
                if (actor && !actor.isDisposed()) {
                    const eased = easeInOut(progress);
                    actor.position.x = BABYLON.Scalar.Lerp(actor.metadata.holdX, actor.metadata.exitX, eased);
                    actor.position.y = BABYLON.Scalar.Lerp(actor.metadata.holdY, actor.metadata.exitY, eased);
                    actor.position.z = BABYLON.Scalar.Lerp(-0.32, -0.9, eased);
                    actor.scaling.setAll(BABYLON.Scalar.Lerp(1.0, 5.0, eased));
                    actor.rotation.set(
                        BABYLON.Scalar.Lerp(0, BABYLON.Tools.ToRadians(8), eased),
                        BABYLON.Tools.ToRadians(290),
                        BABYLON.Scalar.Lerp(0, BABYLON.Tools.ToRadians(80), eased)
                    );
                }
                if (progress >= 1) {
                    if (actor && !actor.isDisposed()) {
                        actor.dispose();
                    }
                    state.stage3FinaleLemonji = null;
                    state.stage3FinaleActive = false;
                    state.stage3FinalePhase = "";
                    state.stage3FinaleTimer = 0;
                    completeGame();
                }
                return;
            }

            if (state.stage3FinalePhase === "fadeEnding" && state.stage3FinaleTimer >= 0.95) {
                stage3IntroOverlayEl.classList.remove("isVisible", "isFading");
                state.stage3FinaleActive = false;
                completeGame();
            }
        }

        function fireEnemyRing(enemy) {
            const center = new BABYLON.Vector2(enemy.position.x - 0.5, enemy.position.y);
            const direction = new BABYLON.Vector2(game.player.position.x - center.x, game.player.position.y - center.y);
            if (direction.lengthSquared() > 0.0001) {
                direction.normalize();
            } else {
                direction.set(-1, 0);
            }
            const speed = 3.5 + state.wave * 0.12;
            const ringRx = enemy.metadata.radius * 0.45;
            const ringRy = enemy.metadata.radius * 0.34;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const bullet = BABYLON.MeshBuilder.CreateSphere("enemyRingBullet", {
                    diameter: 0.13,
                    segments: 10
                }, game.scene);
                bullet.position.set(center.x + Math.cos(angle) * ringRx, center.y + Math.sin(angle) * ringRy, -0.06);
                bullet.metadata = {
                    vx: direction.x * speed,
                    vy: direction.y * speed,
                    radius: 0.12,
                    ringCenterX: center.x,
                    ringCenterY: center.y,
                    ringAngle: angle,
                    ringRx,
                    ringRy,
                    ringSpin: 1.4
                };
                bullet.material = game.materials.enemyBullet;
                enemyBullets.push(bullet);
            }
        }

        function destroyEnemyAt(index, position) {
            const enemy = enemies[index];
            if (!enemy) {
                return;
            }
            state.score += enemy.metadata.points;
            saveHighScore();
            state.kills += 1;
            state.stageKills += 1;
            const wasStageBoss = enemy.metadata.isStageBoss;
            const wasFinalBoss = enemy.metadata.isFinalBoss;
            const wasStageOneCore = enemy.metadata.isStageOneCore;
            if (wasStageOneCore && !state.stage1CoreDefeated) {
                addDestructionEffect(enemy, position);
                playSound("boss");
                state.stage1CoreDefeated = true;
                state.stage1ClearTimer = 0;
                state.stageBossCount = Math.max(0, state.stageBossCount - 1);
                enemy.metadata.isStageBoss = false;
                enemy.metadata.isStageOneCore = false;
                enemy.metadata.isStageOneCoreFalling = true;
                enemy.metadata.canShoot = false;
                enemy.metadata.hp = 9999;
                enemy.metadata.fallTimer = 0;
                enemy.metadata.nextFallBurst = 0.18;
                enemy.metadata.motion = "stage1CoreFall";
                enemy.metadata.points = 0;
                updateHud();
                return;
            }
            if (wasFinalBoss && !enemy.metadata.finalBossDying) {
                startStage3FinaleBossDestruction(enemy, position);
                updateHud();
                return;
            }
            if (enemy.metadata.carriesCapsule) {
                spawnCapsule(position);
            }
            addDestructionEffect(enemy, position);
            playSound(wasFinalBoss || wasStageBoss ? "boss" : "explosion");
            disposeEnemy(enemy);
            enemies.splice(index, 1);
            if (wasStageBoss) {
                state.stageBossCount = Math.max(0, state.stageBossCount - 1);
                if (state.stage === 1 && state.stageBossCount === 0 && state.stage1CoreFallDone) {
                    state.stage1ClearTimer = 0;
                }
                if (state.stage === 2 && state.stageBossCount === 0) {
                    state.bossEnemy = null;
                    bossHudEl.classList.remove("isVisible");
                    state.stage2ClearPending = true;
                    state.stage2ClearTimer = 0;
                }
            }
            updateHud();
        }

        function addShockwave(position, directEnemy, options = {}) {
            const shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {
                diameter: 0.22,
                thickness: 0.035,
                tessellation: 64
            }, game.scene);
            shockwave.rotation.x = Math.PI / 2;
            shockwave.position.set(position.x, position.y, -0.09);
            shockwave.material = game.materials.shockwave;
            shockwave.metadata = {
                age: 0,
                duration: options.duration || 0.42,
                radius: 0.11,
                maxRadius: options.maxRadius || 1.45,
                damage: options.damage || 2,
                damagedEnemies: new Set(directEnemy ? [directEnemy] : [])
            };
            shockwaves.push(shockwave);
        }

        function explodeMissile(position, directEnemy) {
            addSparks(position, 34);
            addShockwave(position, directEnemy);
        }

        function explodeStage3SupportMissile(position, directEnemy) {
            const baseDamage = 3;
            const baseRadius = 1.45;
            addSparks(position, 58);
            addExplosionBurst(position, 1.25);
            addShockwave(position, directEnemy, {
                maxRadius: baseRadius * 1.5,
                damage: baseDamage
            });
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 * i) / 6;
                const burstPosition = new BABYLON.Vector3(
                    position.x + Math.cos(angle) * 1.45,
                    position.y + Math.sin(angle) * 1.15,
                    position.z
                );
                addSparks(burstPosition, 28);
                addExplosionBurst(burstPosition, 0.95);
                addShockwave(burstPosition, null, {
                    maxRadius: baseRadius * 1.5,
                    damage: baseDamage
                });
            }
            playSound("boss");
        }

        function addExplosionBurst(position, intensity = 1) {
            const core = BABYLON.MeshBuilder.CreateSphere("explosionCore", {
                diameter: 0.38,
                segments: 18
            }, game.scene);
            core.position.set(position.x, position.y, -0.12);
            core.material = game.materials.explosionCore;
            core.metadata = {
                age: 0,
                duration: 0.34,
                maxScale: 2.3 * intensity,
                spin: 0
            };
            explosions.push(core);

            const ring = BABYLON.MeshBuilder.CreateTorus("explosionRing", {
                diameter: 0.45,
                thickness: 0.06,
                tessellation: 64
            }, game.scene);
            ring.rotation.x = Math.PI / 2;
            ring.position.set(position.x, position.y, -0.14);
            ring.material = game.materials.explosionHot;
            ring.metadata = {
                age: 0,
                duration: 0.42,
                maxScale: 3.2 * intensity,
                spin: 8
            };
            explosions.push(ring);

            for (let i = 0; i < Math.ceil(5 * intensity); i++) {
                const ember = BABYLON.MeshBuilder.CreateSphere("explosionEmber", {
                    diameter: 0.13 + Math.random() * 0.09,
                    segments: 10
                }, game.scene);
                ember.position.set(position.x, position.y, -0.13);
                const angle = Math.random() * Math.PI * 2;
                const speed = (1.2 + Math.random() * 2.8) * intensity;
                ember.material = Math.random() < 0.5 ? game.materials.explosionCore : game.materials.explosionHot;
                ember.metadata = {
                    age: 0,
                    duration: 0.38 + Math.random() * 0.18,
                    maxScale: 0.12,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    spin: (Math.random() - 0.5) * 9
                };
                explosions.push(ember);
            }
        }

        function addDestructionEffect(enemy, position) {
            const type = enemy.metadata.enemyType;
            const config = enemy.metadata.enemyConfig;
            const intensity = enemy.metadata.isFinalBoss ? 3.2 : enemy.metadata.isStageBoss ? 1.8 : type === "teacherLarge" || type === "worker" ? 1.45 : 1;
            addExplosionBurst(position, intensity);
            if (type === "worker") {
                addSparks(position, 54);
                if (enemy.metadata.shields) {
                    enemy.metadata.shields.forEach((shield) => {
                        if (shield && !shield.isDisposed()) {
                            addSparks(shield.getAbsolutePosition(), 14);
                        }
                    });
                }
            } else if (config && config.ringShot) {
                addSparks(position, 70);
                addShockwave(position, enemy);
            } else if (type === "fighter") {
                addSparks(position, 30);
            } else if (enemy.metadata.isFinalBoss) {
                addSparks(position, 140);
                addShockwave(position, enemy);
            } else {
                addSparks(position, type === "teacherLarge" ? 52 : 34);
            }
        }

        function updateShockwaves(delta) {
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const shockwave = shockwaves[i];
                shockwave.metadata.age += delta;
                const progress = Math.min(1, shockwave.metadata.age / shockwave.metadata.duration);
                const radius = BABYLON.Scalar.Lerp(0.11, shockwave.metadata.maxRadius, progress);
                shockwave.metadata.radius = radius;
                shockwave.scaling.set(radius / 0.11, radius / 0.11, radius / 0.11);

                for (let k = enemies.length - 1; k >= 0; k--) {
                    const enemy = enemies[k];
                    if (shockwave.metadata.damagedEnemies.has(enemy)) {
                        continue;
                    }
                    const distance = distance2D(shockwave.position, enemy.position);
                    if (distance <= radius + enemy.metadata.radius) {
                        shockwave.metadata.damagedEnemies.add(enemy);
                        enemy.metadata.hp -= shockwave.metadata.damage;
                        if (enemy.metadata.isFinalBoss || state.bossEnemy === enemy) {
                            const hpRatio = Math.max(0, enemy.metadata.hp / state.bossMaxHp);
                            bossFillEl.style.width = `${hpRatio * 100}%`;
                        }
                        if (enemy.metadata.hp <= 0) {
                            destroyEnemyAt(k, enemy.position.clone());
                        } else {
                            addSparks(enemy.position, 10);
                            applyEnemyHitReaction(enemy, shockwave.metadata.damage, shockwave.position);
                        }
                    }
                }

                if (progress >= 1) {
                    shockwave.dispose();
                    shockwaves.splice(i, 1);
                }
            }
        }

        function updateExplosions(delta) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const explosion = explosions[i];
                explosion.metadata.age += delta;
                const progress = Math.min(1, explosion.metadata.age / explosion.metadata.duration);
                if (explosion.metadata.vx !== undefined) {
                    explosion.position.x += explosion.metadata.vx * delta;
                    explosion.position.y += explosion.metadata.vy * delta;
                    const scale = Math.max(0.08, 1 - progress);
                    explosion.scaling.set(scale, scale, scale);
                } else {
                    const scale = BABYLON.Scalar.Lerp(0.3, explosion.metadata.maxScale, progress);
                    explosion.scaling.set(scale, scale, scale);
                }
                explosion.rotation.z += (explosion.metadata.spin || 0) * delta;
                const fade = Math.max(0, 1 - progress);
                explosion.visibility = fade;
                if (progress >= 1) {
                    explosion.dispose();
                    explosions.splice(i, 1);
                }
            }
        }

        function updateSparks(delta) {
            for (let i = sparks.length - 1; i >= 0; i--) {
                const spark = sparks[i];
                spark.metadata.life -= delta;
                spark.position.x += spark.metadata.vx * delta;
                spark.position.y += spark.metadata.vy * delta;
                const scale = Math.max(0, spark.metadata.life / spark.metadata.maxLife);
                spark.scaling.set(scale, scale, scale);
                if (spark.metadata.life <= 0) {
                    spark.dispose();
                    sparks.splice(i, 1);
                }
            }
        }

        function tryDamageEnemyShield(enemy, bullet, damage) {
            if (!enemy.metadata || !enemy.metadata.shields || enemy.metadata.shields.length === 0) {
                return false;
            }
            for (let i = enemy.metadata.shields.length - 1; i >= 0; i--) {
                const shield = enemy.metadata.shields[i];
                if (!shield || shield.isDisposed()) {
                    enemy.metadata.shields.splice(i, 1);
                    continue;
                }
                const shieldPosition = shield.getAbsolutePosition();
                if (distance2D(shieldPosition, bullet.position) < shield.metadata.radius + bullet.metadata.radius) {
                    const isSupportMissile = !!bullet.metadata.supportCluster;
                    shield.metadata.hp -= damage;
                    const hpRatio = Math.max(0, shield.metadata.hp / shield.metadata.maxHp);
                    if (shield.metadata.kind === "gravityOrbitRock") {
                        const scale = shield.metadata.baseScale * (0.58 + hpRatio * 0.42);
                        shield.scaling.setAll(scale);
                    } else {
                        shield.visibility = 0.18 + hpRatio * 0.4;
                        shield.scaling.set(0.65 + hpRatio * 0.35, 0.65 + hpRatio * 0.35, 1);
                    }
                    addSparks(shieldPosition, 8);
                    if (shield.metadata.hp <= 0) {
                        if (shield.metadata.kind === "gravityOrbitRock") {
                            addExplosionBurst(shieldPosition, 0.72);
                        }
                        addSparks(shieldPosition, 16);
                        playSound("shieldBreak");
                        shield.dispose();
                        enemy.metadata.shields.splice(i, 1);
                    } else {
                        playSound("shield");
                    }
                    if (isSupportMissile) {
                        explodeStage3SupportMissile(shieldPosition, enemy);
                    }
                    return true;
                }
            }
            return false;
        }

        function updateFighterDodge(enemy, delta, introActive) {
            if (enemy.metadata.enemyType !== "fighter" || introActive) {
                enemy.metadata.dodgeY = BABYLON.Scalar.Lerp(enemy.metadata.dodgeY || 0, 0, Math.min(1, delta * 5));
                enemy.metadata.dodgeDirection = 0;
                return 0;
            }
            enemy.metadata.dodgeCooldown = Math.max(0, (enemy.metadata.dodgeCooldown || 0) - delta);

            let bestThreat = null;
            let bestScore = Infinity;
            bullets.forEach((bullet) => {
                if (bullet.metadata.shotOwner && bullet.metadata.shotOwner !== "player") {
                    return;
                }
                const bulletVx = bullet.metadata.vx !== undefined ? bullet.metadata.vx : bullet.metadata.speed || 0;
                const bulletVy = bullet.metadata.vy || 0;
                if (bulletVx <= 0.1 || bullet.position.x > enemy.position.x + 0.15 || bullet.position.x < enemy.position.x - 4.8) {
                    return;
                }
                const timeToReach = (enemy.position.x - bullet.position.x) / bulletVx;
                if (timeToReach < 0 || timeToReach > 0.72) {
                    return;
                }
                const predictedY = bullet.position.y + bulletVy * timeToReach;
                const missDistance = Math.abs(predictedY - enemy.position.y);
                const dangerRadius = enemy.metadata.radius + bullet.metadata.radius + 0.42;
                if (missDistance < dangerRadius && missDistance < bestScore) {
                    bestScore = missDistance;
                    bestThreat = { predictedY };
                }
            });

            if (bestThreat && enemy.metadata.dodgeCooldown <= 0) {
                const desiredDirection = bestThreat.predictedY <= enemy.position.y ? 1 : -1;
                const roomUp = world.maxY - 0.55 - enemy.position.y;
                const roomDown = enemy.position.y - (world.minY + 0.55);
                enemy.metadata.dodgeDirection = desiredDirection > 0 && roomUp < 0.7
                    ? -1
                    : desiredDirection < 0 && roomDown < 0.7
                        ? 1
                        : desiredDirection;
                enemy.metadata.dodgeTimer = 0.42;
            } else {
                enemy.metadata.dodgeTimer = Math.max(0, (enemy.metadata.dodgeTimer || 0) - delta);
                if (enemy.metadata.dodgeTimer <= 0) {
                    enemy.metadata.dodgeDirection = 0;
                }
            }

            const dodgeSpeed = 5.4;
            if (enemy.metadata.dodgeDirection) {
                enemy.metadata.dodgeY = BABYLON.Scalar.Clamp(
                    (enemy.metadata.dodgeY || 0) + enemy.metadata.dodgeDirection * dodgeSpeed * delta,
                    -1.45,
                    1.45
                );
                if (!bestThreat && enemy.metadata.dodgeTimer <= 0) {
                    enemy.metadata.dodgeCooldown = 0.3;
                }
            } else {
                enemy.metadata.dodgeY = BABYLON.Scalar.Lerp(enemy.metadata.dodgeY || 0, 0, Math.min(1, delta * 3.2));
            }
            return enemy.metadata.dodgeY || 0;
        }

        function updateLists(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                if (bullet.metadata.kind === "missile") {
                    updateMissile(bullet, delta);
                } else {
                    bullet.position.x += bullet.metadata.speed * delta;
                    bullet.position.y += (bullet.metadata.vy || 0) * delta;
                    if (bullet.metadata.spin) {
                        bullet.rotation.z += bullet.metadata.spin * delta;
                        bullet.rotation.y += bullet.metadata.spin * 0.45 * delta;
                    }
                }
                if (bullet.position.x > world.maxX + 1.6 || bullet.position.y < world.minY - 1 || bullet.position.y > world.maxY + 1) {
                    bullet.dispose();
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (enemy.metadata.isStageOneCoreFalling) {
                    enemy.metadata.fallTimer += delta;
                    enemy.metadata.nextFallBurst -= delta;
                    enemy.position.x -= 0.45 * delta;
                    enemy.position.y -= 1.45 * delta;
                    enemy.position.z -= 0.18 * delta;
                    enemy.rotation.z += 3.2 * delta;
                    enemy.scaling.scaleInPlace(1 - delta * 0.22);
                    if (enemy.metadata.nextFallBurst <= 0) {
                        addExplosionBurst(enemy.position, 0.85 + enemy.metadata.fallTimer * 0.35);
                        addSparks(enemy.position, 26);
                        playSound("explosion");
                        enemy.metadata.nextFallBurst = 0.24;
                    }
                    if (enemy.metadata.fallTimer >= 1.45) {
                        addExplosionBurst(enemy.position, 2.2);
                        addSparks(enemy.position, 90);
                        addShockwave(enemy.position, enemy);
                        playSound("boss");
                        disposeEnemy(enemy);
                        enemies.splice(i, 1);
                        state.stage1CoreFallDone = true;
                        state.stage1ClearTimer = 0;
                    }
                    continue;
                }
                const motion = enemy.metadata.motion || "sine";
                if (motion === "hover") {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, enemy.metadata.hoverX || world.maxX - 2.0, 0.018);
                } else if (motion === "stage1LeftGuard") {
                    const guardX = enemy.metadata.hoverX !== undefined ? enemy.metadata.hoverX : enemy.position.x;
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, guardX, 0.028);
                    if (Math.abs(enemy.position.x - guardX) < 0.02) {
                        enemy.position.x = guardX;
                    }
                } else if (motion === "boss") {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 2.4, 0.02);
                } else if (motion === "gravityBoss") {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, enemy.metadata.hoverX, 0.018);
                } else if (motion === "drift") {
                    enemy.position.x -= enemy.metadata.speed * delta;
                    enemy.position.y += (enemy.metadata.driftY || 0) * delta;
                } else if (motion === "bossKaraageMissile") {
                    updateBossKaraageMissile(enemy, delta);
                } else {
                    if (enemy.metadata.depthIntro !== null && enemy.metadata.depthIntro !== undefined && enemy.metadata.introRightX !== undefined) {
                        enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, enemy.metadata.introRightX, Math.min(1, delta * 1.2));
                    } else {
                        enemy.position.x -= enemy.metadata.speed * delta;
                    }
                }
                if (enemy.metadata.isStageBoss && enemy.metadata.hoverX === undefined) {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 1.3, 0.025);
                }
                if (enemy.metadata.isFinalBoss) {
                    enemy.position.x = BABYLON.Scalar.Lerp(enemy.position.x, world.maxX - 1.8, 0.02);
                    enemy.metadata.waveY = 0;
                    updateFinalBoss(enemy, delta);
                }
                const introActive = enemy.metadata.depthIntro !== null && enemy.metadata.depthIntro !== undefined;
                const dodgeY = updateFighterDodge(enemy, delta, introActive);
                const waveAmount = enemy.metadata.waveAmount === undefined ? 0.28 : enemy.metadata.waveAmount;
                const waveSpeed = enemy.metadata.waveSpeed === undefined ? 2.2 : enemy.metadata.waveSpeed;
                if (motion !== "drift" && motion !== "bossKaraageMissile") {
                    enemy.position.y = BABYLON.Scalar.Clamp(
                        enemy.metadata.waveY + Math.sin(state.elapsed * waveSpeed + enemy.metadata.wavePhase) * waveAmount + dodgeY,
                        world.minY + 0.45,
                        world.maxY - 0.45
                    );
                }
                const bankZ = BABYLON.Scalar.Clamp(
                    Math.cos(state.elapsed * waveSpeed + enemy.metadata.wavePhase) * waveAmount * waveSpeed * 0.16 + dodgeY * 0.24,
                    BABYLON.Tools.ToRadians(-20),
                    BABYLON.Tools.ToRadians(20)
                );
                enemy.metadata.baseRotationZ = (enemy.metadata.baseRotationZ || 0) + enemy.metadata.spin * delta;
                if (enemy.metadata.enemyType === "asteroid") {
                    enemy.rotation.x += enemy.metadata.asteroidSpinX * delta;
                    enemy.rotation.y += enemy.metadata.asteroidSpinY * delta;
                    enemy.rotation.z += enemy.metadata.asteroidSpinZ * delta;
                }
                if (enemy.metadata.hitFlash > 0) {
                    enemy.metadata.hitFlash = Math.max(0, enemy.metadata.hitFlash - delta);
                    enemy.metadata.hitKick = BABYLON.Scalar.Lerp(enemy.metadata.hitKick || 0, 0, 0.18);
                    enemy.metadata.hitScale = BABYLON.Scalar.Lerp(enemy.metadata.hitScale || 1, 1, 0.18);
                    if (enemy.metadata.depthIntro === null || enemy.metadata.depthIntro === undefined) {
                        enemy.scaling.setAll(enemy.metadata.hitScale || 1);
                    }
                } else if (enemy.metadata.hitKick) {
                    enemy.metadata.hitKick = BABYLON.Scalar.Lerp(enemy.metadata.hitKick, 0, 0.2);
                    enemy.metadata.hitScale = BABYLON.Scalar.Lerp(enemy.metadata.hitScale || 1, 1, 0.2);
                    if (Math.abs(enemy.metadata.hitKick) < 0.01) {
                        enemy.metadata.hitKick = 0;
                    }
                }
                const modelRoot = enemy.getChildren().find((child) => child.name && child.name.indexOf("Model") >= 0);
                if (enemy.metadata.depthIntro !== null && enemy.metadata.depthIntro !== undefined) {
                    enemy.metadata.depthIntro += delta;
                    const progress = Math.min(1, enemy.metadata.depthIntro / (enemy.metadata.depthIntroDuration || 0.75));
                    const targetScale = 1;
                    const startScale = enemy.metadata.depthIntroStartScale || (enemy.position.z < 0 ? 0.48 : 1.32);
                    const scale = BABYLON.Scalar.Lerp(startScale, targetScale, progress) * (enemy.metadata.hitScale || 1);
                    enemy.scaling.setAll(scale);
                    enemy.position.z = BABYLON.Scalar.Lerp(enemy.metadata.depthIntroStartZ || enemy.position.z, 0, progress);
                    if (progress >= 1) {
                        enemy.metadata.depthIntro = null;
                        enemy.metadata.introRotation = null;
                    }
                }
                if (modelRoot && enemy.metadata.enemyConfig) {
                    const targetRotation = enemy.metadata.enemyConfig.rotation;
                    if (enemy.metadata.introRotation && enemy.metadata.depthIntro !== null && enemy.metadata.depthIntro !== undefined) {
                        const progress = Math.min(1, enemy.metadata.depthIntro / (enemy.metadata.depthIntroDuration || 0.75));
                        modelRoot.rotation.x = BABYLON.Scalar.Lerp(enemy.metadata.introRotation.x, targetRotation.x, progress);
                        modelRoot.rotation.y = BABYLON.Scalar.Lerp(enemy.metadata.introRotation.y, targetRotation.y, progress);
                        modelRoot.rotation.z = BABYLON.Scalar.Lerp(enemy.metadata.introRotation.z, targetRotation.z, progress) + bankZ + (enemy.metadata.hitKick || 0);
                    } else {
                        modelRoot.rotation.x = targetRotation.x;
                        modelRoot.rotation.y = targetRotation.y;
                        modelRoot.rotation.z = targetRotation.z + bankZ + (enemy.metadata.hitKick || 0);
                    }
                } else if (enemy.metadata.enemyType !== "asteroid") {
                    enemy.rotation.z = (enemy.metadata.baseRotationZ || 0) + bankZ + (enemy.metadata.hitKick || 0);
                }
                if (enemy.metadata.carriesCapsule && enemy.metadata.parts) {
                    enemy.metadata.parts.forEach((part) => {
                        if (part.name === "capsuleCarrierRing") {
                            part.rotation.z += delta * 4.5;
                            const pulse = 1 + Math.sin(state.elapsed * 8 + part.metadata.pulse) * 0.12;
                            part.scaling.set(pulse, pulse, pulse);
                        }
                    });
                }
                if (enemy.metadata.enemyType === "corvette" && enemy.metadata.parts) {
                    enemy.metadata.parts.forEach((part, partIndex) => {
                        const angle = state.elapsed * 1.8 + (Math.PI * 2 * partIndex) / enemy.metadata.parts.length;
                        part.position.x = Math.cos(angle) * 0.58;
                        part.position.y = Math.sin(angle) * 0.58;
                    });
                }
                if (enemy.metadata.enemyType === "gravityBoss") {
                    enemy.metadata.gravityTimer -= delta;
                    if (enemy.metadata.parts) {
                        enemy.metadata.parts.forEach((part) => {
                            if (!part || (part.isDisposed && part.isDisposed())) {
                                return;
                            }
                            if (part.metadata && part.metadata.kind === "gravityOrbitRock") {
                                part.metadata.orbitAngle += part.metadata.orbitSpeed * delta;
                                part.position.x = Math.cos(part.metadata.orbitAngle) * part.metadata.orbitRadiusX;
                                part.position.y = Math.sin(part.metadata.orbitAngle) * part.metadata.orbitRadiusY;
                                part.position.z = -0.34 + Math.sin(part.metadata.orbitAngle * 2.0) * 0.08;
                                part.rotation.x += part.metadata.spinX * delta;
                                part.rotation.y += part.metadata.spinY * delta;
                                part.rotation.z += part.metadata.spinZ * delta;
                                return;
                            }
                            part.rotation.z += delta * 1.9;
                            const pulse = 1 + Math.sin(state.elapsed * 3.8) * 0.08;
                            part.scaling.set(pulse, pulse, pulse);
                        });
                    }
                    if (enemy.metadata.gravityTimer <= 0) {
                        spawnGravityAsteroid(enemy);
                        enemy.metadata.gravityTimer = 1.25;
                    }
                }
                if (!introActive && enemy.metadata.openingShotPending && enemy.position.x < world.maxX - 0.05 && enemy.position.x > game.player.position.x + 1.2) {
                    fireEnemyBullet(enemy);
                    enemy.metadata.openingShotPending = false;
                    enemy.metadata.shootTimer = Math.max(enemy.metadata.shootTimer || 0, 1.2);
                }
                if (!introActive && enemy.metadata.canShoot && enemy.position.x < world.maxX - 0.2 && enemy.position.x > game.player.position.x + 1.2) {
                    enemy.metadata.shootTimer -= delta;
                    if (enemy.metadata.shootTimer <= 0) {
                        const shotChance = enemy.metadata.isFinalBoss ? 0.95 : 1;
                        if (Math.random() < shotChance) {
                            fireEnemyBullet(enemy);
                        }
                        enemy.metadata.shootTimer = enemy.metadata.isFinalBoss
                            ? ((enemy.metadata.finalBossPhase || 1) >= 3 ? 1.45 : (enemy.metadata.finalBossPhase || 1) >= 2 ? 2.05 : 2.85)
                            : enemy.metadata.enemyType === "worker"
                                ? 2 + Math.random() * 3
                            : randomRange(enemy.metadata.shotInterval || 8);
                    }
                }

                if (introActive) {
                    continue;
                }

                if (distance2D(enemy.position, game.player.position) < enemy.metadata.radius + 0.38) {
                    if (state.invincibleTimer > 0) {
                        continue;
                    }
                    if (enemy.metadata.isStageOneCore) {
                        destroyEnemyAt(i, enemy.position.clone());
                        damagePlayer();
                        continue;
                    }
                    addSparks(enemy.position, 14);
                    if (enemy.metadata.isStageBoss) {
                        state.stageBossCount = Math.max(0, state.stageBossCount - 1);
                    }
                    disposeEnemy(enemy);
                    enemies.splice(i, 1);
                    damagePlayer();
                    continue;
                }

                if (!enemy.metadata.isStageBoss && !enemy.metadata.isFinalBoss && enemy.position.x < world.minX - 1) {
                    disposeEnemy(enemy);
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (tryDamageEnemyShield(enemy, bullet, bullet.metadata.damage)) {
                        bullet.dispose();
                        bullets.splice(j, 1);
                        break;
                    }
                    if (distance2D(enemy.position, bullet.position) < enemy.metadata.radius + bullet.metadata.radius) {
                        const hitPosition = bullet.position.clone();
                        const enemyPosition = enemy.position.clone();
                        const bulletDamage = bullet.metadata.damage;
                        const isExplosiveMissile = bullet.metadata.kind === "missile" && bullet.metadata.explosive;
                        const isSupportMissile = !!bullet.metadata.supportCluster;
                        const isLemonHit = !!bullet.metadata.lemon;
                        bullet.dispose();
                        bullets.splice(j, 1);
                        enemy.metadata.hp -= bulletDamage;
                        if (enemy.metadata.isFinalBoss || state.bossEnemy === enemy) {
                            const hpRatio = Math.max(0, enemy.metadata.hp / state.bossMaxHp);
                            bossFillEl.style.width = `${hpRatio * 100}%`;
                        }
                        addSparks(hitPosition, isLemonHit ? 14 : 8);
                        if (isSupportMissile) {
                            explodeStage3SupportMissile(hitPosition, enemy);
                        } else if (isExplosiveMissile) {
                            explodeMissile(hitPosition, enemy);
                        }
                        if (enemy.metadata.hp <= 0) {
                            const currentIndex = enemies.indexOf(enemy);
                            if (currentIndex >= 0) {
                                destroyEnemyAt(currentIndex, enemyPosition);
                            }
                        } else {
                            applyEnemyHitReaction(enemy, bulletDamage, hitPosition);
                            playSound("impact");
                        }
                        break;
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                if (bullet.metadata.ringCenterX !== undefined) {
                    bullet.metadata.ringCenterX += bullet.metadata.vx * delta;
                    bullet.metadata.ringCenterY += bullet.metadata.vy * delta;
                    bullet.metadata.ringAngle += bullet.metadata.ringSpin * delta;
                    bullet.position.x = bullet.metadata.ringCenterX + Math.cos(bullet.metadata.ringAngle) * bullet.metadata.ringRx;
                    bullet.position.y = bullet.metadata.ringCenterY + Math.sin(bullet.metadata.ringAngle) * bullet.metadata.ringRy;
                } else {
                    bullet.position.x += bullet.metadata.vx * delta;
                    bullet.position.y += bullet.metadata.vy * delta;
                }
                bullet.rotation.z += delta * 7;

                if (distance2D(bullet.position, game.player.position) < bullet.metadata.radius + 0.38) {
                    addSparks(bullet.position, 10);
                    bullet.dispose();
                    enemyBullets.splice(i, 1);
                    damagePlayer();
                    continue;
                }

                if (
                    bullet.position.x < world.minX - 1
                    || bullet.position.x > world.maxX + 1
                    || bullet.position.y < world.minY - 1
                    || bullet.position.y > world.maxY + 1
                ) {
                    bullet.dispose();
                    enemyBullets.splice(i, 1);
                }
            }

            for (let i = capsules.length - 1; i >= 0; i--) {
                const capsule = capsules[i];
                capsule.position.x -= capsule.metadata.speed * delta;
                capsule.rotation.z += delta * 5;
                if (capsule.metadata.ring) {
                    capsule.metadata.ring.rotation.z -= delta * 8;
                    const pulse = 1 + Math.sin(state.elapsed * 10) * 0.15;
                    capsule.metadata.ring.scaling.set(pulse, pulse, pulse);
                }
                if (distance2D(capsule.position, game.player.position) < capsule.metadata.radius + 0.42) {
                    collectCapsule(capsule);
                    capsule.dispose();
                    capsules.splice(i, 1);
                    continue;
                }
                if (capsule.position.x < world.minX - 1) {
                    capsule.dispose();
                    capsules.splice(i, 1);
                }
            }

            for (let i = terrain.length - 1; i >= 0; i--) {
                const block = terrain[i];
                if (block.metadata.kind === "meteor") {
                    block.position.x += block.metadata.vx * delta;
                    block.position.y += block.metadata.vy * delta;
                    block.rotation.x += block.metadata.spinX * delta;
                    block.rotation.y += block.metadata.spinY * delta;
                    block.rotation.z += block.metadata.spinZ * delta;
                    if (block.position.y < world.minY + 0.35 || block.position.y > world.maxY - 0.35) {
                        block.metadata.vy *= -1;
                    }
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const bullet = bullets[j];
                        if (distance2D(block.position, bullet.position) >= block.metadata.radius + bullet.metadata.radius) {
                            continue;
                        }
                        const hitPosition = bullet.position.clone();
                        const damage = bullet.metadata.damage || 0.5;
                        const isExplosiveMissile = bullet.metadata.kind === "missile" && bullet.metadata.explosive;
                        const isSupportMissile = !!bullet.metadata.supportCluster;
                        bullet.dispose();
                        bullets.splice(j, 1);
                        block.metadata.hp -= damage;
                        addSparks(hitPosition, isExplosiveMissile ? 22 : 10);
                        playSound("impact");
                        if (isSupportMissile) {
                            explodeStage3SupportMissile(hitPosition, null);
                        } else if (isExplosiveMissile) {
                            addExplosionBurst(hitPosition, 0.55);
                        }
                        if (block.metadata.hp <= 0) {
                            addExplosionBurst(block.position, 1.35);
                            addSparks(block.position, 48);
                            playSound("explosion");
                            block.dispose();
                            terrain.splice(i, 1);
                            break;
                        }
                    }
                    if (i >= terrain.length || terrain[i] !== block) {
                        continue;
                    }
                } else {
                    block.position.x -= block.metadata.speed * delta;
                }
                if (distance2D(block.position, game.player.position) < block.metadata.radius + 0.24) {
                    addSparks(game.player.position, 18);
                    damagePlayer();
                    if (block.metadata.kind !== "meteor") {
                        block.position.x = world.minX - 2;
                    }
                }
                if (block.position.x < world.minX - 2 || block.position.y < world.minY - 1 || block.position.y > world.maxY + 1) {
                    block.dispose();
                    terrain.splice(i, 1);
                }
            }

            updateShockwaves(delta);
            updateExplosions(delta);
            updateSparks(delta);
            updateFloatingTexts(delta);
        }

        function updateStars(delta) {
            const hideGameplayStars = state.stage3IntroActive;
            game.stars.forEach((star) => {
                if (star.isEnabled() === hideGameplayStars) {
                    star.setEnabled(!hideGameplayStars);
                }
                if (hideGameplayStars) {
                    return;
                }
                const stageSpeed = state.stage === 2 ? star.metadata.speed * 0.72 : star.metadata.speed;
                star.position.x -= stageSpeed * delta;
                if (star.position.x < world.minX - 0.3) {
                    star.position.x = world.maxX + Math.random();
                    star.position.y = world.minY + Math.random() * (world.maxY - world.minY);
                }
            });
            game.backgroundAsteroids.forEach((asteroid) => {
                const active = !hideGameplayStars && state.stage === 2 && state.hasStarted && !state.gameOver;
                if (asteroid.isEnabled() !== active) {
                    asteroid.setEnabled(active);
                }
                if (!active) {
                    return;
                }
                asteroid.position.x -= asteroid.metadata.speed * delta;
                asteroid.rotation.x += asteroid.metadata.spinX * delta;
                asteroid.rotation.y += asteroid.metadata.spinY * delta;
                asteroid.rotation.z += asteroid.metadata.spinZ * delta;
                if (asteroid.position.x < world.minX - 1.2) {
                    asteroid.position.x = world.maxX + 0.8 + Math.random() * 2.2;
                    asteroid.position.y = world.minY + Math.random() * (world.maxY - world.minY);
                    asteroid.position.z = 1.6 + Math.random() * 1.9;
                    asteroid.scaling.setAll(0.22 + Math.random() * 0.62);
                }
            });
        }

        game.scene.onBeforeRenderObservable.add(() => {
            const delta = Math.min(engine.getDeltaTime() / 1000, 0.033);
            updateGamepadInput();
            updateStars(delta);
            updateTitleMusic();
            updateStage3BossMusic();
            updateEndingLyrics();

            if (!state.hasStarted) {
                return;
            }

            if (state.isIntermission) {
                return;
            }

            if (state.gameOver) {
                state.gameOverReturnTimer += delta;
                updatePlayerDeathExplosion(delta);
                updateExplosions(delta);
                updateSparks(delta);
                updateFloatingTexts(delta);
                return;
            }

            state.elapsed += delta;
            state.stageElapsed += delta;
            if (state.stage1LemonjiEventActive) {
                state.stage1LemonjiEventTimer += delta;
            }
            updateStageActors(delta);
            if (state.stage3FinaleActive) {
                updateStage3Finale(delta);
                updateExplosions(delta);
                updateSparks(delta);
                updateFloatingTexts(delta);
                updateHud();
                return;
            }
            if (state.stage1LemonjiEventActive) {
                if (state.stage1LemonjiEventTimer >= 7.8) {
                    finishStageOneLemonjiFlyby();
                }
            }
            if (state.stage3IntroActive) {
                try {
                    updateStage3IntroCutscene(delta);
                } catch (error) {
                    console.warn("Stage3 intro update skipped for this frame.", error);
                }
                updateDialogue(delta);
                updateExplosions(delta);
                updateSparks(delta);
                updateFloatingTexts(delta);
                updateHud();
                return;
            }
            if (state.stageClearExitActive) {
                updateStageClearExit(delta);
                updateExplosions(delta);
                updateSparks(delta);
                updateFloatingTexts(delta);
                updateHud();
                return;
            }
            updateStage(delta);
            updateDialogue(delta);
            if (state.isIntermission) {
                return;
            }
            state.wave = 1 + Math.floor(state.elapsed / 24) + Math.max(0, state.stage - 1);
            state.enemyTimer -= delta;
            state.formationTimer -= delta;
            state.terrainTimer -= delta;

            const spawnDelay = Math.max(0.36, 1.16 - state.stage * 0.16 - state.wave * 0.04);
            const isBossActive = (state.stage === 1 && state.stage1BossSpawned) || (state.stage === 2 && (state.stage2BossSpawned || state.stage2ClearPending)) || (state.stage === 3 && state.stage3BossSpawned);
            const usesScriptedStageSpawns = state.stage === 1;
            updateBossCapsuleSupply(delta, isBossActive);
            if (state.enemyTimer <= 0 && !isBossActive && !usesScriptedStageSpawns) {
                spawnEnemy();
                state.enemyTimer = spawnDelay;
            }
            if (state.formationTimer <= 0 && !isBossActive && !usesScriptedStageSpawns) {
                spawnFormation();
                state.formationTimer = Math.max(3.8, 8.8 - state.stage * 1.1 - state.wave * 0.18);
            }
            if (state.terrainTimer <= 0 && state.stage === 2) {
                spawnStageTwoMeteor();
                const stageTwoMeteorIntervalScale = state.stageElapsed < 24 ? 1.43 : 1;
                state.terrainTimer = (Math.max(1.15, 2.45 - state.wave * 0.08) + Math.random() * 0.65) * stageTwoMeteorIntervalScale;
            }

            updatePlayer(delta);
            updateLists(delta);
            updateHud();
        });

        loadHighScore();
        resetGame();
        playTitleMusic();

        engine.runRenderLoop(() => {
            syncEventSkipButton();
            game.scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
