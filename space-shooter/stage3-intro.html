<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stage3 Fleet Intro</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #02040a;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        #renderCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            background:
                linear-gradient(rgba(2, 4, 10, 0.12), rgba(2, 4, 10, 0.18)),
                url("./img/stage3-space-bg.jpg") center / cover no-repeat,
                #02040a;
        }

        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: #f4fbff;
            text-shadow: 0 0 14px rgba(0, 0, 0, 0.9);
        }

        .title {
            position: absolute;
            top: 18px;
            left: 22px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0;
            color: rgba(238, 249, 255, 0.72);
        }

        .caption {
            position: absolute;
            left: clamp(18px, 5vw, 72px);
            right: clamp(18px, 5vw, 72px);
            bottom: clamp(24px, 7vh, 72px);
            max-width: 980px;
            display: flex;
            align-items: center;
            gap: clamp(12px, 2vw, 22px);
            font-size: clamp(22px, 3.2vw, 38px);
            line-height: 1.45;
            font-weight: 800;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .captionPortrait {
            width: clamp(64px, 8.8vw, 110px);
            height: clamp(64px, 8.8vw, 110px);
            object-fit: cover;
            flex: 0 0 auto;
            border-radius: 6px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.58);
        }

        .captionText {
            white-space: pre-line;
        }

        .caption.isVisible {
            opacity: 1;
            transform: translateY(0);
        }

        .controls {
            position: absolute;
            right: 18px;
            bottom: 18px;
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        button {
            min-width: 44px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 6px;
            color: #f6fbff;
            background: rgba(10, 18, 28, 0.68);
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(35, 52, 72, 0.78);
        }

        .vignette {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 45%, transparent 44%, rgba(0, 0, 0, 0.66) 100%),
                linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 30%, transparent 70%, rgba(0, 0, 0, 0.36));
        }

        body.isEmbedded .title,
        body.isEmbedded .controls {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div class="overlay">
        <div class="vignette"></div>
        <div class="title">STAGE3 INTRO</div>
        <div id="caption" class="caption">
            <img class="captionPortrait" src="img/lemonji_insert.jpg" alt="">
            <span id="captionText" class="captionText"></span>
        </div>
        <div class="controls">
            <button id="replayButton" type="button" title="Replay">↺</button>
            <button id="fleetButton" type="button" title="Fleet view">艦隊</button>
            <button id="sideButton" type="button" title="Side scroll view">開始</button>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="stage3-intro-scene.js"></script>
    <script>
        const intro = window.Stage3FleetIntro.create();
    </script>
</body>
</html>
