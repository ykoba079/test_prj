<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Babylon.js コードだけで作る自然ドキュメンタリー</title>
    <style>
        :root {
            color-scheme: dark;
            --text: #f7f1df;
            --muted: rgba(247, 241, 223, 0.72);
            --gold: #e3c16c;
            --line: rgba(255, 255, 255, 0.2);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #071015;
            color: var(--text);
            font-family: "Yu Gothic UI", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
        }

        #renderCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            outline: none;
        }

        .title,
        .status,
        .vignette,
        .letterbox,
        .grain {
            position: fixed;
            pointer-events: none;
        }

        .title {
            top: clamp(46px, 8vh, 84px);
            left: clamp(22px, 5vw, 76px);
            z-index: 4;
            max-width: min(680px, calc(100vw - 44px));
            text-shadow: 0 5px 30px rgba(0, 0, 0, 0.78);
        }

        .title .kicker {
            display: flex;
            gap: 12px;
            align-items: center;
            color: var(--gold);
            font-size: clamp(12px, 1.3vw, 15px);
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .title .kicker::before {
            display: block;
            width: 44px;
            height: 1px;
            content: "";
            background: currentColor;
        }

        h1 {
            margin: 14px 0 0;
            font-size: clamp(34px, 7vw, 86px);
            line-height: 1.02;
            letter-spacing: 0;
        }

        .title p {
            max-width: 610px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: clamp(14px, 1.6vw, 18px);
            line-height: 1.85;
        }

        .status {
            right: clamp(18px, 4vw, 56px);
            bottom: clamp(44px, 8vh, 78px);
            z-index: 4;
            display: flex;
            gap: 16px;
            align-items: center;
            color: rgba(247, 241, 223, 0.68);
            font-size: 12px;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.78);
        }

        .status span {
            padding-left: 14px;
            border-left: 1px solid var(--line);
        }

        .status strong {
            display: block;
            margin-top: 4px;
            color: var(--text);
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        .vignette,
        .letterbox,
        .grain {
            inset: 0;
            z-index: 2;
        }

        .vignette {
            background:
                radial-gradient(circle at 50% 42%, transparent 0 42%, rgba(0, 0, 0, 0.34) 83%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.34), transparent 24%, transparent 70%, rgba(0, 0, 0, 0.48));
        }

        .letterbox::before,
        .letterbox::after {
            position: absolute;
            left: 0;
            width: 100%;
            height: clamp(30px, 6vh, 66px);
            content: "";
            background: #040607;
        }

        .letterbox::before {
            top: 0;
        }

        .letterbox::after {
            bottom: 0;
        }

        .grain {
            opacity: 0.1;
            background-image:
                repeating-radial-gradient(circle at 14% 23%, rgba(255, 255, 255, 0.22) 0 1px, transparent 1px 7px),
                repeating-radial-gradient(circle at 73% 57%, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 9px);
            mix-blend-mode: overlay;
        }

        @media (max-width: 720px) {
            .title p,
            .status {
                display: none;
            }

            h1 {
                font-size: clamp(31px, 12vw, 54px);
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <section class="title" aria-hidden="true">
        <div class="kicker">PROCEDURAL NATURE</div>
        <h1>山と森と海の<br>ドキュメンタリー</h1>
        <p>Babylon.js のコードだけで生成した自然風景です。地形、森、海、川、空、雲、霧、鳥を組み合わせ、NHKの自然番組のようにゆっくり巡るカメラワークを入れています。</p>
    </section>

    <aside class="status" aria-hidden="true">
        <span>CAMERA<strong>GRAND AERIAL TOUR</strong></span>
        <span>SCENE<strong>100% CODE + TEXTURES</strong></span>
    </aside>

    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="letterbox"></div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="./documentary-nature.js"></script>
    <script>
        var canvas = document.getElementById("renderCanvas");
        var engine = new BABYLON.Engine(canvas, true, {
            preserveDrawingBuffer: true,
            stencil: true,
            antialias: true
        });
        var scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
