<script>
    const cvWidth=1280;
    const cvHeight=840;
    const sprScaleMaster=5;
    const sprWidth=400;
    const sprHeight=100;

    const cvsElement = document.querySelector('#cvs');
    const renderer = new THREE.WebGLRenderer({
        canvas: cvsElement,
        alpha:true,
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(cvWidth,cvHeight);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45,cvWidth / cvHeight , 0.1, 1000);
    camera.position.set(-100,60,60);


    const controls = new THREE.OrbitControls(camera, cvsElement);


    const directionalLight = new THREE.DirectionalLight(0xEEEEEE, 1.0);
    directionalLight.position.set(100,100,60);
    scene.add(directionalLight);

    const ambientLight = new THREE.AmbientLight(0x979797,1.0);
    scene.add(ambientLight);



    const glbLoader = new THREE.GLTFLoader();


    glbLoader.load('./img/nagoyamae.glb', function(gltf){
        model = gltf.scene;
        model.traverse((object)=>{
            if(object.isMesh){
                object.scale.set(0.1,0.1,0.1);
            }
        });
        scene.add(model);
    }, undefined, function(e){
        console.error(e);
    });





    function tick(){
        //レンダリング
    
        renderer.render(scene,camera);
        requestAnimationFrame(tick);


    }


    tick();
    
</script>
