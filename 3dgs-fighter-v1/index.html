    async function loadGlbJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`${url} failed: ${response.status}`);
      }
      const buffer = await response.arrayBuffer();
      const view = new DataView(buffer);
      if (view.getUint32(0, true) !== 0x46546c67) {
        throw new Error("GLB magic header is missing.");
      }

      let offset = 12;
      let gltf = null;
      let binary = null;
      while (offset + 8 <= buffer.byteLength) {
        const length = view.getUint32(offset, true);
        const type = view.getUint32(offset + 4, true);
        const chunk = buffer.slice(offset + 8, offset + 8 + length);
        if (type === 0x4e4f534a) {
          gltf = JSON.parse(new TextDecoder().decode(chunk).trim());
        } else if (type === 0x004e4942) {
          binary = chunk;
        }
        offset += 8 + length;
      }
      if (!gltf || !binary) {
        throw new Error("GLB JSON or BIN chunk is missing.");
      }
      return { gltf, binary };
    }

    function readGlbAccessor(gltf, binary, accessorIndex) {
      const accessor = gltf.accessors[accessorIndex];
      const bufferView = gltf.bufferViews[accessor.bufferView];
      const componentCount = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT4: 16 }[accessor.type] ?? 1;
      const componentSize = accessor.componentType === 5126 ? 4 : accessor.componentType === 5123 ? 2 : 4;
      const stride = bufferView.byteStride ?? componentCount * componentSize;
      const start = (bufferView.byteOffset ?? 0) + (accessor.byteOffset ?? 0);
      const view = new DataView(binary, start, stride * accessor.count);
      const values = [];
      for (let i = 0; i < accessor.count; i++) {
        const item = [];
        for (let j = 0; j < componentCount; j++) {
          const byteOffset = i * stride + j * componentSize;
          if (accessor.componentType === 5126) {
            item.push(view.getFloat32(byteOffset, true));
          } else if (accessor.componentType === 5123) {
            item.push(view.getUint16(byteOffset, true));
          } else {
            item.push(view.getFloat32(byteOffset, true));
          }
        }
        values.push(componentCount === 1 ? item[0] : item);
      }
      return values;
    }

    function makeQuat(values) {
      return new BABYLON.Quaternion(values[0], values[1], values[2], values[3]);
    }

    function sampleGlbChannel(channel, time) {
      const times = channel.input;
      const values = channel.output;
      if (!times.length) {
        return values[0];
      }
      const duration = times[times.length - 1] || 1;
      const wrapped = ((time % duration) + duration) % duration;
      let index = 0;
      while (index < times.length - 2 && times[index + 1] < wrapped) {
        index += 1;
      }
      const next = Math.min(index + 1, times.length - 1);
      const span = Math.max(0.0001, times[next] - times[index]);
      const amount = BABYLON.Scalar.Clamp((wrapped - times[index]) / span, 0, 1);
      if (channel.path === "rotation") {
        return BABYLON.Quaternion.Slerp(makeQuat(values[index]), makeQuat(values[next]), amount);
      }
      const a = BABYLON.Vector3.FromArray(values[index]);
      const b = BABYLON.Vector3.FromArray(values[next]);
      return BABYLON.Vector3.Lerp(a, b, amount);
    }

    async function createGlbMotionDebug(url) {
      const { gltf, binary } = await loadGlbJson(url);
      const nodes = (gltf.nodes ?? []).map((node, index) => ({
        index,
        name: node.name ?? `node_${index}`,
        children: node.children ?? [],
        parent: null,
        translation: BABYLON.Vector3.FromArray(node.translation ?? [0, 0, 0]),
        rotation: makeQuat(node.rotation ?? [0, 0, 0, 1]),
        scale: BABYLON.Vector3.FromArray(node.scale ?? [1, 1, 1]),
        world: BABYLON.Matrix.Identity(),
        position: BABYLON.Vector3.Zero()
      }));
      nodes.forEach((node) => {
        node.children.forEach((childIndex) => {
          if (nodes[childIndex]) {
            nodes[childIndex].parent = node.index;
          }
        });
      });

      const channels = [];
      (gltf.animations?.[0]?.channels ?? []).forEach((channel) => {
        const sampler = gltf.animations[0].samplers[channel.sampler];
        channels.push({
          nodeIndex: channel.target.node,
          path: channel.target.path,
          input: readGlbAccessor(gltf, binary, sampler.input),
          output: readGlbAccessor(gltf, binary, sampler.output)
        });
      });
      const movingChannels = channels.filter((channel) => {
        const first = JSON.stringify(channel.output[0]);
        return channel.output.some((value) => JSON.stringify(value) !== first);
      }).length;

      const root = new BABYLON.TransformNode("mixamoJsonDebugRoot", scene);
      root.position.set(3.2, 0.06, 0);
      const marker = BABYLON.MeshBuilder.CreateBox("mixamoJsonDebugMarker", { width: 0.12, height: 0.12, depth: 0.12 }, scene);
      marker.parent = root;
      marker.material = mats.hit;
      const clock = BABYLON.MeshBuilder.CreateSphere("mixamoJsonDebugClock", { diameter: 0.09, segments: 10 }, scene);
      clock.parent = root;
      clock.position.set(-1.55, 2.55, 0);
      clock.material = mats.lane;
      clock.isPickable = false;

      const rotateByQuaternion = (vector, quaternion) => {
        const q = quaternion.normalize();
        const u = new BABYLON.Vector3(q.x, q.y, q.z);
        const s = q.w;
        const dotUV = BABYLON.Vector3.Dot(u, vector);
        const dotUU = BABYLON.Vector3.Dot(u, u);
        const crossUV = BABYLON.Vector3.Cross(u, vector);
        return u.scale(2 * dotUV)
          .add(vector.scale(s * s - dotUU))
          .add(crossUV.scale(2 * s));
      };

      const computePose = (time) => {
        nodes.forEach((node, index) => {
          const source = gltf.nodes[index];
          node.translation = BABYLON.Vector3.FromArray(source.translation ?? [0, 0, 0]);
          node.rotation = makeQuat(source.rotation ?? [0, 0, 0, 1]);
          node.scale = BABYLON.Vector3.FromArray(source.scale ?? [1, 1, 1]);
          node.worldRotation = node.rotation.clone();
          node.position = node.translation.clone();
        });
        channels.forEach((channel) => {
          const node = nodes[channel.nodeIndex];
          if (!node) {
            return;
          }
          if (!["translation", "rotation", "scale"].includes(channel.path)) {
            return;
          }
          const sampled = sampleGlbChannel(channel, time);
          if (channel.path === "translation") {
            node.translation = sampled;
          } else if (channel.path === "rotation") {
            node.rotation = sampled;
          } else if (channel.path === "scale") {
            node.scale = sampled;
          }
        });
        const updateNode = (node) => {
          if (node.parent !== null) {
            const parent = nodes[node.parent];
            node.position = parent.position.add(rotateByQuaternion(node.translation, parent.worldRotation));
            node.worldRotation = parent.worldRotation.multiply(node.rotation);
          } else {
            node.position = node.translation.clone();
            node.worldRotation = node.rotation.clone();
          }
          node.children.forEach((childIndex) => updateNode(nodes[childIndex]));
        };
        nodes.filter((node) => node.parent === null).forEach(updateNode);
      };

      computePose(0);
      const positions = nodes.map((node) => node.position);
      const min = positions.reduce((acc, pos) => BABYLON.Vector3.Minimize(acc, pos), positions[0].clone());
      const max = positions.reduce((acc, pos) => BABYLON.Vector3.Maximize(acc, pos), positions[0].clone());
      const size = max.subtract(min);
      const axes = [
        { name: "x", size: size.x },
        { name: "y", size: size.y },
        { name: "z", size: size.z }
      ].sort((a, b) => b.size - a.size);
      const upAxis = axes[0].name;
      const sideAxis = axes[1].name;
      const depthAxis = axes[2].name;
      const drawScale = 2.4 / Math.max(0.001, axes[0].size);
      const axisValue = (pos, axis) => axis === "x" ? pos.x : axis === "y" ? pos.y : pos.z;
      const anchorNode =
        nodes.find((node) => normalizeMixamoBoneName(node.name) === "hips") ??
        nodes.find((node) => normalizeMixamoBoneName(node.name).endsWith("hips")) ??
        nodes[0];
      const getFrameBounds = () => {
        const framePositions = nodes.map((node) => node.position);
        return {
          min: framePositions.reduce((acc, pos) => BABYLON.Vector3.Minimize(acc, pos), framePositions[0].clone()),
          max: framePositions.reduce((acc, pos) => BABYLON.Vector3.Maximize(acc, pos), framePositions[0].clone()),
          anchor: anchorNode.position
        };
      };
      const toDebugPoint = (pos, frameBounds = { min, max }) => new BABYLON.Vector3(
        (axisValue(pos, sideAxis) - axisValue(frameBounds.anchor ?? anchorNode.position, sideAxis)) * drawScale,
        (axisValue(pos, upAxis) - axisValue(frameBounds.min, upAxis)) * drawScale,
        (axisValue(pos, depthAxis) - axisValue(frameBounds.anchor ?? anchorNode.position, depthAxis)) * drawScale
      );

      const lineNodes = nodes.filter((node) => node.parent !== null);
      const initialFrameBounds = getFrameBounds();
      const lines = lineNodes.map((node) => {
        const mesh = BABYLON.MeshBuilder.CreateLines(
          `mixamoJsonBone_${node.name}`,
          { points: [toDebugPoint(nodes[node.parent].position, initialFrameBounds), toDebugPoint(node.position, initialFrameBounds)], updatable: true },
          scene
        );
        mesh.parent = root;
        mesh.color = new BABYLON.Color3(0.1, 0.9, 1);
        mesh.isPickable = false;
        return { node, mesh };
      });
      const jointMaterial = makeMaterial(
        "mixamoJointDebugMat",
        new BABYLON.Color3(0.1, 0.9, 1),
        new BABYLON.Color3(0.02, 0.35, 0.5)
      );
      const jointNodes = nodes.filter((node) => node.parent !== null && node.children.length);
      const joints = jointNodes.map((node) => {
        const sphere = BABYLON.MeshBuilder.CreateSphere(
          `mixamoJsonJoint_${node.name}`,
          { diameter: 0.055, segments: 8 },
          scene
        );
        sphere.parent = root;
        sphere.position.copyFrom(toDebugPoint(node.position, initialFrameBounds));
        sphere.material = jointMaterial;
        sphere.isPickable = false;
        return { node, sphere };
      });
      const normalizedNodes = new Map(nodes.map((node) => [normalizeMixamoBoneName(node.name), node]));
      const findMotionNode = (candidates) =>
        candidates.map((name) => normalizedNodes.get(name)).find(Boolean) ||
        [...normalizedNodes.entries()].find(([name]) => candidates.some((candidate) => name.endsWith(candidate)))?.[1];
      const partLookup = new Map(PARTS.map((part) => [part.id, part]));
      const partMarkers = Object.entries(MIXAMO_PART_BONES).map(([partId, candidates]) => {
        const node = findMotionNode(candidates);
        if (!node) {
          return null;
        }
        const part = partLookup.get(partId);
        const markerMat = makeMaterial(
          `mixamoPartMarker_${partId}`,
          part?.color ?? new BABYLON.Color3(1, 1, 1),
          part?.color?.scale(0.22) ?? new BABYLON.Color3(0.2, 0.2, 0.2)
        );
        const marker = BABYLON.MeshBuilder.CreateBox(
          `mixamoPartMarkerBox_${partId}`,
          { width: 0.11, height: 0.11, depth: 0.11 },
          scene
        );
        marker.parent = root;
        marker.position.copyFrom(toDebugPoint(node.position, initialFrameBounds));
        marker.material = markerMat;
        marker.isPickable = false;
        return { partId, node, marker, baseRotation: node.rotation.clone() };
      }).filter(Boolean);
      const partMarkerById = new Map(partMarkers.map((marker) => [marker.partId, marker]));

      return {
        mode: "jsonDebug",
        nodes,
        lines,
        joints,
        partMarkers,
        partMarkerById,
        root,
        frameBounds: initialFrameBounds,
        startedAt: performance.now() / 1000,
        resetClock() {
          this.startedAt = performance.now() / 1000;
        },
        update(time) {
          const localTime = time - this.startedAt;
          computePose(localTime);
          const frameBounds = getFrameBounds();
          this.frameBounds = frameBounds;
          this.lines.forEach(({ node, mesh }) => {
            BABYLON.MeshBuilder.CreateLines(null, {
              points: [toDebugPoint(nodes[node.parent].position, frameBounds), toDebugPoint(node.position, frameBounds)],
              instance: mesh
            });
          });
          this.joints.forEach(({ node, sphere }) => {
            sphere.position.copyFrom(toDebugPoint(node.position, frameBounds));
          });
          this.partMarkers.forEach(({ node, marker }) => {
            marker.position.copyFrom(toDebugPoint(node.position, frameBounds));
          });
          clock.position.x = -1.55 + (Math.sin(localTime * 4) * 0.25 + 0.25);
        },
        getPartPoint(partId) {
          const marker = this.partMarkerById.get(partId);
          return marker ? toDebugPoint(marker.node.position, this.frameBounds) : null;
        },
        dispose() {
          root.dispose(false, false);
        },
        summary: {
          nodes: nodes.length,
          channels: channels.length,
          movingChannels,
          parts: partMarkers.length,
          upAxis,
          sideAxis,
          depthAxis
        }
      };
    }

    function updateMixamoMotionDebug() {
      const motion = state.mixamo.current;
      if (!motion) {
        return;
      }
      if (motion.mode === "jsonDebug") {
        motion.update(performance.now() / 1000);
        return;
      }
      motion.skeleton.prepare();
      updateMixamoSkeletonDebug(motion.debug);
    }

    async function loadMixamoMotion(action) {
      const motionInfo = MIXAMO_MOTION_FILES[action] ?? MIXAMO_MOTION_FILES.idle;
      if (state.mixamo.loading) {
        return state.mixamo.current;
      }
      if (state.mixamo.currentKey === action && state.mixamo.current) {
        state.mixamo.current.resetClock?.();
        return state.mixamo.current;
      }
      const cached = state.mixamo.motions.get(action);
      if (cached) {
        state.mixamo.current?.root?.setEnabled(false);
        cached.root.setEnabled(true);
        cached.root.rotation.y = motionInfo.displayYaw ?? 0;
        cached.resetClock?.();
        state.mixamo.current = cached;
        state.mixamo.currentKey = action;
        setMessage(`${motionInfo.label} selected. ${cached.summary.movingChannels}/${cached.summary.channels} moving channels, ${cached.summary.parts}/18 parts.`);
        return cached;
      }

      state.mixamo.loading = true;
      state.mixamo.error = null;
      setMessage(`Loading ${motionInfo.file}...`);

      try {
        state.mixamo.current?.root?.setEnabled(false);
        const encodedFile = motionInfo.file.split("/").map(encodeURIComponent).join("/");
        const debug = await createGlbMotionDebug(`mixamo/${encodedFile}`);
        debug.root.rotation.y = motionInfo.displayYaw ?? 0;
        state.mixamo.current = debug;
        state.mixamo.currentKey = action;
        state.mixamo.motions.set(action, debug);
        state.mixamo.loading = false;
        setMessage(`${motionInfo.label} loaded. ${debug.summary.movingChannels}/${debug.summary.channels} moving channels, ${debug.summary.parts}/18 parts.`);
        console.log(`${motionInfo.file} JSON debug:`, debug.summary);
        return debug;
      } catch (error) {
        console.error(error);
        state.mixamo.loading = false;
        state.mixamo.error = error;
        state.mixamo.current = null;
        state.mixamo.currentKey = null;
        setMessage(`${motionInfo.file} could not load: ${error.message}`);
        return null;
      }
    }

    function ensureMixamoIdleMotion() {
      return loadMixamoMotion("idle");
    }

    const MIXAMO_PART_FOLLOW_TUNING = {
      hips: { x: 0.14, y: 0.12, z: 0.1, max: 0.1 },
      spine: { x: 0.16, y: 0.12, z: 0.1, max: 0.11 },
      spine1: { x: 0.18, y: 0.14, z: 0.11, max: 0.12 },
      spine2: { x: 0.22, y: 0.16, z: 0.12, max: 0.14 },
      neck: { x: 0.14, y: 0.1, z: 0.08, max: 0.07 },
      head: { x: 0.03, y: 0.025, z: 0.02, max: 0.025 },
      leftShoulder: { x: 0.18, y: 0.08, z: 0.18, max: 0.13 },
      rightShoulder: { x: 0.18, y: 0.08, z: 0.18, max: 0.13 },
      leftUpperArm: { x: 0.28, y: 0.1, z: 0.26, max: 0.22 },
      rightUpperArm: { x: 0.28, y: 0.1, z: 0.26, max: 0.22 },
      leftForearm: { x: 0.28, y: 0.1, z: 0.2, max: 0.2 },
      rightForearm: { x: 0.28, y: 0.1, z: 0.2, max: 0.2 },
      leftHand: { x: 0.14, y: 0.08, z: 0.12, max: 0.1 },
      rightHand: { x: 0.14, y: 0.08, z: 0.12, max: 0.1 },
      leftThigh: { x: 0.34, y: 0.1, z: 0.12, max: 0.24 },
      rightThigh: { x: 0.34, y: 0.1, z: 0.12, max: 0.24 },
      leftShin: { x: 0.32, y: 0.08, z: 0.08, max: 0.22 },
      rightShin: { x: 0.32, y: 0.08, z: 0.08, max: 0.22 },
      leftFoot: { x: 0.22, y: 0.08, z: 0.08, max: 0.14 },
      rightFoot: { x: 0.22, y: 0.08, z: 0.08, max: 0.14 }
    };

    const SPZ_RIG_CHILDREN = Object.entries(SPZ_RIG_PARENT).reduce((children, [partId, parentId]) => {
      if (parentId) {
        children[parentId] = children[parentId] ?? [];
        children[parentId].push(partId);
      }
      return children;
    }, {});

    function quaternionFromUnitVectors(from, to) {
      const vFrom = from.normalizeToNew();
      const vTo = to.normalizeToNew();
      const dot = BABYLON.Vector3.Dot(vFrom, vTo);
      if (dot < -0.999999) {
        const axis = Math.abs(vFrom.x) > 0.1
          ? BABYLON.Vector3.Cross(BABYLON.Axis.Y, vFrom)
          : BABYLON.Vector3.Cross(BABYLON.Axis.X, vFrom);
        axis.normalize();
        return BABYLON.Quaternion.RotationAxis(axis, Math.PI);
      }
      if (dot > 0.999999) {
        return BABYLON.Quaternion.Identity();
      }
      const cross = BABYLON.Vector3.Cross(vFrom, vTo);
      return new BABYLON.Quaternion(cross.x, cross.y, cross.z, 1 + dot).normalize();
    }

    function getSpzRigAimTarget(partId) {
      const children = SPZ_RIG_CHILDREN[partId];
      if (children?.length) {
        return children[0];
      }
      return SPZ_RIG_PARENT[partId] ?? null;
    }

    function forceSpzJointPositionsToMotion(fighter, motion) {
      const hips = fighter.parts.get("hips");
      const motionHips = motion.getPartPoint("hips");
      if (hips && motionHips) {
        hips.node.position.copyFrom(BABYLON.Vector3.Lerp(hips.node.position, motionHips, 0.68));
      }

      Object.entries(SPZ_RIG_PARENT).forEach(([partId, parentId]) => {
        if (!parentId) {
          return;
        }
        const part = fighter.parts.get(partId);
        const parentPart = fighter.parts.get(parentId);
        const motionPoint = motion.getPartPoint(partId);
        const parentMotionPoint = motion.getPartPoint(parentId);
        if (!part || !parentPart || !motionPoint || !parentMotionPoint) {
          return;
        }

        const forcedLocal = motionPoint.subtract(parentMotionPoint);
        part.node.position.copyFrom(BABYLON.Vector3.Lerp(part.node.position, forcedLocal, 0.68));
      });
    }

    function applyJsonMotionToSpzParts(fighter, motion) {
      if (!motion?.partMarkers?.length || !fighter.parts.size) {
        return false;
      }

      forceSpzJointPositionsToMotion(fighter, motion);
      let headMotionPoint = null;

      motion.partMarkers.forEach(({ partId, node, baseRotation }) => {
        const part = fighter.parts.get(partId);
        if (!part) {
          return;
        }
        if (partId === "head") {
          headMotionPoint = motion.getPartPoint("head");
          return;
        }
        const aimTargetId = getSpzRigAimTarget(partId);
        const targetPart = aimTargetId ? fighter.parts.get(aimTargetId) : null;
        const motionPoint = motion.getPartPoint(partId);
        const motionTargetPoint = aimTargetId ? motion.getPartPoint(aimTargetId) : null;
        if (targetPart && motionPoint && motionTargetPoint) {
          const hasChildTarget = SPZ_RIG_PARENT[aimTargetId] === partId;
          const restVector = hasChildTarget
            ? targetPart.restLocalPosition
            : part.restLocalPosition;
          const motionVector = hasChildTarget
            ? motionTargetPoint.subtract(motionPoint)
            : motionPoint.subtract(motionTargetPoint);
          if (restVector.lengthSquared() > 0.000001 && motionVector.lengthSquared() > 0.000001) {
            const directionRotation = quaternionFromUnitVectors(restVector, motionVector);
            const euler = directionRotation.toEulerAngles();
            const rotationGain = partId === "head" ? 0.12 : 1;
            const maxAngle = partId === "head" ? 0.08 : 0.9;
            setPartRotation(
              fighter,
              partId,
              clampMotion(euler.x * rotationGain, maxAngle),
              clampMotion(euler.y * state.frontSign * rotationGain, maxAngle),
              clampMotion(euler.z * rotationGain, maxAngle),
              0.24
            );
            return;
          }
        }

        const base = MIXAMO_IDLE_BASE_POSE[partId] ?? { x: 0, y: 0, z: 0 };
        const tuning = MIXAMO_PART_FOLLOW_TUNING[partId] ?? { x: 0.16, y: 0.08, z: 0.08, max: 0.1 };
        const delta = BABYLON.Quaternion.Inverse(baseRotation).multiply(node.rotation);
        const euler = delta.toEulerAngles();
        setPartRotation(
          fighter,
          partId,
          base.x + clampMotion(euler.x * tuning.x, tuning.max),
          base.y + clampMotion(euler.y * tuning.y * state.frontSign, tuning.max),
          base.z + clampMotion(euler.z * tuning.z, tuning.max),
          0.2
        );
      });

      const headPart = fighter.parts.get("head");
      if (headPart && headMotionPoint) {
        fighter.root.computeWorldMatrix(true);
        const headWorldPoint = BABYLON.Vector3.TransformCoordinates(headMotionPoint, fighter.root.getWorldMatrix());
        headPart.node.setAbsolutePosition(headWorldPoint);
        setNodeWorldRotation(headPart.node, getWorldRotationQuaternion(fighter.root), 0.45);
      }
      return true;
    }

    function applyMixamoIdle(fighter, time) {
      const motion = state.mixamo.current;
      if (!motion) {
        return false;
      }
      if (motion.mode === "jsonDebug") {
        return applyJsonMotionToSpzParts(fighter, motion);
      }

      motion.skeleton.prepare();
      updateMixamoSkeletonDebug(motion.debug);
      const scale = new BABYLON.Vector3();
      const rotation = new BABYLON.Quaternion();
      const position = new BABYLON.Vector3();
      motion.parts.forEach(({ bone, baseRotation }, partId) => {
        bone.getAbsoluteTransform().decompose(scale, rotation, position);
        const delta = BABYLON.Quaternion.Inverse(baseRotation).multiply(rotation);
        const euler = delta.toEulerAngles();
        const base = MIXAMO_IDLE_BASE_POSE[partId] ?? { x: 0, y: 0, z: 0 };
        const tuning = MIXAMO_IDLE_TUNING[partId] ?? { x: 0.08, y: 0.04, z: 0.04, max: 0.04 };
        setPartRotation(
          fighter,
          partId,
          base.x + clampMotion(euler.x * tuning.x * MIXAMO_IDLE_GAIN, tuning.max),
          base.y + clampMotion(euler.y * tuning.y * state.frontSign * MIXAMO_IDLE_GAIN, tuning.max),
          base.z + clampMotion(euler.z * tuning.z * MIXAMO_IDLE_GAIN, tuning.max),
          0.16
        );
      });

      Object.entries(MIXAMO_IDLE_BASE_POSE).forEach(([partId, base]) => {
        if (!motion.parts.has(partId)) {
          setPartRotation(fighter, partId, base.x, base.y, base.z, 0.16);
        }
      });
      return true;
    }

    function animatePlayerParts(fighter, deltaSeconds) {
      const time = performance.now() / 1000;
      const idle = fighter.action === "ready" || fighter.action === "idle" ? 1 : 0;
      const walkForward = fighter.action === "walkForward" ? 1 : 0;
      const jogBack = fighter.action === "jogBack" ? 1 : 0;
      const walkCycle = Math.sin(time * 7.5) * walkForward;
      const backCycle = Math.sin(time * 10.5) * jogBack;
      const stride = walkCycle + backCycle * 0.62;
      const idleBob = Math.sin(time * 3.2) * idle;
      const front = state.frontSign;

      const selectedMixamoMotion = state.mode === "test" && state.mixamo.current?.mode === "jsonDebug";
      if ((idle || selectedMixamoMotion) && applyMixamoIdle(fighter, time)) {
        fighter.parts.forEach((part) => {
          part.box.visibility = ui.boxesToggle.checked ? 1 : 0;
        });
        if (fighter.visual && fighter.visual !== fighter.root) {
          fighter.visual.position.y = idleBob * 0.014;
        }
        fighter.shadow.scaling.x = 1 + Math.max(0, fighter.root.position.y) * 0.16;
        fighter.shadow.scaling.z = 0.48 + Math.max(0, fighter.root.position.y) * 0.06;
        return;
      }

      setPartRotation(fighter, "hips", jogBack * -0.08, -stride * front * 0.04, 0);
      setPartRotation(fighter, "spine", idleBob * 0.012 + jogBack * 0.03, stride * front * 0.04, 0);
      setPartRotation(fighter, "spine1", idleBob * 0.018 + jogBack * 0.04, stride * front * 0.05, 0);
      setPartRotation(fighter, "spine2", idleBob * 0.024 + jogBack * 0.05, stride * front * 0.06, 0);
      setPartRotation(fighter, "neck", idleBob * 0.02, stride * front * 0.03, 0);
      setPartRotation(fighter, "head", idleBob * 0.025, stride * front * 0.025, 0);
      setPartRotation(fighter, "leftShoulder", -walkCycle * 0.16 + backCycle * 0.08, 0, stride * 0.06);
      setPartRotation(fighter, "leftUpperArm", -walkCycle * 0.34 + backCycle * 0.18, 0, stride * 0.18);
      setPartRotation(fighter, "leftForearm", -walkCycle * 0.2 + backCycle * 0.12, 0, stride * 0.08);
      setPartRotation(fighter, "leftHand", -walkCycle * 0.08 + backCycle * 0.04, 0, 0);
      setPartRotation(fighter, "rightShoulder", walkCycle * 0.16 - backCycle * 0.08, 0, -stride * 0.06);
      setPartRotation(fighter, "rightUpperArm", walkCycle * 0.34 - backCycle * 0.18, 0, -stride * 0.18);
      setPartRotation(fighter, "rightForearm", walkCycle * 0.2 - backCycle * 0.12, 0, -stride * 0.08);
      setPartRotation(fighter, "rightHand", walkCycle * 0.08 - backCycle * 0.04, 0, 0);
      setPartRotation(fighter, "leftThigh", walkCycle * 0.42 - backCycle * 0.26, 0, 0);
      setPartRotation(fighter, "leftShin", Math.max(-walkCycle, 0) * 0.48 + backCycle * 0.18, 0, 0);
      setPartRotation(fighter, "leftFoot", -Math.max(walkCycle, 0) * 0.24 + Math.max(-walkCycle, 0) * 0.16 - backCycle * 0.12, 0, 0);
      setPartRotation(fighter, "rightThigh", -walkCycle * 0.42 + backCycle * 0.26, 0, 0);
      setPartRotation(fighter, "rightShin", Math.max(walkCycle, 0) * 0.48 - backCycle * 0.18, 0, 0);
      setPartRotation(fighter, "rightFoot", -Math.max(-walkCycle, 0) * 0.24 + Math.max(walkCycle, 0) * 0.16 + backCycle * 0.12, 0, 0);

      fighter.parts.forEach((part) => {
        part.node.position.copyFrom(part.restLocalPosition ?? part.node.position);
        part.box.visibility = ui.boxesToggle.checked ? 1 : 0;
      });
      if (fighter.visual && fighter.visual !== fighter.root) {
        fighter.visual.position.y = idleBob * 0.018 + Math.max(0, Math.abs(stride)) * 0.022;
      }

      fighter.shadow.scaling.x = 1 + Math.max(0, fighter.root.position.y) * 0.16;
      fighter.shadow.scaling.z = 0.48 + Math.max(0, fighter.root.position.y) * 0.06;
    }

    function animateFallbackFighter(fighter, deltaSeconds) {
      const time = performance.now() / 1000;
      const bob = fighter.action === "walk" ? Math.sin(time * 16) * 0.07 : Math.sin(time * 5) * 0.025;
      const lean =
        fighter.action === "punch" ? -fighter.facing * 0.18 :
        fighter.action === "kick" ? -fighter.facing * 0.28 :
        fighter.action === "hit" ? fighter.facing * 0.22 :
        fighter.action === "guard" ? fighter.facing * 0.12 : 0;
      if (fighter.visual && fighter.visual !== fighter.root) {
        fighter.visual.position.y = Math.max(0, bob);
        fighter.visual.rotation.z = BABYLON.Scalar.Lerp(fighter.visual.rotation.z, lean, 0.24);
        fighter.visual.rotation.x = BABYLON.Scalar.Lerp(fighter.visual.rotation.x, fighter.action === "down" ? Math.PI / 2 : 0, 0.18);
      }
      fighter.shadow.scaling.x = 1 + Math.max(0, fighter.root.position.y) * 0.16;
      fighter.shadow.scaling.z = 0.48 + Math.max(0, fighter.root.position.y) * 0.06;
    }

    function animateFighter(fighter, deltaSeconds) {
      fighter.actionTime = Math.max(0, fighter.actionTime - deltaSeconds);
      fighter.hitCooldown = Math.max(0, fighter.hitCooldown - deltaSeconds);
      if (fighter.actionTime <= 0 && fighter.action !== "down" && fighter.action !== "win") {
        fighter.action = fighter.guard ? "guard" : "ready";
      }
      if (fighter.parts.size) {
        animatePlayerParts(fighter, deltaSeconds);
      } else {
        animateFallbackFighter(fighter, deltaSeconds);
      }
    }

    function updatePhysics(fighter, deltaSeconds) {
      fighter.vy -= 16.5 * deltaSeconds;
      fighter.root.position.x += fighter.vx * deltaSeconds;
      fighter.root.position.y += fighter.vy * deltaSeconds;
      fighter.vx *= Math.pow(0.18, deltaSeconds);
      clampFighter(fighter);
    }

    function updateCamera() {
      if (state.mode === "test" || state.mode === "select") {
        camera.target = BABYLON.Vector3.Lerp(camera.target, new BABYLON.Vector3(state.p1.root.position.x, 1.55, 0), 0.08);
        camera.radius = BABYLON.Scalar.Lerp(camera.radius, 14.5, 0.06);
        return;
      }
      const mid = state.p1.root.position.add(state.p2.root.position).scale(0.5);
      const distance = Math.abs(state.p1.root.position.x - state.p2.root.position.x);
      camera.target = BABYLON.Vector3.Lerp(camera.target, new BABYLON.Vector3(mid.x, 1.8, 0), 0.08);
      camera.radius = BABYLON.Scalar.Lerp(camera.radius, BABYLON.Scalar.Clamp(13 + distance * 0.9, 15, 24), 0.06);
    }

    function gameLoop() {
      const dt = Math.min(engine.getDeltaTime() / 1000, 0.04);
      updateMixamoMotionDebug();
      if (state.mode === "test") {
        updatePlayer(dt);
        updatePhysics(state.p1, dt);
      } else if (state.roundActive) {
        state.roundTime = Math.max(0, state.roundTime - dt);
        if (state.roundTime <= 0) {
          if (state.p1.hp === state.p2.hp) {
            endRound("Time over. Draw.");
          } else {
            endRound(state.p1.hp > state.p2.hp ? "Time over. Player 1 wins." : "Time over. Rival wins.");
          }
        }
        updatePlayer(dt);
        updateAi(dt);
        updatePhysics(state.p1, dt);
        updatePhysics(state.p2, dt);
        setFacing();
        if (["punch", "kick", "special"].includes(state.p1.action)) {
          tryHit(state.p1, state.p2, state.p1.action);
        }
        if (state.p2.action === "punch" || state.p2.action === "kick") {
          tryHit(state.p2, state.p1, state.p2.action);
        }
      }
      animateFighter(state.p1, dt);
      if (state.p2.root.isEnabled()) {
        animateFighter(state.p2, dt);
      }
      updateSpzRigDebug(state.p1);
      updateCamera();
      state.flashTime = Math.max(0, state.flashTime - dt);
      if (state.flashTime <= 0) {
        ui.flash.classList.remove("isActive");
      }
      updateHud();
    }

    function initialize() {
      createStage();
      renderPartToggles();
      state.p1 = createFighter("p1", -3.2, 1, null, mats.blue);
      state.p2 = createFighter("p2", 3.2, -1, null, mats.red);
      prepareCharacterPreview();
      ui.startFightButton.disabled = false;
      setSelectStatus("SPZ optional. Press Motion Test to check Fighting Idle.glb only.");
      setMessage("Press Motion Test to check Fighting Idle.glb, or load a SPZ character.");
    }

    window.addEventListener("keydown", (event) => {
      keys.add(event.code);
      if (event.code === "KeyI") {
        loadMixamoMotion("idle");
        startAction(state.p1, "idle");
      }
      if (event.code === "KeyB") {
        loadMixamoMotion("jogBack");
        startAction(state.p1, "jogBack");
      }
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    ui.splatFile.addEventListener("change", () => {
      const file = ui.splatFile.files[0];
      if (file) {
        ui.selectScreen.classList.remove("isHidden");
        loadSplatSource(file, file.name);
      }
    });

    ui.selectSplatFile.addEventListener("change", () => {
      const file = ui.selectSplatFile.files[0];
      if (file) {
        loadSplatSource(file, file.name);
      }
    });

    ui.scaleInput.addEventListener("input", () => {
      ui.scaleValue.textContent = ui.scaleInput.value;
    });

    ui.scaleInput.addEventListener("change", () => {
      if (state.splatSource) {
        ui.selectScreen.classList.remove("isHidden");
        loadSplatSource(state.splatSource, state.sourceName);
      }
    });

    ui.boxesToggle.addEventListener("change", () => {
      state.p1.parts.forEach((part) => {
        part.box.visibility = ui.boxesToggle.checked ? 1 : 0;
      });
    });

    ui.partsToggles.addEventListener("change", (event) => {
      const partId = event.target?.dataset?.partId;
      if (!partId) {
        return;
      }
      if (event.target.checked) {
        state.visibleParts.add(partId);
      } else {
        state.visibleParts.delete(partId);
      }
      applyPartVisibility();
    });

    ui.sampleButton.addEventListener("click", () => {
      ui.selectScreen.classList.remove("isHidden");
      loadSplatSource(SAMPLE_SPZ_URL, "asahi2_f.spz");
    });

    ui.selectSampleButton.addEventListener("click", () => {
      loadSplatSource(SAMPLE_SPZ_URL, "asahi2_f.spz");
    });

    ui.frontSelect.addEventListener("change", () => {
      if (state.splatSource) {
        loadSplatSource(state.splatSource, state.sourceName);
      }
    });

    ui.remapButton.addEventListener("click", () => {
      if (state.splatSource) {
        loadSplatSource(state.splatSource, state.sourceName);
      } else {
        setSelectStatus("Load a SPZ character first.");
      }
    });

    ui.idleButton.addEventListener("click", () => {
      loadMixamoMotion("idle");
      startAction(state.p1, "idle");
    });

    ui.walkButton.addEventListener("click", () => {
      loadMixamoMotion("walkForward");
      startAction(state.p1, "walkForward");
    });

    ui.backButton.addEventListener("click", () => {
      loadMixamoMotion("jogBack");
      startAction(state.p1, "jogBack");
    });

    ui.startFightButton.addEventListener("click", startFight);

    ui.reselectButton.addEventListener("click", () => {
      if (state.characterReady) {
        prepareCharacterPreview();
        setSelectStatus(`${state.sourceName} ready.`);
      } else {
        setSelectStatus("No character loaded.");
      }
    });

    ui.resetButton.addEventListener("click", () => {
      if (state.mode === "test") {
        resetMotionTest(true);
      } else if (state.mode === "fight") {
        resetRound(true);
      } else {
        returnToCharacterSelect();
      }
    });

    initialize();

    scene.onBeforeRenderObservable.add(gameLoop);
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
