<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebXR Moon / Move</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
        }

        #renderCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .page-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 8px 10px;
            color: #e9f1ff;
            text-decoration: none;
            background: rgba(10, 14, 24, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            font-size: 13px;
        }

        .page-link:focus-visible,
        .page-link:hover {
            background: rgba(38, 62, 92, 0.84);
            outline: none;
        }

        .status {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 10;
            max-width: min(320px, calc(100% - 24px));
            padding: 8px 10px;
            color: #e9f1ff;
            background: rgba(10, 14, 24, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            font-size: 12px;
        }

        .status:empty {
            display: none;
        }

        .motion-button {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 11;
            display: none;
            width: 56px;
            height: 56px;
            color: #e9f1ff;
            background: rgba(10, 14, 24, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
        }

        .motion-button.is-visible {
            display: block;
        }

        .motion-button:focus-visible,
        .motion-button:hover {
            background: rgba(38, 62, 92, 0.9);
            outline: none;
        }
    </style>
</head>
<body>
    <a class="page-link" href="./index.html">サンプル一覧へ</a>
    <div class="status" id="status">Loading 3D scene...</div>
    <button class="motion-button" id="motionButton" type="button" aria-label="Use phone motion to move the camera">MOVE</button>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const statusPanel = document.getElementById("status");
        const motionButton = document.getElementById("motionButton");
        const engine = new BABYLON.Engine(canvas, true, {
            preserveDrawingBuffer: true,
            stencil: true
        });
        let skyboxMesh = null;
        let activeScene = null;
        let activeCamera = null;
        let normalCamera = null;
        let motionCamera = null;
        let motionModeEnabled = false;
        let motionReference = null;
        let motionBase = null;
        let accelerationReference = null;
        let motionVelocity = new BABYLON.Vector3(0, 0, 0);
        let lastMotionTime = null;

        const DEG = Math.PI / 180;
        const zoom = 2;
        const earthDistance = 12 / zoom;
        const moonDistance = 2 / zoom;
        const sunRadius = 4 / zoom;
        const earthRadius = 1 / zoom;
        const moonRadius = 0.3 / zoom;
        const moonShadowHeight = 6 / zoom;
        const moveSensitivity = 4.2;
        const moveDamping = 0.9;
        const moveDeadZone = 0.06;

        const spaceImages = [
            "https://raw.githubusercontent.com/ykoba079/sample1/master/nif/img/mat_space_4.jpg",
            "https://raw.githubusercontent.com/ykoba079/sample1/master/nif/img/mat_space_5.jpg",
            "https://raw.githubusercontent.com/ykoba079/sample1/master/nif/img/mat_space_3.jpg",
            "https://raw.githubusercontent.com/ykoba079/sample1/master/nif/img/mat_space_2.jpg",
            "https://raw.githubusercontent.com/ykoba079/sample1/master/nif/img/mat_space_5.jpg",
            "https://raw.githubusercontent.com/ykoba079/sample1/master/nif/img/mat_space_1.jpg"
        ];

        function rotateX(position, origin, degrees) {
            const y = position.y - origin.y;
            const z = position.z - origin.z;

            position.y = y * Math.cos(DEG * degrees) - z * Math.sin(DEG * degrees) + origin.y;
            position.z = y * Math.sin(DEG * degrees) + z * Math.cos(DEG * degrees) + origin.z;
        }

        function createSkybox(scene) {
            const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 1000 }, scene);
            const skyboxMaterial = new BABYLON.BackgroundMaterial("skyBoxMaterial", scene);
            const skyboxTexture = BABYLON.CubeTexture.CreateFromImages(spaceImages, scene);

            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.reflectionTexture = skyboxTexture;
            skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
            skyboxTexture.useRGBColor = false;
            skybox.material = skyboxMaterial;
            skyboxMesh = skybox;
        }

        function setStatus(message) {
            statusPanel.textContent = message;
        }

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        }

        function setupWebXR(scene) {
            if (isIOS()) {
                setStatus("");
                return;
            }

            if (!window.isSecureContext || !navigator.xr) {
                setStatus("");
                return;
            }

            const xrTimeout = new Promise((_, reject) => {
                window.setTimeout(() => reject(new Error("WebXR initialization timed out")), 4000);
            });

            Promise.race([
                BABYLON.WebXRDefaultExperience.CreateAsync(scene),
                xrTimeout
            ]).then((xr) => {
                setStatus("");
                xr.input.onControllerAddedObservable.add((controller) => {
                    controller.onMotionControllerInitObservable.add((motionController) => {
                        motionController.onTriggerStateChangedObservable.add((state) => {
                            if (state.pressed) {
                                console.log("VR controller trigger pressed");
                            }
                        });
                    });
                });
            }).catch((error) => {
                console.warn("WebXR is unavailable. Showing the normal 3D view.", error);
                setStatus("");
            });
        }

        async function requestDeviceOrientationPermission() {
            let orientationAllowed = true;
            let motionAllowed = true;

            if (typeof DeviceOrientationEvent === "undefined" ||
                typeof DeviceOrientationEvent.requestPermission !== "function") {
                orientationAllowed = true;
            } else {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    orientationAllowed = permission === "granted";
                } catch (error) {
                    console.warn("Device orientation permission request failed.", error);
                    orientationAllowed = false;
                }
            }

            if (typeof DeviceMotionEvent !== "undefined" &&
                typeof DeviceMotionEvent.requestPermission === "function") {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    motionAllowed = permission === "granted";
                } catch (error) {
                    console.warn("Device motion permission request failed.", error);
                    motionAllowed = false;
                }
            }

            return orientationAllowed && motionAllowed;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function angleDeltaDegrees(current, reference) {
            return ((current - reference + 540) % 360) - 180;
        }

        function getDeviceHeading(event) {
            if (typeof event.webkitCompassHeading === "number") {
                return 360 - event.webkitCompassHeading;
            }
            return event.alpha || 0;
        }

        function onDeviceOrientation(event) {
            if (!motionModeEnabled || !motionCamera ||
                (event.alpha === null && event.beta === null && event.gamma === null)) {
                return;
            }

            const heading = getDeviceHeading(event);
            const beta = event.beta || 0;
            const gamma = event.gamma || 0;

            if (!motionReference) {
                motionReference = {
                    alpha: heading,
                    beta,
                    gamma
                };
                motionBase = {
                    x: motionCamera.rotation.x,
                    y: motionCamera.rotation.y,
                    z: motionCamera.rotation.z
                };
            }

            const yawDelta = angleDeltaDegrees(heading, motionReference.alpha) * DEG;
            const pitchDelta = (beta - motionReference.beta) * DEG * 0.9;
            const rollDelta = (gamma - motionReference.gamma) * DEG * 0.25;

            motionCamera.rotation.x = clamp(motionBase.x + pitchDelta, -1.35, 1.35);
            motionCamera.rotation.y = motionBase.y - yawDelta;
            motionCamera.rotation.z = motionBase.z + rollDelta;
        }

        function onDeviceMotion(event) {
            if (!motionModeEnabled || !motionCamera) {
                return;
            }

            const raw = event.acceleration || event.accelerationIncludingGravity;
            if (!raw || raw.x === null || raw.y === null || raw.z === null) {
                return;
            }

            const now = performance.now();
            if (lastMotionTime === null) {
                lastMotionTime = now;
                accelerationReference = {
                    x: raw.x || 0,
                    y: raw.y || 0,
                    z: raw.z || 0
                };
                return;
            }

            const dt = Math.min((now - lastMotionTime) / 1000, 0.05);
            lastMotionTime = now;

            const ax = (raw.x || 0) - accelerationReference.x;
            const ay = (raw.y || 0) - accelerationReference.y;
            const az = (raw.z || 0) - accelerationReference.z;
            const filtered = new BABYLON.Vector3(
                Math.abs(ax) < moveDeadZone ? 0 : ax,
                Math.abs(ay) < moveDeadZone ? 0 : ay,
                Math.abs(az) < moveDeadZone ? 0 : az
            );

            const right = motionCamera.getDirection(BABYLON.Axis.X);
            const up = motionCamera.getDirection(BABYLON.Axis.Y);
            const forward = motionCamera.getDirection(BABYLON.Axis.Z);
            const impulse = right.scale(filtered.x)
                .add(up.scale(-filtered.y * 0.75))
                .add(forward.scale(-filtered.z));

            motionVelocity.addInPlace(impulse.scale(dt * moveSensitivity));
            motionVelocity.scaleInPlace(moveDamping);

            if (motionVelocity.length() < 0.002) {
                return;
            }

            motionCamera.position.addInPlace(motionVelocity.scale(dt * 8));

            const distanceFromSun = motionCamera.position.length();
            if (distanceFromSun < 1.8) {
                motionCamera.position.normalize().scaleInPlace(1.8);
                motionVelocity.scaleInPlace(0.2);
            } else if (distanceFromSun > 22) {
                motionCamera.position.normalize().scaleInPlace(22);
                motionVelocity.scaleInPlace(0.2);
            }
        }

        async function enableMotionView() {
            const orientationAllowed = await requestDeviceOrientationPermission();
            if (!orientationAllowed) {
                setStatus("Motion sensor permission was not granted.");
                return;
            }

            if (!activeScene || !normalCamera) {
                return;
            }

            motionCamera = new BABYLON.UniversalCamera("motionCamera", normalCamera.position.clone(), activeScene);
            motionCamera.minZ = 0.1;
            motionCamera.speed = 0.12;
            motionCamera.angularSensibility = 6000;
            motionCamera.setTarget(BABYLON.Vector3.Zero());
            normalCamera.detachControl(canvas);
            activeScene.activeCamera = motionCamera;
            activeCamera = motionCamera;
            motionCamera.attachControl(canvas, true);

            motionModeEnabled = true;
            motionReference = null;
            motionBase = null;
            accelerationReference = null;
            motionVelocity = new BABYLON.Vector3(0, 0, 0);
            lastMotionTime = null;
            window.addEventListener("deviceorientation", onDeviceOrientation, true);
            window.addEventListener("devicemotion", onDeviceMotion, true);
            motionButton.textContent = "3D";
            motionButton.setAttribute("aria-label", "Return to touch camera control");
            setStatus("");
        }

        function disableMotionView() {
            motionModeEnabled = false;
            motionReference = null;
            motionBase = null;
            accelerationReference = null;
            motionVelocity = new BABYLON.Vector3(0, 0, 0);
            lastMotionTime = null;
            window.removeEventListener("deviceorientation", onDeviceOrientation, true);
            window.removeEventListener("devicemotion", onDeviceMotion, true);

            if (activeScene && motionCamera) {
                motionCamera.detachControl(canvas);
                activeScene.activeCamera = normalCamera;
                activeCamera = normalCamera;
                normalCamera.attachControl(canvas, true);
                motionCamera.dispose();
                motionCamera = null;
            }

            motionButton.textContent = "MOVE";
            motionButton.setAttribute("aria-label", "Use phone motion to move the camera");
            setStatus("");
        }

        function showMotionButton() {
            motionButton.classList.add("is-visible");

            motionButton.addEventListener("click", async () => {
                try {
                    if (motionModeEnabled) {
                        disableMotionView();
                        return;
                    }
                    await enableMotionView();
                } catch (error) {
                    console.warn("Motion view is unavailable.", error);
                    disableMotionView();
                    setStatus(`Motion view is unavailable: ${error.message}`);
                }
            });
        }

        function createMoonShadow(scene) {
            const moonShadow = BABYLON.MeshBuilder.CreateCylinder("moonShadow", {
                height: moonShadowHeight,
                diameterTop: 0,
                diameterBottom: moonRadius,
                updatable: true,
                tessellation: 64
            }, scene);

            const positions = moonShadow.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            const vertexCount = positions.length / 3;

            for (let i = 0; i < vertexCount; i += 1) {
                positions[i * 3 + 1] += moonShadowHeight / 2;
            }

            moonShadow.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);

            const material = new BABYLON.StandardMaterial("moonShadowMaterial", scene);
            material.emissiveColor = new BABYLON.Color3(1, 0, 0);
            material.alpha = 0.4;

            moonShadow.material = material;
            moonShadow.renderingGroupId = 3;
            return moonShadow;
        }

        function createScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                Math.PI / 2,
                Math.PI / 4,
                6,
                BABYLON.Vector3.Zero(),
                scene
            );
            camera.attachControl(canvas, true);
            camera.wheelDeltaPercentage = 0.004;
            camera.minZ = 0.1;
            scene.activeCamera = camera;
            activeCamera = camera;
            normalCamera = camera;

            createSkybox(scene);

            const sun = BABYLON.MeshBuilder.CreateSphere("sun", { diameter: sunRadius, segments: 32 }, scene);
            const earth = BABYLON.MeshBuilder.CreateSphere("earth", { diameter: earthRadius, segments: 32 }, scene);
            const moon = BABYLON.MeshBuilder.CreateSphere("moon", { diameter: moonRadius, segments: 64 }, scene);

            const light = new BABYLON.PointLight("pointLight", new BABYLON.Vector3(0, 0, 0), scene);
            light.intensity = 10.0;

            BABYLON.ParticleHelper.CreateAsync("sun", scene).then((set) => {
                set.systems[0].particleEmitterType.radius = sunRadius / zoom;
                set.systems[1].particleEmitterType.radius = sunRadius / zoom;
                set.systems[2].particleEmitterType.radius = sunRadius / zoom;
                set.systems[0].maxSize = 1 / zoom;
                set.systems[2].maxSize = 1 / zoom;
                set.systems[1].maxScaleX = sunRadius / zoom;
                set.systems[1].maxScaleY = sunRadius / zoom;
                set.start();
            });

            const sunMaterial = new BABYLON.StandardMaterial("sunMaterial", scene);
            sunMaterial.diffuseColor = new BABYLON.Color3(0.3773, 0.0930, 0.0266);
            sunMaterial.emissiveColor = new BABYLON.Color3(0.3773, 0.0930, 0.0266);
            sun.material = sunMaterial;
            sun.renderingGroupId = 3;

            const earthMaterial = new BABYLON.StandardMaterial("earthMaterial", scene);
            earthMaterial.diffuseTexture = new BABYLON.Texture("https://raw.githubusercontent.com/ykoba079/sample1/master/image/babyBook15/earthTecture1k.jpg", scene);
            earthMaterial.diffuseTexture.vScale = -1;
            earthMaterial.diffuseTexture.uScale = -1;
            earthMaterial.bumpTexture = new BABYLON.Texture("https://raw.githubusercontent.com/ykoba079/sample1/master/image/babyBook15/earthNormalMap.jpg", scene);
            earthMaterial.bumpTexture.vScale = -1;
            earthMaterial.bumpTexture.uScale = -1;
            earthMaterial.invertNormalMapX = true;
            earthMaterial.invertNormalMapY = true;
            earthMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            earth.material = earthMaterial;
            earth.renderingGroupId = 3;

            const moonMaterial = new BABYLON.StandardMaterial("moonMaterial", scene);
            moonMaterial.diffuseTexture = new BABYLON.Texture("https://raw.githubusercontent.com/ykoba079/sample1/master/image/babyBook15/moon1k.jpg", scene);
            moonMaterial.diffuseTexture.vScale = -1;
            moonMaterial.diffuseTexture.uScale = -1;
            moonMaterial.bumpTexture = new BABYLON.Texture("https://raw.githubusercontent.com/ykoba079/sample1/master/image/babyBook15/moonNormalMap.jpg", scene);
            moonMaterial.bumpTexture.vScale = -1;
            moonMaterial.bumpTexture.uScale = -1;
            moonMaterial.invertNormalMapX = true;
            moonMaterial.invertNormalMapY = true;
            moonMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            moon.material = moonMaterial;
            moon.renderingGroupId = 3;

            const moonShadow = createMoonShadow(scene);
            const earthOrbitA = BABYLON.Curve3.ArcThru3Points(
                new BABYLON.Vector3(0, 0, earthDistance),
                new BABYLON.Vector3(earthDistance, 0, 0),
                new BABYLON.Vector3(0, 0, -earthDistance)
            );
            BABYLON.MeshBuilder.CreateLines("earthOrbitA", { points: earthOrbitA.getPoints() }, scene);

            const earthOrbitB = BABYLON.Curve3.ArcThru3Points(
                new BABYLON.Vector3(0, 0, -earthDistance),
                new BABYLON.Vector3(-earthDistance, 0, 0),
                new BABYLON.Vector3(0, 0, earthDistance)
            );
            BABYLON.MeshBuilder.CreateLines("earthOrbitB", { points: earthOrbitB.getPoints() }, scene);

            const earthClones = [];
            const moonClones = [];
            const shadowClones = [];

            for (let i = 0; i <= 12; i += 1) {
                earthClones.push(earth.clone(`earth${i}`));
                moonClones.push(moon.clone(`moon${i}`));
                shadowClones.push(moonShadow.clone(`moonShadow${i}`));
            }

            let earthAngle = 0;
            for (const earthClone of earthClones) {
                earthAngle += 30;
                earthClone.position.x = Math.sin(DEG * earthAngle) * earthDistance;
                earthClone.position.z = Math.cos(DEG * earthAngle) * earthDistance;
            }

            let moonAngle = 180;
            for (let i = 0; i <= 12; i += 1) {
                moonAngle += 30;

                moonClones[i].position.x = Math.sin(DEG * moonAngle) * moonDistance + earthClones[i].position.x;
                moonClones[i].position.z = Math.cos(DEG * moonAngle) * moonDistance + earthClones[i].position.z;
                rotateX(moonClones[i].position, earthClones[i].position, 25);

                shadowClones[i].position.copyFrom(moonClones[i].position);

                const direction = sun.position.subtract(moonClones[i].position);
                direction.normalize();
                shadowClones[i].rotationQuaternion = BABYLON.Quaternion.FromUnitVectorsToRef(
                    new BABYLON.Vector3(0, -1, 0),
                    direction,
                    new BABYLON.Quaternion()
                );

                const moonOrbitA = new BABYLON.Vector3(
                    earthClones[i].position.x - moonDistance,
                    earthClones[i].position.y,
                    earthClones[i].position.z
                );
                const moonOrbitB = new BABYLON.Vector3(
                    earthClones[i].position.x,
                    earthClones[i].position.y,
                    earthClones[i].position.z - moonDistance
                );
                const moonOrbitC = new BABYLON.Vector3(
                    earthClones[i].position.x + moonDistance,
                    earthClones[i].position.y,
                    earthClones[i].position.z
                );
                const moonOrbitD = new BABYLON.Vector3(
                    earthClones[i].position.x,
                    earthClones[i].position.y,
                    earthClones[i].position.z + moonDistance
                );

                rotateX(moonOrbitB, earthClones[i].position, 25);
                rotateX(moonOrbitD, earthClones[i].position, 25);

                const localMoonOrbitA = BABYLON.Curve3.ArcThru3Points(moonOrbitA, moonOrbitB, moonOrbitC);
                BABYLON.MeshBuilder.CreateLines(`moonOrbitA${i}`, { points: localMoonOrbitA.getPoints() }, scene);

                const localMoonOrbitB = BABYLON.Curve3.ArcThru3Points(moonOrbitC, moonOrbitD, moonOrbitA);
                BABYLON.MeshBuilder.CreateLines(`moonOrbitB${i}`, { points: localMoonOrbitB.getPoints() }, scene);
            }

            earth.setEnabled(false);
            moon.setEnabled(false);
            moonShadow.setEnabled(false);

            activeScene = scene;
            setupWebXR(scene);
            if (isIOS() || !navigator.xr) {
                showMotionButton();
            }

            return scene;
        }

        try {
            const sceneToRender = createScene();
            setStatus("");
            engine.runRenderLoop(() => {
                sceneToRender.render();
            });
        } catch (error) {
            console.error(error);
            setStatus(`3D scene failed to start: ${error.message}`);
        }

        window.addEventListener("resize", () => {
            engine.resize();
        });

        window.addEventListener("pagehide", () => {
            disableMotionView();
        });
    </script>
</body>
</html>
