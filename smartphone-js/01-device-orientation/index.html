<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061315">
  <meta name="description" content="スマートフォンを傾けて3D迷路のボールを操作するJavaScriptデモです。">
  <title>スマホ傾き迷路 | スマホ × JavaScript #01</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.babylonjs.com/babylon.js"></script>
  <script defer src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
  <script defer src="./sensor-controller.js"></script>
  <script defer src="./ball-scene.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="game-shell">
    <section class="sensor-panel" aria-label="端末姿勢センサーと操作">
      <div class="sensor-heading">
        <span class="sensor-label">DEVICE ORIENTATION</span>
        <div class="status-chip">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="sensor-status" role="status" aria-live="polite">準備中</span>
        </div>
      </div>

      <div class="sensor-content">
        <div class="reading-group">
          <span class="reading-group-label">RAW姿勢</span>
          <dl class="raw-values">
            <div><dt>α / Z軸回転</dt><dd id="alpha-value">--</dd></div>
            <div><dt>β / 前後傾き</dt><dd id="beta-value">--</dd></div>
            <div><dt>γ / 左右傾き</dt><dd id="gamma-value">--</dd></div>
          </dl>
        </div>
        <div class="reading-group">
          <span class="reading-group-label">CONTROL / 補正後</span>
          <dl class="tilt-values">
            <div><dt>X / 左右</dt><dd id="tilt-x-value">0.0°</dd></div>
            <div><dt>Y / 前後</dt><dd id="tilt-y-value">0.0°</dd></div>
          </dl>
        </div>
        <div class="sensor-meta">
          <span id="reference-label">端末水平を0°</span>
          <span class="motion-readout"><span>MOTION</span> <strong id="acceleration-value">--</strong><span>m/s²</span> <b id="motion-state">WAIT</b></span>
          <span id="screen-angle-value">Portrait ↑</span>
        </div>
      </div>

      <div class="game-controls">
        <button class="control-button" id="calibrate-button" type="button" disabled>今の角度を0°に</button>
        <button class="control-button accent" id="reset-ball-button" type="button">最初から</button>
      </div>
    </section>

    <section class="maze-stage" aria-label="ボール転がし迷路">
      <canvas id="ball-canvas" aria-label="スマートフォンの傾きで操作する3D迷路"></canvas>
      <p class="motion-hint">傾けてROLL・横へ動かして迷路をスライド</p>
      <p class="goal-message" id="goal-message" aria-live="polite"></p>
      <div class="loading-badge" id="physics-status">3Dを準備しています…</div>
    </section>

    <div class="start-overlay" id="start-overlay">
      <section class="start-card" aria-label="センサー開始">
        <p class="start-number">DEVICE ORIENTATION</p>
        <p class="start-guide">傾けてボールを転がし、スマホを平行移動して迷路との慣性差を体験します。</p>
        <button class="button button-primary" type="button" data-start-sensor>傾きセンサーを開始</button>
        <small>センサー情報は端末内だけで処理し、保存・送信しません。</small>
      </section>
    </div>
  </main>
</body>
</html>
