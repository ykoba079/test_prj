<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061315">
  <meta name="description" content="スマートフォンを傾けて3D迷路のボールを操作するJavaScriptデモです。">
  <title>スマホ傾き迷路 | スマホ × JavaScript #01</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.babylonjs.com/babylon.js"></script>
  <script defer src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
  <script defer src="./sensor-controller.js"></script>
  <script defer src="./ball-scene.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="game-shell">
    <section class="sensor-panel" aria-label="端末姿勢センサーと操作">
      <div class="sensor-heading">
        <span class="sensor-label">DEVICE ORIENTATION</span>
        <div class="status-chip">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="sensor-status" role="status" aria-live="polite">準備中</span>
        </div>
      </div>

      <div class="sensor-content">
        <dl class="raw-values">
          <div><dt>α</dt><dd id="alpha-value">--</dd></div>
          <div><dt>β</dt><dd id="beta-value">--</dd></div>
          <div><dt>γ</dt><dd id="gamma-value">--</dd></div>
        </dl>
        <dl class="tilt-values">
          <div><dt>X / 左右</dt><dd id="tilt-x-value">0.0°</dd></div>
          <div><dt>Y / 前後</dt><dd id="tilt-y-value">0.0°</dd></div>
        </dl>
        <div class="sensor-meta">
          <span id="reference-label">端末水平を基準</span>
          <span id="screen-angle-value">Portrait ↑</span>
        </div>
      </div>

      <div class="game-controls">
        <button class="control-button" type="button" data-start-sensor>センサー</button>
        <button class="control-button" id="calibrate-button" type="button" disabled>基準設定</button>
        <button class="control-button" id="clear-calibration-button" type="button" disabled>基準解除</button>
        <button class="control-button accent" id="reset-ball-button" type="button">リセット</button>
        <button class="control-button" id="manual-toggle-button" type="button" aria-expanded="false" aria-controls="manual-controls">PC操作</button>
      </div>
    </section>

    <section class="maze-stage" aria-label="ボール転がし迷路">
      <canvas id="ball-canvas" aria-label="スマートフォンの傾きで操作する3D迷路"></canvas>
      <p class="goal-message" id="goal-message" aria-live="polite"></p>
      <div class="loading-badge" id="physics-status">3Dを準備しています…</div>
    </section>

    <div class="start-overlay" id="start-overlay">
      <section class="start-card" aria-label="センサー開始">
        <p class="start-number">DEVICE ORIENTATION</p>
        <p class="start-guide">スマホを普段見る角度で持ち、センサーを開始してください。</p>
        <button class="button button-primary" type="button" data-start-sensor>センサーを開始</button>
        <button class="text-button" id="start-manual-button" type="button">PCで手動操作を試す</button>
        <small>センサー情報は端末内だけで処理し、保存・送信しません。</small>
      </section>
    </div>

    <section class="manual-controls" id="manual-controls" aria-label="PC用手動操作" hidden>
      <div class="manual-heading">
        <strong>手動で傾きを再現</strong>
        <button class="close-button" id="manual-close-button" type="button" aria-label="手動操作を閉じる">×</button>
      </div>
      <label>左右 <output id="manual-x-output">0.0°</output><input id="manual-x" type="range" min="-25" max="25" value="0" step="0.5"></label>
      <label>前後 <output id="manual-y-output">0.0°</output><input id="manual-y" type="range" min="-25" max="25" value="0" step="0.5"></label>
      <button class="control-button" id="manual-center-button" type="button">中央に戻す</button>
    </section>
  </main>
</body>
</html>
